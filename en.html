nement here? If not, may we still see Christ here? And under grace, does the debt of the wrong still count?<\/strong><\/p>"],["The gospel-parable view (this is exactly what Christ did for us)","","<p>From the ancient church to the Reformation, many preachers saw the gospel directly in these verses. In his preface to Philemon, Luther said that what Christ has done for us is exactly what Paul did for Onesimus: he laid down his own rights, charged our debt to himself, and pleaded for us before the Father — “we are all his [Christ’s] Onesimus, if we believe.” The strength of this view is that it lets the congregation see the shape of the cross in one short letter. The sense of being moved is genuine, and there is indeed a New Testament word root that echoes it: in Romans Paul uses the same root to say that “sin is not charged” (Rom 5:13).<\/p><p><strong>Difficulty: <\/strong>Paul himself does not make this connection. Once it is turned into typology or doctrine, the analogy is pushed further than it can bear. Philemon is not an angry Father God — he too is a sinner who has received grace (1:19). Paul is not Christ; he died for no one. And Onesimus is no more a sinner than Philemon. We must not say “Onesimus is a type of the sinner” — that would put a slave in the lowest place yet again, which is exactly what red line 5 of this volume is there to prevent.<\/p>"],["The commercial-guarantee view (this is simply an IOU)","","<p>Another view insists on reading these two verses for what they literally are: a friend of means using a formal legal format to guarantee another man’s debt. Paul may well have been able to pay (in Rome he “stayed two whole years in his own rented house,” Acts 28:30); this is a real financial commitment, not a metaphor. The strength of this view is that it respects the plain wording and the history of the text, and lets these two verses keep their real weight: Paul was genuinely ready to pay.<\/p><p><strong>Difficulty: <\/strong>Reading it only as a commercial document, however, misses the fact that Paul’s whole person had been shaped by the gospel. In verse 17 he says, “receive him as you would receive me,” and that word “receive” is the very word he uses in Romans: “accept one another, even as Christ also accepted you” (Rom 15:7). Paul’s standing surety for someone in this way is itself the gospel he had received, lived out in him. To forbid readers ever to think of Christ here is another way of failing to hear the text.<\/p>"],["[3] Where these notes stand","","<p><strong>Where these notes stand: verses 18–19 are a real IOU, and at the same time “this reminds us” of Christ — we may be reminded of him, but we must not make it Paul’s typology or his teaching on the atonement. We must not say “Onesimus is a type of the sinner” or “Paul is teaching the doctrine of atonement here.”<\/strong>Luther’s “we are all his [Christ’s] Onesimus, if we believe” likewise belongs only under “this reminds us.”<\/p><p>The passages this brings to mind are these. In Romans Paul uses a word from the same root to say that “sin is not charged” (Rom 5:13). He also says that “God was in Christ reconciling the world to himself, not reckoning to them their trespasses” (2 Cor 5:19), and “For him who knew no sin he made to be sin on our behalf; so that in him we might become the righteousness of God” (2 Cor 5:21). And there is one more IOU: “wiping out the handwriting in ordinances which was against us. He has taken it out of the way, nailing it to the cross” (Col 2:14) — written in a letter sent on the same journey as Philemon.<strong>Paul, in prison, wrote out an IOU for one man; the Lord, on the cross, took the IOU away for all.<\/strong><\/p><p>A second boundary is just as important:<strong>The debt of the wrong is real, and someone must take responsibility.<\/strong>Paul did not tell Philemon, “Forget it — don’t keep score.” He said, “put that to my account.” Grace is not pretending there was no wrong; grace is someone shouldering the wrong. So these notes do not present forgiveness as “acting as if it never happened,” nor do they tell those who suffered loss simply to swallow it. In the church and in the workplace, the responsibilities of compensation, restitution and repairing relationships must all be faced honestly (see ISS00_3).<\/p>"],["[4] Should this affect your faith?","","<p>Interpreters differ over whether these two verses are a gospel parable, and this should not shake your faith. Paul has already made the cross very clear in his other letters; it does not depend on these two verses for proof.<\/p><p>But these two verses can let you see yourself once more in one concrete picture:<strong>I am the one who ran up a debt and does not know whether the door will open; I am also the one holding someone else’s IOU, wanting to collect.<\/strong>And there is a Lord who, while we were still sinners, charged our debt to himself. Those for whom someone has stood surety like this begin to learn to write out an “I will repay it” for others, instead of forcing the wounded to write the debt off.<\/p>"]],"con":[],"say":"These notes’ position for the whole book: verses 18–19 are Paul’s real guarantee in his own hand, and this reminds us of Christ (Rom 5:13; 2 Cor 5:19, 21; Col 2:14). We do not make it Paul’s typology or his teaching on the atonement, nor do we say Onesimus is a type of the sinner; Luther’s “we are all his [Christ’s] Onesimus, if we believe” belongs only under “this reminds us.” The debt of the wrong is real, and someone must take responsibility — grace is not pretending there was no wrong; grace is someone shouldering the wrong.","care":"In the congregation will be people carrying debts, people who did wrong and caused others loss and are now afraid to come back to church or home; and people who have been wronged — of money, time or reputation — yet are urged, “Christians shouldn’t keep score.” To the first, the pastor proclaims the Lord who stands surety for us, and walks with them step by step as they take up whatever responsibility they can. With the second, the pastor acknowledges that their loss is real and does not rush them to “let it go.” Do not preach “charging to the account” as “wiping the slate clean and acting as if it never happened”; do not cast the one who did wrong as Onesimus and the one who suffered loss as Philemon and then make both follow the script; and do not use a church member’s debts as a sermon illustration."},{"id":"ISS00_6","t":"Authorship and Authenticity: Did Paul Write Philemon?","r":"1:1","ch":[],"why":"6. The author is the apostle Paul, and this is hardly disputed at all; even Marcion in the second century included the letter in his collection of Paul’s letters. This question sets out the letter’s self-identification, the autograph of verse 19, its links with Colossians, and the doubts of a few nineteenth-century scholars — so that readers know this volume can confidently write “Paul says,” while keeping the focus on the Lord whom Paul proclaimed.","pos":[["[1] What the text is asking","","<p>The letter opens, “Paul, a prisoner of Christ Jesus, and Timothy our brother, to Philemon, our beloved fellow worker” (1:1). In the middle it says, “being such a one as Paul, the aged, but also a prisoner of Jesus Christ” (1:9), and also, “I, Paul, write this with my own hand” (1:19). The co-workers the letter mentions — Epaphras, Mark, Aristarchus, Demas and Luke — almost exactly match the list at the end of Colossians (Col 4:10–14).<strong>So the text asks: Did Paul write this letter? And why is there almost no dispute over the authorship of this book?<\/strong><\/p>"],["The Pauline-autograph view (the historic tradition and the great majority of scholars)","","<p>The church through the ages has unanimously received this as Paul’s letter. Marcion’s canon and the Muratorian Fragment both include it, and Tertullian and Origen both cite it. In modern times the great majority of scholars — including those skeptical about other Pauline letters — also list it among the undisputed letters of Paul. The reasons are the letter’s self-identification (1:1, 9, 19); its natural agreement with the list of names in Colossians; Paul’s distinctive tone and vocabulary (“in Christ,” “in the Lord,” “heart” in the sense of inward affections); and the fact that a forger would have had little motive to write so short and personal a letter.<\/p><p><strong>Difficulty: <\/strong>This view has few difficulties. The one thing to note is that if the authorship of Colossians is disputed, the near-identical lists in the two letters themselves call for explanation: does Philemon prove that Colossians is genuine, or did Colossians copy Philemon’s list? In the Colossians Study Notes these notes have already taken Paul as the author, so the two letters confirm each other.<\/p>"],["The pseudonymous-story view (the nineteenth-century Tübingen school)","","<p>In the nineteenth century F. C. Baur cast doubt on this letter, regarding it as a little Christian tale written under Paul’s name to show how Christianity viewed slaves and masters. His reason was that its style and thought differed from the letters he considered Paul’s “chief epistles.” The strength of this view is that it forces readers not simply to say “that’s the tradition,” but to reckon seriously with the evidence of the text.<\/p><p><strong>Difficulty: <\/strong>The letter is too short and too concrete; it has none of the doctrinal program a work of fiction would set out to convey. Even Baur’s own students and later critical scholars have for the most part abandoned this view. Someone writing a story would not leave the hero’s fate hanging on an unresolved “perhaps” (1:15), nor end the tale without ever telling us how Philemon finally responded.<\/p>"],["[3] Where these notes stand","","<p><strong>Where these notes stand: the author is the apostle Paul, with Timothy as co-sender; verse 19 is the passage Paul guaranteed in his own hand. Baur’s doubts are set alongside, without ridicule.<\/strong>In this letter Paul does not call himself an apostle, only a “prisoner” — the first stroke in the book’s whole view of authority (see ISS00_4).<\/p><p>This volume can therefore write “Paul says”; but every time, the point must land on the one Paul was pointing to. When the congregation finishes this letter, what they should remember is the Lord who charged our debt to himself, not Paul’s eloquence.<\/p>"]],"con":[],"say":"These notes’ position for the whole book: the author is the apostle Paul (1:1, 9, 19), with Timothy as co-sender. This is very nearly the least disputed book in the whole New Testament as to authorship — even Marcion included it. F. C. Baur’s nineteenth-century theory of pseudonymity is set alongside, without ridicule. We may write “Paul says,” but the focus falls on Paul’s Lord.","care":"In the congregation will be people who have read a little biblical criticism, come to think that “the scholars all say the Bible is false,” and are unsettled. The pastor can use this book as a reassuring example: even the most skeptical scholars mostly acknowledge that this is Paul’s letter. Do not ridicule scholars, and do not shut down questioners with “asking that kind of question means you don’t believe.” Let them know that serious questions and steadfast faith can live side by side."},{"id":"ISS00_7","t":"Place and Date of Writing: Rome, Ephesus or Caesarea?","r":"1:22--24","ch":[],"why":"7. Rome, Ephesus and Caesarea are set side by side as three views; all three agree that the letter was written at the same time as Colossians and sent on the same journey. Paul mentions his chains four times in the letter (1:1, 9, 10, 13) and asks Philemon to prepare a guest room for him (1:22). Our judgment about the place affects how we picture Onesimus’s journey and how near Paul’s hope of “coming” really was.","pos":[["[1] What the text is asking","","<p>Paul calls himself “a prisoner of Christ Jesus” (1:1); Onesimus is the child “whom I have become the father of in my chains” (1:10); and he adds, “Also, prepare a guest room for me, for I hope that through your prayers I will be restored to you” (1:22). Epaphras is “my fellow prisoner” (1:23), and Luke, Aristarchus and Mark are all at his side (1:24).<strong>So the text asks: Where was Paul imprisoned? When did he write? How did a slave from Colossae come to meet Paul in prison?<\/strong><\/p>"],["The Rome view (about AD 60–62; the traditional reading)","","<p>Tradition holds that this letter was written during Paul’s first house arrest in Rome: “Paul stayed two whole years in his own rented house and received all who were coming to him” (Acts 28:30). Luke and Aristarchus both accompanied him to Rome (Acts 27:2), so the names fit. Rome was a great city; if Onesimus was a runaway slave, it was the easiest place to disappear. And if he had gone to seek Paul’s intercession, Paul in Rome was a man he could find. The strength of this view is that it rests on the direct record of Acts and is supported by early church tradition.<\/p><p><strong>Difficulty: <\/strong>Rome is more than a thousand kilometers from Colossae, across the sea. Paul asks Philemon to “prepare a guest room,” as though he would be coming soon, yet his original plan was to go on west from Rome to Spain (Rom 15:24, 28). Whether Onesimus ran away or went to plead with his master’s friend, walking so far and then being sent back so far both need a reasonable explanation.<\/p>"],["The Ephesus view (about AD 54–55)","","<p>Another view notes that Paul lived in Ephesus for more than two years (Acts 19:10) and very probably was imprisoned there — he speaks of being “in prisons more abundantly” (2 Cor 11:23). Ephesus is only about 160 kilometers from Colossae, so both Onesimus’s going to find Paul and Paul’s plan to come and stay become far closer at hand. It also best suits the reading in which Onesimus deliberately sought out his master’s friend to plead for him. The strength of this view is that it makes the hope of 1:22 very practical.<\/p><p><strong>Difficulty: <\/strong>Acts records no imprisonment of Paul in Ephesus, and there is no evidence that Luke was with Paul in Ephesus. This view is built on inference; reasonable as it is, it cannot settle the question.<\/p>"],["The Caesarea view (about AD 57–59)","","<p>Yet another view holds that the letter was written in Caesarea, where Paul was “kept in Herod’s palace” (Acts 23:35) and held for two full years (Acts 24:27); Luke and Aristarchus may also have been nearby. The strength of this view is that Acts records a lengthy imprisonment there.<\/p><p><strong>Difficulty: <\/strong>Caesarea is likewise a long way from Colossae. If Onesimus was a runaway, it was no great city in which to hide; if he went to plead his case, the journey was just as long. And at the time Paul was set on appealing to Rome, so talk of coming to stay in Colossae makes little sense. This view has the fewest supporters.<\/p>"],["[3] Where these notes stand","","<p><strong>Where these notes stand: the three views are set side by side without a ruling. The pulpit follows tradition in treating Rome as the most common reading, without ruling out Ephesus. What all three agree on is that Philemon and Colossians were written at the same time and sent on the same journey — Tychicus carrying Colossians, with Onesimus traveling alongside (Col 4:7–9).<\/strong><\/p><p>Whichever prison it was, the heart of this letter is the same: a man in chains became the father of a child (1:10), and then wrote out an IOU for that child (1:19). Paul’s chains did not stop the gospel; instead, they became the place where a man who had left home met the Lord.<\/p>"]],"con":[],"say":"These notes’ position for the whole book: on the place of writing, Rome (about AD 60–62), Ephesus (about 54–55) and Caesarea (about 57–59) are set side by side without a ruling. All three agree that Philemon and Colossians were written at the same time and carried on the same journey by Tychicus and Onesimus (Col 4:7–9).","care":"This question is mainly background knowledge, but in the congregation will be people who feel “locked in” — on a sickbed, caring for a family member with dementia, in a correctional facility, or trapped in a job they cannot leave. The pastor can use this question to help them see that even in chains Paul became the father of a child. Do not turn place and date into an exam, and do not let scholarly disagreement leave people feeling that the history in the Bible is unreliable."},{"id":"ISS00_8","t":"Why Was Philemon Received into the Canon?","r":"1:1--25","ch":[],"why":"8. Why did the church receive into the canon a short personal letter without a single doctrinal outline? As early as the fourth century some held that this letter was too personal, lacking edifying instruction, and unworthy to stand beside Paul’s other letters; Jerome and Chrysostom defended it. This question explains that Philemon was received into the canon precisely because it brings the gospel down to one household, one person and one debt.","pos":[["[1] What the text is asking","","<p>This letter has only one chapter and twenty-five verses. It does not discuss justification, the resurrection or order in the church; it deals with whether one slave would stay or go, and it closes with “Also, prepare a guest room for me” (1:22). Yet from very early on it was listed among Paul’s letters.<strong>So the text asks: Why is a letter so personal and so short the word of God? What is its place in the canon?<\/strong><\/p>"],["The skeptical view (too personal, not edifying)","","<p>In the preface to his commentary on Philemon, Jerome mentions that some in his day held either that Paul did not write this letter, or that even if he did, it contained nothing to edify — the apostle did not speak every word under the inspiration of the Holy Spirit, and a letter dealing with household affairs should not be treated as Scripture. The strength of this view is that it takes seriously the weight of the word “Scripture” and does not let just any writing slip into the canon.<\/p><p><strong>Difficulty: <\/strong>This view assumes that “the spiritual” lives only in doctrine, and that household affairs and account books are not spiritual — yet Paul pointedly says, “both in the flesh and in the Lord” (1:16). Moreover, this letter was widely accepted by the church very early: Marcion’s collection of Paul’s letters and the Muratorian Fragment both include it. The church read it, recited it and preserved it long before anyone questioned it.<\/p>"],["The defense view (great gospel in a small letter)","","<p>Jerome and Chrysostom both defended this letter. Chrysostom said that it teaches us never to look down on anyone — even a slave, even someone who once did wrong, is worth an apostle writing a letter in his own hand. Jerome, in his preface, answered the skeptics, saying in substance that although this letter is short, it is still Paul’s letter and carries apostolic teaching and edification, and must not be despised because it deals with everyday matters. At the Reformation, Luther went further and saw here Christ’s intercession for us. The strength of this view is that it sees that a book’s significance in the canon lies not in its length but in how it bears witness to Christ.<\/p><p><strong>Difficulty: <\/strong>If, in defending it, we allegorize the letter too far — making every character a type — we lose what is most precious about it: it is real people, a real debt and a real door (see the boundary in ISS00_5).<\/p>"],["[3] Where these notes stand","","<p><strong>Where these notes stand: Philemon belongs in the canon and has been there since the earliest collections of Paul’s letters. Its place in the canon is to bring the gospel down to earth — the gospel changes not only a person’s eternity, but also what a household calls the man standing at its door.<\/strong><\/p><p>This reminds us of Paul’s words: “Every Scripture is God-breathed and profitable for teaching, for reproof, for correction, and for instruction in righteousness” (2 Tim 3:16). The word “profitable” here (ὠφέλιμος) is not the same Greek word as “useful” in 1:11 (εὔχρηστος); the Chinese Union Version simply happens to render the two alike, so the echo belongs to the Chinese. Yet even that echo can remind us that the words God breathed out include a letter written for a man who had been “useless.” If the Bible lacked Philemon, we would be missing a page: the one that shows what happens when the gospel stands before a door and faces a real debt.<\/p>"]],"con":[],"say":"These notes’ position for the whole book: Philemon has been in the canon since the earliest collections of Paul’s letters (Marcion, the Muratorian Fragment). The fourth-century doubts are set alongside, as is the defense by Jerome and Chrysostom. It was received into the canon precisely because it brings the gospel down to one household, one person and one debt.","care":"In the congregation will be people who feel their lives are too trivial and ordinary — “nothing spiritual about them”: housework, bills, caring for family, managing staff. The pastor can help them see that God put a letter about household affairs into the Bible, which shows that he cares about kitchens, account books and doorways. Do not preach this book as though only doctrine matters, and do not allegorize it until every character becomes a symbol."},{"id":"ISS00_9","t":"Should These Controversies Affect a Person’s Faith?","r":"1:1--25","ch":[],"why":"9. Debates between schools of thought should not affect your faith; but the question “Which person am I in this letter, and will that door open?” should. And through it all: “The grace of our Lord Jesus Christ be with your spirit.” Philemon has only twenty-five verses, yet it touches some of the most sensitive matters in the New Testament: slavery, forgiveness and reconciliation, spiritual authority, the limits of gospel analogy — along with all the discussions about Onesimus’s circumstances, the place of writing and more. A believer who has read the issues pages carefully may well ask: With so much uncertain, what can I still be sure of? This question puts the controversies of the whole book back in their proper place.","pos":[["[1] What the text is asking","","<p>The letter itself leaves many questions the text does not answer. Why did Onesimus leave? Did Philemon receive him in the end — did he set him free? Did Paul ever reach Colossae? At the most crucial point Paul even uses the word “perhaps”: “For perhaps he was therefore separated from you for a while, that you would have him forever” (1:15).<\/p><p>At the same time, the letter places two unchanging things at its beginning and its end. At the beginning: “Grace to you and peace from God our Father and the Lord Jesus Christ” (1:3). At the end: “The grace of our Lord Jesus Christ be with your spirit” (1:25).<strong>So the text asks: Faced with all the controversies and unknowns in this book, how should a believer hold himself? Is there anything that controversy cannot shake?<\/strong><\/p>"],["The view that controversy proves the Bible unreliable","","<p>This is a common inference among skeptics: Paul’s attitude to slavery cannot even be stated clearly, Onesimus’s circumstances have four readings, the place of writing has three theories — so the Bible is evidently nothing more than the work of ancient people and does not deserve our full trust. The strength of this view is its honesty: it does not pretend the problems are not there, and it forces the church to answer with more than “just believe.”<\/p><p><strong>Difficulty: <\/strong>These controversies arise almost entirely at the level of “how to understand,” not at the level of “who Jesus is and what he has accomplished.” Those who argue for implied manumission and those who say only the relationship changed both agree that Onesimus is “a beloved brother” (1:16); those who read verse 19 as pressure and those who read it as humor both agree that Paul says, “for love’s sake I rather beg” (1:9). Many controversies show that this letter has been read seriously for two thousand years — not that it cannot be trusted.<\/p>"],["The just-believe-don’t-ask view","","<p>This is a common reaction in churches: these controversies will trip people up, so it is best not to raise them in church; believers need only believe simply. The strength of this view is that it shields weaker believers from being swamped with information, and reminds us that faith is not gained through scholarship.<\/p><p><strong>Difficulty: <\/strong>It is precisely because the church did not explain things clearly that Philemon has been used to defend slavery, to send victims back, and to force people to forgive. A faith that is not allowed to ask questions is the most fragile of all, and the most easily exploited by those who misuse Scripture; and treating questioners as unspiritual is exactly the overreach of authority described in ISS00_4. Paul’s own “perhaps” is itself a demonstration: facing the unknown honestly is part of faith.<\/p>"],["[3] Where these notes stand","","<p><strong>Where these notes stand: we take a layered approach — standing firm on the foundations, and on secondary matters setting views side by side, humbly, without a ruling.<\/strong>These notes have already dealt with the controversies of the whole book in ISS00_1–8: the letter’s setting and principles (ISS00_1), slavery and labor (ISS00_2), forgiveness and reconciliation (ISS00_3), authority and appeal (ISS00_4), charging the account and standing surety (ISS00_5), authorship (ISS00_6), place and date (ISS00_7), and the canon (ISS00_8). Each question lays out the reasons and difficulties of every view, because giving conclusions without the process robs readers of the right to think.<\/p><p>But there are several things that no controversy anywhere in the book has ever shaken:<strong>Grace and peace come “from God our Father and the Lord Jesus Christ” (1:3); a man who “once was useless” has become, in the gospel, “a beloved brother” (1:11, 16); there is a guarantor willing to say, “put that to my account” (1:18); and “The grace of our Lord Jesus Christ be with your spirit” (1:25).<\/strong>This is the foundation of Philemon, and the foundation of these notes on the whole book.<\/p>"],["[4] Should this affect your faith?","","<p>Debates between schools of thought should not affect your faith. Asking questions is not unbelief; Paul himself said “perhaps,” and he did not pretend to know the whole of God’s plan.<\/p><p>But there is one thing that should affect you:<strong>Having read this letter, which of its three people do I see myself in?<\/strong>Am I Paul, who could command but chose to appeal? Philemon, who had rights and reasons and was invited to lay them down? Or Onesimus, once useless, now standing at the door? Whichever one you are, the Lord who said, “put that to my account,” has already gone through that door ahead of you. The controversies can be pondered slowly; this grace can be received today.<\/p>"]],"con":[],"say":"These notes’ position for the whole book: the controversies in Philemon all arise at the level of “how to understand,” and these notes take a layered approach — standing firm on the foundations, and on secondary matters setting views side by side, humbly, without a ruling. Grace and peace come from God; a man who was useless has become a beloved brother; a guarantor says, “put that to my account” — no controversy has shaken any of these.","care":"In the congregation will be people in the middle of a crisis of faith, with so many questions they dare not voice them; older believers who are unsettled the moment they hear “scholars disagree”; and people who have been hurt by this very letter — sent back into danger, forced to forgive, bound by a debt of gratitude — and who as a result no longer dare to trust even God. To the first, do not say, “You just don’t have enough faith”; be with them first. To the second, point them to 1:3 and 1:25. To the third, let them know that what hurt them was people misusing Scripture, not the Lord who stands surety for them. If doubt comes with prolonged sleeplessness or a sense of hopelessness, follow up privately after the meeting, and where necessary help them seek professional help."},{"id":"ISS01_1","t":"Four readings: was Onesimus a runaway slave?","r":"1:10–16; Col 4:9","ch":[1],"why":"When Chinese churches preach Philemon, they almost always begin with “Onesimus the runaway slave,” as though the text stated it outright. Yet the text never once uses the word “run away.” Paul says only that he “was … separated from you for a while,” and he puts it in the passive voice. How Onesimus came to be at Paul’s side determines how we see his past and how we see Philemon’s situation—and it also determines whether the pulpit, without quite noticing, ends up passing sentence on a man.","pos":[["[1] What the text is asking","","<p>The text settles only three things: Onesimus “once was useless to you” (1:11); he came to faith in Paul’s chains (1:10); and Paul is now sending him back to Philemon (1:12). Beyond that, 1:18 says, “if he has wronged you at all or owes you anything”—a conditional sentence. The question is this: why was he at the side of an imprisoned apostle at all? Did he flee his master’s house and happen to run into Paul, or was there some other reason? No verse answers this directly, so we can only reason from the clues.<\/p>"],["The runaway-slave view (the traditional reading)","","<p>Since Chrysostom, most readers have held that Onesimus ran away from his master’s house, perhaps taking property with him (1:18), and made his way to a great city, where he met Paul and came to faith. The “separated from you for a while” of 1:15, the wrong and the debt of 1:18, and the careful, tactful tone of the whole letter all fit this reading well: a slave who had broken Roman law needed someone to plead for him.<\/p><p><strong>Difficulty: <\/strong>The last place a fugitive slave should go is to his master’s friend—and Paul was very likely Philemon’s spiritual father (1:19). The odds of “happening to meet Paul in prison” are not high. And the text never says “ran away”; to preach this reading as settled is to add a charge to the text that the text itself does not bring.<\/p>"],["The mediator view (amicus domini)","","<p>The writings of the Roman jurists mention that a slave who had fallen out with his master could go to a friend of the master (amicus domini) to intercede for him, and that in law this did not count as running away. On this reading, something had gone wrong at home; Onesimus, afraid of severe punishment, deliberately sought out Paul, whom his master respected, and asked him to write on his behalf. That he came to faith while with Paul was grace he never expected. This also explains why Paul’s letter reads like a letter of mediation.<\/p><p><strong>Difficulty: <\/strong>This view leans on circumstantial evidence from Roman law; the text itself never says Onesimus came looking for Paul on purpose. Moreover, after his conversion he seems to have stayed with Paul for some time (1:11, 13), which does not fit neatly with a brief errand of intercession.<\/p>"],["The sent-by-Philemon view, and the blood-brother view","","<p>Two further readings have fewer adherents. The first is the commissioning view: Onesimus had been sent by Philemon, or by the church at Colossae, to serve Paul in prison, and the words of 1:13, “on your behalf he might serve me,” seem to support it; Paul’s request is then that he be allowed to stay, or that Philemon release him. The second is the blood-brother view: on the strength of “in the flesh” in 1:16, it holds that Onesimus and Philemon were blood relatives—two brothers who had fallen out.<\/p><p><strong>Difficulty: <\/strong>The commissioning view struggles to explain the “useless” of 1:11, the “separated” of 1:15 and the wrong done in 1:18. The blood-brother view reads the “slave” of 1:16 as a figure of speech, which does not suit the tone of the letter as a whole, and very few scholars support it.<\/p>"],["[3] Where these notes stand","","<p><strong>These notes hold the first two readings—the runaway slave, and the slave who sought Paul as a mediator—together as the main readings, without ruling between them; the commissioning view and the blood-brother view are simply set alongside.<\/strong>The pulpit preaches only what the text makes certain: he was once useless; he was begotten in chains; and he is now being sent back to his master’s house by Paul, carrying a letter, accompanied by a companion, and covered by a guarantee.<\/p><p>So these notes do not say, “Onesimus the runaway sinned, and it is only right that he go back and be punished”—the text passes no such sentence on him. Nor do they turn him into an innocent hero—Paul admits that he “once was useless to you.” We add nothing in either direction, and leave the text’s own sense of proportion intact.<\/p>"],["[4] Should this affect your faith?","","<p>No. All four readings agree on this: a man who in law was property became a son of God in Paul’s chains, and is now called “a beloved brother”; Paul appeals for love’s sake and guarantees the debt in his own hand. These are the things the letter wants us to see.<\/p><p>That we do not know how Onesimus left is itself a timely reminder: we usually know less about another person’s past than we think we do. To speak cautiously where things are unclear and firmly where they are clear—this is itself a discipline of reading Scripture. For the book’s setting and contested questions as a whole, see ISS00_1 and ISS00_9.<\/p>"]],"con":[],"say":"Where these notes stand: there are four readings of how Onesimus came to be with Paul. These notes hold “the runaway slave” and “the slave who sought Paul as a mediator” together as the main readings, without ruling between them. The pulpit preaches only what the text makes certain; it neither condemns him nor whitewashes him. For the position these notes take across the whole book, see ISS00_1.","care":"In the pews there may be someone who once “ran away”—who left a home, a job or a church, and is still known to this day as “the one who ran off.” When you preach on this question, do not use “runaway slave” as a joke or a label. A pastor can sit with such a person privately and help him put into words the real reason he left—listening first, in no hurry to judge. Do not say, “Running off like that was simply irresponsible,” because some people left in order to save their own lives."},{"id":"ISS01_2","t":"Did Paul ask Philemon to set Onesimus free?","r":"1:21; 1:13–16","ch":[1],"why":"In 1:21 Paul says, “knowing that you will do even beyond what I say,” yet he never spells out what that “beyond” is. Some take it as a hint at manumission; others think Paul wanted only that Philemon change the way he treated him. This question bears on how we understand the relationship between the gospel and social structures—and on whether Christian employers and managers today, having heard this letter, ought to make structural changes.","pos":[["[1] What the text is asking","","<p>Paul says three things: “no longer as a slave, but more than a slave, a beloved brother” (1:16); “receive him as you would receive me” (1:17); and “Having confidence in your obedience … knowing that you will do even beyond what I say” (1:21). In addition, 1:13 says he “desired to keep” Onesimus with him. The question is this: did Paul want Philemon to free Onesimus in law, or to see him with new eyes within the same legal status? Two things are key: the ὡς (hōs), “as,” of 1:16, and the unspoken “beyond” of 1:21.<\/p>"],["The implied-manumission view","","<p>Many commentators hold that although Paul does not say it outright, he has made himself perfectly clear. In 1:13 he wants to keep Onesimus by his side to serve the gospel, and the most natural meaning of “beyond what I say” in 1:21 is to set him free, so that he can return to Paul as a free man. Besides, if a “beloved brother” is still your property, a brotherhood that holds “in the flesh” is hard to sustain. Paul puts it tactfully, leaving the decision to Philemon’s free will.<\/p><p><strong>Difficulty: <\/strong>If Paul really wanted manumission, why not say so? In 1:8 he plainly says he could command it. This view has to assume that Paul was deliberately holding back, and the text offers no firm proof of that.<\/p>"],["The changed-relationship view","","<p>Other commentators draw attention to the ὡς (hōs) of 1:16: “no longer as a slave” describes the way Philemon is to regard him; it does not directly say his legal status has changed. On this reading, what Paul wants is for master and slave, in the same household, to become brothers—eating at the same table and honoring one another. “Beyond what I say” may then mean still kinder treatment: letting him take part in ministry, for instance, or restoring his good name.<\/p><p><strong>Difficulty: <\/strong>Preached too quickly, this view easily becomes “as long as the attitude changes, the structure need not move.” Yet the “in the flesh” of 1:16 is precisely meant to carry the change into everyday social relationships, not leave it in the meeting for worship.<\/p>"],["The dissolving-from-within view","","<p>Some scholars take a wider angle. Whether or not the word “freedom” was in Paul’s mind, the principles he placed into this household—a slave is a beloved brother, and the master is to receive him as he would receive the apostle—would in the end dissolve the master–slave system from within. Church history did in fact later see believers buying slaves their freedom, and Christians in the abolitionist movement citing this very letter.<\/p><p><strong>Difficulty: <\/strong>This view describes the long-term effect, not what Paul concretely asks for in this letter. And church history also has people who read the same letter and went on owning slaves—proof that principles do not turn themselves into action.<\/p>"],["[3] Where these notes stand","","<p><strong>These notes set the three readings—“implied manumission,” “changed relationship” and “dissolving from within”—side by side, without settling the matter.<\/strong>But the floor shared by all three is clear: Paul wants more than Philemon’s inward forgiveness. He wants a change “in the flesh” as well as “in the Lord”—at home, in the account books, and when the work is handed out.<\/p><p>So these notes do not say, “Paul only wanted people to adjust their attitude,” nor do they say, “Paul plainly demanded manumission, and if Philemon didn’t free him he was disobedient.” The text leaves that “beyond” to Philemon’s free will, and the pulpit must likewise leave room for its hearers—while pointing clearly in a direction: dignity, fairness and freedom.<\/p>"],["[4] Should this affect your faith?","","<p>No. All three readings agree that once the gospel enters a household, no one can go on treating a brother as property. Paul did not write a manifesto for abolition; he wrote a letter that made it impossible for one master to go on living as before.<\/p><p>You do not need to know whether Philemon finally signed the papers of manumission in order to know what you should do today. Just ask yourself: in the relationship where I hold the power, is what I do “beyond” what anyone asks of me? For the book-wide position on slavery and status, see ISS00_2.<\/p>"]],"con":[],"say":"Where these notes stand: on whether “you will do even beyond what I say” (1:21) hints at manumission, these notes set the three readings—“implied manumission,” “changed relationship” and “dissolving from within”—side by side without settling the matter. All three agree that the change must happen “in the flesh” as well as “in the Lord”—at home, in the account books and when the work is handed out. For the position these notes take across the whole book, see ISS00_2.","care":"In the pews there may be employers and managers, and there may also be employees, migrant workers and live-in caregivers who have been treated unfairly. Do not preach “submission” only to the employees, or “attitude” only to the bosses. A pastor can sit down with an employer and go through working hours, time off and wages concretely, and can also help a worker who has been wronged find the proper channels. Do not say, “You’re brothers in the Lord, so don’t make a fuss about the pay.”"},{"id":"ISS01_3","t":"Why does Paul not oppose slavery outright?","r":"1:16; 1 Cor 7:21; 1 Tim 1:10","ch":[1],"why":"This is the question most often asked of Philemon today, and the one that stings most: an apostle sends a slave back to his master’s house without a single word condemning slavery. Some have doubted the morality of the New Testament because of it; others have actually used this letter to defend slavery. Handled badly, this question will put off seekers, and it will leave workers who are being exploited today feeling that the church sides with the powerful.","pos":[["[1] What the text is asking","","<p>Philemon never says “slavery is a sin.” Yet it says that Onesimus is “no longer as a slave, but more than a slave, a beloved brother,” and that this holds “both in the flesh and in the Lord” (1:16). Elsewhere Paul urges those who are slaves, “if you get an opportunity to become free, use it” (1 Cor 7:21; the Greek of this verse admits another reading), and he lists “slave-traders” among things “contrary to the sound doctrine” (1 Tim 1:10). The question is this: why does Paul not demand in this letter that the institution be abolished? Does his silence mean tacit approval, or is there some other reason?<\/p>"],["The constraints-of-context view","","<p>A good many scholars point out that the first-century church was a small band of people with no political power. Slaves made up a very large share of the Roman Empire’s population, and the whole economy was built on the institution. The slave revolt led by Spartacus was crushed in blood, and thousands were crucified. Had Paul publicly called for abolition, the first to suffer would have been the slaves themselves. So, within the bounds of what was actually possible, he began the change with one household and one man.<\/p><p><strong>Difficulty: <\/strong>This view explains why Paul “could not,” but it is easily stretched into “so Christians need not concern themselves with social structures.” Nor can it fully answer why Paul did not speak plainly even in a private letter.<\/p>"],["The gospel-seed view","","<p>Another view holds that what Paul chose was not a street movement but planting in the church a seed that would break the institution apart. In Christ there is “neither slave nor free man” (which brings Gal 3:28 to mind); master and slave break bread at the same table; and masters are reminded, “you also have a Master in heaven” (Col 4:1). If a master truly regards his slave as a beloved brother, the institution is hollowed out from within.<\/p><p><strong>Difficulty: <\/strong>The seed took nearly eighteen centuries to grow, and all that time many who called themselves Christians still owned slaves, even quoting the Bible in their defense. This view must honestly admit that the church has often failed to live out the very principles it holds in its hands.<\/p>"],["The critical view: New Testament ethics are bound by their age","","<p>Some scholars and ordinary readers alike hold that Paul was, in the end, a man of his time, unable to see beyond the horizon of ancient society; Philemon shows that the New Testament’s ethics on slavery are inadequate, and today’s readers must supplement them with a fuller notion of human rights. The strength of this view is that it makes no excuses for the wrongs of history, and that it listens seriously to the voices of the oppressed.<\/p><p><strong>Difficulty: <\/strong>This view often overlooks the direction the New Testament itself already sets: slave-trading is sin, freedom is better if it can be had, a slave is a beloved brother, and masters must treat people justly. Many who later drove the abolitionist movement drew their strength from exactly these passages. To judge the New Testament as a whole to be backward does not do justice to the text itself.<\/p>"],["[3] Where these notes stand","","<p><strong>Where these notes stand: the New Testament does not endorse slavery.<\/strong>In a situation where he had no power to change the law, Paul placed the gospel into one concrete household, called a “thing” a “brother,” and required that this change take place “in the flesh” as well as “in the Lord.” The constraints-of-context view and the gospel-seed view can be held together; the critical view reminds us not to defend the church’s historical failures.<\/p><p>So these notes do not say “the Bible supports slavery,” nor do they say the Bible has lost its authority because Paul wrote no manifesto for abolition. Likewise, they do not say “today’s foreign workers are slaves”—but they do require the church to see, concretely, today’s migrant workers, caregivers and agency workers, and never to use “we’re brothers in the Lord” to paper over injustice in wages, time off and dignity.<\/p>"],["[4] Should this affect your faith?","","<p>It deserves your serious attention, but it need not shake your trust in the gospel. The gospel has never worked by changing the law first and the heart afterward. Rather, a Lord who “emptied himself, taking the form of a servant” (Phil 2:7) redeemed human dignity from the very bottom up.<\/p><p>What ought truly to trouble us is not that Paul wrote too little, but that we can read this letter and still call someone “brother” on Sunday and go back to treating him as manpower on Monday. For the book-wide position on slavery, labor and status, see ISS00_2; on contested questions and faith, see ISS00_9.<\/p>"]],"con":[],"say":"Where these notes stand: the New Testament does not endorse slavery. In a situation where he had no power to change the law, Paul placed the gospel into one household and required a change “in the flesh” as well as “in the Lord.” These notes do not say the Bible supports slavery, nor that “foreign workers are slaves”; but today’s workers must be concretely seen. For the position these notes take across the whole book, see ISS00_2.","care":"In the pews there may be people whose ancestors were enslaved or exploited; there may be migrant workers laboring far from home whose papers have been confiscated or whose wages are in arrears; and there may be seekers whose faith has been shaken by this very question. Do not rush to apologetics or say, “Actually, slaves back then had it pretty good.” First acknowledge the wounds of history, then point to the direction of the text. If someone is being exploited right now, helping him find the channels where workers can get help matters more than winning an argument."},{"id":"ISS01_4","t":"What does “that the fellowship of your faith may become effective” mean?","r":"1:6; 1:17","ch":[1],"why":"Verse 1:6 is widely regarded as the hardest sentence in the letter, and the Chinese Union Version, the Chinese New Version and Today’s Chinese Version render it very differently. Chinese churches often preach it as “evangelism should be fruitful”; others read it as being about personal growth in faith. In fact this sentence is Paul’s prayer before he makes his request—and depending on how it is read, the center of gravity of the whole letter shifts with it.","pos":[["[1] What the text is asking","","<p>The Chinese Union Version renders 1:6 as a prayer that the faith Philemon shares with others may show its effect, so that people may know that every good deed of theirs is done for Christ; WEB reads, “that the fellowship of your faith may become effective in the knowledge of every good thing which is in us in Christ Jesus.” The key is the genitive phrase ἡ κοινωνία τῆς πίστεώς σου (hē koinōnia tēs pisteōs sou): κοινωνία (koinōnia) can mean “sharing,” “fellowship” or “participation.” The question is this: what is Paul praying for Philemon—that he share his faith with others, that he enjoy a partnership in faith with all the saints, or that he himself live more deeply in faith?<\/p>"],["The sharing-faith view","","<p>Some translations and commentators read it as “the faith you share with others,” with an evangelistic sense: may the faith Philemon proclaims and shares with others be effective, bringing people to know every good thing that is in Christ. The Chinese Union Version’s wording, “the faith you hold in common with others,” can accommodate both this reading and the fellowship view below. The strength of this view is that it sees faith as never private; it is meant to flow out to others.<\/p><p><strong>Difficulty: <\/strong>The setting of the letter as a whole is not outward evangelism but acceptance within a house church. Reading 1:6 as evangelistic fruitfulness does not connect well with the request that follows from 1:7 on.<\/p>"],["The fellowship-of-faith view","","<p>Another reading takes κοινωνία (koinōnia) as the partnership among believers: the fellowship by which, through faith, you have become one with us. The strongest reason lies in 1:17: “If then you count me a partner”—and “partner,” κοινωνόν (koinōnon), comes from the same root. Paul prays for this partnership in 1:6, and by 1:17 he grounds it in one concrete act: receiving Onesimus.<\/p><p><strong>Difficulty: <\/strong>This view relies on a literary reading of echoes between the verses. Pressed too tightly, it shrinks 1:6 into a mere preview of 1:17 and overlooks the wider meaning of Paul’s prayer in its own right.<\/p>"],["The participation-in-faith view","","<p>Yet another reading takes the genitive as subjective: Philemon’s own participation in the faith—that is, the whole of his life lived in faith. May his faith grow more vigorous “in the knowledge of every good thing,” and bring forth action. This view keeps close to the sense of ἐνεργὴς (energēs), “effective, at work,” and its concern lies close to that of James: “faith apart from works is dead” (Jas 2:26).<\/p><p><strong>Difficulty: <\/strong>This view puts the weight on personal spiritual growth, and the original flavor of κοινωνία (koinōnia)—something “held in common with others”—fades. Yet the center of the whole letter is exactly the relationship between one man and a community.<\/p>"],["[3] Where these notes stand","","<p><strong>These notes take the fellowship-of-faith view as primary: the fellowship of faith must “become effective” in one concrete act of welcome, echoing “If then you count me a partner” in 1:17. The sharing view and the participation view are set alongside.<\/strong><\/p><p>The pulpit need not lay out all three readings; it needs only to grasp one thing. How real a church’s faith is depends not only on how complete its statement of faith is, but on whether, when a man who once wronged someone stands at its door, that door can open. The end point of good works is Christ, not a display of our own magnanimity.<\/p>"],["[4] Should this affect your faith?","","<p>No. All three readings agree that faith is not a feeling that stays in the heart; it must be acted out, and acted out between people. The only dispute is where the emphasis of Paul’s sentence falls.<\/p><p>The most important question for you today is this: when was the last time my faith “became effective,” and toward whom? If the answer is always people who are easy to love, this verse is gently praying for you right now. For the book-wide position on contested questions and faith, see ISS00_9.<\/p>"]],"con":[],"say":"Where these notes stand: on 1:6 these notes take the “fellowship of faith” view as primary—the fellowship of faith must become effective in one concrete act of welcome, echoing “partner” in 1:17. The sharing view and the participation view are set alongside, and the pulpit does not stage the debate. For the book-wide position on contested questions and faith, see ISS00_9.","care":"In the pews there may be someone who feels his faith has “no effect”—no one believes when he shares the gospel, his service bears no fruit—and who will blame himself all the more on hearing this verse. Do not preach 1:6 as a performance review. A pastor can remind him that one genuine act of welcome, one chair pulled out for someone, is faith becoming effective. Do not compare his results with anyone else’s."},{"id":"ISS01_5","t":"“The aged” or “an ambassador”?","r":"1:9; Eph 6:20","ch":[1],"why":"In 1:9 every manuscript reads πρεσβύτης (presbytēs), “old man,” yet some translations (such as the RSV) and commentaries render it “ambassador.” This difference of a single word touches on a principle of textual criticism—may a conjecture with no manuscript support alter the text? It also touches on whether Paul is here displaying his authority or laying it down, which directly affects how we read the letter’s whole view of authority.","pos":[["[1] What the text is asking","","<p>WEB reads, “yet for love’s sake I rather beg, being such a one as Paul, the aged, but also a prisoner of Jesus Christ” (1:9), and the Chinese Union Version likewise has “the aged.” All the manuscripts read πρεσβύτης (presbytēs), “old man”; some scholars propose emending it to πρεσβευτής (presbeutēs), “ambassador”; still others think no emendation is needed, since πρεσβύτης (presbytēs) can itself carry the sense “ambassador.” The two words differ by a single letter. The question is this: is Paul calling himself an old man here, or Christ’s ambassador? The first is a position of weakness; the second, a title of authority.<\/p>"],["The old-man view (following the manuscripts)","","<p>Every Greek manuscript reads πρεσβύτης (presbytēs), and the Chinese Union Version’s “aged” follows this reading. The context supports it too: Paul has just said that he has “all boldness … to command,” yet “for love’s sake I rather beg”; then he places himself in two positions of weakness—old, and locked up. “The aged” and “prisoner” form a pair: this is a man who has laid down his authority, pleading.<\/p><p><strong>Difficulty: <\/strong>Paul was probably in his fifties when he wrote this letter, and whether that counted as an “old man” at the time is debated. Moreover, in ancient copying the spellings of these two words were sometimes interchanged, so some scholars feel that the agreement of the manuscripts alone cannot entirely rule out the other reading.<\/p>"],["Ambassador view one: conjectural emendation (Bentley)","","<p>In the eighteenth century Bentley proposed a conjecture: the original must have been πρεσβευτής (presbeutēs), “ambassador,” and a letter dropped out in copying. His reason was that in Ephesians Paul says, “for which I am an ambassador in chains” (Eph 6:20), which closely resembles “but also a prisoner of Jesus Christ.” On this reading Paul, even as he makes his request, reminds Philemon that the one writing is Christ’s representative.<\/p><p><strong>Difficulty: <\/strong>This conjectural emendation has no manuscript support whatever; it amounts to changing the text for the sake of a meaning. And in the context of 1:8–9, brandishing the title “ambassador” runs exactly counter to the direction Paul is taking—not commanding, only pleading.<\/p>"],["Ambassador view two: one spelling, two meanings (Lightfoot)","","<p>Lightfoot and other scholars do not alter the text. They point out that in the Greek of the day the spelling πρεσβύτης (presbytēs) was itself sometimes used to mean “ambassador,” the two words’ spellings often being interchangeable. On this reading the manuscripts’ word need not be touched; only its meaning may be “ambassador.” The “ambassador” of some translations (such as the RSV) takes this route, and it too can be linked to the “ambassador in chains” of Eph 6:20.<\/p><p><strong>Difficulty: <\/strong>Because this view requires no change to the text, the objection “no manuscript support” does not apply to it. Its difficulty lies in the context: Paul has just said he will not use his authority and has placed himself in a position of weakness, so to produce the title “ambassador” immediately afterward jars with the tone. And whether one spelling really carries the second meaning in this verse is still debated among scholars.<\/p>"],["[3] Where these notes stand","","<p><strong>These notes follow the manuscripts and the Chinese Union Version in reading “the aged”; the two “ambassador” views are set alongside.<\/strong>On Bentley’s conjectural emendation: with no manuscript support, the text should not be altered. On Lightfoot’s one-spelling-two-meanings view: the word may stand unchanged, but the direction of the context is the laying down of authority, and “the aged” and “prisoner” travel the same road. So these notes still take “the aged.”<\/p><p>The pulpit, then, need not hand Paul an extra title. What could an old prisoner use to pressure anyone? Love is all he has left to use. This is the letter’s whole view of authority: the one who could command chooses to plead for love’s sake.<\/p>"],["[4] Should this affect your faith?","","<p>No. Both readings agree that “for love’s sake I rather beg”—whether he is an old man or an ambassador, he does not use his authority to pressure anyone. Differences of a single letter like this one let us see that textual criticism is honest, open work, not something hidden away.<\/p><p>The more important question for you today is this: in the places where you hold authority, did you last command, or did you plead? For the book-wide position on authority and appeal, see ISS00_4; on contested questions and faith, see ISS00_9.<\/p>"]],"con":[],"say":"Where these notes stand: in 1:9 these notes follow the manuscripts and the Chinese Union Version in reading “the aged,” and set the two “ambassador” views—conjectural emendation and one spelling with two meanings—alongside. The direction of the context is the laying down of authority: pleading for love’s sake, not commanding. For the position these notes take across the whole book, see ISS00_4.","care":"In the pews there may be older brothers and sisters who feel they have grown old and useless, and that no one listens when they speak. Yet it was as “the aged” that Paul wrote this letter that changed a household. Do not preach old age as nothing but memories. A pastor can invite the elderly to “plead” with prayer and love—which is often more powerful than the commands of the young."},{"id":"ISS01_6","t":"Roman law and harboring fugitive slaves: could Paul have kept Onesimus?","r":"1:13–14; Deut 23:15–16","ch":[1],"why":"Paul says he “desired to keep” Onesimus with him, yet he sends him back. Under Roman law, anyone who harbored another person’s slave was answerable to the master; the law of Moses, by contrast, laid down that a slave who had escaped must not be handed back to his master (Deut 23:15–16). Why did Paul not follow Deuteronomy and keep him? This question bears on how we view Paul’s “sending back,” and on how the church today responds to people who have fled harm and come to us for help.","pos":[["[1] What the text is asking","","<p>“whom I desired to keep with me, that on your behalf he might serve me in my chains for the Good News. But I was willing to do nothing without your consent, that your goodness would not be as of necessity, but of free will” (1:13–14). The reason Paul gives is not “the law does not allow it” but “without your consent.” The question is this: did Paul send Onesimus back because Roman law forced him to, out of some moral obligation, or for the sake of a larger purpose?<\/p>"],["The legal-obligation view","","<p>Some scholars stress the background of Roman law: to harbor someone else’s fugitive slave was, in law, tantamount to misappropriating property, and the harborer had to compensate the master for his loss. As a Roman citizen and a friend of Philemon’s, Paul would have wronged Philemon both legally and morally had he kept Onesimus. Sending him back was Paul’s way of keeping the law—and also of protecting Onesimus from being hunted down.<\/p><p><strong>Difficulty: <\/strong>The reason Paul himself gives has nothing to do with law; it is the “free will” of 1:14. And if Onesimus had come to Paul as a mediator (amicus domini), the legal problem of harboring a fugitive does not even arise.<\/p>"],["The tension-with-the-law view","","<p>Other readers point to the command of Deut 23:15–16: “You shall not deliver to his master a servant who has escaped from his master to you”; rather, he is to live among you wherever he pleases. Paul knew the law well, yet chose to send Onesimus back. Some therefore think Paul compromised under the Roman system; others think Deuteronomy speaks of slaves fleeing from foreign lands into Israel, and cannot be applied directly to a slave in a believer’s household.<\/p><p><strong>Difficulty: <\/strong>Pushed too far, this view makes Paul out to be a lawbreaker. But Paul was not tossing a helpless man back into danger; he sent him back with a guarantee, a companion and the witness of an entire church. The situation differs from the one in Deuteronomy.<\/p>"],["The relationship-and-free-will view","","<p>Yet another view holds that keeping Onesimus would have been most convenient for Paul, and might perhaps have been managed legally; but what he wanted was more than the fate of one slave. He wanted the reconciliation of two brothers, and a good deed that came from Philemon’s free will. Had Paul acted first and informed him afterward, Philemon could only have nodded; his welcome would have been grudging, and in that household Onesimus would forever have been a reminder that “the master lost.”<\/p><p><strong>Difficulty: <\/strong>This view is beautiful, but we must take care that it is not misused to mean “for the sake of reconciliation, the one who was hurt must go back and face it.” Onesimus’s return was protected; not every return comes with such conditions.<\/p>"],["[3] Where these notes stand","","<p><strong>These notes take the relationship-and-free-will view as primary, setting the legal-obligation view and the tension-with-the-law view alongside. The most direct reason Paul sent Onesimus back is the “free will” of 1:14: he wanted Philemon to make the decision himself, and he wanted a broken relationship to have a chance of being restored in truth and under a guarantee.<\/strong><\/p><p>At the same time these notes draw a clear line: Onesimus’s return was a protected return—with a letter, with Tychicus traveling alongside (Col 4:7–9), with the witness of the church and with Paul’s guarantee. This passage must never be used to tell those suffering domestic violence, abuse or exploitation to go back to the people who are harming them. When someone’s physical safety is under threat, protect life first, seek help through the law and report it.<\/p>"],["[4] Should this affect your faith?","","<p>No. Paul’s choice shows us that when the gospel deals with a matter, it asks not only “Does the law allow it?” but also “Will this let people act freely, and make the relationship real?” Here is an apostle who will not use his authority to make decisions for others.<\/p><p>If you are in a relationship that is harming you right now, please hear this clearly: this passage is not telling you to go back. What the church should do is what Paul did—protect you, stay with you and speak up for you. For the book-wide position on forgiveness and return, see ISS00_3; on authority and appeal, see ISS00_4.<\/p>"]],"con":[],"say":"Where these notes stand: the most direct reason Paul sent Onesimus back is the “free will” of 1:14. And it was a protective return—with a letter, a companion, witnesses and a guarantee—which must never be used to send victims back into danger. For the position these notes take across the whole book, see ISS00_3 and ISS00_4.","care":"In the pews there may be a spouse who is suffering domestic violence, a migrant worker who has fled an exploitative employer, a teenager who has run away from home. When they hear “Paul sent him back,” their hearts may sink. Do not say, “You should go back and face it too.” A pastor must first ask whether they are safe right now, give them information on shelter and reporting, and walk with them through the proper channels for help. Protecting life always comes before reconciliation."},{"id":"ISS01_7","t":"“Separated from you for a while”—does God use human wrongdoing?","r":"1:15; Gen 50:20; Rom 8:28","ch":[1],"why":"Paul says, “perhaps he was therefore separated from you for a while, that you would have him forever” (1:15), seeming to hint that God’s hand lay behind Onesimus’s departure. Chinese churches often stretch this reading into “everything is God’s arrangement,” using it to comfort the wounded—and often wounding them further. This question bears on God’s sovereignty and human responsibility, and on how we ought to speak when others are suffering.","pos":[["[1] What the text is asking","","<p>Verse 1:15 has two key words. τάχα (tacha), “perhaps,” occurs only twice in the New Testament; ἐχωρίσθη (echōristhē), “was separated,” is in the passive voice. Paul does not say “he ran away,” nor does he say “this was God’s plan.” The question is this: does the passive voice hint that God was at work behind the scenes? If so, is Paul saying that God “used” what may have been Onesimus’s wrongdoing, or that God “arranged” the whole thing?<\/p>"],["The divine-passive view (a providential reading)","","<p>Many commentators read ἐχωρίσθη (echōristhē) as a “divine passive”: on the surface it was Onesimus who left, but behind it God was at work, so that Philemon might have a brother forever. This resembles what Joseph said to his brothers: “you meant evil against me, but God meant it for good” (Gen 50:20); it also echoes “all things work together for good for those who love God” (Rom 8:28).<\/p><p><strong>Difficulty: <\/strong>Take away Paul’s “perhaps,” and this view easily becomes “all of this was predestined by God to happen”—laying both the man’s wrongdoing and the other party’s loss at God’s door, and leaving the wounded afraid to voice their real pain.<\/p>"],["The euphemism view","","<p>Other scholars think the passive voice is simply Paul’s tact. He avoids harsh words such as “ran away” or “betrayed,” so that Philemon will not think of his loss the moment he reads, and the request can get a hearing. On this reading, 1:15 is chiefly rhetorical consideration, not the announcement of a theological conclusion.<\/p><p><strong>Difficulty: <\/strong>Taken all the way, this view misses the fact that Paul really is inviting Philemon to “change his perspective”—to look past the temporary to the eternal, and past the loss to the word that appeared on receipts as “paid in full.” That is not mere rhetoric; it is the eye of faith.<\/p>"],["The cautious-providence view","","<p>A further reading combines the two. Paul does see that God’s hand may be in it, which is why he uses the passive voice; but he governs the whole sentence with τάχα (tacha), “perhaps,” and will not pronounce God’s will with finality. God can work in the midst of human wrongdoing and brokenness without that making the wrong good, and without requiring the injured party to pretend he has not been injured—Paul still deals with the debt in 1:18.<\/p><p><strong>Difficulty: <\/strong>This view asks the preacher to strike a careful balance between certainty and uncertainty, which is harder to preach than a declaration. The congregation may also feel that “perhaps” is not strong enough, not comforting enough.<\/p>"],["[3] Where these notes stand","","<p><strong>These notes take the cautious-providence view: God can work through human wrongdoing to bring about eternal good; but Paul says “perhaps,” and these notes, too, refuse to say more than that.<\/strong>We do not say, “All the harm done to you was God’s plan.” We do not dress up betrayal, abuse or sin as God’s will, nor do we cancel the wrongdoer’s responsibility on the grounds that God can transform it.<\/p><p>The landing point of 1:15 is a “change of perspective”: from “he left” to “perhaps … that you would have him forever.” That way of seeing is for the injured person to come to slowly, before God, for himself; it is not something anyone else can pronounce on his behalf.<\/p>"],["[4] Should this affect your faith?","","<p>No. Every view agrees that God was not absent, and that human responsibility has not vanished. Paul sees what God may be doing, and he also deals with the real debt (1:18–19).<\/p><p>If you are in the middle of something broken right now, you can say two things at once: “What happened was wrong, and it hurts”; and “Lord, perhaps you can work here.” God does not need you to call the harm a good thing before he can work within it. For the book-wide position on forgiveness and return, see ISS00_3; on contested questions and faith, see ISS00_9.<\/p>"]],"con":[],"say":"Where these notes stand: in 1:15 Paul says “perhaps.” God can work in human wrongdoing, but these notes do not call harm, betrayal or sin God’s plan, nor do they cancel human responsibility; a change of perspective is something the wounded come to see slowly, before God. For the position these notes take across the whole book, see ISS00_3 and ISS00_9.","care":"In the pews there may be people betrayed by a spouse, swindled by a business partner, hurt by their closest family; the sentence they most dread hearing is “all of this is God’s arrangement.” Do not quote 1:15 or Rom 8:28 while the wound is still bleeding. Let the pastor first weep with them and acknowledge that what happened was wrong; then, when they themselves begin to ask God their own “perhaps,” look at it together with them."},{"id":"ISS01_8","t":"“Put that to my account”: is it a picture of substitutionary atonement?","r":"1:18–19; 2 Cor 5:19, 21; Rom 5:13","ch":[1],"why":"Luther said, “we are all his (Christ’s) Onesimi, if only we believe,” and that saying has made 1:18 one of the verses most often used to preach the gospel from Chinese pulpits. But did Paul himself mean this debt as a picture of atonement? Preach it as Paul’s doctrine, and the text is allegorized; leave it out entirely, and we seem to miss what has moved readers for two thousand years, who have thought of the cross at this very point. This question bears on how we read Scripture, and on how we preach the gospel.","pos":[["[1] What the text is asking","","<p>“But if he has wronged you at all or owes you anything, put that to my account. I, Paul, write this with my own hand: I will repay it” (1:18–19). ἐλλόγα (elloga) is a commercial term, “charge to an account,” and shares its root with ἐλλογεῖται (ellogeitai) in Rom 5:13. The question is this: is Paul deliberately using a picture of the gospel here, or simply dealing with a real debt? When readers think of Christ at this point, is that Paul’s intention, or the readers’ response?<\/p>"],["The gospel-picture view","","<p>From Luther onward, many preachers have read these two verses as the gospel in miniature: we are like Onesimus, in debt to our master; Christ is like Paul, saying, “put that to my account”; God the Father is like Philemon, receiving us on the strength of our guarantor. The power of this view is that it genuinely touches the heart—and the New Testament does indeed speak of God “not reckoning to them their trespasses” (2 Cor 5:19).<\/p><p><strong>Difficulty: <\/strong>Nowhere in this letter does Paul say this is a picture. Assigning a counterpart to every character turns Onesimus into a symbol and Philemon into a stand-in for God the Father—in which case, could Philemon refuse? Push the allegory any further and the text can no longer bear the weight.<\/p>"],["The real-guarantee view","","<p>Other commentators stress that what Paul wrote was a legally binding IOU: ἀποτίσω (apotisō) is the legal term for making restitution, and a signature in one’s own hand was the standard form of a promissory note at the time. Paul is dealing with the real loss Onesimus may have caused, so that Philemon’s welcome need not rest on swallowing the loss. The focus of this letter is a man with a name, not a system of doctrine.<\/p><p><strong>Difficulty: <\/strong>Preached too drily, this view ignores Paul’s own theological vocabulary. In Romans and 2 Corinthians he uses “count” and “reckon” to preach the gospel, and it is hard to imagine that he wrote these two verses without any thought of his own experience of being received by Christ.<\/p>"],["The echo view (“this brings to mind”)","","<p>A further view stands between the two. Paul is dealing with a real debt, and he does not write it as a figure of speech; but because Paul himself had first been received by Christ in just this way, what he does carries the echo of the gospel. For readers to think of the cross here is a legitimate response—“For him who knew no sin he made to be sin on our behalf” (2 Cor 5:21)—provided we say “this brings to mind,” and not that it is Paul’s argument.<\/p><p><strong>Difficulty: <\/strong>The line between “this brings to mind” and “this is what Paul meant” is not easy to keep in the pulpit; one careless step and the echo slides back into allegory.<\/p>"],["[3] Where these notes stand","","<p><strong>These notes take the echo view: 1:18–19 is a real guarantee in Paul’s own hand. It brings Christ to mind (Rom 5:13; 2 Cor 5:19, 21), but we do not present it as Paul’s typology or as teaching on the atonement, nor do we say that Onesimus is a type of the sinner.<\/strong>Luther’s saying belongs only under “this brings to mind.”<\/p><p>There is one more pastoral point in this question: the debt of the wrong is real, and someone has to be answerable for it. Grace is not pretending there was no wrong; it is someone shouldering the wrong. This keeps us from preaching forgiveness as “treat it as if it never happened,” and from telling the injured party to swallow the loss.<\/p>"],["[4] Should this affect your faith?","","<p>No. Whether or not Paul had it in mind, the gospel of the cross does not depend on these two verses for its proof; it is set out with perfect clarity in Romans and 2 Corinthians. What Philemon gives us is a picture of the gospel coming down onto one real debt.<\/p><p>You may pause here and give thanks: someone has shouldered your debt too. Only remember that the one who moves you is not Paul’s eloquence, but the Lord behind Paul, who first shouldered Paul’s own. For the book-wide position on reckoning and guarantee, see ISS00_5.<\/p>"]],"con":[],"say":"Where these notes stand: 1:18–19 is a real guarantee in Paul’s own hand. It brings Christ to mind, but we do not present it as Paul’s typology or as a doctrine of atonement, nor do we say that Onesimus is a type of the sinner. The debt of the wrong is real, and someone has to be answerable for it. For the position these notes take across the whole book, see ISS00_5.","care":"In the pews there may be people carrying real debts—money owed, an apology owed, years of time owed to their family—who will feel close to tears on hearing “put that to my account.” There may also be people on the injured side, afraid that “grace” will be used to make them swallow their loss. Do not say, “Once you believe, the slate is wiped clean, so stop keeping score.” A pastor can help the one who owes make concrete amends, and help the one who was wronged to be seen."},{"id":"ISS01_9","t":"Was Onesimus the later bishop of Ephesus?","r":"1:10; Col 4:9","ch":[1],"why":"Around AD 110, Ignatius of Antioch wrote to the church in Ephesus and mentioned that their bishop was named Onesimus. On this basis some scholars have speculated that the slave of years before later became a bishop—even that it was he who collected Paul’s letters, which is why this short private letter was preserved. It is a moving story, and pulpits often tell it as the ending; but how reliable it is deserves careful discernment.","pos":[["[1] What the text is asking","","<p>Philemon does not tell us what became of Onesimus. We know only that Paul calls him “my child, whom I have become the father of in my chains” (1:10), and that Colossians calls him “the faithful and beloved brother” (Col 4:9). The question is this: is the Onesimus, bishop of Ephesus, in Ignatius’s letters the same man as the Onesimus of Philemon? And if he is, does that explain why Philemon was included in the collection of Paul’s letters?<\/p>"],["The same-man view","","<p>In the twentieth century some scholars proposed that the opening chapters of Ignatius’s letter to the Ephesians seem deliberately to echo the wording of Philemon—for example, a pun on the name in the phrase “may I have benefit from you” (which brings to mind ὀναίμην (onaimēn) in 1:20, rendered in WEB “let me have joy from you”). If Onesimus later became bishop of Ephesus, he may well have taken part in collecting Paul’s letters, and this private letter was cherished for that reason: a man who was once useless had become a shepherd of the church.<\/p><p><strong>Difficulty: <\/strong>The two are about fifty years apart; the young slave would by then have been an old man—not impossible, but it requires an assumption. Ignatius’s pun may also be no more than common wordplay of the time: he uses ὀναίμην (onaimēn) repeatedly in his other letters as well (To the Romans 5:2, To Polycarp 1:1, and elsewhere), which is not enough to prove that he had Philemon in mind.<\/p>"],["The same-name, different-man view","","<p>Most scholars take the more cautious view. “Onesimus” (meaning “useful”) was an extremely common slave name at the time, and inscriptions and literature record many men who bore it. Although Ephesus and Colossae are not far apart, a shared name is not enough to prove a shared identity. Philemon’s inclusion in the canon can also be explained by its having been written at the same time as Colossians and sent on the same journey, so that the two were preserved together.<\/p><p><strong>Difficulty: <\/strong>This view must still face a coincidence: the name, place and date of the Ephesian bishop all fall within the possible span of the life of Philemon’s Onesimus. Ruling out entirely that they are the same man is not necessarily better grounded than affirming it.<\/p>"],["[3] Where these notes stand","","<p><strong>These notes set both views side by side without settling the question: that they were the same man is possible, but the evidence is insufficient.<\/strong>From the pulpit one may say, “some scholars have speculated,” but one may not state as settled fact that “Onesimus later became bishop of Ephesus.”<\/p><p>More important still: the hope of Philemon does not depend on this ending. Even if Onesimus was all his life simply a faithful brother with no office at all, the words “now is useful to you and to me” (1:11) have already come true. The worth of the gospel does not lie in how high a person later climbs.<\/p>"],["[4] Should this affect your faith?","","<p>No. This is a question mark of history, not a foundation of faith. Philemon was received into the canon because it brings the gospel down into one household, one man and one debt—not because it has a handsome ending.<\/p><p>We often want to write a happy ending for other people’s stories—the prodigal comes home, the slave becomes a bishop. What God gave Onesimus was already the best ending of all: a name called “beloved brother.” For the book-wide position on why it was received into the canon, see ISS00_8; on contested questions and faith, see ISS00_9.<\/p>"]],"con":[],"say":"Where these notes stand: whether the Onesimus, bishop of Ephesus, in Ignatius’s letters is the Onesimus of Philemon, these notes set both views side by side without settling the question. The pulpit says only “some scholars have speculated”; the hope of the gospel does not depend on this ending. For the position these notes tak
