e across the whole book, see ISS00_8.","care":"In the pews there may be people who once went astray and are now working hard to start over; hearing “the slave became a bishop” will greatly encourage them—though some may also feel, “I won’t have an ending that remarkable.” Do not preach the rise from rock bottom as the standard specimen of grace. A pastor can remind them that to be called a son by God and to be caught and held by brothers and sisters is already grace complete. Nor should anyone compare them with someone else’s success story."}],"terrain":{"points":[[0.56,60,2,"The assembly in your house",null],[0.76,78,7,"Saints’ hearts refreshed","top"],[0.84,66,9,"For love’s sake I beg",null],[0.88,72,10,"My child, born in my chains",null],[0.92,14,11,"Once useless to you","bot"],[1.08,30,15,"Separated for a while","bot"],[1.12,98,16,"More than a slave: a brother","top"],[1.2,26,18,"If he owes you anything","bot"],[1.24,90,19,"I will repay it","top"],[1.48,84,25,"Grace be with your spirit",null]]},"tracks":[{"gk":"Χριστός / κύριος","tr":"Christos / kyrios","gl":"Christ, Lord (in Christ, in the Lord)","code":"G5547","root":"Χριστός — the Anointed One, the Messiah; κύριος — lord, master. κύριος is also the word a slave used to address his master: in Philemon’s household, Onesimus called Philemon κύριε every day. In this short letter Paul uses “Christ” eight times and “Lord” five times, setting this household under a higher Master","ins":"The first station of this word family is a prisoner: “Paul, a prisoner of Christ Jesus” (1:1) — Paul does not call himself an apostle but Christ’s prisoner. The greeting fixes the source of grace and peace in “God our Father and the Lord Jesus Christ” (1:3). Philemon’s faith is “toward the Lord Jesus” (1:5), and the goal of his good works is Christ (1:6, εἰς Χριστόν, “unto Christ”). Verse 8 brings the first reversal: Paul has “all boldness in Christ to command” — he has authority, and that authority comes from Christ; yet in the next verse he calls himself “a prisoner of Jesus Christ” (1:9) — the source of authority turns out to be a man in chains. Verse 16 is the climax: “both in the flesh and in the Lord.” κύριος was the word a slave used for his master; now master and slave share one Lord, and before this Lord, Onesimus is “a beloved brother.” In verse 20 Paul asks Philemon to let him have joy “in the Lord” and to refresh his heart in Christ (WEB has “in the Lord” again; the Greek text followed here reads ἐν Χριστῷ). In verse 23 even Epaphras, his fellow prisoner, is a prisoner “in Christ Jesus.” The final station: “The grace of our Lord Jesus Christ be with your spirit” (1:25) — the letter begins in prison and ends in grace. Who the true Master of this household is determines who the man at the door is.","stops":[["1:1","Paul, a prisoner of Christ Jesus","top"],["1:3","Grace to you and peace from God our Father and the Lord Jesus Christ",""],["1:5","the faith which you have toward the Lord Jesus, and toward all the saints",""],["1:6","every good thing which is in us in Christ Jesus",""],["1:8","though I have all boldness in Christ to command you that which is appropriate",""],["1:9","but also a prisoner of Jesus Christ",""],["1:16","both in the flesh and in the Lord","top"],["1:20","let me have joy from you in the Lord. Refresh my heart in the Lord",""],["1:23","Epaphras, my fellow prisoner in Christ Jesus, greets you",""],["1:25","The grace of our Lord Jesus Christ be with your spirit","top"]]},{"gk":"ἀγάπη / ἀγαπητός / σπλάγχνα","tr":"agapē / agapētos / splanchna","gl":"love, beloved, heart (inward affections)","code":"G26","root":"ἀγάπη — love; ἀγαπητός — loved, beloved; σπλάγχνα — the inward parts, which for the Greeks were the seat of feeling (much as we speak of the heart). This letter speaks of “love” three times, “beloved” twice and the “heart” three times","ins":"At the first station, “beloved” is Philemon’s title: “to Philemon, our beloved fellow worker” (1:1). Paul has heard of his love (1:5), and that love has already taken on flesh: “the hearts of the saints have been refreshed through you” (1:7) — the first appearance of σπλάγχνα, as the hearts of many find rest in his home. In verse 9 love changes direction: it is no longer Philemon’s love but the manner of Paul’s request — “for love’s sake I rather beg.” Verse 12 is the first reversal: the word “heart” becomes a person — “that is, my own heart,” literally “he is my very inward parts”; Paul is sending his own heart back. Verse 16 is the second reversal: “beloved,” the title that once belonged to Philemon, is given to Onesimus — “a beloved brother.” The final station joins the three “hearts” together: you refreshed the hearts of the saints (7); my heart is standing at your door (12); and now, “Refresh my heart in the Lord” (1:20). Love is not a feeling; it is a heart sent to stand at someone else’s door.","stops":[["1:1","to Philemon, our beloved fellow worker",""],["1:5","hearing of your love",""],["1:7","we have much joy and comfort in your love, because the hearts of the saints have been refreshed through you","top"],["1:9","for love’s sake I rather beg",""],["1:12","that is, my own heart","top"],["1:16","a beloved brother","top"],["1:20","Refresh my heart in the Lord",""]]},{"gk":"ἀδελφός / ἀδελφή / συν- / κοινων-","tr":"adelphos / adelphē / syn- / koinōn-","gl":"brother, sister, fellow worker, fellow soldier, fellow prisoner, partner","code":"G80","root":"ἀδελφός — brother (from the same womb); συνεργός — fellow worker; συστρατιώτης — fellow soldier; συναιχμάλωτος — fellow captive; κοινωνία / κοινωνός — sharing, partner (the same word was used of a business partner). This short letter is full of “fellow” words: Paul puts everyone in the same boat","ins":"The letter opens as a family: “Timothy our brother,” “Philemon, our beloved fellow worker” (1:1), Apphia our sister (the Greek reads ἀδελφή, where WEB has “the beloved Apphia”), and “Archippus our fellow soldier” (1:2). In verse 6, κοινωνία — “the fellowship of your faith” — makes faith a shared estate. In verse 7 Paul calls Philemon “brother” directly for the first time. Verse 16 is the first reversal: the same word is given to a slave — “a beloved brother”; Philemon has gained a brother he never chose. Verse 17 is the second reversal: κοινωνός is a business partner — “If then you count me a partner, receive him”: the qualification for being a partner is receiving the one I have received. In verse 20 Paul says “brother” once more, this time at the height of his appeal. The last two stations are a list of names: “Epaphras, my fellow prisoner” (1:23), and “Mark, Aristarchus, Demas, and Luke, my fellow workers” (1:24). This list includes one man who once turned back partway and later returned, and one who would later leave (this reminds us of 2 Tim 4:10–11) — companions are real, not perfect, and it is into just such a list that Onesimus is received.","stops":[["1:1","Timothy our brother, to Philemon, our beloved fellow worker",""],["1:2","to the beloved Apphia, to Archippus our fellow soldier",""],["1:6","that the fellowship of your faith may become effective",""],["1:7","brother",""],["1:16","a beloved brother","top"],["1:17","If then you count me a partner, receive him as you would receive me","top"],["1:20","Yes, brother",""],["1:23","Epaphras, my fellow prisoner in Christ Jesus, greets you",""],["1:24","as do Mark, Aristarchus, Demas, and Luke, my fellow workers",""]]}],"lesson":{"1":{"no":1,"vol":"321 Philemon Study Notes · Lesson 1 · Philemon","title":"Charge It to My Account — Heart, IOU, Brother","chars":5164,"min":60,"deep":8,"dchars":1691,"tchars":1473,"blocks":[["h","1. The Second Signature on the IOU"],["p","Brothers and sisters, peace to you. In a great many Chinese families, the older generation has passed down the same piece of advice: never, ever co-sign a loan for anyone. Why not? Because on that IOU, besides the name of the man who borrowed the money, there is a second signature. And if one day the borrower disappears and the creditor comes knocking, he does not go looking for the borrower. He goes looking for the one who signed the second name. That stroke of the pen writes somebody else’s debt into your own name."],["p","There is a letter in the New Testament with exactly that kind of signature in its second half. The man writing it is sitting in prison, and most likely he is dictating to a scribe. But when he reaches this point, he takes the pen into his own hand and writes: “But if he has wronged you at all or owes you anything, put that to my account.” (1:18) “I, Paul, write this with my own hand: I will repay it.” (1:19) That is the letter to Philemon. One chapter, twenty-five verses — a letter of guarantee written into a letter."],["p","Who is the borrower? His name is Onesimus, a slave in the household of Philemon, a believer in Colossae. Under Roman law a slave was property — a thing. Onesimus had left his master’s house, and may well have cost his master money as well; later, in Paul’s chains, he came to faith in the Lord. Did he run away, or did he go looking for Paul to mediate? The contested-questions page sets out the options; this lesson does not rule on it. What is certain is this: now he is to carry Paul’s letter back and stand once again at that household’s door."],["p","So there are three people in this letter. Paul, who writes it: he could command, yet he appeals; he could keep the man, yet he sends him back; he could settle the account, yet he shoulders it himself. Philemon, who receives it: he has his rights and his reasons, and he is being invited to lay them down. Onesimus, who carries it: once useless, now standing at the door. The letter itself moves in three steps: Love, Appeal, Receive. In this lesson we will teach it through three words: heart, IOU, brother."],["p","Listen first to the opening line: “Paul, a prisoner of Christ Jesus” (1:1). In his other letters Paul usually opens by calling himself an apostle. In this one he calls himself only a prisoner — in the Greek δέσμιος (desmios), a man who is bound. In the very first line he lays his authority down. And among the recipients is “the assembly in your house” (1:2). Why read out a household matter in front of the whole church? Because when someone is welcomed back, it is never a matter between just two people. The church is present as witness, and as protection. Then come grace and peace (1:3): this letter begins with grace and ends in grace, and the very hard request is set between two layers of it."],["d",["Was Onesimus really a runaway slave? And if he was not, does the letter still make sense?","It makes sense either way. Scholars read the situation in four ways. The first is the traditional reading: he fled his master and met Paul where Paul was imprisoned. The second: he had fallen out with his master and went to Paul of his own accord to ask him to mediate — a recognized practice under Roman law. The third: Philemon had sent him to serve Paul. The fourth, held by a few: he and Philemon were blood brothers. These notes take the first two as the main readings, but do not rule between them. When you teach, simply hold on to what the text makes certain: he was away from his master for a while; he had once been useless to his master; he may have caused him a loss; he came to faith in Paul’s chains; and now he is going back carrying a letter. Whichever reading you take, the letter has the same power."]],["h","2. Love: A Home Where People Can Catch Their Breath"],["p","Paul does not open with his request. He opens with thanksgiving: “I thank my God always, making mention of you in my prayers” (1:4), because he keeps hearing of Philemon’s love and faith (1:5). Thanks first, request afterward — but this is no persuasion technique. Paul is treating Philemon as a brother worthy of trust."],["p","Verse 6 is the hardest sentence in the whole letter to translate: “that the fellowship of your faith may become effective in the knowledge of every good thing which is in us in Christ Jesus.” (1:6) The key word behind “the fellowship of your faith” is the Greek κοινωνία (koinōnia): fellowship, partnership, sharing. Interpreters read it in different ways, but on one thing they agree: faith has to “become effective” — it has to be put into action. When we reach verse 17, Paul will use a word from the same root: “If then you count me a partner” (1:17). In other words, how real our fellowship of faith is will show when someone who once wronged you is standing at the door — and we find out whether that door can open."],["p","Verse 7: “For we have much joy and comfort in your love, because the hearts of the saints have been refreshed through you, brother.” (1:7) “Refreshed” is the Greek ἀναπέπαυται (anapepautai): to let someone stop and catch their breath. And it is in the perfect tense: they have been given rest, and they remain rested. People came into his house weary and went out lightened."],["p","It reminds us of the Lord Jesus saying, “I will give you rest” — the very same verb (Matt 11:28). The Lord gives rest, and Philemon was a pair of hands that rest passed through. Philemon is no villain. Paul is asking him to do what he has always done — only now for the hardest person of all. Every one of us keeps a list for our love, and on it are the people who are easy to love. Paul simply gives thanks first, and then, gently, adds one more name."],["d",["What exactly does verse 6 mean when it speaks of “the fellowship of your faith” becoming “effective”?","This is the hardest sentence in the letter to translate, and interpreters read it differently. The key word, κοινωνία (koinōnia), can be taken three ways: first, the faith you share with others; second, the fellowship or partnership with us that you have through faith; third, your own participation in the faith itself. The Chinese Union Version’s rendering leans toward the second. The judgment of these notes is this: the word shares a root with “partner” in verse 17, “If then you count me a partner,” so what Paul prays for in verse 6 as fellowship has to come down to earth in verse 17. The fellowship of faith must become effective in one concrete act of welcome. How real a small group’s faith is will show when someone who once wronged others comes back — and we see how everyone receives him."]],["h","3. Appeal: The One Who Could Command Chooses to Ask"],["p","In verse 8 Paul says he has “all boldness in Christ to command you that which is appropriate” (1:8). “Command” is the Greek ἐπιτάσσειν (epitassein), the word for an order given by someone in authority. He had that authority. But the next line reads: “yet for love’s sake I rather beg” (1:9). He had not lost his authority; he chose not to use it. A command can get you compliance; only an appeal can win a heart. He also calls himself “the aged” — in the Greek πρεσβύτης (presbytēs), an old man. An old man, and a prisoner besides: what could he possibly use to pressure anyone? Love was all he had left."],["p","The word order of verse 10 is remarkable. In the Greek Paul first says “my child,” then “whom I have become the father of in my chains,” and only with the very last word does the name come: Ὀνήσιμον (Onēsimon). Before Philemon ever hears the name, he hears what place this man holds in Paul’s heart. Under Roman law he was property; on Paul’s lips he is a son. Then comes the lowest line in the letter: “who once was useless to you, but now is useful to you and to me.” (1:11) Paul does not whitewash him, but he sums up his past in a single word and moves straight on to “now.” And this “now” was born in chains; its source is the gospel."],["p","“I am sending him back. … that is, my own heart” (1:12). When you teach this verse, be sure to see clearly how he goes back. He has Paul’s letter in his hand. Tychicus travels with him. The letter is read before the whole church, and everyone present is a witness. And Paul has written a guarantee in his own hand (1:17–19). This is a return under protection."],["p","In another letter Paul introduces him like this: “together with Onesimus, the faithful and beloved brother, who is one of you.” (Col 4:9) He did not go back alone. So this verse must never be used to tell a spouse suffering domestic violence, an abused child or an exploited migrant worker to go back to the person who is hurting them. If your physical safety is under threat right now, protect your life first, seek help through the proper legal channels, and find someone to report it. The church should be standing beside you — not standing in the doorway pushing you back in."],["p","In verses 13 and 14 Paul says he had wanted to keep Onesimus with him to serve him, “But I was willing to do nothing without your consent, that your goodness would not be as of necessity, but of free will.” (1:14) To keep the man first and ask for permission afterward would have been presenting Philemon with a done deal. Paul hands the decision back to him, whole and entire. “Free will” is the Greek ἑκούσιον (hekousion): of one’s own accord. A request is a request — not a command in disguise."],["p","Verse 15: “For perhaps he was therefore separated from you for a while, that you would have him forever” (1:15). Listen to that word “perhaps” — in the Greek τάχα (tacha), maybe. Paul does not overstate the case. “Separated” is the Greek ἐχωρίσθη (echōristhē), a passive: he was parted from you. Paul does not say he ran away. “Have” is the Greek ἀπέχῃς (apechēs), a word found on receipts: paid in full. You thought you had a loss on your books, Paul says; what you have received is payment in full — and it is forever. But be careful here: “God can work in brokenness” and “the harm was God’s plan” are two very different sentences."],["p","Then comes the highest line in the letter: “no longer as a slave, but more than a slave, a beloved brother” (1:16). In verse 1, Timothy was the brother and Philemon the beloved; now the two titles come together and settle on the man standing at the door. A thing has been called a brother. And Paul adds: “both in the flesh and in the Lord” (1:16). In the Lord he is a brother; in the flesh he is a brother too. Not only in the meeting, but in the account books — and tomorrow morning, when the day’s work is handed out."],["p","We need to say this plainly: the New Testament does not endorse slavery. Paul tells those who are slaves, “if you get an opportunity to become free, use it” (1 Cor 7:21), and he lists “slave-traders” among the things “contrary to the sound doctrine” (1 Tim 1:10). The letter to Philemon was not written as a manifesto. It lets the gospel into a household and turns the relationship of master and slave inside out from within."],["d",["Why didn’t Paul simply demand that Philemon set Onesimus free? Does that mean he tacitly accepted slavery?","No, it was not tacit approval. The New Testament does not endorse slavery: Paul tells those who are slaves that if they get an opportunity to become free, they should use it (1 Cor 7:21), and he lists slave-traders among the things contrary to sound doctrine (1 Tim 1:10). He wrote no abolitionist manifesto, and scholars understand that in several ways. One: the limits of the situation — a handful of small house churches could not move the institutions of Rome. Two: the gospel works like a seed, overturning the master–slave relationship from inside a household. Three: Paul did in fact hint at freedom, and “you will do even beyond what I say” in verse 21 may refer to exactly that. These notes do not pin it down. What is certain is that verse 16 asks Philemon to see him “no longer as a slave,” and as a brother “in the flesh” as well — and that has already hollowed out the very foundation for treating a person as a thing. The direction is toward dignity and freedom."]],["d",["“For perhaps he was therefore separated from you for a while, that you would have him forever” — does that mean the harm done to me was arranged by God too?","It cannot be read that way. Paul uses τάχα (tacha): perhaps, maybe. He sees that God’s hand may be at work in this, but he does not state it as settled fact — still less does he say that whatever wrong Onesimus may have done, or the loss Philemon suffered, was something God wanted to happen. It is true that God can work in places of brokenness. It is also true that the harm itself is wrong and that the one who caused it is responsible. Both sentences have to be said. Call the harm God’s plan, and the person who was hurt will be afraid to ask for help. If you are in a harmful situation right now, your first task is not to work out God’s will. It is to get safe and find someone to help."]],["h","4. Light from the Greek: Heart, Useful, Charged to My Account"],["p","By verse 17, after sixteen verses of thanksgiving, appeal and explanation, Paul uses the imperative for the first time: “If then you count me a partner, receive him as you would receive me.” (1:17) “Partner” is the Greek κοινωνόν (koinōnon), a business partner. “Receive” is the Greek προσλαβοῦ (proslabou), to take someone in to your side. To receive is to bring a person in through the door — the same table, the same guest room. Now, come with me as we unpack three Greek words."],["p","The first word: σπλάγχνα (splanchna). The Chinese Union Version renders it simply “heart”; the Greek is the inward parts, the deepest and tenderest place in a person. It appears three times in the letter, threading the three sections together. In verse 7, the hearts of the saints have been refreshed through you. In verse 12, Onesimus is “my own heart” — literally, he is my very insides. In verse 20, “Refresh my heart in the Lord” (1:20). Hear them together: you have let everyone’s heart catch its breath; now my heart is standing at your door; please let my heart catch its breath as well. What Paul is sending back is not a piece of property. It is his own heart."],["p","The second word is really a pair of puns. The name Onesimus, Ὀνήσιμος (Onēsimos), means “useful.” Paul says that once he was ἄχρηστον (achrēston), useless, but now εὔχρηστον (euchrēston), useful. The man named Useful had once been useless; now at last he lives up to his name. In verse 20 Paul does it again: “let me have joy from you in the Lord” (1:20). “Have joy” is the Greek ὀναίμην (onaimēn), from the same root as the name, and a footnote in the Chinese Union Version notes that it can also be rendered “benefit.” The gospel does not erase a person’s past. The gospel gives him a “now.”"],["p","The third word: ἐλλόγα (elloga), “put that to my account” — a commercial term. “But if he has wronged you at all or owes you anything, put that to my account” (1:18). Paul never says, “Let bygones be bygones.” The wrong is real, the debt is real, and someone has to be responsible for it. Paul does not tear up the ledger. He changes the name on it: charge it to me. And he takes the pen himself: “I will repay it” (1:19) — the Greek ἀποτίσω (apotisō), a legal term used on promissory notes of the day."],["p","Paul is not teaching a doctrine of atonement here, nor does he say that Onesimus stands for sinners; he is dealing with a real debt. And yet this debt reminds us of another: “For him who knew no sin he made to be sin on our behalf; so that in him we might become the righteousness of God.” (2 Cor 5:21) The same Paul also says that God in Christ was “not reckoning to them their trespasses” (2 Cor 5:19). Our debt was not treated as though it did not exist. It was charged to Another’s account. And he did not merely write an IOU; he paid it in full on the cross."],["p","The second half of verse 19 — “you owe to me even your own self besides” (1:19) — can be read as gentle pressure or as a reminder given with a smile. I lean slightly toward the latter: a debt of gratitude still carries weight. But either way, it must never become pulpit language for binding people with what they owe you. “Having confidence in your obedience” (1:21) is trust, not a threat. Obedience to what? The text does not say. It may be Paul’s request; it may be the gospel itself. Either way, it is not unconditional submission to a person, nor a phrase for silencing questions. Paul also plans to come and stay (1:22). A person who is welcomed back is not simply handed over and then left to fend for himself."],["p","Last come the five who send greetings: Epaphras, Mark, Aristarchus, Demas and Luke. Mark had once turned back partway, yet later Paul would say that “he is useful to me” (2 Tim 4:11) — the very word for “useful.” Demas later left (2 Tim 4:10). The list is real, not perfect. We do not use Demas to shame those who have left the church, nor do we claim that everyone who leaves will come back."],["p","Then comes the final line: “The grace of our Lord Jesus Christ be with your spirit. Amen.” (1:25) In the Greek, “your” is plural: the grace is given to the whole household. A door opened through gritted teeth will soon swing shut again. Grace comes first; then welcome."],["d",["Can “put that to my account” be called a picture of the atonement? Does Onesimus represent us?","The answer has two layers. On the first: Paul is dealing here with a real debt. He does not say it is a parable of the gospel, nor does he teach a doctrine of atonement, and to assign Onesimus, Philemon and Paul each a symbolic role one by one is to say too much. On the second: there is good reason why readers of this letter have paused here for two thousand years. ἐλλόγα (elloga), “put that to my account,” shares its root with the word Romans uses when it says sin is not “charged” (Rom 5:13); and elsewhere Paul says that God does not reckon people’s trespasses to them (2 Cor 5:19). So these notes put it this way: this debt reminds us of another debt. Luther’s line, that we are all Christ’s Onesimus if we believe, belongs in exactly that place. That way, no one forgets that Onesimus was a person with a name — and yet here we also see the shape of the cross."]],["h","5. Distortions We Must Learn to Recognize"],["p","The first distortion is to begin with the 321 principles — people matter more than tasks, relationships more than things — and then use the story of Onesimus as an illustration, or to teach the whole letter as a class in persuasion techniques. The order is gospel first; 321 recognizes it at the end. The focus is on the Lord who shoulders the debt, not on Paul’s eloquence."],["p","The second distortion is to claim that because Paul sent a slave back to his master, the Bible supports slavery — or, the other way round, that because Paul did not demand the abolition of slavery, this book is out of date. Both claims read the letter backward. The New Testament does not endorse slavery, and verse 16 asks Philemon to see him as no longer a slave."],["p","The third distortion is to misuse verse 12 to tell a spouse suffering domestic violence, an abused child, or an exploited migrant worker or employee to go back to the person who is hurting them. Onesimus went back with a letter, with a traveling companion, with the church as witness and with a guarantor. When someone’s physical safety is threatened, protect life first, seek help through the proper legal channels, and report it."],["p","The fourth distortion is to press people who have been hurt to forgive at once and welcome back at once — “Philemon let go of a loss that big; why can’t you?” — or to present forgiveness as wiping the slate clean and restoring the person to his old position straight away. Forgiveness means handing judgment over to God, and it can begin first before God. Reconciliation is a road both parties walk, and it requires repentance and safety. Forgiveness is not the same as reconciliation, nor is it the same as letting someone off: the debt in verses 18 and 19 is real, and someone takes responsibility for it."],["p","The fifth distortion is to preach verse 18 as Paul’s typology — Onesimus is the sinner, Philemon is God the Father; or to preach verse 15 as meaning that every hurt you have suffered was God’s plan; or to treat verse 19 as a model for binding people with what they owe you: “I led you to the Lord, so you have to do what I say.” That too is wrong. Paul is dealing with a real debt; he says only “perhaps”; and what he wants is free will."],["h","6. Two Real Questions from Chinese Contexts"],["p","The first question: the caregiver in your home. Many families hire a foreign domestic caregiver to look after an elderly parent, and she may well be sitting in our meetings too. On Sunday we call her sister. On Monday, what time does she get up? How many days off does she get a month? Is she allowed to use her phone? Does her room have a door? She is not an ancient slave, but she can just as easily be seen as a unit of labor, a line item of cost. “Both in the flesh and in the Lord” (1:16). In the Lord, she is a sister; in the flesh, her hours, her days off, her pay and her name must also be treated the way you would treat a sister’s. The first step is to be able to call her by her real name."],["p","The second question: should I go back, and should I forgive? Chinese families say, “When the family is at peace, everything prospers.” Perhaps years ago your father ran off with the family’s money. Now he is old and ill, and relatives are calling: “He’s your dad. Come home.” Philemon does not hand you a quick “Just forgive him.” It gives you a path with stages. Forgiveness can begin first before God, as you hand judgment over to him. Reconciliation requires genuine repentance on the other side; it requires someone to talk things through plainly; and it requires your safety. If that person once laid hands on you and still makes you afraid today, you do not have to go back. Protect yourself first, and find people you trust and professional help. The debt is real. You can take the road slowly."],["d",["We have a foreign caregiver in our home. What does it look like to treat her rightly “both in the flesh and in the Lord”?","You can begin with three small things. First, her name: call her by her real name, not “the one we have at home.” Remember the names of her children back home and ask how they are doing. Second, the books: pay her full wages, overtime and days off as the law requires; do not hold on to her passport or papers; give her a room with a door and time to contact her family. That is what “in the flesh” looks like. Third, the table: let her eat with the family rather than hiding in the kitchen; and if she is a believer, help her find a gathering in her own language. She is not an ancient slave. What this letter reminds us is that a person’s place in a contract cannot determine her worth in God’s eyes. If you call her sister on Sunday, treat her that way on Monday too."]],["h","7. Living Out 321 — One More Chair by the Door"],["p","Only once the text has been fully taught does 321 recognize it at the end."],["p","Jesus is my role model: Paul does not call himself an apostle, only a prisoner; he could command, yet he appeals; he writes someone else’s debt into his own name. Paul did not invent these three strokes. He traced them from a Lord who “emptied himself, taking the form of a servant” (Phil 2:7). The Lord himself was the first to take the place of a slave."],["p","The Bible is my standard: “both in the flesh and in the Lord” (1:16). The standard does not govern only our meetings. It governs the account books, the household rules and the work roster as well."],["p","The Holy Spirit is my guide: verse 15 says only “perhaps.” In uncertainty, the Spirit helps us see God’s hand without putting words in God’s mouth — and without calling harm the will of God."],["p","Let Jesus be King: in that day slaves called their masters κύριος (kyrios); the “masters” addressed in Col 4:1 are called by this very word. But Paul says “in the Lord” (1:20): this household has a higher Lord. To let him be King is to give up three seats: the judge’s seat, the owner’s seat and the seat of saving face."],["p","Let Jesus receive all the glory: Paul prays that the fellowship of Philemon’s faith may become effective “in the knowledge of every good thing which is in us in Christ Jesus” (1:6) — so that every good thing is seen to be done for Christ. When a household welcomes a returning person through its door, what people see is not how generous the master is. They see Christ."],["p","Establish God’s system: the smallest unit of the system is “the assembly in your house” (1:2) — one living room, one table. Its test is not how lively the meetings are, but whether a returning person gets a seat at that table. Kingdom 321 Online Fellowship is scattered across many countries, and welcoming someone back is not one person’s heroic act either. It is a whole group holding that person up together."],["h","8. The Four Hearts: Which Side of the Door Are You On?"],["p","The proud heart stands inside the door, hand on the handle: I’m in the right. I’m the one who lost out. He has to bow first, pay it all back first, prove himself first — then I’ll think about it. Paul does not deny that you lost out. He simply asks you to look at the IOU: someone has already shouldered that debt. Paul, who could command, laid his rights down first, and that is what made it possible for Philemon, who was being invited, to lay his down too. Humility sets humility in motion."],["p","The fearful heart is afraid that opening the door will mean getting hurt all over again — afraid people will call it weakness, and just as afraid of being called unspiritual for keeping it shut. Listen to verse 14: what Paul wants is free will, not necessity. You can take your time. You can begin simply by praying for that person. Being afraid is not a sin."],["p","The ashamed heart stands outside the door, raising a hand to knock and letting it fall again: I was useless once. I owed people. I walked away. Remember that Paul spoke of Onesimus’s past in a single word and moved straight on to “now.” Before you ever knock, Someone has already signed the guarantee for you."],["p","The hurting heart may have been wronged by family, by an employer, even by people in the church — and then pushed to hurry up and forgive. Those words were never what Philemon means. Forgiveness is not the same as reconciliation, and it is not the same as pretending it never happened. If that person is still hurting you, get safe first, find someone you trust to walk with you, and seek professional help where needed. The Lord who shoulders the debt sees what is owed to you."],["d",["Someone who once wronged me has come back, and the church is urging me to welcome him. But I’m not ready yet. What do I do?","Let’s be clear first: not being ready is not a sin. Paul wanted Philemon’s goodness to be “would not be as of necessity, but of free will” (1:14). Forgiveness and reconciliation are two different things. Forgiveness is you handing judgment over before God, and it can begin with prayer, a little at a time. Reconciliation is a road for two people; it requires genuine repentance on the other side, someone to talk things through plainly, and your safety. Nor does forgiveness mean pretending it never happened or restoring someone to his old position: the debt in verse 18 is real, and someone has to take responsibility for it. If that person ever laid hands on you, or still makes you afraid today, you do not have to see him. Find a pastor or someone you trust to stand with you, and seek professional help where needed."]],["h","9. A Few Things You Can Do This Week"],["p","For the following five things, please write down a time, a place and a name before we leave today."],["p","First, read 1:15–19 once every morning. When you reach “put that to my account,” stop, name one debt of your own to the Lord, and then say: Lord, thank you for charging it to your account."],["p","Second, in your home, your workplace or your church, find someone who is usually treated as a unit of labor — a caregiver, a cleaning auntie, a coworker sent by an agency. Before Friday, learn their name and call them by it once, face to face. If you are the employer or the manager, check their hours, days off and pay."],["p","Third, write down the name of someone you have been keeping accounts against, and ask yourself: am I willing to hand judgment over to God? Once you have written it, you do not need to go and find them right away."],["p","Fourth, if you have wronged someone, write a short message. Don’t ask them to forgive you; simply own what you did and ask how you can make it right. If there has been violence between you, do not contact them yet — talk with a pastor first."],["p","Fifth, this Sunday, at a meal table or in an online small group, invite someone who usually doesn’t get invited."],["p","Then let us say these four sentences out loud together."],["p","I declare: the Lord Jesus has already charged my debt to his own account; I will no longer let my past define me."],["p","I declare: both in the flesh and in the Lord, every person around me is a person with a name, not a unit of labor."],["p","I declare: my welcome will come from free will, not from necessity; I hand judgment over to God, and I take every person’s safety seriously."],["p","I declare: may the grace of the Lord Jesus Christ be in my heart always — and in this household of ours as well."],["d",["What if I am the Onesimus — the one who wronged someone? What is my first step?","Go back first to verse 18. Paul does not tell Philemon to forget Onesimus’s past; he admits there may have been a wrong, and a debt. So the first step is honesty: before God, name that debt — no excuses, no shrinking it down. The second step is to own it, not to make demands: write a short message or a letter saying what you did and what it did to the other person, and then ask how you can make it right. Do not ask them in that message to forgive you; that is their road to walk. The third step is to find a Paul: a pastor who will help you think through how to make restitution and how to begin the conversation. If you were ever violent toward that person, do not go to them on your own. Talk with a pastor first, and respect their safety and their wishes. Before you ever knock, the Lord Jesus has already charged your debt to his own account."]],["h","10. Closing Word"],["p","This lesson began with an IOU. And the most moving thing in the letter to Philemon is exactly this: an old man in prison signing the second name on an IOU for someone who had once been useless. The text does not tell us what Philemon did next. But this letter was preserved and read aloud generation after generation, and we have good reason to hope that the door opened."],["p","The focus of this lesson is not whether Philemon was generous enough, nor how eloquent Paul was. The focus is on the Lord who charged our debt to his own account. So the order of this chapter is this: grace comes first — “The grace of our Lord Jesus Christ be with your spirit” (1:25); then welcome — “receive him as you would receive me” (1:17); and only then can we see a person as “a beloved brother” (1:16). Please don’t come away admiring Paul more. Come away loving more the Lord who says, “Put that to my account.”"],["p","Let us bow our heads and pray together. Heavenly Father, thank you that our debt was not treated as though it did not exist. The Lord Jesus charged it to his own account and paid it in full on the cross. Give those standing inside the door a willing heart, not a forced one. Give those standing outside the door courage to believe the “now” you have given them. Protect those who are being hurt, exploited, or pressured to go back, and help them find safety and help. And open our eyes to see the name of every caregiver and migrant worker around us. May the grace of the Lord Jesus Christ be in our hearts always. We pray in the name of the Lord Jesus Christ. Amen."],["h","11. Small-Group Discussion: the Three Transformations"],["p","This group is not a contest to see who can be the most generous. It is a place for each person to say which side of the door they are standing on, one name in the ledger of their heart, and one chair they will pull out this week. Group leaders, please lead through the Three Transformations below in order."],["m","Leader’s note: the lesson’s main thread is heart, IOU, brother. Around the table there may be someone who is being pressured to forgive or to go back, someone working far from home, and someone who has only just come back. Please read the leader’s reminder in Transformation Two first."],["m","Priority markers: ★★★ = top priority; if time is short, discuss at least this question in each transformation. ★★ = second priority. ★ = discuss if time allows. The multiplication task marked [Must do] may not be skipped, but it can be completed at home."],["s","Transformation One | Internalise — until it becomes mindset (about 20 minutes)"],["m","Purpose: to be able to state three mindsets: authority laid down, appeal made for love’s sake; a thing called a brother, in the flesh and in the Lord; the debt of a wrong is real, and someone shoulders it."],["n","1. ★ That opening line — never, ever co-sign a loan for anyone — has anyone in your family ever said it? Have you or a family member ever co-signed for someone and been dragged down with them?"],["n","2. ★★★ In your own words: Paul could command, so why did he choose to appeal? In verse 14, what is the difference between free will and necessity? Give an example from your own life of something that looked like a request but was really a command."],["n","3. ★★ Verse 16 says “both in the flesh and in the Lord.” Why do we need both? If you had only one of them, what would be missing? Give an example."],["n","4. ★★ Paul says “put that to my account,” yet he never says the debt is simply cancelled. Why does it matter both that the debt is real and that someone shoulders it? What does this remind you of that the Lord Jesus has done for you?"],["m","Leader’s reminder: whether Onesimus ran away, and whether Paul asked for his release — point to the contested-questions page in a single sentence and do not debate these in the group. Do not name anyone in the group as “Philemon” or “Onesimus.”"],["s","Transformation Two | Digest — until it becomes life (about 35 minutes · the lesson’s main thread)"],["m","Purpose: for each person to say which side of the door they are standing on, one name in the ledger of their heart, and one small step they will take this week."],["t","[See] See yourself"],["n","5. ★★★ Of the three people in this letter, which one are you most like: Paul, who writes it; Philemon, inside the door; or Onesimus, outside it? Share something recent — no need for details."],["t","[Listen] Listen to God"],["n","6. ★★ Read 1:15–19 slowly, twice. Which word made you stop — perhaps, forever, brother, receive, or I will repay it? What did it say to you?"],["t","[Think] Think through the sticking point"],["n","7. ★★★ If you are Philemon, where are you stuck that keeps you from opening the door: the loss is too great, you can’t let go of your pride, you’re afraid of being hurt again, or it isn’t safe? If you are Onesimus, where are you stuck that keeps you from daring to knock? Choose one and say it."],["t","[Speak] Say it out loud"],["n","8. ★★ Say this one sentence to the group: “The Lord Jesus has already charged that debt of mine to his own account.” The next person replies with just one sentence — “It’s been put to his account” — and gives no advice."],["t","[Do] Take one step"],["n","9. ★★★ Write down the small step you will take this week: which day, toward which person, doing what. If that person is still hurting you, this step is to talk with someone you trust about your safety."],["m","Leader’s reminder: this transformation may touch on family harm, domestic violence, exploitation and long-standing hopelessness. Do not press for details. Do not ask anyone to forgive anyone, nor ask anyone to reconcile, and do not say “You need to have faith” to someone who is in tears. If someone discloses that they are still in violence or danger and their physical safety is threatened, protect life first and seek help through the proper legal channels. Do not deal with it in the group; follow up with them privately afterward and, where needed, help them seek professional help. After question 7, please leave thirty seconds of silence."],["s","Transformation Three | Transform — until it becomes daily living (about 25 minutes)"],["m","Purpose: to carry this lesson into the calendar: one person to call by name, one chair to pull out, one 920 “2,” and one friend to tell it to."],["n","10. ★★ Name someone who is usually treated as a unit of labor. What is his or her name? Which day this week will you call them by name, face to face, and what one concrete kindness will you do?"],["n","11. ★ What time each morning this week, and where, will you read 1:15–19? When you reach “put that to my account,” what is the one sentence you will say to the Lord?"],["n","12. ★★ This Sunday or at the next small group, which person who usually doesn’t get invited will you invite to sit at your table? Give a name, a time and a place."],["n","13. ★★★ This is the lesson’s 920 practice: find your “2” — the hardest one. It may be someone who once wronged you; it may be someone you have wronged. Say it here and now; you may use a name, or just a description (for example, “a family member”). If it is someone you have wronged, say which day this week and in what way you will own it to them, and share this lesson with them. If it is someone who once wronged you, simply pray for them this week, and leave sharing for a time when it is safe and you yourself are willing."],["n","14. ★★★ [Must do] Multiplication task: tell this lesson to a friend outside the church in three sentences. First: Two thousand years ago a slave may have wronged his master, and an old man in prison wrote a letter guaranteeing his debt: “Put that to my account.” Second: That letter took a man who was treated as a thing and called him a beloved brother. Third: Jesus has shouldered my debt too, so I am learning to open the door. Next time, come back and tell us how they responded."],["m","Leader’s reminder: answers must be specific — a time, a place, a name. Do not accept answers like “I’ll try to be more tolerant.” The 920 person may be described without a name; if it is someone who once wronged you, the default is simply to pray for them. Where hurt, violence or exploitation is involved, do not press for details, do not require forgiveness, do not require reconciliation, and do not say “You need to have faith” to someone who is in tears. Put safety first, follow up privately afterward, and where needed help them seek professional help."],["s","Closing (5 minutes)"],["p","Have each person say in one sentence: the one person they will call by name this week, and the one chair they will pull out."],["p","Then pray for one another, praying by name for three kinds of people: someone who once wronged others and wants to come back but doesn’t dare to knock; someone who has been hurt yet is being pressured to hurry up and forgive — ask the Lord to protect them and give them time and safety; and a migrant worker or domestic caregiver working far from home — ask the Lord that they be treated fairly."],["p","Finally, the group leader reads slowly, once: “The grace of our Lord Jesus Christ be with your spirit. Amen.” (1:25)"]]}}}</script>

      var m = l.match(/^\s*(#{1,6})\s*(.+)$/);
      if (m) { out.push({ k: 'h', n: m[1].length, t: m[2] }); i++; continue; }
      if (/^\s*>/.test(l)) {

sys": " Audience: a teenager (about 12–18). Be funny, witty and real — like a cool older brother or sister chatting, never lecturing or talking down. Use pictures from their world: phone at 1% battery, game levels, binge-watching, likes and followers, exams, peer pressure, sports. A light joke or current slang now and then is welcome, but NEVER joke about God, Jesus or Scripture itself, and never be flippant about sin or pain; after the laugh, land firmly on the truth. Keep it short, put the main point first, use short paragraphs, and end with one small challenge they can try today. If they mention being hurt, bullied, or wanting to harm themselves, answer gently and encourage them to tell a trusted adult (parent, teacher, pastor) right away.", "write": "\nThe reader is a teenager: light, witty, like a friend chatting; a little humour is fine, but never preachy, flippant, or joking about God or Scripture. No emoji.", "style": "Style: the questions and explanations are funny and witty, like friendly banter; the options may be playful, but the correct answer must be unambiguous, and never joke about God or Scripture itself.", "res": ["Slippery one! Read it again and you’ll own the next round.", "Not bad! A few more rounds and you can challenge your friends.", "Boss-level run! You’re a Bible pro."], "q": ["How does this passage connect to my everyday life — school, friends, my phone?", "If this passage were a message from God to me, what would it say?", "Everyone is doing it — is it weird if I don’t? What does Scripture say?", "Can you explain this passage with a game or a movie?", "What’s surprising or little-known about this passage?", "Exam stress is huge — what strength does this passage give me?", "I can’t forgive someone. How does this passage help?", "Does God really see me? What makes me worth loving?"], "fu": [["🏫", "School", "Using what you just said, help me think through how to use it at school and with my studies — give me one small move I can try today."] ence of explanation, with at most one cute emoji.", "res": ["That’s okay! Let’s read the story again and play once more! 🌱", "Great job! You remembered so much! 🌟", "Wow, amazing! God is so happy! 🎉"], "q": ["What is this story about? Tell it to me.", "What did God do in this story?", "Does Jesus love me? How do I know?", "Who is the bravest in this story? Why?", "How can I be like the people in this story?", "Teach me one short verse I can remember.", "I had a fight with my best friend. What would Jesus do?", "Can you teach me a little prayer?"], "fu": [["🏠", "At home", "About what you just said — what can I do at home? Please tell me in simple words."], ["🏫", "At school", "About what you just said — what can I do at school? Please tell me in simple words."], ["🤝", "With friends", "About what you just said — what can I do with my friends? Please tell me in simple words."], ["🙏", "Little prayer", "Please teach me a very short little prayer I can say to Jesus."], ["📖", "Story", "Can you tell me another little story about this?"]]}, "seeker": {"sys": " Audience: a seeker — a friend who is not yet a believer and is exploring the Christian faith. Stand fully in their shoes: they may never have read the Bible, do not know church language, and may have questions or reservations. (1) Start from their real situation, feelings or question, then bring in the passage, so they feel \"this is about me\". (2) Use plain everyday words; the 321 vision is only your inner compass — never use insider words like \"selfless\", \"let Jesus reign\", \"overcomer\" or \"spiritual\", and no church or theological jargon; if a word like grace, sin or salvation is unavoidable, explain it at once in everyday terms. (3) Be honest and respectful — no preaching, no pressure, no demand to believe now, no judging; doubts and objections are normal, so acknowledge the weight of the question first, then answer it honestly. (4) State clearly what the Bible says about it (what God is like, what Jesus did e, clear; no internet slang. No emoji.", "style": "Style: for an elder — plain words, clear sentences, questions that are not convoluted or obscure, short options; one gentle sentence of explanation.", "res": ["That is all right — take it slowly; another read will make it clearer.", "Very good! You remember a lot of this chapter.", "Wonderful! The Word is living in your heart."], "q": ["In the simplest words, what is this passage saying?", "What comfort does this passage give to those who are older?", "My body is growing weaker — how does God watch over me?", "I often feel lonely — what does this passage give me?", "How can I pass my faith on to my children and grandchildren?", "There are things I cannot let go of — how does this passage teach me to entrust them?", "I am old — what can I still do for God?", "Please write me a short prayer I can read to the Lord."], "fu": [["🩺", "Health", "Based on your answer, explain how to apply it to physical frailty and health, and give me one concrete step I can take this week."], ["🤍", "Loneliness", "Based on your answer, explain how to apply it to loneliness and missing loved ones, and give me one concrete step I can take this week."], ["👨‍👩‍👧‍👦", "Family", "Based on your answer, explain how to apply it to my relationship with my children and grandchildren, and give me one concrete step I can take this week."], ["🕊️", "Entrusting", "Based on your answer, explain how to apply it to letting go of my worries and entrusting them to the Lord, and give me one concrete step I can take this week."], ["🌅", "Hope", "Based on your answer, explain how to apply it to eternal hope and gratitude, and give me one concrete step I can take this week."], ["🙏", "Prayer", "Please turn the key point of your answer into a short, simple prayer I can read slowly to the Lord."]]}, "single_parent": {"sys": " Audience: a single parent (carrying a household alone). First receive their weariness: they are often exhausted, carry guilt and loneliness, and face pressure over money, time and raising children. Be warm, accepting and non-judging; do not ask why they are single, never say \"you should find a partner\", and never describe single parenting as a lack. Bring in God’s heart: he is a father to the fatherless and a defender of widows (Psalm 68:5), and he is with us. Then give hope and practicality — every small step must be doable in a busy life (a five-minute prayer, one small ritual with the child, asking brothers and sisters for help). Keep it short, in short paragraphs. End with one step they can take this week. If they mention being abused, being too exhausted to go on, or wanting to harm themselves, answer gently and encourage them to contact someone they trust, a church worker or professional help right away.", "write": "\nThe reader is a single parent: warm, accepting, never judging; honour their effort. No emoji.", "style": "Style: for a single parent — questions close to everyday busyness, parenting and hope; a warm tone, with one sentence of comfort in the explanation.", "res": ["That is all right — you have worked so hard. Read it again when you have time.", "Nice! You remember so much in such busy days.", "Wonderful! The Word is holding you up."], "q": ["What comfort does this passage give me as I carry a family alone?", "I am so tired and feel I owe my children more — how does God see me?", "How does God care for orphans and widows, and what does that mean for me?", "Money is very tight — what does this passage give me?", "My child talks back and has big emotions — what should I do?", "I do not know how to talk to my child about Dad (or Mom) not being around.", "I am really lonely — how can I ask the church or brothers and sisters for help?", "Please write me a short prayer I can pray in five minutes."], "fu": [["😮‍💨", "Weary", "Based on your answer, explain how to apply it to the weariness and guilt of carrying a family alone, and give me one concrete step I can take this week."], ["👧", "Child", "Based on your answer, explain how to apply it to being with my child and parenting, and give me one concrete step I can take this week."], ["💰", "Money", "Based on your answer, explain how to apply it to pressure over money and time, and give me one concrete step I can take this week."], ["🤝", "Help", "Based on your answer, explain how to apply it to asking brothers, sisters or the church for help, and give me one concrete step I can take this week."], ["🌤️", "Hope", "Based on your answer, explain how to apply it to seeing God’s presence and hope in this season, and give me one concrete step I can take this week."], ["🙏", "Prayer", "Please turn the key point of your answer into a short prayer I can finish in five minutes in the middle of a busy day."]]}, "single": {"sys": " Audience: a single person (never married, divorced, widowed, or still waiting — do not assume they want or do not want to marry). Never describe being single as a lack, a \"preparation stage\" or \"life not yet begun\", and never use a pushy-about-marriage tone. Speak of an identity in Christ that is already whole and loved; of connecting with God, friends and fellowship in loneliness; of using time, money and gifts for a purpose; of trusting while waiting; of wisdom in dating and marriage and of purity in heart and body, respectfully and without judging. Be sincere, equal and light. End with one step they can take this week. If they mention loneliness so deep they want to harm themselves, answer gently and encourage them to contact someone they trust or professional help right away.", "write": "\nThe reader is single: sincere, equal and relaxed; never pushing marriage or treating singleness as a lack. No emoji.", "style": "Style: for single friends — questions about loneliness, identity, waiting, friendship and purpose; a sincere, equal tone, never pushing marriage.", "res": ["That is okay — take your time; another read will make it clearer.", "Nice! You have caught the main points of this chapte function mx_u32(b,p){return b[p]*16777216+b[p+1]*65536+b[p+2]*256+b[p+3];}
function mx_i32(b,p){const v=mx_u32(b,p);return v>=2147483648?v-4294967296:v;}
function mx_u64(b,p){return mx_u32(b,p)*4294967296+mx_u32(b,p+4);}
function mx_typ(b,p){return String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]);}

function mx_boxes(b,start,end){
  const out=[];let p=start;
  while(p+8<=end){
    let size=mx_u32(b,p),hs=8;
    if(size===1){size=mx_u64(b,p+8);hs=16;}
    else if(size===0)size=end-p;
    if(size<8||p+size>end)break;
    out.push({type:mx_typ(b,p+4),start:p,size:size,hs:hs,body:p+hs,end:p+size});
    p+=size;
  }
  return out;
}
function mx_find(list,t){return list.filter(x=>x.type===t);}
function mx_one(list,t){const r=mx_find(list,t);return r.length?r[0]:null;}
function mx_children(b,mx_box){return mx_boxes(b,mx_box.body,mx_box.end);}

function mx_parseTrun(b,tr,tfhd,baseOffset){
  const flags=mx_u32(b,tr.body)&0xffffff;
  const cnt=mx_u32(b,tr.body+4);
  let p=tr.body+8;
  let dataOff=0;
  if(flags&0x1){dataOff=mx_i32(b,p);p+=4;}
  let firstFlags=null;
  if(flags&0x4){firstFlags=mx_u32(b,p);p+=4;}
  const samples=[];
  let off=baseOffset+dataOff;
  for(let i=0;i<cnt;i++){
    let dur=tfhd.defDur, size=tfhd.defSize, fl=tfhd.defFlags, cto=0;
    if(flags&0x100){dur=mx_u32(b,p);p+=4;}
    if(flags&0x200){size=mx_u32(b,p);p+=4;}
    if(flags&0x400){fl=mx_u32(b,p);p+=4;}
    if(flags&0x800){cto=mx_i32(b,p);p+=4;}
    if(i===0&&firstFlags!==null)fl=firstFlags;
    samples.push({off:off,size:size,dur:dur,cto:cto,sync:!(fl&0x10000)});
    off+=size;

function mx_parseTfhd(b,mx_box){
  const flags=mx_u32(b,mx_box.body)&0xffffff;
  const trackId=mx_u32(b,mx_box.body+4);
  let p=mx_box.body+8;
  let base=null;
  if(flags&0x1){base=mx_u64(b,p);p+=8;}
  if(flags&0x2){p+=4;}
  let defDur=0,defSize=0,defFlags=0;
  if(flags&0x8){defDur=mx_u32(b,p);p+=4;}
  if(flags&0x10){defSize=mx_u32(b,p);p+=4;}
  if(flags&0x20){defFlags=mx_u32(b,p);p+=4;}
  return {trackId:trackId,base:base,defDur:defDur,defSize:defSize,defFlags:defFlags,

function mx_box(type,...parts){
  let len=8;parts.forEach(p=>len+=p.length);
  const head=new Uint8Array(8);
  head[0]=(len>>>24)&255;head[1]=(len>>>16)&255;head[2]=(len>>>8)&255;head[3]=len&255;
  for(let i=0;i<4;i++)head[4+i]=type.charCodeAt(i);
  const out=new Uint8Array(len);out.set(head,0);
  let p=8;parts.forEach(x=>{out.set(x,p);p+=x.length;});
  return out;
}
function mx_b32(v){return new Uint8Array([(v>>>24)&255,(v>>>16)&255,(v>>>8)&255,v&255]);}
function mx_b64(v){const hi=Math.floor(v/4294967296),lo=v>>>0;

  moofs.forEach(mf=>{
    const trafs=mx_find(mx_children(b,mf),"traf");
    trafs.forEach(tf=>{
      const tfc=mx_children(b,tf);
      const tfhdBox=mx_one(tfc,"tfhd");
      if(!tfhdBox)return;
      const tfhd=mx_parseTfhd(b,tfhdBox);
      const t=tracks[tfhd.trackId];
      if(!t)return;

      const base=tfhd.hasBase?tfhd.base:mf.start;
      let running=null;
      mx_find(tfc,"trun").forEach(tr=>{
        const flags=mx_u32(b,tr.body)&0xffffff;
        const hasOff=!!(flags&0x1);
        const r=mx_parseTrun(b,tr,tfhd,hasOff?base:(running===null?base:running));
        r.samples.forEach(s=>t.samples.push(s));
        if(r.samples.length){
          const last=r.samples[r.samples.length-1];
          running=last.off+last.size;

    });
  });

  const order=[];
  Object.keys(tracks).forEach(id=>{
    tracks[id].samples.forEach((s,i)=>order.push({id:+id,i:i,off:s.off,size:s.size}));
  });
  order.sort((a,b2)=>a.off-b2.off);

  const newOff={};

  function buildStbl(id,stblOld,mediaTimescale){

    const szBody=[mx_b32(0),mx_b32(0),mx_b32(ss.length)];
    ss.forEach(s=>szBody.push(mx_b32(s.size)));

  function assemble(mdatStart){
    const newTraks=[];
    traks.forEach(tk=>{
      const tkc=mx_children(b,tk);
      const tkhd=mx_one(tkc,"tkhd");
      const v=b[tkhd.body];
      const id=mx_u32(b,tkhd.body+(v===1?20:12));
      const mdia=mx_one(tkc,"mdia");
      const mdc=mx_children(b,mdia);
      const mdhd=mx_one(mdc,"mdhd");

function blank(t, seed){
  const parts = String(t).split(/(\s+)/), idx = [];
  parts.forEach((w, i) => { if (/[A-Za-z]{4,}/.test(w)) idx.push(i); });
  let r = seed; const rnd = () => (r = (r * 1103515245 + 12345) % 2147483648) / 2147483648;
  const n = Math.max(1, Math.round(idx.length * 0.3)), pick = new Set();
  let guard = 0;
  while (idx.length && pick.size < n && guard++ < 999) pick.add(idx[Math.floor(rnd() * idx.length)]);
  return parts.map((w, i) => {
    if (!pick.has(i)) return esc(w);

const tShort = s => {

function terrain(cur){

  const LAST = 1;
  const x = c => pad + (c - 0.5) / LAST * (W - pad * 2);   // c is the position within the chapter (integer = chapter center)
  const y = v => 10 + (100 - v) / 100 * (H0 - 26);
  let d = `M ${x(0.5)} ${y(40)}`;
  P.forEach(p => { d += ` L ${x(p[0]).toFixed(1)} ${y(p[1]).toFixed(1)}`; });
  d += ` L ${x(LAST + 0.5)} ${y(P.length ? P[P.length - 1][1] : 30)}`;

  // the dots and the "you are here" ring are obstacles too, so labels never sit on the line

    h += `</div><p class="xs muted">The one chapter and 25 verses, with ${Object.keys(BLK).reduce((a,c)=>a+BLK[c].length,0)} verse-by-verse expositions, all included.</p></div>`;
    return h;
  }
  const n = R.ch, m = meta(n);
  setTitle('Philemon ' + n, false);
  let h = `<div class="sect"><p class="eyebrow">Chapter ${n} · ${esc(m.arc)}</p>
    <h2 class="big">${esc(m.t)}</h2><p class="sm muted">${esc(m.sub)}</p></div>`;
  const full = D.txt[n] || [];
  h += `<div class="mkhint">💡 <b>Tap a verse</b> to highlight it; <b>tap it again</b> to write a reflection. Tap the <b>verse number</b> on the left to read the exposition.</div>`;
  h += '<div style="margin-bottom:10px">';
  full.forEach((t, i) => {
    const vn = i + 1, ref = n + ':' + vn, b = VMAP[ref];
    const first = b && b.a === vn;
    const cls = b ? (b.star ? 'vs star has' : 'vs has') : 'vs';
    const note = (n === 16 && vn === 24) ? '<span class="flag" style="color:var(--dusk)">※ Not in the earliest manuscripts</span>' : '';
    const tag = first && b.z > b.a ? `<span class="flag" style="color:var(--dusk)">Exposition · vv. ${b.a}–${b.z}</span>` : '';
    const t2 = D.txt[n][i];
    const sents = splitHTML(esc(t2));

    sents.forEach((sv, si) => {
      const mk = 'v|' + ref + (sents.length > 1 ? '|' + si : ''), on = mkHas(mk), c = mkColor(mk);
      vb += `<span class="mks${on ? ' hl' : ''}"${c ? ` data-c="${c}"` : ''} data-k="${mk}"
        onclick="event.stopPropagation();mkTap('${mk}',this)">${sv}</span>`;
      if (on && mkNote(mk)) notes += `<div class="mknote"${c ? ` data-c="${c}"` : ''} style="margin-left:29px">
        <b>Reflection</b>&nbsp; ${esc(mkNote(mk))}
        <button class="mkask" onclick="askXz(mkText('${mk}'),'My reflection: ${escA(mkNote(mk))}')">✨ Ask Xiaozhi</button>
        <button class="mkask del" onclick="mkDrop('${mk}')">🗑 Delete</button></div>`;
    });
    h += `<div class="${cls}" data-v="${ref}">
      <span class="vn" ${b ? `onclick="openV('${ref}')"` : ''}>${vn}</span>
      <span class="vt">${vb}${note}${tag}</span></div>` + notes;
  });
  h += '</div>';
  h += `<div class="hr"></div><button class="btn" onclick="go('course',${n})">Chapter ${n} in the course ›</button>`;
  return h;
}

/* ===== Verse exposition (six layers) ===== */
let OPENL = { 1:1, 2:0, 3:1, 4:0, 5:0, 6:1 };
function openV(ref){
  const v = VMAP[ref]; if (!v) return;
  const rr = v.ch + ':' + (v.a === v.z ? v.a : v.a + '–' + v.z);
  const L = (i, name, body, cls) => {
    const on = OPENL[i] && !(i === 2 && !S.set.grk) && !(i === 4 && !S.set.grk);
    return `<div class="layer"><div class="lh" onclick="tglL(${i},'${ref}')">
      <span class="n">${['','①','②','③','④','⑤','⑥'][i]}</span><span>${name}</span>
      <span class="caret">${on ? '▾' : '▸'}</span></div>
      ${on ? `<div class="lb ${cls || ''}">${body}</div>` : ''}</div>`;
  };
  let h = `<h4>Philemon ${esc(rr)}</h4>
    <p class="xs muted" style="margin:0 0 10px">${v.star ? '★ Key passage &nbsp;·&nbsp; ' : ''}Chapter ${v.ch}</p>
    ${L(1, 'World English Bible', blkCuv(v))}
    ${S.set.grk && v.grk ? L(2, 'Greek', v.grk, 'grk') : ''}
    ${v.lit ? L(3, 'Literal rendering', tagParas(v.lit, 'x|' + v.ch + ':' + v.a + '|lit'), 'lit') : ''}
    ${S.set.grk && v.key ? L(4, 'Key words', v.key) : ''}
    ${v.gram ? L(5, 'Grammar', tagParas(v.gram, 'x|' + v.ch + ':' + v.a + '|gram')) : ''}
    ${v.exp ? L(6, 'Exposition', tagParas(v.exp, 'x|' + v.ch + ':' + v.a + '|exp')) : ''}`;
  const iss = (D.issues || []).filter(x => (x.ch || []).includes(v.ch));
  if (iss.length){ h += `<div class="hr"></div>`;
    iss.forEach(x => h += `<button class="btn" style="margin:0 6px 6px 0" onclick="openIssue('${x.id}')">⚖ ${esc(x.t)} ›</button>`); }
  const prev = BLK[v.ch][v.i - 1], next = BLK[v.ch][v.i + 1];
  h += `<div class="hr"></div><div class="row">
    ${prev ? `<button class="btn" onclick="openV('${v.ch}:${prev.a}')">‹ Previous</button>` : ''}
    ${next ? `<button class="btn" onclick="openV('${v.ch}:${next.a}')">Next ›</button>` : ''}
    <button class="btn" onclick="sayV('${ref}')">🔊 Read aloud</button>
    <button class="btn" onclick="askXz(blkPlain('${ref}'))">✨ Ask Xiaozhi</button>
    <button class="btn" onclick="go('course',${v.ch})">Whole chapter</button></div>`;
  sheet(h);
}
function blkPlain(ref){ const v = VMAP[ref]; if (!v) return '';
  const t = D.txt[v.ch] || []; let c = '';
  for (let i = v.a; i <= v.z; i++) c += (t[i - 1] || '') + ' ';
  return c + '\n' + (v.lit || '').replace(/<[^>]+>/g, ' ') + '\n' + (v.exp || '').replace(/<[^>]+>/g, ' '); }
function sayV(ref){ const v = VMAP[ref]; if (!v) return;
  speak(blkPlain(ref), 'Phlm ' + v.ch + ':' + v.a); }
function sayMV(n){ const m = meta(n); speak(m.mv.t + ' ' + m.mv.r + '.', 'Memory verse'); }
function tglL(i, ref){ OPENL[i] = OPENL[i] ? 0 : 1; openV(ref); }

function lesGo(n, i){

  if (el) el.scrollIntoView({ behavior:'smooth', block:'start' });
}
function lesNote(n){ (S.lnote = S.lnote || {})[n] = $('#ln').value; save(); toast('Note saved'); }

/* -- Lesson read-aloud: skip the book title, teleprompter and contents, and start with the body --
   Section headings, “Think deeper” and the Three Transformations are all introduced conversationally,
   so it sounds like a teacher speaking, not a screen reading out its layout. */
const DEEP_LEAD = [
  'Let’s think a little deeper here. Someone may ask: ',
  'Let me add one more word here. Perhaps someone is asking right now: ',
  'I know some of you will stop here and ask: ',
  'Let’s take this one step further. Someone asks: ',
  'Here is a question worth pausing over: ',
  'Perhaps you are wondering: ',
];
const DEEP_ANS = ['Here is my answer. ', 'This is how I see it. ', 'We can think of it this way. ', 'This is how I would answer. ',
  'Let me put it this way. ', 'The answer is right there in the text. '];
const NUMW = ['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve',
  'thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENSW = ['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
/* a number spoken as a word (used for "Part one", "Question fourteen") */
function numWord(n){
  n = parseInt(n, 10);
  if (!(n >= 0)) return String(n);
  if (n < 20) return NUMW[n];
  if (n < 100) return TENSW[Math.floor(n / 10)] + (n % 10 ? '-' + NUMW[n % 10] : '');
  return String(n);
}
/* split plain text into sentences (exactly the same rule as the tappable .mks sentences on screen, so the two line up) */
const plainSents = s => splitHTML(esc(s)).map(x =>
  x.replace(/<[^>]+>/g, '').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&'));
const endDot = s => /[.!?…”’)]$/.test(String(s).trim()) ? String(s).trim() : String(s).trim() + '.';

/* Read-aloud units: one per sentence, each remembering which block and which sentence it is on screen
   { t:text to speak, i:block index, part:'t'|'a', j:sentence index (-1 = the whole block) }  */
function lesSpeakUnits(n){
  const L = (D.lesson || {})[n];
  if (!L) return [];
  const out = [];
  let di = 0, qi = 0;
  const push = (t, i, part, j) => { if (String(t).trim()) out.push({ t:String(t), i, part, j }); };
  /* a whole block: the first sentence gets the spoken lead-in, the rest are read as they are, indexed like the screen */
  const block = (raw, i, part, lead, drop) => {
    const ss = plainSents(raw);
    ss.forEach((s, j) => {
      let x = s;
      if (j === 0){ if (drop) x = x.replace(drop, ''); x = (lead || '') + x; }
      push(x, i, part, j);
    });
  };
  L.blocks.forEach((b, i) => {
    const t = b[1];
    switch (b[0]){
      case 'h': {                                   // "1. A Letter with No Signature" -> "Part one. A Letter with No Signature."
        const m = String(t).match(/^(\d+)\.\s*(.*)$/);
        push(m ? `Part ${numWord(m[1])}. ${endDot(m[2])}` : endDot(t), i, 't', -1);
        break;
      }
      case 'd':                                     // “Think deeper”: a question and its answer
        push(DEEP_LEAD[di % DEEP_LEAD.length] + t[0], i, 'q', -1);
        block(t[1], i, 'a', DEEP_ANS[di % DEEP_ANS.length]);
        di++;
        break;
      case 's': {                                   // a Three Transformations heading (the minutes in parentheses are not read)
        const s = String(t).replace(/\s*\([^)]*\)/g, '').replace(/\s*\|\s*/g, ': ').trim();
        push(/^Closing/i.test(s) ? 'Let’s close.' : `Next comes ${endDot(s)}`, i, 't', 0);
        break;
      }
      case 't': {                                   // [See] [Listen] [Think] [Speak] [Do]
        const m = String(t).match(/^\[(.+?)\]\s*(.*)$/);
        push(m ? `This step is ‘${m[1]}’: ${endDot(m[2])}` : endDot(t), i, 't', 0);
        break;
      }
      case 'm':                                     // leader's guide / leader's note: already labelled in the text
        if (/^Priority markers/i.test(String(t))) break;   // the stars are marks on paper; reading them aloud means nothing
        block(t, i, 't');
        break;
      case 'n': {                                   // "1. ★★★ question" -> "Question one. question"
        const m = String(t).match(/^(\d+)\./);
        qi = m ? +m[1] : qi + 1;
        const must = /\[(?:Must do|Required)\]/.test(String(t));
        block(t, i, 't', `Question ${numWord(qi)}. ${must ? 'This one is a must-do. ' : ''}`, /^\d+\.\s*(★+)?\s*(\[(?:Must do|Required)\])?\s*/);
        break;
      }
      default:
        block(t, i, 't');
    }
  });
  return out;
}
/* Merge units into the pieces fetched as one audio request: within a block, keep merging until a piece
   reaches about 180 characters. Too small and playback keeps waiting on the network; too large and it is
   slow to start. Each piece remembers which on-screen sentences it covers. */
function lesSegs(n){
  const us = lesSpeakUnits(n), segs = [];
  us.forEach(u => {
    const last = segs[segs.length - 1];
    if (last && last.i === u.i && last.part === u.part && last.j0 >= 0 && u.j >= 0
        && last.t.length < 180 && last.t.length + u.t.length <= 600){
      last.t += (/\s$/.test(last.t) ? '' : ' ') + u.t; last.js.push(u.j);
    } else {
      segs.push({ t:u.t, i:u.i, part:u.part, j0:u.j, js:u.j >= 0 ? [u.j] : [] });
    }
  });
  segs.forEach(s => { s.t = sanitize(s.t); });
  return segs.filter(s => s.t);
}
const lesSpeakText = n => lesSpeakUnits(n).map(u => u.t).join('\n');
function lesTitle(n){
  const L = (D.lesson || {})[n];
  return L ? `Lesson ${n} · ${titleMain(L.title)}` : 'Lesson';
}
function lesSpeak(n){
  if (SPK.on) return stopSpeak();
  const segs = lesSegs(n);
  if (!segs.length) return toast('No teaching lesson for this chapter yet');
  playSegs(segs, lesTitle(n), n);
}
/* Download ahead: store the whole lesson's audio in IndexedDB so it can be played offline */
async function lesDownload(n){
  const segs = lesSegs(n);
  if (!segs.length) return toast('No teaching lesson for this chapter yet');
  if (!S.set.human) return toast('You’re using the device voice; there’s nothing to download');
  const b = $('#lesDl' + n);
  const chunks = segs.map(s => s.t);
  let done = 0, fail = 0;
  const paint = () => { if (b) b.textContent = `⤓ Downloading ${done}/${chunks.length}`; };
  paint();
  const CONC = 6; let next = 0;
  await new Promise(res => {
    let running = 0;
    const pump = () => {
      if (!chunks.length) return res();
      while (running < CONC && next < chunks.length){
        running++;
        ttsFetch(chunks[next++]).catch(() => { fail++; }).then(() => {
          running--; done++; paint();
          if (done === chunks.length) res(); else pump();
        });
      }
    };
    pump();
  });
  if (b) b.textContent = fail ? '⤓ Download for offline' : '✓ Downloaded';
  toast(fail ? `${fail} ${fail === 1 ? 'piece' : 'pieces'} didn’t download; please try again` : 'The whole lesson’s audio is on this device; you can listen offline');
}
/* On entering a lesson page, check whether this lesson has already been downloaded */
function lesDlCheck(n){
  const b = $('#lesDl' + n);
  if (!b || !S.set.human) return;
  const segs = lesSegs(n); if (!segs.length) return;
  const keys = segs.map(s => voiceName() + '|' + rateAttr() + '|' + s.t);
  ttsCount(keys, got => {
    const el = $('#lesDl' + n); if (!el) return;
    el.textContent = got >= keys.length ? '✓ Downloaded'
      : got ? `⤓ Download for offline (${got}/${keys.length} saved)` : '⤓ Download for offline';
  });
}

const TTS_DB = 'r321_tts-en';
function ttsDB(cb){
  try {
    if (!window.indexedDB) return cb(null);
    const r = indexedDB.open(TTS_DB, 1);
    r.onupgradeneeded = () => { try { if (!r.result.objectStoreNames.contains('a')) r.result.createObjectStore('a'); } catch(e){} };
    r.onsuccess = () => cb(r.result);
    r.onerror = () => cb(null);
  } catch(e){ cb(null); }
}
function ttsGet(k, cb){
  ttsDB(db => { if (!db) return cb(null);
    try { const q = db.transaction('a').objectStore('a').get(k);
      q.onsuccess = () => cb(q.result || null); q.onerror = () => cb(null);
    } catch(e){ cb(null); } });
}
function ttsPut(k, blob){
  ttsDB(db => { if (!db) return;
    try { db.transaction('a', 'readwrite').objectStore('a').put(blob, k); } catch(e){} });

    try {

      let n = 0, done = 0;
      keys.forEach(k => {

        q.onsuccess = () => { if (q.result !== undefined && q.result !== 0) n++; if (++done === keys.length) cb(n); };
