<script id="DATA" type="application/json">{"ch":[{"n":1,"t":"No Longer as a Slave, but More Than a Slave — a Beloved Brother","sub":"Love, Appeal, Receive","lv":"A","arc":"Love · Appeal · Receive","sec":[["1:1--3","And to the Assembly in Your House: Paul the Prisoner and a Household"],["1:4--7","The Hearts of the Saints Refreshed through You: Thanksgiving and Prayer"],["1:8--12","For Love’s Sake I Rather Beg: A Son Fathered in Chains"],["1:13--16","No Longer as a Slave, but More Than a Slave, a Beloved Brother: For a While and Forever"],["1:17--22","Put That to My Account: Welcome, Guarantee and Hope"],["1:23--25","The Grace of Our Lord Jesus Christ Be with Your Spirit: Five Fellow Workers, and Grace"]],"serm":{"pts":[["A Home Where Hearts Are Refreshed","1:1--7","“The hearts of the saints have been refreshed through you” — Philemon’s home is already a church, and his love has already given rest to many; Paul’s appeal begins with thanksgiving."],["From Slave to Brother","1:8--16","“No longer as a slave, but more than a slave, a beloved brother” — the one who could command chooses to appeal for love’s sake; a man once useless is born in chains; a thing is called a brother, in the flesh and in the Lord."],["Put That to My Account","1:17--25","“Receive him as you would receive me” — welcome takes concrete action: opening the door, charging the account, standing guarantor; the wrong is real, and someone is willing to shoulder it; the last word is grace."]]},"q":"Has someone like this ever stood at your door? He once cost you a sum of money, or a measure of trust, or the peace of your home. He left without saying goodbye, and now he has come back carrying a letter. He is standing outside, not knowing whether the door will open.\nPerhaps he is the employee who absconded with the company’s money, the brother you have not spoken to in years, the child who once stole from the family, or the one who quietly left the small group and has now returned. Or perhaps you yourself are the one standing at the door, hand raised, not daring to knock.\nThe question this chapter asks is this: can a person who was once treated as a thing, who once wronged others, who once walked away, be called a beloved brother? And for the one who opens the door — what does it really take: willpower and clenched teeth, or a grace that has already caught and held them?","truth":"A man treated as a thing under the law is called, in the Lord, a beloved brother. To welcome him is not to pretend the debt does not exist; it is for someone to say, “But if he has wronged you at all or owes you anything, put that to my account” (1:18).\nSo we are able to “receive him as you would receive me” (1:17) — not because we are generous enough, but because that Lord long ago charged our debt to his own account. That is what 1:18 brings to mind.","mv":{"t":"No longer as a slave, but more than a slave, a beloved brother.","r":"Phlm 1:16"},"card":["Philemon has only one chapter, and this chapter is the whole road of Love · Appeal · Receive. First comes Love (1:1–7): Philemon’s home is already a church, and the hearts of the saints have been refreshed through him. Then comes Appeal (1:8–16): the one who could command appeals for love’s sake, and a man who was once useless is called a brother. Last comes Receive (1:17–25): receive him as you would receive me; someone has guaranteed the debt of the wrong; and the final word is grace. Lift the whole chapter up and it comes to one sentence: how a person who was once treated as a thing, who once wronged others, who once walked away, is welcomed back into a household.","On the surface this letter is an exchange among three people, but its true subject is hidden in the passive voice and in the blessings. Grace and peace come “from God our Father and the Lord Jesus Christ” (1:3). Onesimus was fathered in chains (1:10) — what changed him was not a self-improvement program but the gospel. He “was … separated” for a while (1:15); Paul carefully says “perhaps,” yet he sees that God’s hand may have been in it. Whether Paul gets out of prison is God’s gift (1:22). And at the last, the grace of the Lord Jesus Christ comes upon the whole house church (1:25). God turns a “thing” into a son, and a living room into a church.","In 1:15, “that you would have him forever,” the word “have” is the Greek ἀπέχῃς (apechēs), a word used on commercial receipts of the day: paid in full. Philemon thought what he had on his books was a loss; Paul uses the language of a receipt to tell him that what he has received is payment in full — and it is forever. That changes how we read today. When the person who once cost you something is standing at your door, perhaps God is not asking you to take another loss, but to receive a brother forever. Paul says only “perhaps”; he does not put words in God’s mouth. But he does have Philemon look at the matter in a different ledger.","There are three people in this chapter, and each of them holds up a mirror to me. I might be Philemon: I have my rights and my reasons, I love all the saints — and yet the list in my heart is missing the one who cost me, the one who made me lose face in front of others. I might be Onesimus: standing at the door, treating my past as bigger than the new name God has given me, raising my hand to knock and letting it fall again. Or I might be someone who wants to be Paul but only knows how to give orders: I could ask, but I am used to making other people’s decisions for them.","“But if he has wronged you at all or owes you anything, put that to my account” (1:18). The thing most worth remembering in this whole chapter is a single action: a pen taken from the scribe’s hand, and the words written, “I, Paul, write this with my own hand: I will repay it” (1:19). Grace is not tearing up the ledger and pretending there was no wrong; nor is it making the injured party swallow it. It is someone charging the wrong to his own account. This reminds us of the God who was “not reckoning to them their trespasses” (2 Cor 5:19). The debt is real — and so is the One who shoulders it.","This week, in your home, your workplace or your church, find someone who is usually treated as “a unit of labor”: the caregiver at home, the cleaning auntie at work, the coworker sent by an agency, the sister who is always busy in the kitchen. Before Friday, learn their name and call them by it once, face to face. Ask how their family back home is doing. If you are the employer or the manager, take a moment to make sure their days off and pay this week are fair. If you call them brother or sister on Sunday, treat them that way on Monday too — “both in the flesh and in the Lord” (1:16).","Final integration: Colossae, a Sunday evening.\nPhilemon’s living room is full — Apphia, Archippus, brothers and sisters from across the street. This is “the assembly in your house” (1:2).\nThe door opens. Tychicus walks in, and behind him comes someone everyone recognizes. The room suddenly goes quiet. Someone remembers that unpleasant episode; someone else steals a glance at Philemon’s face.\nTychicus unrolls a letter and reads it aloud before the whole church. Philemon hears “my child” first, and only at the very end hears the name. The reading goes on:\n“no longer as a slave, but more than a slave, a beloved brother” (1:16).\nNo one says a word. The ledger is still in the drawer in the study; if there really was a wrong, that debt is real too. But toward the end of the letter, the handwriting suddenly changes:\n“I, Paul, write this with my own hand: I will repay it” (1:19).\nThe text does not record how that evening ended. But the whole letter was written for a scene like this:\nPhilemon stands up. He does not pretend the ledger isn’t there — only, whatever is written in it, someone has already said he will shoulder it. He walks over to the table and pulls out the chair beside his own.\nThe same table, the same bread. In the flesh, one household; in the Lord, one body.\nToday every one of us is standing on one side or the other of this door. Some of us have our hand on the handle; some of us are standing outside.\nThe last line of the letter is not a command to Philemon, nor a warning to Onesimus. It is for everyone in the room:\n“The grace of our Lord Jesus Christ be with your spirit” (1:25).\nThe door can open — not because anyone’s willpower is strong enough, but because that Lord long ago charged the debt of every one of us to his own account."],"self":"The “self-centred life” this chapter exposes belongs to the person who says, “I’m in the right”: I have my rights, I have my reasons, I’m the one who lost out — so I’ll wait for the other person to bow first, pay it all back first, prove first that he has changed, and only then will I consider whether to open the door. I love all the saints, yet on that list one name is conspicuously missing: the one who hurt me.\nThe self-centred life can also change its clothes. The one standing at the door treats his past as bigger than the new name God has given him and will not believe in the “now.” The one standing in a high place could ask, but is used to commanding, using position and favors owed to make other people’s decisions for them. The way out in this chapter is not to try harder to forgive. It is first to be caught and held by the Lord who says, “Put that to my account.”","t321":{"k":"Jesus is my role model: in the first line of the letter Paul does not call himself an apostle, only “a prisoner”; in 1:9 he could command, yet he appeals; in 1:18 he writes someone else’s debt into his own name. Paul did not invent any of these three strokes. He traced them from a Lord who, existing in the form of God, “emptied himself, taking the form of a servant” (Phil 2:7). How did Jesus welcome people while he was on earth? He went to the house of Zacchaeus the tax collector and sat down to eat, without first requiring Zacchaeus to settle his accounts. The Lord came through the door first, and then Zacchaeus himself said, “If I have wrongfully exacted anything of anyone, I restore four times as much” (Luke 19:8). So this model has two strokes: welcome comes first, and the debt is still real. What I am learning is not Paul’s rhetoric, but the Lord who comes through the door first and also shoulders the debt.","g":"Let Jesus be King: this chapter asks us to give up the place of “master.” In his household Philemon was κύριος (kyrios), the word slaves used for their masters. But Paul says, “both in the flesh and in the Lord” (1:16), and he asks Philemon to let him “have joy from you in the Lord” (1:20) — this household has a higher Lord. To let Jesus be King is to acknowledge that my home, my company and my account books are not the court of final appeal. Concretely, there are three seats to give up: the judge’s seat (I get the final say on that debt), the owner’s seat (he is my labor, my asset), and the seat of saving face (I can’t lose in front of everyone). You can check yourself: in your home or your company, is there someone you give orders to every day, yet whose name you cannot say?","p":"Establish God’s system: the smallest unit of the system is “the assembly in your house” (1:2) — one household, one living room. Its test is not how lively the meetings are, but whether a returning person gets a seat at that table. Paul shows how a whole group welcomes one person back. There is a letter (to make things clear). There is a companion (Tychicus goes with him, Col 4:7–9). There are witnesses (the whole church is present to hear the letter). There is a guarantor (Paul writes the IOU in his own hand). And there is follow-up: “Also, prepare a guest room for me” (1:22) — Paul means to come and see for himself. The small groups of Kingdom 321 Online Fellowship are scattered across many places, and they can welcome people the same way. When a member leaves and comes back, we do more than say “Welcome back.” Someone walks alongside, someone talks things through plainly, someone is willing to share the cost, and someone keeps caring. Welcome is not one person’s heroic act. It is a whole group holding someone up together."},"grp":["[1. Icebreaker] What does your name mean? Who gave it to you? Have you ever had someone get your name wrong, or call you only by your job title or a number? How did you feel in that moment?","[2. Cut to the heart] The text says, “who once was useless to you, but now is useful to you and to me” (1:11). In your life, is there someone who has stayed stuck in “once” in your heart — a family member, a former coworker, a group member who left and came back? Say how you would refer to them. And turning it around: do you have a “once” of your own that you are still afraid of people bringing up today?","[3. Gospel] Read 1:18–19: “But if he has wronged you at all or owes you anything, put that to my account” (1:18). This reminds us that God in Christ was “not reckoning to them their trespasses” (2 Cor 5:19). If that debt of your own was shouldered long ago, how would that change the way you see the person who owes you? And how would it change the way you see yourself?","[4. Action] Name one person you will treat well “in the flesh” this week — the caregiver at home, an agency worker or cleaner at your company, a group member who is often overlooked. Give their name or how you refer to them, which day, and one concrete thing you will do. If there is a “person at the door” in your heart, also name one small step you are willing to take toward them this week — it can be simply praying for them, with no need to meet right away.","[5. Prayer] Pray by name for three kinds of people: someone who once wronged others and wants to come back but doesn’t dare to knock — ask the Lord to give them genuine repentance and courage; someone who has been hurt yet is being pressured to “hurry up and forgive” — ask the Lord to protect them and give them time and safety; and a migrant worker or domestic caregiver working far from home — ask the Lord that in their employer’s home they be called by name and treated fairly, and that in the church they be called a beloved brother or sister."],"prac":{"main":"This week, I will first let the Lord who says, “Put that to my account,” catch and hold me — and then learn to open the door before one particular person: in the flesh, and in the Lord.","items":["Toward God: read 1:15–19 once every day. When you reach the words “put that to my account,” stop and name to the Lord one debt of your own (something you owe God or owe another person), and then say: “Lord, thank you for charging it to your account.”","Toward yourself: open the ledger in your heart and write down the name of someone you have been keeping accounts against, and what the debt is. Ask yourself three questions: Is this debt real? What would it take for me to count it paid? Am I willing to hand judgment over to God? Forgiveness can begin first before God; it does not have to wait for reconciliation. Reconciliation requires the other person’s repentance — and it requires your safety.","Toward others: choose someone in your home, workplace or church who is usually treated as “labor.” This week, learn their name, call them by it once face to face before Friday, and do one concrete kindness. If you are the employer or the manager, check once whether their hours, days off and pay are fair.","Toward daily living: this week, invite someone who usually doesn’t get invited to sit down at your family’s table — a new coworker, a group member who left and came back, an older person who lives alone. And if you have wronged someone, write a short letter or send a message — not asking them to forgive you, but simply owning what you did and asking how you can make it right.","Toward mission: in your small group, talk through one concrete arrangement. When someone leaves and comes back, or when one member has wronged another, how can the group act as Paul did — someone to talk things through plainly, someone to walk alongside, someone present as a witness, and someone willing to share the cost? And pray by name every day for one migrant worker or caregiver working far from home, and see what one practical thing the group can do for them."]},"safe":["① Beginning with the 321 principles “people matter more than tasks, relationships matter more than things,” and then using 1:16 and the story of Onesimus as an illustration to confirm them; or preaching the whole letter as a class in “repairing relationships.”","The order of Philemon is gospel first — Onesimus was fathered in chains (1:10), and a thing is called a brother “in the Lord” (1:16). 321 can only recognize it at the end: people matter more than tasks because the Lord saw people this way first (iron rule 5). Turn the text into an illustration of a principle, and what the congregation remembers is a principle, not the Lord.","Test: after you have preached 1:16, is the first picture the congregation remembers a 321 diagram — or a man called “a beloved brother,” and the Lord who called him that?","② Misusing 1:12 to say, “Paul sent a runaway slave back to his master, which shows the Bible supports slavery, and slaves should submit all the way.”","The New Testament does not endorse slavery: Paul urges those who are slaves, “if you get an opportunity to become free, use it” (1 Cor 7:21), and he lists “slave-traders” among the things “contrary to the sound doctrine” (1 Tim 1:10); 1:16 asks Philemon to see him “no longer as a slave.” To preach this letter as evidence for slavery is to get it exactly backward (for the book’s position, see ISS00_2).","Test: after this section, is the congregation clearer that the direction of the gospel is toward dignity and freedom — or does it sound as though the Bible tacitly allows one person to own another?","③ Preaching Onesimus as “a runaway slave who sinned, so going back to be punished is only right”; or, the other way round, saying “Paul did not demand the abolition of slavery, so this book is out of date.”","The text never condemns Onesimus. Paul sums up his past with nothing more than “useless” and moves straight on to “now” (1:11). His situation can also be read in four ways, none of which can be treated as settled (see the contested questions ISS01_1 and ISS01_3). At the other extreme, dismissing the text on account of an ancient institution misses the power of the gospel to overturn the master–slave relationship from inside a household.","Test: when the congregation has heard it, do they see more clearly a person changed by the gospel and welcomed back — or do they hear only a trial of Onesimus, or a trial of the Bible?","④ Misusing 1:12, “I am sending him back,” to tell a spouse suffering domestic violence, an abused child or an exploited migrant worker to go back to the person who is hurting them: “Even Onesimus went back; you need to go back and face it too.”","Onesimus’s return was a protected return: he had Paul’s letter, Tychicus traveling with him (Col 4:7–9), the whole church as witness (1:2), and Paul’s guarantee in his own hand (1:17–19). When someone’s physical safety is threatened, protect life first, seek help through the proper legal channels, and report it. To preach this verse as telling people to go back into danger is to take a letter written to protect a person and use it to wound (for the book’s position, see ISS00_3).","Test: when a sister who is suffering domestic violence has heard it, does she know better that she can seek help and that the church will protect her — or does she feel all the more that she ought to go back and endure it?","⑤ Wrongly pressing people who have been hurt to forgive at once and welcome back at once: “Philemon let go of a loss that big — why can’t you? Go and reconcile with him today.”","Paul left Philemon room, wanting his goodness to be “would not be as of necessity, but of free will” (1:14); and the text does not record Philemon’s response. Forgiveness is handing judgment over to God, and it can begin first before God; reconciliation is a road both parties walk, and it requires repentance and safety. Pushing people to forgive quickly only teaches them to hide their wounds (for the book’s position, see ISS00_3).","Test: when a brother or sister who has been deeply hurt has heard it, do they feel seen and free to walk at God’s pace — or do they feel they now have one more sin charged against them: refusing to forgive?","⑥ Presenting forgiveness as “the slate wiped clean and everything restored as it was”: a church worker misappropriated offerings, so after confessing he should be restored to his post at once, and bringing up the money again is unspiritual.","1:18 acknowledges, “if he has wronged you at all or owes you anything” — the debt is real. Paul’s solution is not to cancel it but to have someone take responsibility for repaying it (1:19). Forgiveness does not mean releasing someone from responsibility, does not mean restoring them to their post, and does not mean reconciliation. Protecting the community and restoring trust take time and concrete accountability.","Test: after you have preached 1:18–19, does the congregation understand better that in grace someone shoulders the debt — or do they think grace means pretending it never happened?","⑦ Preaching a “request” as a command in disguise: the leadership board decides a matter first and then says, “We appeal to you for love’s sake,” and anyone who declines is called unsubmissive.","Paul had “all boldness in Christ to command” (1:8), yet “for love’s sake I rather beg” (1:9), and “I was willing to do nothing without your consent” (1:14) — he hands the decision back to Philemon, whole and entire. A request that cannot be refused is a command. When the pulpit speaks in that tone, free will turns into necessity (for the book’s position, see ISS00_4).","Test: when the congregation has heard it, do they feel respected and free to respond honestly — or do they feel that an “appeal” is just another command with no choice?","⑧ Using 1:19, “you owe to me even your own self besides,” as a model for spiritual leaders: “I led you to the Lord; everything you have, the church gave you — so you have to do what I say.”","This line has historically been read in two ways, as “gentle pressure” and as “a reminder given with a smile.” But Paul has only just said that what he wants is free will (1:14). To turn it into a tool for binding people with what they owe, for emotional blackmail, runs exactly against the direction of the whole letter — and it is where spiritual abuse begins (for the book’s position, see ISS00_4; on spiritual abuse, see position 5 in the 1 Peter Study Notes).","Test: when someone who was once controlled by a church leader with “you owe me” has heard it, are they freer — or bound one turn tighter?","⑨ Using 1:21, “Having confidence in your obedience,” to silence questions: “Paul said you will obey; if you keep asking why, that’s rebellion.”","Paul gave Philemon a dozen or more verses of reasons, respecting his ability to think, and then said, “knowing that you will do even beyond what I say” (1:21) — this is trust, not intimidation. Two readings of “obedience” here stand side by side: obedience to what Paul asks in the Lord (which is ultimately obedience to the Lord), or obedience to the gospel itself. Neither reading means unconditional submission to an individual (see ISS00_4).","Test: when the congregation has heard it, are they more willing to bring their honest questions before God and their brothers and sisters — or do they feel all the more that asking questions is unspiritual?","⑩ Preaching 1:18 as “Onesimus is a type of the sinner, Philemon a type of God the Father, Paul a type of Christ — in this verse Paul is teaching the atonement.”","Paul is dealing here with a real debt; he does not present it as a parable of the gospel. Charging it to an account can only “remind us” of Christ — of God “not reckoning to them their trespasses” (2 Cor 5:19); “not charged” in Rom 5:13 shares its root with the word in 1:18. Turn an allegory into Paul’s doctrine, and people forget that this was a man with a name (see the contested question ISS01_8; for the book’s position, see ISS00_5).","Test: after this section, does the congregation remember a chart of types matched one to one — or a real debt that someone shouldered, which in turn brought the cross to mind?","⑪ Preaching only that “in the Lord we are all brothers,” without ever touching wages, days off or living quarters; or, the other way round, saying “today’s foreign workers are the slaves of the ancient world.”","1:16 says “both in the flesh and in the Lord” — both are required. Someone you call brother on Sunday must be treated that way on Monday as well, when the work is handed out and the wages are calculated (Col 4:1). Today’s migrant workers, domestic caregivers, foreign domestic helpers and agency laborers must be concretely seen, but their status and circumstances differ from those of ancient slaves, and the two must not be equated. To use “in the Lord” to paper over injustice between classes, or to demote workers to slaves, is once again to treat people as things (for the book’s position, see ISS00_2).","Test: when a caregiver who works in her employer’s home is sitting in the congregation, does she come away feeling she has been treated as a person with a name — or that she has been filed under “slave”?","⑫ Using 1:15 to announce, “The harm you suffered and the other person’s betrayal were all God’s plan, meant for your good.”","Paul says only “perhaps” (τάχα) — he sees that God may be at work in it, but he does not say that Onesimus’s possible wrongdoing or Philemon’s loss was something God wanted to happen (see the contested question ISS01_7). Call harm the will of God, and victims will not dare to be angry or to seek help, and those who did the harm will have a spiritual excuse.","Test: when someone who has just been betrayed and hurt has heard it, are they more confident that God can work in brokenness — or do they feel more than ever that God is on the side of the one who hurt them?","⑬ Misusing Demas in 1:24 to shame those who have left the church — “Look, Demas left in the end; everyone who leaves the church loves the world” — or using Mark to reassure people that “those who leave will surely come back.”","This list of fellow workers is real, not perfect. Mark had once left, and later “he is useful to me for service” (2 Tim 4:11); Demas later left (2 Tim 4:10), and we do not know how his story ended. People leave for many reasons, and some leave because they were hurt. Mark’s return was grace, not a guarantee.","Test: when someone who once left the church and has just come back to sit in the back row has heard it, do they feel the door is open — or that they have been labeled “Demas”?","⑭ Using the setting to cancel the principle — “This is a private letter about first-century Roman slavery; it has nothing to do with today” — or forcing the setting onto today: “Today’s employees are their boss’s Onesimus; if they do wrong, they must come back and submit to whatever is done to them.”","Walk all the way through the three questions for an epistle. The setting: a master who hosted a church in his home, and a slave who had once wronged him. The principles: in the Lord he is a beloved brother; appeal for love’s sake; free will, not necessity; someone guarantees the debt of the wrong. Where it lands today: the home, the church, the workplace, migrant workers and caregivers, broken relationships. The principles hold firm; where they land follows the setting (for the book’s position, see ISS00_1).","Test: when the congregation has heard it, do they know how this letter is to be lived today in their own homes and workplaces — or do they feel it is either too remote, or a weapon for pressuring people?","⑮ Preaching Philemon as a cold-blooded villain and Onesimus as an innocent hero; or singling out some “Philemon” in the congregation from the pulpit and demanding that he publicly declare he will welcome someone back.","Paul first thanks God for Philemon’s love and says that the hearts of the saints have been refreshed through him (1:7). He is not a problem to be managed but a man who is trusted. The letter is read before the whole church (1:2) as witness and protection, not as public pressure. If the pulpit manufactures shame, it turns a letter of trust into a public trial.","Test: when a “Philemon” who holds the rights and is still wrestling in his heart has heard it, does he feel trusted and invited — or backed into a corner?","⑯ Preaching the whole chapter as a showcase of Paul’s eloquence: “See how well Paul speaks — praise first, then the request, and finally the debt of gratitude. You should learn this persuasion technique too.”","Every stroke Paul makes — not calling himself an apostle, appealing for love’s sake, writing someone else’s debt into his own name — he learned from the Lord who “emptied himself, taking the form of a servant” (Phil 2:7). Put the focus on Paul’s rhetoric, and what the congregation learns is how to persuade people; what they lose is the Lord who shoulders the debt (iron rule 7).","Test: when the congregation has heard it, do they admire Paul’s eloquence more — or love more the Lord who says, “Put that to my account”?"]}],"txt":{"1":["Paul, a prisoner of Christ Jesus, and Timothy our brother, to Philemon, our beloved fellow worker,","to the beloved Apphia, to Archippus our fellow soldier, and to the assembly in your house:","Grace to you and peace from God our Father and the Lord Jesus Christ.","I thank my God always, making mention of you in my prayers,","hearing of your love and of the faith which you have toward the Lord Jesus, and toward all the saints,","that the fellowship of your faith may become effective in the knowledge of every good thing which is in us in Christ Jesus.","For we have much joy and comfort in your love, because the hearts of the saints have been refreshed through you, brother.","Therefore though I have all boldness in Christ to command you that which is appropriate,","yet for love’s sake I rather beg, being such a one as Paul, the aged, but also a prisoner of Jesus Christ.","I beg you for my child, whom I have become the father of in my chains, Onesimus,","who once was useless to you, but now is useful to you and to me.","I am sending him back. Therefore receive him, that is, my own heart,","whom I desired to keep with me, that on your behalf he might serve me in my chains for the Good News.","But I was willing to do nothing without your consent, that your goodness would not be as of necessity, but of free will.","For perhaps he was therefore separated from you for a while, that you would have him forever,","no longer as a slave, but more than a slave, a beloved brother, especially to me, but how much rather to you, both in the flesh and in the Lord.","If then you count me a partner, receive him as you would receive me.","But if he has wronged you at all or owes you anything, put that to my account.","I, Paul, write this with my own hand: I will repay it (not to mention to you that you owe to me even your own self besides).","Yes, brother, let me have joy from you in the Lord. Refresh my heart in the Lord.","Having confidence in your obedience, I write to you, knowing that you will do even beyond what I say.","Also, prepare a guest room for me, for I hope that through your prayers I will be restored to you.","Epaphras, my fellow prisoner in Christ Jesus, greets you,","as do Mark, Aristarchus, Demas, and Luke, my fellow workers.","The grace of our Lord Jesus Christ be with your spirit. Amen."]},"blk":{"1":[{"a":1,"z":1,"star":1,"grk":"<p lang=\"grc\">Παῦλος δέσμιος Χριστοῦ Ἰησοῦ καὶ Τιμόθεος ὁ ἀδελφὸς Φιλήμονι τῷ ἀγαπητῷ καὶ συνεργῷ ἡμῶν<\/p>","lit":"<p>Paul, a prisoner of Christ Jesus, and Timothy the brother, to Philemon—the beloved one, and our fellow worker,<\/p>","key":"<table><tr><th>Greek<\/th><th>Transliteration<\/th><th>Literal<\/th><th>Here<\/th><\/tr><tr><td>Παῦλος δέσμιος Χριστοῦ Ἰησοῦ<\/td><td>Paulos desmios Christou Iēsou<\/td><td>Paul, a prisoner of Christ Jesus<\/td><td>Not “apostle” but first “prisoner”; repeated in 1:9<\/td><\/tr><tr><td>Τιμόθεος ὁ ἀδελφὸς<\/td><td>Timotheos ho adelphos<\/td><td>Timothy the brother<\/td><td>Track 3, first stop: “brother”<\/td><\/tr><tr><td>Φιλήμονι τῷ ἀγαπητῷ<\/td><td>Philēmoni tō agapētō<\/td><td>to beloved Philemon<\/td><td>Track 2, first stop: “beloved”<\/td><\/tr><tr><td>συνεργῷ ἡμῶν<\/td><td>synergō hēmōn<\/td><td>our fellow worker<\/td><td>The “fellow-” prefix: fellow worker, fellow soldier, fellow prisoner<\/td><\/tr><\/table>","gram":"<p><strong>In this letter Paul does not use his most familiar title.<\/strong>At the head of Romans, First and Second Corinthians, Ephesians and Colossians, Paul usually calls himself ἀπόστολος (apostolos); in Philippians he and Timothy are δοῦλοι (douloi). Only in this letter is the first noun δέσμιος (desmios): one who is bound, a prisoner. The word appears again in 1:9, pressed right up against “for love’s sake I rather beg” (1:9). It is a letter of appeal, and its writer leaves his authority outside the door before he begins.<\/p><p>The genitive in δέσμιος Χριστοῦ Ἰησοῦ (desmios Christou Iēsou) can be read two ways. One is causal—“imprisoned for the sake of Christ Jesus”—which is the reading the Chinese Union Version adopts. The other is possessive—“a prisoner belonging to Christ Jesus”: what binds Paul is not Rome but Christ. The two readings do not compete, and these notes hold both.<\/p><p>The forms of address plant a seed for later. Timothy is ὁ ἀδελφὸς (ho adelphos); Philemon is τῷ ἀγαπητῷ (tō agapētō). In 1:16 these two words will come together and settle on Onesimus: ἀδελφὸν ἀγαπητόν (adelphon agapēton). In his very first line, Paul has already laid the titles he means to give Onesimus on two honored men, one each.<\/p>","exp":"<p>“Paul, a prisoner of Christ Jesus, and Timothy our brother, to Philemon, our beloved fellow worker” (1:1). The man writing sits in a prison; the man receiving sits in his own home. A man with no freedom is writing to a man with a house and slaves, to ask him to do something very hard.<\/p><p>Paul could easily have led with his apostleship. He does not. He calls himself a prisoner first, which is as good as telling Philemon: this is not an official decree; it was written by a man in chains. As Chapter 1 of our Philippians Study Notes showed, Paul’s chains were no defeat: “it became evident … that my bonds are in Christ” (Phil 1:13). In this letter the chains serve one more purpose: they make an appeal sound like an appeal.<\/p><p>Philemon is called a “fellow worker”—not a disciple, not a subordinate. Paul seats him in the same row as himself and Timothy. What Paul is about to ask of him is not an order passed down from superior to inferior; it is a conversation between colleagues.<\/p><p>This brings to mind the Lord who “emptied himself, taking the form of a servant” (Phil 2:7). Paul’s calling himself a prisoner is not humility put on for show; he really is in chains. The 321 principles say Jesus is my role model: the one who holds authority lays it down first, and you can see it in the very first line of the letter.<\/p>"},{"a":2,"z":3,"star":2,"grk":"<p lang=\"grc\">καὶ Ἀπφίᾳ τῇ ἀδελφῇ καὶ Ἀρχίππῳ τῷ συστρατιώτῃ ἡμῶν καὶ τῇ κατʼ οἶκόν σου ἐκκλησίᾳ·<\/p><p lang=\"grc\">χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.<\/p>","lit":"<p>and to Apphia the sister, and to Archippus our fellow soldier, and to the church in your house:<\/p><p>Grace to you, and peace, from God our Father and the Lord Jesus Christ.<\/p>","key":"<table><tr><th>Greek<\/th><th>Transliteration<\/th><th>Literal<\/th><th>Here<\/th><\/tr><tr><td>Ἀπφίᾳ τῇ ἀδελφῇ<\/td><td>Apphia tē adelphē<\/td><td>to Apphia the sister<\/td><td>◆ Textual note: RP reads “beloved”<\/td><\/tr><tr><td>Ἀρχίππῳ τῷ συστρατιώτῃ ἡμῶν<\/td><td>Archippō tō systratiōtē hēmōn<\/td><td>to Archippus our fellow soldier<\/td><td>The Archippus of Col 4:17<\/td><\/tr><tr><td>τῇ κατʼ οἶκόν σου ἐκκλησίᾳ<\/td><td>tē kat' oikon sou ekklēsia<\/td><td>to the church in your house<\/td><td>σου singular: one person’s house<\/td><\/tr><tr><td>χάρις ὑμῖν καὶ εἰρήνη<\/td><td>charis hymin kai eirēnē<\/td><td>grace and peace to you<\/td><td>ὑμῖν plural; forms a frame with 1:25<\/td><\/tr><\/table>","gram":"<p><strong>The letter has four sets of recipients.<\/strong>Philemon, Apphia, Archippus, and finally τῇ κατʼ οἶκόν σου ἐκκλησίᾳ (tē kat' oikon sou ekklēsia), “the church in your house.” κατʼ οἶκόν (kat' oikon) means “by house,” “in the home”; Rom 16:5, 1 Cor 16:19 and Col 4:15 all use this expression for a house church. σου (sou) is singular, and its most natural referent is Philemon, the first name on the list. A minority of scholars take it to mean Archippus, the name immediately before it; but every “you” in the rest of the letter is Philemon, and these notes follow the majority reading. A private letter, yet its addressees include an entire gathering: this letter was meant to be read aloud before the church.<\/p><blockquote><p>◆ Textual note: SBLGNT, WH, Treg and NA28 read ἀδελφῇ (adelphē), “sister,” and the Chinese Union Version’s “sister” follows this reading; RP reads ἀγαπητῇ (agapētē), “beloved.” ἀγαπητῇ (agapētē) is very likely a scribe’s assimilation to τῷ ἀγαπητῷ (tō agapētō) in 1:1, making the two forms of address match; ἀδελφῇ (adelphē) is the reading of the earlier manuscripts, and also the less tidy one—the harder one to have been produced by correction. These notes follow SBLGNT and the Chinese Union Version. Apphia is often thought to have been Philemon’s wife, though the text does not say so.<\/p><\/blockquote><p>The ὑμῖν (hymin) of 1:3 is plural—the letter’s first “you all.” From 1:4 onward, “you” returns to the singular. In 1:22 and 1:25 the plural reappears: at both its opening and its close, the letter gathers in the whole house church.<\/p>","exp":"<p>[Col] Col 4:9–17 (Colossians Study Notes, Chapter 4)<\/p><p>To Apphia our sister, “to Archippus our fellow soldier, and to the assembly in your house” (1:2). These names can also be found at the close of Colossians. Tychicus carried that letter, and with him Paul sent Onesimus—“together with Onesimus, the faithful and beloved brother, who is one of you” (Col 4:9). One journey, two letters: Colossians went to the church of the whole city, Philemon to one household within it. Archippus is named there too: “Take heed to the ministry which you have received in the Lord, that you fulfill it” (Col 4:17).<\/p><p>Why should a household matter be read out before the whole church? Not to apply pressure, leaving Philemon no graceful way out in front of everyone. The better understanding is this: when a person is received back, it is never merely a matter between two people. Onesimus was coming back to a home, and also to a table where the church gathered. The church’s presence was both a witness and a protection—from then on, everyone would know what Paul had asked, and everyone would know into whose hands Onesimus had been entrusted.<\/p><p>The greeting is Paul’s customary “grace and peace.” This letter begins in grace, and it ends in grace too (1:25). The appeal in the middle is held between two layers of grace.<\/p><p>Chapter 3 of our Colossians Study Notes dealt with the household-code lines about “bondservant” and “free.” In Colossians the household code is a principle; here it is a man with a name, standing at the door of a home with an address. The 321 principles speak of establishing God’s system, and the smallest unit of that system is right here in this verse: one household, one living room, one group of people. Its test is here as well: can a returning slave find a seat at that table?<\/p>"},{"a":4,"z":5,"star":1,"grk":"<p lang=\"grc\">Εὐχαριστῶ τῷ θεῷ μου πάντοτε μνείαν σου ποιούμενος ἐπὶ τῶν προσευχῶν μου,<\/p><p lang=\"grc\">ἀκούων σου τὴν ἀγάπην καὶ τὴν πίστιν ἣν ἔχεις πρὸς τὸν κύριον Ἰησοῦν καὶ εἰς πάντας τοὺς ἁγίους,<\/p>","lit":"<p>I thank my God, always making mention of you in my prayers,<\/p><p>because I keep hearing of your love, and of the faith that you have toward the Lord Jesus and toward all the saints,<\/p>","key":"<table><tr><th>Greek<\/th><th>Transliteration<\/th><th>Literal<\/th><th>Here<\/th><\/tr><tr><td>Εὐχαριστῶ τῷ θεῷ μου πάντοτε<\/td><td>Eucharistō tō theō mou pantote<\/td><td>I always thank my God<\/td><td>Present tense: not just once<\/td><\/tr><tr><td>μνείαν σου ποιούμενος<\/td><td>mneian sou poioumenos<\/td><td>making mention of you<\/td><td>Named in prayer<\/td><\/tr><tr><td>ἀκούων<\/td><td>akouōn<\/td><td>continually hearing<\/td><td>Present participle: the news keeps coming<\/td><\/tr><tr><td>τὴν ἀγάπην καὶ τὴν πίστιν<\/td><td>tēn agapēn kai tēn pistin<\/td><td>love and faith<\/td><td>Track 2: “your love”<\/td><\/tr><tr><td>πρὸς τὸν κύριον Ἰησοῦν καὶ εἰς πάντας τοὺς ἁγίους<\/td><td>pros ton kyrion Iēsoun kai eis pantas tous hagious<\/td><td>toward the Lord Jesus, and toward all the saints<\/td><td>Chiasm<\/td><\/tr><\/table>","gram":"<p><strong>1:5 is a chiasm.<\/strong>In the Greek the order runs: love—faith—toward the Lord—toward the saints. The most natural reading pairs them crosswise: faith toward the Lord Jesus, love toward all the saints. The Chinese Union Version’s main text hangs both objects, the Lord Jesus and all the saints, on “faith”; its footnote offers an alternative—“because I hear that you have love and faith toward the Lord Jesus and all the saints”—so that both objects attach to both love and faith. Yet another reading takes πίστιν (pistin) as “faithfulness,” and faithfulness toward the saints makes good sense too. These notes take the chiastic reading, setting the main text and the footnote side by side.<\/p><p>ἀκούων (akouōn) is a present participle: Paul did not hear once; he keeps on hearing. Where was the news coming from? Epaphras had come from Colossae (Col 1:7–8), and Onesimus had come from that very household. The man who came from his master’s house may well have been the one telling Paul, “My master really loves the brothers and sisters.”<\/p>","exp":"<p>“I thank my God always, making mention of you in my prayers” (1:4). Rhetoricians call this a bid for goodwill: affirm the other person first, then make the request. But Paul’s thanksgiving is not wrapping paper. Everything he names is something Philemon truly has: love, faith, the hearts of all the saints refreshed through him. Paul’s praise rests on fact, and so the appeal that follows stands on solid ground.<\/p><p>The words “all the saints” deserve a second look. Philemon loved “all the saints”—and when this was written it was true. But once Onesimus came to faith in chains, the roll of “all the saints” grew by one. The appeal Paul is about to make simply reads the word “all” in 1:5 at face value: you love all the saints, and now among those saints is your own slave.<\/p><p>A person’s love often carries an invisible list, and the names on it are the people who are easy to love. Paul does not criticize Philemon for having too short a list. He simply gives thanks first, and then gently adds one more name. Thanks first, request after—that very order is a mark of respect for Philemon: he is seen before he is invited.<\/p>"},{"a":6,"z":6,"star":2,"grk":"<p lang=\"grc\">ὅπως ἡ κοινωνία τῆς πίστεώς σου ἐνεργὴς γένηται ἐν ἐπιγνώσει παντὸς ἀγαθοῦ τοῦ ἐν ἡμῖν εἰς Χριστόν<\/p>","lit":"<p>so that the fellowship of your faith may become effective, in the knowledge of every good thing that is among us, for Christ.<\/p>","key":"<table><tr><th>Greek<\/th><th>Transliteration<\/th><th>Literal<\/th><th>Here<\/th><\/tr><tr><td>ὅπως<\/td><td>hopōs<\/td><td>so that<\/td><td>Continues the prayer of 1:4: what Paul prays<\/td><\/tr><tr><td>ἡ κοινωνία τῆς πίστεώς σου<\/td><td>hē koinōnia tēs pisteōs sou<\/td><td>the fellowship of your faith<\/td><td>The hardest sentence in the book; three readings<\/td><\/tr><tr><td>ἐνεργὴς γένηται<\/td><td>energēs genētai<\/td><td>may become effective<\/td><td>Take effect, be put into action<\/td><\/tr><tr><td>ἐν ἐπιγνώσει παντὸς ἀγαθοῦ<\/td><td>en epignōsei pantos agathou<\/td><td>in the knowledge of every good thing<\/td><td>ἀγαθοῦ links to τὸ ἀγαθόν σου in 1:14<\/td><\/tr><tr><td>εἰς Χριστόν<\/td><td>eis Christon<\/td><td>for Christ<\/td><td>◆ RP adds “Jesus”<\/td><\/tr><\/table>","gram":"<p><strong>1:6 is the hardest sentence in the whole book.<\/strong>The difficulty lies in the genitive phrase ἡ κοινωνία τῆς πίστεώς σου (hē koinōnia tēs pisteōs sou), which can be read in at least three ways: ①<\/p><p>①<strong>Faith shared outward<\/strong>: you share your faith with others, with an evangelistic overtone; the Chinese Union Version’s rendering can accommodate both ① the sharing view and ② the fellowship view. ②<strong>Fellowship that comes from faith<\/strong>: by faith you have become partners with us; κοινωνία (koinōnia) refers to the partnership among believers. ③<strong>Your participation in the faith<\/strong>: a subjective genitive, referring to Philemon’s own life of faith.<\/p><p>These notes take the second reading, and the reason lies in 1:17: Εἰ οὖν με ἔχεις κοινωνόν (Ei oun me echeis koinōnon), “If then you count me a partner”—the same root. In 1:6 Paul prays for this partnership; by 1:17 he grounds it in one concrete act: receive him. The fellowship of faith is to “become effective”; ἐνεργὴς (energēs) means put into action, made to work.<\/p><p>Whose knowledge is ἐν ἐπιγνώσει (en epignōsei)? The Chinese Union Version renders it “so that people may know,” treating it as the knowledge of others; it can also be read as Philemon’s own deepening knowledge. παντὸς ἀγαθοῦ (pantos agathou) echoes τὸ ἀγαθόν σου (to agathon sou) in 1:14: the abstract “every good thing” becomes, by 1:14, one concrete good deed.<\/p><blockquote><p>◆ At the end of the verse SBLGNT reads εἰς Χριστόν (eis Christon); RP reads “for Christ Jesus,” adding Ἰησοῦν (Iēsoun). The meaning is the same, and the Chinese Union Version’s “for Christ” agrees with SBLGNT.<\/p><\/blockquote>","exp":"<p>“That the fellowship of your faith may become effective in the knowledge of every good thing which is in us in Christ Jesus” (1:6). Paul’s prayer for Philemon is not for more feelings but for effect. Faith that stays only in the heart is like a check that is never cashed.<\/p><p>This prayer is about to be answered, and in a way Philemon could never have imagined. Paul has not yet mentioned Onesimus by name, yet he has already prayed that “the fellowship of your faith may become effective.” When the door opens and that man is standing there, the prayer will have a face. The fellowship of faith is not seen most clearly while the church sings hymns together; it is seen most clearly in front of someone who is hard to receive.<\/p><p>The Chinese Union Version closes the verse with “all done for Christ”; the Greek points in a direction: εἰς Χριστόν (eis Christon), toward Christ. The destination of good deeds is not Philemon’s reputation, nor Paul’s request being granted; it is Christ. The 321 principles say: let Jesus receive all the glory. The very same good deed can be done to show off one’s magnanimity, or done for Christ. From the outside you cannot tell the difference, but the destination is not the same.<\/p><p>Interpreters read this sentence differently, and there is no need to unpack the debate from the pulpit. Hold on to just one thing: faith becomes effective only in a concrete act of welcome. How genuine a church’s faith is depends not only on how complete its confession of faith is, but on whether its door can open when someone who once wronged others is standing at it.<\/p>"},{"a":7,"z":7,"star":2,"grk":"<p lang=\"grc\">χαρὰν γὰρ πολλὴν ἔσχον καὶ παράκλησιν ἐπὶ τῇ ἀγάπῃ σου, ὅτι τὰ σπλάγχνα τῶν ἁγίων ἀναπέπαυται διὰ σοῦ, ἀδελφέ.<\/p>","lit":"<p>For I have had much joy and comfort in your love, because the hearts of the saints have been refreshed through you, brother.<\/p>","key":"<table><tr><th>Greek<\/th><th>Transliteration<\/th><th>Literal<\/th><th>Here<\/th><\/tr><tr><td>χαρὰν γὰρ πολλὴν ἔσχον<\/td><td>charan gar pollēn eschon<\/td><td>For I have had much joy<\/td><td>◆ Textual note: RP reads “grace”<\/td><\/tr><tr><td>παράκλησιν<\/td><td>paraklēsin<\/td><td>comfort<\/td><td>Same root as παρακαλῶ in 1:9–10<\/td><\/tr><tr><td>τὰ σπλάγχνα τῶν ἁγίων<\/td><td>ta splanchna tōn hagiōn<\/td><td>the hearts of the saints<\/td><td>The book’s first “heart” (vv. 7, 12, 20)<\/td><\/tr><tr><td>ἀναπέπαυται<\/td><td>anapepautai<\/td><td>have been refreshed<\/td><td>Perfect tense: the refreshment still lasts<\/td><\/tr><tr><td>διὰ σοῦ ἀδελφέ<\/td><td>dia sou adelphe<\/td><td>through you, brother<\/td><td>Vocative placed at the end of the sentence<\/td><\/tr><\/table>","gram":"<p><strong>σπλάγχνα (splanchna) is the key word of the whole letter.<\/strong>Its basic meaning is the inward parts; the ancients believed the emotions rose from the belly, so it is rendered “heart” or “inward affections.” It appears three times in this letter: in 1:7 the hearts of the saints have been refreshed through you; in 1:12 Onesimus is my very heart; in 1:20, refresh my heart as well. String the three together and you have the path of the whole book.<\/p><p>ἀναπέπαυται (anapepautai) is perfect passive, and ἀναπαύω (anapauō) means to let someone stop and catch their breath. When the Lord says “I will give you rest” (Matt 11:28), he uses the future of the same verb, ἀναπαύσω (anapausō). This brings the Lord’s words to mind; it is not that Paul is quoting them. διὰ σοῦ (dia sou) names the channel: the Lord gives people rest, and Philemon is the hand through which that rest passes.<\/p><blockquote><p>◆ Textual note: SBLGNT, WH, Treg and NA28 read χαρὰν (charan), “joy,” and the Chinese Union Version’s “great joy” follows this reading; RP reads χάριν (charin), “grace.” The two words differ by only a letter or two and were easily confused in copying. χαρὰν (charan) has the support of earlier manuscripts and pairs with παράκλησιν (paraklēsin) to make the natural couplet “joy and comfort”; χάριν (charin) may have been influenced by the idiom χάριν ἔχω (charin echō), “to give thanks.” These notes follow SBLGNT and the Chinese Union Version.<\/p><\/blockquote><p>ἀδελφέ (adelphe), placed at the end of the sentence, is a vocative. Before he opens his mouth to ask anything, Paul first calls him “brother.”<\/p>","exp":"<p>“For we have much joy and comfort in your love, because the hearts of the saints have been refreshed through you, brother” (1:7). Here stands the first peak of this chapter on the book’s terrain map. Philemon is not a man who needs to be remade; he is already a man in whose company people can rest. Those who came to his house for worship arrived weary and left lighter.<\/p><p>This must be made clear first, because it determines the nature of the appeal that follows. Paul is not asking Philemon to become someone else; he is asking him to be himself: you have always refreshed the hearts of the saints, and now here is a saint whose heart is my own heart (1:12). In 1:20 Paul says, “Refresh my heart in the Lord” (1:20)—the same “heart,” the same “refresh.” Paul is simply asking him to do once more what he has always done, and to do it for the hardest person of all.<\/p><p>It also reminds every reader of this letter: the truest test of a good name is not how we treat the people everyone likes. Philemon was already a place of rest for many. The question is whether the man who once cost him money and caused him to lose face could also catch his breath in that house.<\/p><p>Paul’s tone is gentle, but it is not vague. He spells out Philemon’s goodness plainly, so that Philemon knows: you are not being handled as a problem; you are being trusted. A man who is trusted finds it easier to do more than he thought he could.<\/p>"},{"a":8,"z":9,"star":2,"grk":"<p lang=\"grc\">Διό, πολλὴν ἐν Χριστῷ παρρησίαν ἔχων ἐπιτάσσειν σοι τὸ ἀνῆκον,<\/p><p lang=\"grc\">διὰ τὴν ἀγάπην μᾶλλον παρακαλῶ, τοιοῦτος ὢν ὡς Παῦλος πρεσβύτης νυνὶ δὲ καὶ δέσμιος Χριστοῦ Ἰησοῦ —<\/p>","lit":"<p>Therefore, though I have much boldness in Christ to command you what is fitting,<\/p><p>yet for love’s sake I would rather appeal to you—being such a one as I am: Paul, an old man, and now also a prisoner of Christ Jesus—<\/p>","key":"<table><tr><th>Greek<\/th><th>Transliteration<\/th><th>Literal<\/th><th>Here<\/th><\/tr><tr><td>Διό<\/td><td>Dio<\/td><td>therefore<\/td><td>Links back to 1:4–7: because you are this kind of man<\/td><\/tr><tr><td>πολλὴν ἐν Χριστῷ παρρησίαν ἔχων<\/td><td>pollēn en Christō parrēsian echōn<\/td><td>having much boldness in Christ<\/td><td>Concessive participle: though I have<\/td><\/tr><tr><td>ἐπιτάσσειν σοι τὸ ἀνῆκον<\/td><td>epitassein soi to anēkon<\/td><td>to command you what is fitting<\/td><td>Paul really does have authority to command<\/td><\/tr><tr><td>διὰ τὴν ἀγάπην μᾶλλον παρακαλῶ<\/td><td>dia tēn agapēn mallon parakalō<\/td><td>for love’s sake I rather appeal<\/td><td>Authority laid down; love speaks<\/td><\/tr><tr><td>Παῦλος πρεσβύτης<\/td><td>Paulos presbytēs<\/td><td>Paul, an old man<\/td><td>◆ Textual note: conjectural reading “ambassador”<\/td><\/tr><tr><td>νυνὶ δὲ καὶ δέσμιος<\/td><td>nyni de kai desmios<\/td><td>and now also a prisoner<\/td><td>Links back to 1:1<\/td><\/tr><\/table>","gram":"<p><strong>1:8–9 is a concessive sentence.<\/strong>ἔχων (echōn) is a concessive participle: “though I have.” Paul has παρρησίαν (parrēsian), the freedom to speak boldly in Christ; he could ἐπιτάσσειν (epitassein), the word for a command issued by someone in authority. The New Testament uses it when Jesus commands unclean spirits and commands the wind and the waves (Mark 1:27; Luke 8:25), and when Herod gives an order (Mark 6:27). τὸ ἀνῆκον (to anēkon), “what is fitting,” shares its root with ὡς ἀνῆκεν ἐν κυρίῳ (hōs anēken en kyriō) in Col 3:18: Paul knows that this matter is fitting in the Lord, and he has every right to say so outright. Yet the main verb is παρακαλῶ (parakalō), “I appeal,” with μᾶλλον (mallon) in front of it: rather.<\/p><p>Whose love is διὰ τὴν ἀγάπην (dia tēn agapēn)? It could be Paul’s love; it could be Philemon’s love of 1:5 and 1:7; or it could be the love the two men share. The article points back to the love just mentioned, and these notes read it this way: on the strength of that love we both know.<\/p><blockquote><p>◆ Textual note: every manuscript reads πρεσβύτης (presbytēs), “old man,” and the Chinese Union Version’s “aged” follows this reading. The reading “ambassador” actually comes in two forms. One is a conjectural emendation (Bentley) that changes the text to πρεσβευτής (presbeutēs). The other is Lightfoot’s view that the two are one word with two senses: spelling was sometimes interchanged at the time, so the form πρεσβύτης (presbytēs) itself could mean “ambassador” without any change to the text. Some versions (such as the RSV) adopt “ambassador.” Both views can point to πρεσβεύω (presbeuō) in Eph 6:20: “for which I am an ambassador in chains” (Eph 6:20). The emendation has no manuscript support at all; Lightfoot’s view needs no change to the text and carries more weight. But here “ambassador” is a title of authority, running directly against the direction of the context, which is the laying down of authority; “old man” pairs with “prisoner,” and both are positions of weakness. These notes follow the manuscripts and the Chinese Union Version in reading “aged,” and set out both forms of the “ambassador” reading.<\/p><\/blockquote><p>At the end of 1:9 SBLGNT has a dash: as Paul speaks of himself as a prisoner, the sentence breaks off, and only in 1:10 does he pick up παρακαλῶ (parakalō) and say it again.<\/p>","exp":"<p>“Therefore though I have all boldness in Christ to command you that which is appropriate, yet for love’s sake I rather beg, being such a one as Paul, the aged, but also a prisoner of Jesus Christ” (1:8–9). This is the book’s view of authority. Paul does not say he has no authority. He says he has it, and plenty of it—and then he chooses not to use it.<\/p><p>A command can win compliance; only an appeal can win the heart. What Paul wants is not one action from Philemon but Philemon’s heart. Had he issued an order, Onesimus might well have been taken in—but taken in by an unwilling master, and that kind of welcome would show its cracks on his very first day home. So Paul does not command.<\/p><p>These two verses are often pressed in two opposite directions, and both need care. The first uses 1:8 to justify spiritual commands: “Even Paul said he could command.” Do not read it that way; Paul says this precisely in order to say that he will not do it. The second turns “appeal” into a command in disguise—outwardly a request, in reality impossible to refuse. 1:14 will close that road: what Paul wants is a willing heart.<\/p><p>He places himself in two positions of weakness: he is old, and he is locked up. What pressure can an old prisoner bring to bear on anyone? Love is all he has left to use. 321 teaches that humility means laying down our rights and returning to our originally intended position. Paul has not lost his standing as an apostle; what he lays down is power. And Philemon will soon be invited to lay something down as well: his rights as a master. Humility draws out humility.<\/p>"},{"a":10,"z":11,"star":3,"grk":"<p lang=\"grc\">παρακαλῶ σε περὶ τοῦ ἐμοῦ τέκνου, ὃν ἐγέννησα ἐν τοῖς δεσμοῖς Ὀνήσιμον,<\/p><p lang=\"grc\">τόν ποτέ σοι ἄχρηστον νυνὶ δὲ σοὶ καὶ ἐμοὶ εὔχρηστον,<\/p>","lit":"<p>I appeal to you for my child, whom I have fathered in my chains: Onesimus,<\/p><p>who once was useless to you, but now is very useful both to you and to me;<\/p>","key":"<table><tr><th>Greek<\/th><th>Transliteration<\/th><th>Literal<\/th><th>Here<\/th><\/tr><tr><td>παρακαλῶ σε περὶ τοῦ ἐμοῦ τέκνου<\/td><td>parakalō se peri tou emou teknou<\/td><td>I appeal to you for my child<\/td><td>τέκνου is a word of family, parent and child<\/td><\/tr><tr><td>ὃν ἐγέννησα ἐν τοῖς δεσμοῖς<\/td><td>hon egennēsa en tois desmois<\/td><td>whom I fathered in my chains<\/td><td>A man in bonds has a child<\/td><\/tr><tr><td>Ὀνήσιμον<\/td><td>Onēsimon<\/td><td>Onesimus<\/td><td>The name comes last in the sentence; CUV footnote: “profitable”<\/td><\/tr><tr><td>τόν ποτέ σοι ἄχρηστον<\/td><td>ton pote soi achrēston<\/td><td>once useless to you<\/td><td>The lowest point on the book’s terrain<\/td><\/tr><tr><td>νυνὶ δὲ σοὶ καὶ ἐμοὶ εὔχρηστον<\/td><td>nyni de soi kai emoi euchrēston<\/td><td>now very useful to you and to me<\/td><td>Once / now: the formula of transformation<\/td><\/tr><\/table>","gram":"<p><strong>The name comes last in the sentence.<\/strong>The word order of 1:10 runs: I appeal to you—for my child—whom I fathered in my chains—Onesimus. Ὀνήσιμον (Onēsimon) is the very last word. Paul lets Philemon hear “my child” and “fathered in my chains” first, and only at the end speaks the name. Before Philemon ever hears the name, he has already heard the place this man holds in Paul’s heart.<\/p><p>ἐγέννησα (egennēsa) means “fathered,” “begot.” Paul uses the same image when he says he became the Corinthians’ father through the Good News (this brings 1 Cor 4:15 to mind), and he says to the Galatians, “My little children, of whom I am again in travail” (Gal 4:19). A man shut up in prison has had a son.<\/p><p>The name and 1:11 form a pun. The Chinese Union Version’s footnote reads, “Onesimus: that is, ‘profitable.’” It was a common slave name in that day; a master would name his slave “Useful,” rather like putting a label on a tool. 1:11 uses ἄχρηστον (achrēston), “useless,” and εὔχρηστον (euchrēston), “very useful.” Both carry the root of χρηστός (chrēstos), and together with the meaning of the name they make a play on words: the man called “Profitable” was once unprofitable; now he finally lives up to his name.<\/p><blockquote><p>Some scholars take it a step further. In that period χρηστός (chrēstos) and Χριστός (Christos) were pronounced very much alike, so ἄχρηστον (achrēston) could sound like “without Christ” and εὔχρηστον (euchrēston) like “a good Christ-man.” Ancient readers did notice this wordplay, but whether Paul intended it cannot be proved. These notes set it out without deciding, and it is not a point to stress from the pulpit.<\/p><\/blockquote><p>ποτέ (pote) … νυνὶ δὲ (nyni de), “once … but now,” is the New Testament’s formula for describing conversion; Eph 2:13 also has νυνὶ δὲ (nyni de). σοὶ καὶ ἐμοὶ (soi kai emoi): the ones who benefit are first Philemon, then Paul. Paul later uses this same word εὔχρηστος (euchrēstos) of Mark: “he is useful to me for service” (2 Tim 4:11).<\/p>","exp":"<p>“I beg you for my child, whom I have become the father of in my chains, Onesimus, who once was useless to you, but now is useful to you and to me” (1:10–11). The lowest point of this chapter on the book’s terrain map lies in the first half of 1:11. Paul does not whitewash Onesimus: he really was useless once. That sentence is fair to Philemon. He had suffered loss, and Paul admits it.<\/p><p>Why was Onesimus with Paul at all? The text does not say directly, and four readings have been proposed over the centuries. ① <strong>A runaway slave<\/strong>: the traditional reading—he fled his master’s house and, by a roundabout path, came upon Paul. ② <strong>Seeking a mediator<\/strong>: in the writings of the Roman jurists, a slave who had fallen out with his master could go to a friend of the master (<em>amicus domini<\/em>) to plead on his behalf, and this did not count as running away; Onesimus may have sought Paul out on purpose. ③ <strong>Sent by Philemon<\/strong>: he had been sent to serve Paul, which the words “on your behalf he might serve me” in 1:13 might support. ④ <strong>Blood brothers<\/strong>: a few, on the basis of “in the flesh” in 1:16, think the two men were blood relatives, but this reading has very little support. These notes hold the first two readings together as the main options and do not rule between them. From the pulpit, preach only the three things the text makes certain: he was once useless; he was born again in Paul’s chains; and he is now being sent back by Paul to his master’s house.<\/p><p>Whichever reading you take, steer clear of one direction: describing Onesimus’s departure as “This runaway sinned, and he deserves to go back and be punished.” The text never says that. Paul speaks of his past with a single word: useless. Then he turns straight to “now.”<\/p><p>Where does this “now” come from? Not from Onesimus working hard to make himself useful, but from his being born in Paul’s chains. The source of the change is the gospel, not a self-improvement program. His name finally fits him, because a Lord has changed him.<\/p><p>Paul calls him “my child.” A man who under Roman law was property is, on Paul’s lips, a son. In 321’s 235, the “3” stands for spiritual parents and children. Here we can see what that relationship looks like: the father does not hide his child’s past, yet he sets the child’s name beside his own.<\/p>"},{"a":12,"z":12,"star":2,"grk":"<p lang=\"grc\">ὃν ἀνέπεμψά σοι αὐτόν, τοῦτʼ ἔστιν τὰ ἐμὰ σπλάγχνα ·<\/p>","lit":"<p>I am sending him back to you—him, that is, my very heart.<\/p>","key":"<table><tr><th>Greek<\/th><th>Transliteration<\/th><th>Literal<\/th><th>Here<\/th><\/tr><tr><td>ὃν ἀνέπεμψά σοι<\/td><td>hon anepempsa soi<\/td><td>I am sending him back to you<\/td><td>Epistolary aorist; also the legal word for “remitting” a case<\/td><\/tr><tr><td>αὐτόν<\/td><td>auton<\/td><td>him<\/td><td>Redundant pronoun for emphasis; CUV “in person”<\/td><\/tr><tr><td>τοῦτʼ ἔστιν<\/td><td>tout' estin<\/td><td>that is<\/td><td>Formula of explanation<\/td><\/tr><tr><td>τὰ ἐμὰ σπλάγχνα<\/td><td>ta ema splanchna<\/td><td>my very heart<\/td><td>The second “heart”: the heart has become a person<\/td><\/tr><\/table>","gram":"<p><strong>ἀνέπεμψά (anepempsa) is an epistolary aorist.<\/strong>When Paul writes, he has not yet sent the man; but by the time Philemon reads the letter, the man is already standing in front of him. Paul writes from the reader’s point in time, so he uses the past tense, and the Chinese Union Version’s “I am now sending” captures it exactly. The verb is also a legal term for remitting a case to the person with authority to decide it: in Luke 23:7, when Pilate ἀνέπεμψεν (anepempsen) Jesus to Herod, this is the word used. Paul is handing this case to Philemon for his decision.<\/p><p>Grammatically the sentence is incomplete: after ὃν (hon) comes another αὐτόν (auton), followed by τοῦτʼ ἔστιν τὰ ἐμὰ σπλάγχνα (tout' estin ta ema splanchna). Literally: he is my inward parts. The Chinese Union Version renders 1:12 as “he is the one on my heart,” unpacking the metaphor. σπλάγχνα (splanchna) in 1:7 was the hearts of the saints; here it has become a person.<\/p><blockquote><p>◆ Textual note: SBLGNT, WH, Treg and NA28 have no imperative verb in this verse; RP adds προσλαβοῦ (proslabou), “receive him.” The copyist very likely borrowed this word from 1:17 to complete an unfinished sentence. The earlier manuscripts lack it, and so does the Chinese Union Version. These notes follow SBLGNT and the Chinese Union Version. The effect matters a great deal: in 1:12 Paul does not yet say “receive.” He wants first to finish giving his reasons in 1:13–16, and only in 1:17 does he speak in the imperative for the first time.<\/p><\/blockquote>","exp":"<p>[Col] Col 4:7–9 (Colossians Study Notes, Chapter 4)<\/p><p>“I am sending him back … that is, my own heart” (1:12). This sentence is the easiest in the letter to preach crookedly, so we must first see clearly how Onesimus went back.<\/p><p>He did not walk back alone. First, he carried Paul’s letter in his hand, and the letter spelled out his new identity. Second, he had a traveling companion: Tychicus went with him carrying the letter to the Colossians—“the beloved brother, faithful servant, and fellow bondservant in the Lord” (Col 4:7)—and Paul makes a point of saying that he went “together with Onesimus” (Col 4:9). Third, this letter was to be read before the whole church (1:2), so the entire house church stood as witnesses. Fourth, Paul put himself up as guarantor: receive him as you would receive me; charge whatever he owes to my account (1:17–19). This was a protected return.<\/p><p>So this verse must never be used to send an abused spouse, a mistreated child, or an exploited migrant worker or employee back to the person who is harming them. That is not Onesimus’s situation, and it is not what Paul did. When someone’s physical safety is under threat, protect life first, seek help through the law, and report it—this is where these notes draw the line. If reconciliation is possible at all, it requires repentance, a guarantor and safety; it does not rest on the endurance of the one who was hurt.<\/p><p>There is another side to this verse: what Paul sends away is his own heart. He could have kept Onesimus, yet he sends him back. Sending a man back to face his past costs Paul something too. He is not pushing a problem back where it came from; he is handing over a part of himself and entrusting it to Philemon.<\/p><p>The word “heart” walks three steps through the book, and this is the middle one: you have refreshed the hearts of the saints (1:7); now my own heart stands at your door.<\/p>"},{"a":13,"z":14,"star":2,"grk":"<p lang=\"grc\">ὃν ἐγὼ ἐβουλόμην πρὸς ἐμαυτὸν κατέχειν, ἵνα ὑπὲρ σοῦ μοι διακονῇ ἐν τοῖς δεσμοῖς τοῦ εὐαγγελίου,<\/p><p lang=\"grc\">χωρὶς δὲ τῆς σῆς γνώμης οὐδὲν ἠθέλησα ποιῆσαι, ἵνα μὴ ὡς κατὰ ἀνάγκην τὸ ἀγαθόν σου ᾖ ἀλλὰ κατὰ ἑκούσιον·<\/p>","lit":"<p>him I kept wanting to hold back here with me, so that on your behalf he might serve me in my chains for the gospel;<\/p><p>but without your consent I was willing to do nothing, so that your goodness would not be as if from compulsion, but from free will.<\/p>","key":"<table><tr><th>Greek<\/th><th>Transliteration<\/th><th>Literal<\/th><th>Here<\/th><\/tr><tr><td>ἐβουλόμην<\/td><td>eboulomēn<\/td><td>I kept wanting<\/td><td>Imperfect: a lingering desire<\/td><\/tr><tr><td>πρὸς ἐμαυτὸν κατέχειν<\/td><td>pros emauton katechein<\/td><td>to keep with me<\/td><td>κατέχειν: to hold fast, to hold back<\/td><\/tr><tr><td>ὑπὲρ σοῦ μοι διακονῇ<\/td><td>hyper sou moi diakonē<\/td><td>serve me on your behalf<\/td><td>Onesimus serving Paul = Philemon serving Paul<\/td><\/tr><tr><td>χωρὶς δὲ τῆς σῆς γνώμης<\/td><td>chōris de tēs sēs gnōmēs<\/td><td>but without your consent<\/td><td>γνώμης: opinion, consent<\/td><\/tr><tr><td>κατὰ ἀνάγκην<\/td><td>kata anankēn<\/td><td>from compulsion<\/td><td>Under pressure<\/td><\/tr><tr><td>κατὰ ἑκούσιον<\/td><td>kata hekousion<\/td><td>from free will<\/td><td>Only here in the New Testament; willingly<\/td><\/tr><\/table>","gram":"<p><strong>The tenses of two verbs sketch Paul’s heart.<\/strong>ἐβουλόμην (eboulomēn) in 1:13 is imperfect: he kept wanting it, wanted it for a long time, yet did not act on it. ἠθέλησα (ēthelēsa) in 1:14 is aorist: a decision. Paul’s desire was to keep him; Paul’s decision was not to.<\/p><p>ὑπὲρ σοῦ (hyper sou) is a deft touch: had Onesimus stayed, he would have been serving Paul “on your behalf.” Paul counts Philemon into this service, as though Philemon were already serving him in prison. διακονῇ (diakonē) is the word for serving, for a servant or deacon; Col 4:7 calls Tychicus a faithful servant, using the same word family.<\/p><p>The contrast in 1:14 is κατὰ ἀνάγκην (kata anankēn) and κατὰ ἑκούσιον (kata hekousion): compulsion and free will. The adjective ἑκούσιον (hekousion) appears only here in the New Testament. When Peter urges the elders to shepherd the flock “not under compulsion, but voluntarily” (1 Pet 5:2), he uses the adverb from the same root, ἑκουσίως (hekousiōs). τὸ ἀγαθόν σου (to agathon sou) links back to παντὸς ἀγαθοῦ (pantos agathou) in 1:6: that abstract “every good thing” here becomes one particular good thing Philemon is to do.<\/p><p>ὡς κατὰ ἀνάγκην (hōs kata anankēn) has ὡς (hōs), “as if,” in front of it: Paul does not want it even to look as though Philemon were compelled. Roman law had rules about harboring someone else’s slave, so had Paul kept him, he would have had to answer to Philemon in law and in decency alike. He chose not to make Philemon’s decision for him.<\/p>","exp":"<p>“Whom I desired to keep with me, that on your behalf he might serve me in my chains for the Good News. But I was willing to do nothing without your consent, that your goodness would not be as of necessity, but of free will” (1:13–14). Paul had a very real need: he was locked up and needed someone to look after him. Onesimus was already looking after him. Keeping him would have been the most convenient thing for Paul.<\/p><p>But Paul will not make Philemon’s decision for him. This verse carries 1:8–9 all the way: an appeal is not a command in disguise. Had Paul kept the man first and then written to “ask” Philemon’s consent, it would have been a fait accompli, and Philemon could only have nodded. Paul does not do that. He hands the decision back, whole and entire.<\/p><p>“Free will” is the heart of these two verses. When a good deed is done under compulsion, the one who does it keeps score, and the one who is taken in can feel it. A slave taken in under pressure would forever be a reminder in that house: the master lost. A welcome given freely is different—it lets both men stand up straight.<\/p><p>This matters greatly for pastoral care today. Never use this letter to force a wounded person to accept someone at once, or to forgive at once; that would run directly against 1:14. Forgiveness hands judgment over to God; reconciliation is a road both parties walk, and it takes time, repentance and safety. Paul left Philemon room, and the pulpit must leave its hearers room as well.<\/p><p>321 says that when humility meets humility, both sides win. Paul first lays down the power to command and lays down his own wish to keep the man; only then can Philemon freely lay down his rights as a master. When one side yields first, the other has room to stand.<\/p>"},{"a":15,"z":16,"star":3,"grk":"<p lang=\"grc\">τάχα γὰρ διὰ τοῦτο ἐχωρίσθη πρὸς ὥραν ἵνα αἰώνιον αὐτὸν ἀπέχῃς,<\/p><p lang=\"grc\">οὐκέτι ὡς δοῦλον ἀλλὰ ὑπὲρ δοῦλον, ἀδελφὸν ἀγαπητόν, μάλιστα ἐμοί, πόσῳ δὲ μᾶλλον σοὶ καὶ ἐν σαρκὶ καὶ ἐν κυρίῳ.<\/p>","lit":"<p>For perhaps this is the very reason he was parted from you for a while, that you might have him back in full forever,<\/p><p>no longer as a slave, but more than a slave, as a beloved brother—especially to me, but how much more to you, both in the flesh and in the Lord.<\/p>","key":"<table><tr><th>Greek<\/th><th>Transliteration<\/th><th>Literal<\/th><th>Here<\/th><\/tr><tr><td>τάχα γὰρ<\/td><td>tacha gar<\/td><td>for perhaps<\/td><td>Paul does not pin down God’s will<\/td><\/tr><tr><td>ἐχωρίσθη<\/td><td>echōristhē<\/td><td>he was parted<\/td><td>Passive voice: not “he ran away”<\/td><\/tr><tr><td>πρὸς ὥραν<\/td><td>pros hōran<\/td><td>for a while<\/td><td>Literally “for an hour”<\/td><\/tr><tr><td>αἰώνιον αὐτὸν ἀπέχῃς<\/td><td>aiōnion auton apechēs<\/td><td>that you might have him in full forever<\/td><td>ἀπέχῃς: “paid in full” on a receipt<\/td><\/tr><tr><td>οὐκέτι ὡς δοῦλον<\/td><td>ouketi hōs doulon<\/td><td>no longer as a slave<\/td><td>ὡς: the way he is regarded<\/td><\/tr><tr><td>ἀλλὰ ὑπὲρ δοῦλον ἀδελφὸν ἀγαπητόν<\/td><td>alla hyper doulon adelphon agapēton<\/td><td>but more than a slave, as a beloved brother<\/td><td>The hinge of the whole book<\/td><\/tr><tr><td>καὶ ἐν σαρκὶ καὶ ἐν κυρίῳ<\/td><td>kai en sarki kai en kyriō<\/td><td>both in the flesh and in the Lord<\/td><td>Both are required<\/td><\/tr><\/table>","gram":"<p><strong>τάχα (tacha) means “perhaps.”<\/strong>This adverb appears only twice in the New Testament; the other occurrence is “Yet perhaps for a righteous person someone would even dare to die” (Rom 5:7). When Paul explains Onesimus’s departure in 1:15, the very first word he uses is “perhaps.” He sees that God’s hand may be in this, but he will not pin it down.<\/p><p>ἐχωρίσθη (echōristhē) is passive: “he was parted.” Paul does not say “he ran away,” nor even “he left you.” The passive can be read in two ways. One is the “divine passive,” hinting that God was at work behind the scenes; the other is Paul’s tact, avoiding a harsh word so that Philemon is not reminded of his loss the moment he reads it. Both readings are set out here. And even if it is read as a divine passive, the τάχα (tacha) in front of it still governs it.<\/p><p>πρὸς ὥραν (pros hōran) literally means “for an hour,” set against αἰώνιον (aiōnion), “forever.” ἀπέχῃς (apechēs) is a word from commercial receipts meaning “paid in full”: when the Lord says of the hypocrites, “they have received their reward” (Matt 6:2), the Greek is ἀπέχουσιν (apechousin), the same word. What Philemon lost was a slave for an hour; what he receives is a brother forever—and received in full.<\/p><p>The ὡς (hōs) in 1:16 needs to be read carefully. οὐκέτι ὡς δοῦλον (ouketi hōs doulon) means “no longer as a slave”: Paul is speaking of the way Philemon regards him; he does not say outright that Onesimus’s legal status has changed. Some scholars think this verse, together with 1:21, hints at manumission; both readings are set out—see the contested-questions page. ὑπὲρ δοῦλον (hyper doulon) means “more than a slave”—not “no longer related,” but a relationship raised higher. ἀδελφὸν ἀγαπητόν (adelphon agapēton) is precisely Timothy’s “brother” and Philemon’s “beloved” from 1:1, joined together.<\/p><p>The final phrase is καὶ ἐν σαρκὶ καὶ ἐν κυρίῳ (kai en sarki kai en kyriō): both in the flesh and in the Lord. ἐν σαρκὶ (en sarki) refers to everyday human and social relationships—at home, at work; ἐν κυρίῳ (en kyriō) refers to one’s standing in the Lord. Paul uses καὶ (kai) … καὶ (kai): both are required.<\/p>","exp":"<p>[Gal] Gal 3:28 (Galatians Study Notes, Chapter 3)<\/p><p>“For perhaps he was therefore separated from you for a while, that you would have him forever” (1:15). This is the second valley of this chapter on the book’s terrain map: he left. The very next verse is the highest peak in the book. Between them stands just one word: “perhaps.”<\/p><p>That word “perhaps” matters a great deal. Paul does not say, “This was all God’s plan.” He says perhaps. When a relationship has broken, people are often quick to speak for God: “All of this was God’s arrangement.” Paul is more careful than we are. He sees that God may be at work in it, yet he does not call Onesimus’s possible wrongdoing or Philemon’s loss things God wanted to happen. This is not to say that God is not sovereign; it is to say that we must not dress up harm as the will of God. 321 says the Holy Spirit is my guide: we see God’s hand in the midst of uncertainty without saying more than we know. It also calls us to change our perspective: from the human view, “he left,” to “perhaps … that you would have him forever”—from the temporary to the eternal.<\/p><p>“No longer as a slave, but more than a slave, a beloved brother” (1:16). This is the hinge of the whole book. In Roman law a slave was <em>res<\/em>, a thing. Now a thing is being called a brother. Paul himself had said in Galatians, “there is neither slave nor free man … for you are all one in Christ Jesus” (Gal 3:28); and Colossians says, “where there can’t be … bondservant, or free person; but Christ is all, and in all” (Col 3:11). Here those words acquire a face.<\/p><p>The New Testament does not endorse slavery. Paul urges slaves, “if you get an opportunity to become free, use it” (1 Cor 7:21; the Greek of this verse can also be read differently), and he lists “slave-traders” (1 Tim 1:10) among the things contrary to sound doctrine. Philemon was not written as a manifesto for abolition. It does something else: the gospel enters one particular household and turns the relationship between master and slave inside out.<\/p><p>“Both in the flesh and in the Lord” (1:16). In the Lord the two men are brothers; in the flesh they are brothers too. This change does not happen only while we are singing hymns at worship. It must happen at home, in the account books, and tomorrow morning when the day’s work is handed out. We cannot say, “We are brothers in the Lord,” and then carry on as before when it comes to wages, time off and living quarters. Colossians had already said it: “Masters, give to your servants that which is just and equal, knowing that you also have a Master in heaven” (Col 4:1).<\/p><p>Today this becomes especially concrete. The live-in caregiver at home, the migrant worker in the factory, the agency-placed employee—their situations differ from those of ancient slaves, and we must not simply equate them. Yet they too are easily seen as so much labor, a line of cost. What 1:16 requires is that whoever calls them brother on Sunday treat them that way on Monday.<\/p><p>321 says people matter more than tasks, and relationships matter more than things. Philemon carries that saying all the way: even a man the law treated as a thing is a brother. Here the “2” of 920 is the hardest one of all: someone who once wronged you.<\/p>"},{"a":17,"z":19,"star":3,"grk":"<p lang=\"grc\">Εἰ οὖν με ἔχεις κοινωνόν, προσλαβοῦ αὐτὸν ὡς ἐμέ.<\/p><p lang=\"grc\">εἰ δέ τι ἠδίκησέν σε ἢ ὀφείλει, τοῦτο ἐμοὶ ἐλλόγα<\/p><p lang=\"grc\">ἐγὼ Παῦλος ἔγραψα τῇ ἐμῇ χειρί, ἐγὼ ἀποτίσω· ἵνα μὴ λέγω σοι ὅτι καὶ σεαυτόν μοι προσοφείλεις.<\/p>","lit":"<p>So if you count me a partner, receive him as you would receive me.<\/p><p>And if he has wronged you in anything, or owes you anything, charge this to my account.<\/p><p>I, Paul, have written it with my own hand: I will repay—not to mention to you t
