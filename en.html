hat you owe me even your very self besides.<\/p>","key":"<table><tr><th>Greek<\/th><th>Transliteration<\/th><th>Literal<\/th><th>Here<\/th><\/tr><tr><td>Εἰ οὖν με ἔχεις κοινωνόν<\/td><td>Ei oun me echeis koinōnon<\/td><td>so if you count me a partner<\/td><td>κοινωνός: a business partner<\/td><\/tr><tr><td>προσλαβοῦ αὐτὸν ὡς ἐμέ<\/td><td>proslabou auton hōs eme<\/td><td>receive him as you would receive me<\/td><td>The letter’s first imperative<\/td><\/tr><tr><td>ἠδίκησέν σε ἢ ὀφείλει<\/td><td>ēdikēsen se ē opheilei<\/td><td>wronged you, or owes you<\/td><td>Paul does not deny the loss<\/td><\/tr><tr><td>τοῦτο ἐμοὶ ἐλλόγα<\/td><td>touto emoi elloga<\/td><td>charge this to my account<\/td><td>A commercial term; RP reads ἐλλόγει<\/td><\/tr><tr><td>ἐγὼ Παῦλος ἔγραψα τῇ ἐμῇ χειρί<\/td><td>egō Paulos egrapsa tē emē cheiri<\/td><td>I, Paul, have written it with my own hand<\/td><td>A legally binding IOU<\/td><\/tr><tr><td>ἐγὼ ἀποτίσω<\/td><td>egō apotisō<\/td><td>I will repay<\/td><td>A legal term; only here in the New Testament<\/td><\/tr><tr><td>σεαυτόν μοι προσοφείλεις<\/td><td>seauton moi prosopheileis<\/td><td>you owe me even your own self besides<\/td><td>Paraleipsis: saying “not to mention” while mentioning it<\/td><\/tr><\/table>","gram":"<p><strong>1:17 is the letter’s first imperative.<\/strong>For sixteen verses Paul has been giving thanks, appealing and explaining; only here does he say προσλαβοῦ (proslabou), “receive him.” This is also the word that the RP variant at 1:12 borrowed: Paul’s real command does not appear until his reasons have been fully given. The conditional Εἰ οὖν με ἔχεις κοινωνόν (Ei oun me echeis koinōnon) assumes its condition to be true: since you do count me a partner. κοινωνόν (koinōnon) shares its root with κοινωνία (koinōnia) in 1:6; the prayer of 1:6 comes down to earth here.<\/p><p>προσλαβοῦ (proslabou) means to take someone to your side. Paul uses the same word in Romans: “Therefore accept one another, even as Christ also accepted you” (Rom 15:7).<\/p><p>εἰ δέ τι ἠδίκησέν σε ἢ ὀφείλει (ei de ti ēdikēsen se ē opheilei) in 1:18 is also a conditional. Paul says “if”: he neither accuses Onesimus nor denies a possible loss. ἐλλόγα (elloga) is a commercial term, “enter it on the account.” RP reads ἐλλόγει (ellogei), another form of the same verb, with the same meaning. The cognate ἐλλογεῖται (ellogeitai) appears in Rom 5:13: “but sin is not charged when there is no law” (Rom 5:13)—“not charged” means “not entered on the books.”<\/p><p>In 1:19 Paul takes the pen from his scribe: ἔγραψα τῇ ἐμῇ χειρί (egrapsa tē emē cheiri), I have written with my own hand. This was the standard form of an IOU in that day, and ἀποτίσω (apotisō) is the legal word for making restitution. Then comes the rhetorical device of paraleipsis: ἵνα μὴ λέγω σοι (hina mē legō soi), not to mention to you—when in fact he has just mentioned it. Philemon had very likely come to faith through Paul; what he owed Paul was his own life. The sentence can be read in two ways: as gentle pressure, or as a reminder given with a smile. These notes set out both, leaning slightly toward the humorous reading, because the whole letter moves in the direction of the free will of 1:14; yet for the one receiving the letter, a debt of grace still carries weight.<\/p>","exp":"<p>“If then you count me a partner, receive him as you would receive me” (1:17). Receiving someone involves a concrete action: opening the door. Paul does not want Philemon merely to forgive in his heart; he wants Philemon to bring the man in through the door and welcome him the way he would welcome Paul—the same table, the same guest room.<\/p><p>“But if he has wronged you at all or owes you anything, put that to my account” (1:18). This is the third valley of this chapter on the book’s terrain map. Paul does not say, “Let bygones be bygones.” He does not say, “He’s a believer now, so the slate is wiped clean.” If a wrong really was done, the debt is real, and someone has to answer for it. The text does not say Onesimus stole anything; Paul only says “if.” But he takes over every possible debt in advance. Paul’s solution is not to cancel the debt but to put it under another name: charge it to me. This is where forgiveness and reconciliation differ: reconciliation does not mean pretending no wrong was done, nor does it mean waiving responsibility. Philemon’s possible loss is seen, and it is borne.<\/p><p>“I, Paul, write this with my own hand: I will repay it” (1:19). Another peak, right on the heels of the valley floor. Each time we look down and see a debt, in the very next verse someone shoulders it.<\/p><p>At this point, readers across two thousand years have stopped and pondered. In his 1522 preface to Philemon, Luther said that we are all Christ’s Onesimus, if we believe—these are Luther’s words, not the text’s. This brings Christ to mind: God was “not reckoning to them their trespasses” (2 Cor 5:19), and “him who knew no sin he made to be sin on our behalf” (2 Cor 5:21); and Rom 5:13 uses this very same root for “charging to an account.” But let us be clear: Paul is not teaching a doctrine of atonement here, nor does he say Onesimus represents the sinner. He is dealing with a real debt. That this debt reminds us of the cross is the reader’s response, not Paul’s argument.<\/p><p>“Not to mention to you that you owe to me even your own self besides” (1:19). This sentence must not be taken as a model for using past kindness to bind people from the pulpit—as if a spiritual leader could say, “Everything you have, I gave you, so you must do as I say.” Paul has only just said he wants a willing heart (1:14). In raising this old debt, he is more likely making the kind of smiling remark friends make: I’m shouldering his debt; you actually owe me a little on your side too, but I won’t bring it up. Both readings are set out, leaning slightly toward the humorous one; yet for the one receiving the letter, a debt of grace still carries weight. So this sentence may only be said gently by the one who is owed; it may never be used by the pulpit to make demands of people.<\/p><p>What these three verses should leave in our memory is not Paul’s eloquence but the Lord who wrote our debt down under his own name. 321 speaks of selflessness: writing another person’s debt under your own name. Paul did this because he had first been treated this way himself.<\/p>"},{"a":20,"z":22,"star":1,"grk":"<p lang=\"grc\">ναί, ἀδελφέ, ἐγώ σου ὀναίμην ἐν κυρίῳ· ἀνάπαυσόν μου τὰ σπλάγχνα ἐν Χριστῷ<\/p><p lang=\"grc\">πεποιθὼς τῇ ὑπακοῇ σου ἔγραψά σοι, εἰδὼς ὅτι καὶ ὑπὲρ ἃ λέγω ποιήσεις.<\/p><p lang=\"grc\">ἅμα δὲ καὶ ἑτοίμαζέ μοι ξενίαν, ἐλπίζω γὰρ ὅτι διὰ τῶν προσευχῶν ὑμῶν χαρισθήσομαι ὑμῖν.<\/p>","lit":"<p>Yes, brother, may I have benefit from you in the Lord; refresh my heart in Christ.<\/p><p>Confident of your obedience, I write to you, knowing that you will do even more than I say.<\/p><p>And at the same time, prepare a guest room for me as well, for I hope that through your prayers I will be graciously given back to you.<\/p>","key":"<table><tr><th>Greek<\/th><th>Transliteration<\/th><th>Literal<\/th><th>Here<\/th><\/tr><tr><td>ἐγώ σου ὀναίμην ἐν κυρίῳ<\/td><td>egō sou onaimēn en kyriō<\/td><td>may I have benefit from you in the Lord<\/td><td>ὀναίμην: same root as the name Onesimus<\/td><\/tr><tr><td>ἀνάπαυσόν μου τὰ σπλάγχνα<\/td><td>anapauson mou ta splanchna<\/td><td>refresh my heart<\/td><td>The third “heart”; echoes 1:7<\/td><\/tr><tr><td>πεποιθὼς τῇ ὑπακοῇ σου<\/td><td>pepoithōs tē hypakoē sou<\/td><td>confident of your obedience<\/td><td>Obedience to whom?<\/td><\/tr><tr><td>ὑπὲρ ἃ λέγω ποιήσεις<\/td><td>hyper ha legō poiēseis<\/td><td>will do more than I say<\/td><td>A hint of manumission?<\/td><\/tr><tr><td>ἑτοίμαζέ μοι ξενίαν<\/td><td>hetoimaze moi xenian<\/td><td>prepare a guest room for me<\/td><td>Paul intends to come in person<\/td><\/tr><tr><td>χαρισθήσομαι ὑμῖν<\/td><td>charisthēsomai hymin<\/td><td>I will be graciously given to you<\/td><td>Passive voice; “you” plural<\/td><\/tr><\/table>","gram":"<p><strong>ὀναίμην (onaimēn) is the book’s final pun.<\/strong>It is the optative of ὀνίνημι (oninēmi), found only here in the New Testament, meaning “may I have benefit.” The name Onesimus, Ὀνήσιμος (Onēsimos), comes from this very root. Paul is as good as saying: may I gain an “Onesimus” from you. The Chinese Union Version’s footnote reads, “joy: or, benefit”; the main text, “have joy because of you,” takes the extended sense, while the footnote preserves the meaning of the root.<\/p><p>ἀνάπαυσόν μου τὰ σπλάγχνα (anapauson mou ta splanchna) echoes 1:7: the same verb, the same “heart.” ◆ At the end of the verse SBLGNT reads ἐν Χριστῷ (en Christō), and the Chinese Union Version’s “in Christ” follows it; RP reads ἐν κυρίῳ (en kyriō), possibly altered for consistency under the influence of the ἐν κυρίῳ (en kyriō) in the first half of the verse.<\/p><p>ὑπακοῇ (hypakoē) in 1:21 is “obedience,” and its object is not stated: it may be Paul’s request, or it may be the gospel itself. Both readings are set out; on either reading, it means obeying what Paul asks in the Lord (and so, in the end, obeying the Lord), not unconditional submission to an individual. ὑπὲρ ἃ λέγω (hyper ha legō), “more than I say,” is read by some as a hint that Onesimus should be set free, and by others as a general reference to further kindness; both readings are set out—see the contested-questions page. In 1:22, προσευχῶν ὑμῶν (proseuchōn hymōn) and χαρισθήσομαι ὑμῖν (charisthēsomai hymin) are both plural: the whole house church prays together. χαρισθήσομαι (charisthēsomai) is passive: whether Paul gets out of prison is God’s gracious gift.<\/p>","exp":"<p>“Yes, brother, let me have joy from you in the Lord. Refresh my heart in the Lord” (1:20). This is the last time Paul calls him “brother.” The benefit he asks for is not money; it is a man being caught and held well. When Onesimus is received, Paul’s heart will find its rest.<\/p><p>“Having confidence in your obedience, I write to you, knowing that you will do even beyond what I say” (1:21). This is trust, not threat. What Philemon is to obey is what Paul asks in the Lord (and so, in the end, the Lord himself), not unconditional submission to an individual. Nor may this verse be used to silence questions, as though “obedience” meant you are not allowed to ask why. Paul gave Philemon more than a dozen verses of reasons precisely because he respected Philemon’s thinking.<\/p><p>“Also, prepare a guest room for me” (1:22). Paul intends to come in person. That gives the whole letter a sequel: this is not a request written once and then forgotten. Paul will come and see; he will know how Onesimus is faring in that house. The one who is received back is not simply handed over and then left with no one to care for him. Nor does Paul’s hope rest on his own maneuvering; it rests on “your prayers” (1:22). He places his release from prison in God’s hands, and he places Onesimus in the care of a praying household.<\/p>"},{"a":23,"z":25,"star":2,"grk":"<p lang=\"grc\">Ἀσπάζεταί σε Ἐπαφρᾶς ὁ συναιχμάλωτός μου ἐν Χριστῷ Ἰησοῦ,<\/p><p lang=\"grc\">Μᾶρκος, Ἀρίσταρχος, Δημᾶς, Λουκᾶς, οἱ συνεργοί μου.<\/p><p lang=\"grc\">Ἡ χάρις τοῦ κυρίου Ἰησοῦ Χριστοῦ μετὰ τοῦ πνεύματος ὑμῶν<\/p>","lit":"<p>Epaphras, my fellow prisoner in Christ Jesus, greets you,<\/p><p>as do Mark, Aristarchus, Demas and Luke, my fellow workers.<\/p><p>The grace of the Lord Jesus Christ be with your spirit.<\/p>","key":"<table><tr><th>Greek<\/th><th>Transliteration<\/th><th>Literal<\/th><th>Here<\/th><\/tr><tr><td>Ἐπαφρᾶς ὁ συναιχμάλωτός μου<\/td><td>Epaphras ho synaichmalōtos mou<\/td><td>Epaphras, my fellow prisoner<\/td><td>A word for prisoners of war; founder of the Colossian church<\/td><\/tr><tr><td>Μᾶρκος, Ἀρίσταρχος, Δημᾶς, Λουκᾶς<\/td><td>Markos, Aristarchos, Dēmas, Loukas<\/td><td>Mark, Aristarchus, Demas, Luke<\/td><td>The same group as in Col 4:10–14<\/td><\/tr><tr><td>οἱ συνεργοί μου<\/td><td>hoi synergoi mou<\/td><td>my fellow workers<\/td><td>Links back to “fellow worker” in 1:1<\/td><\/tr><tr><td>Ἡ χάρις τοῦ κυρίου Ἰησοῦ Χριστοῦ<\/td><td>Hē charis tou kyriou Iēsou Christou<\/td><td>the grace of the Lord Jesus Christ<\/td><td>◆ RP adds “our”<\/td><\/tr><tr><td>μετὰ τοῦ πνεύματος ὑμῶν<\/td><td>meta tou pneumatos hymōn<\/td><td>be with your spirit<\/td><td>ὑμῶν plural; ◆ RP adds “Amen”<\/td><\/tr><\/table>","gram":"<p><strong>συναιχμάλωτός (synaichmalōtos) was originally a word for prisoners of war.<\/strong>αἰχμάλωτος (aichmalōtos) is someone captured on the battlefield; add the prefix “fellow-” and it means a fellow captive. Colossians uses it of Aristarchus (Col 4:10); here it is used of Epaphras. Paul strings his companions together with a chain of “fellow-” words: fellow worker, fellow soldier, fellow prisoner.<\/p><p>The verb Ἀσπάζεταί (Aspazetai) in 1:23 is singular, yet five names hang from it: Epaphras is the subject, and the four in 1:24 are added on.<\/p><p>The ὑμῶν (hymōn) of 1:25 is plural. From 1:4 onward the letter uses the singular “you” almost throughout, speaking to Philemon alone; but the final sentence switches to the plural: grace be with the spirit of you all. This personal letter gives grace to the whole house church. The Chinese Union Version reads “in your heart,” in the singular, so here the Greek must supply what is missing.<\/p><blockquote><p>◆ Textual note: SBLGNT, WH, Treg and NA28 read τοῦ κυρίου Ἰησοῦ Χριστοῦ (tou kyriou Iēsou Christou), with no ἀμήν (amēn) at the end; RP adds ἡμῶν (hēmōn) after κυρίου (kyriou) and adds Ἀμήν (Amēn) at the end. The Chinese Union Version’s “our Lord” and “Amen” follow RP. An “Amen” at the close of a letter was easily added during the church’s public reading; some important manuscripts (such as A and D*) lack it, while ℵ, C and others have it. These notes follow SBLGNT; from the pulpit, read the Chinese Union Version as it stands—there is no need to change it. The word “always” in the Chinese Union Version is printed in small type as a supplied word: the Greek has no such word, and the translators added it for the sake of smooth sense.<\/p><\/blockquote>","exp":"<p>[Background] Acts 15:37–39 (Acts Study Notes, Chapter 15)<\/p><p>[2 Tim] 2 Tim 4:10–11 (2 Timothy Study Notes, Chapter 4)<\/p><p>“Epaphras, my fellow prisoner in Christ Jesus, greets you, as do Mark, Aristarchus, Demas, and Luke, my fellow workers” (1:23–24). Epaphras was the man who brought the gospel to Colossae (Col 1:7), and Philemon very likely knew him. Aristarchus sailed with Paul to Rome (Acts 27:2).<\/p><p>Mark’s name deserves a pause. As Chapter 15 of our Acts Study Notes explained, Mark was “someone who had withdrawn from them in Pamphylia” (Acts 15:38), and Paul and Barnabas fell into a dispute over him. Now he stands beside Paul, listed among his fellow workers. Later Paul would even say, “Take Mark, and bring him with you, for he is useful to me for service” (2 Tim 4:11). “Useful” is the very word used of Onesimus in 1:11. On this list stand two men who were once “useless” and later became useful.<\/p><p>Demas is on the list too. Later Paul would write, “Demas left me, having loved this present world, and went to Thessalonica” (2 Tim 4:10). A team roster is real, not perfect. Do not use Demas to shame people who have left the church; we do not know how his story ended, and what we hold on to is prayer and hope. Nor should we use Mark to say, “Those who leave will always come back”; Mark’s return was grace, not a guarantee. In 321’s 235, the “5” is the team: a real roster on which some come back and some leave, all of them in God’s hands.<\/p><p>“The grace of our Lord Jesus Christ be with your spirit. Amen” (1:25). The last word of the whole book is grace. Philemon cannot receive Onesimus on willpower alone; when someone grits his teeth to open a door, the door soon swings shut again. The order of this letter is: first grace, then welcome. Only when the whole house church is held up by grace together can that table make room for one who has come back.<\/p>"}]},"serm":{"1":{"min":18,"blocks":[["h","No Longer as a Slave, but More Than a Slave — a Beloved Brother"],["p","Brothers and sisters, peace to you. Today we are reading Philemon together. The whole book is a single chapter—twenty-five verses."],["q","Colossae, at dusk. Cooking smoke is rising, and people in the street are heading home."],["p","In one house, voices drift from the courtyard, along with the clink of bowls and plates."],["p","Today is the day the church gathers. The master of the house stands at the door welcoming the brothers and sisters. His name is Philemon."],["p","Just then, two men come walking up from the end of the lane, their feet covered in dust."],["p","The one in front is Tychicus. Tucked inside his cloak is a letter—sent by Paul from prison."],["p","The one behind him keeps his head down the whole way."],["p","He knows this lane far too well. He knows exactly which paving stone is loose."],["p","Because he used to live here. He was a slave in this household."],["q","His name is Onesimus."],["p","Once he was useless to his master, and he may even have owed his master something."],["p","Tychicus raises his hand and knocks. The voices in the courtyard stop for a moment."],["q","The door opens."],["p","Philemon sees Tychicus, and his first response is a smile. Then he sees the face behind Tychicus."],["p","Brothers and sisters, please stop right here, at this moment."],["p","Inside the door: a room full of brothers and sisters, and a master who has suffered a loss."],["p","Outside the door: a man who once left and has now come back."],["p","Between the two of them, there is nothing but a letter."],["p","There are three people in this letter."],["p","Paul, who wrote it: he could command, yet he asks; he could keep the man, yet he sends him back; he could settle the account, yet he shoulders it himself."],["p","Philemon, who receives it: he has rights, he has reasons, yet he is invited to lay them down."],["p","Onesimus, who delivers it: once useless, now standing at the door."],["p","You may see yourself in one of these three."],["p","But my hope is that, in the end, the one you see is Someone else."],["p","This chapter has three words: Love, Appeal, Receive."],["p","We will take three steps: a home where hearts are refreshed; from slave to brother; charge it to my account."],["q","Step one: a home where hearts are refreshed."],["p","Tychicus opens the letter. The room falls quiet to hear the first line."],["q","“Paul, a prisoner of Christ Jesus, and Timothy our brother, to Philemon, our beloved fellow worker” (1:1)"],["p","In his other letters Paul usually opens by calling himself an apostle. In this one he says: a prisoner."],["p","The Greek word means someone who is bound."],["p","In a letter that will ask someone to do a hard thing, the writer’s first move, in the very first line, is to leave his authority outside the door."],["p","He calls Philemon a “beloved fellow worker.” Not a subordinate—a fellow worker."],["p","Please remember two terms of address: Timothy is “brother,” and Philemon is “beloved.”"],["p","In a little while, these two terms will come together and land on the man standing at the door."],["q","“To the beloved Apphia, to Archippus our fellow soldier, and to the assembly in your house” (1:2)."],["p","Why would a household matter be read out in front of the whole church?"],["p","Not to leave Philemon with no graceful way out. It is because when someone is received back, it is never just a matter between two people."],["p","He is coming back to a household, and also back to a table where the church gathers. The church’s presence is a witness—and a protection."],["p","Here is God’s system in its smallest unit: one household, one living room, one group of people."],["p","And here is its test as well: whether a slave who has come back can find a seat at that table."],["q","“Grace to you and peace from God our Father and the Lord Jesus Christ” (1:3)."],["p","This letter begins with grace, and it will end in grace too."],["p","The very hard request in the middle is held between two layers of grace."],["p","And then Paul does not make his request straight away. First he gives thanks."],["q","“I thank my God always, making mention of you in my prayers” (1:4)"],["q","“Hearing of your love and of the faith which you have toward the Lord Jesus, and toward all the saints” (1:5)."],["p","“Hearing”—in the Greek, he keeps on hearing. The news kept making its way into the prison."],["p","Listen to that word “all.” When Paul wrote this sentence, the list of “all the saints” already had one more name on it."],["p","Each of us carries an invisible list in our love. The names on that list are the people who are easy to love."],["p","Paul does not criticize Philemon for having too short a list. He simply gives thanks first, and then gently adds one name."],["q","“That the fellowship of your faith may become effective in the knowledge of every good thing which is in us in Christ Jesus” (1:6)."],["p","Interpreters read this sentence in different ways. We will hold on to just one word: effective—that is, worked out in practice."],["p","How real a church’s faith is shows when someone who once wronged another is standing at its door—does the door open or not?"],["q","“For we have much joy and comfort in your love, because the hearts of the saints have been refreshed through you, brother” (1:7)."],["p","“Hearts”—in the Greek, the inward parts: the deepest, tenderest place inside a person."],["p","“Refreshed” means letting someone stop and catch their breath. This brings to mind the words of the Lord Jesus, with the same verb:"],["q","“Come to me, all you who labor and are heavily burdened, and I will give you rest” (Matt 11:28)."],["p","It is the Lord who gives rest. Philemon is a pair of hands through which that rest passes."],["p","People came to his house weary, and left lighter."],["p","Brothers and sisters, do you have a home like that? A home where, the moment you step inside, you can let your shoulders drop?"],["p","Philemon is not a bad man. He is already a good brother."],["p","Paul is not asking him to become someone else, but to be himself."],["p","To do once more what he has always done—and to do it for the hardest person of all."],["p","But the truest test of a good man’s love is not how he treats the people everyone likes."],["p","Tychicus turns to the next section. By now Philemon has probably guessed who the letter is about to mention."],["q","Step two: from slave to brother."],["q","“Therefore though I have all boldness in Christ to command you that which is appropriate” (1:8)"],["p","“Command” is the word for an order issued by someone with authority. Paul has that authority—and plenty of it."],["q","“Yet for love’s sake I rather beg, being such a one as Paul, the aged, but also a prisoner of Jesus Christ” (1:9)"],["p","And then he chooses not to use it."],["p","A command can win compliance. Only an appeal can win the heart."],["p","When someone is taken in under pressure, that welcome shows its cracks on the very first day home."],["p","Old, and a prisoner besides. What pressure can an old prisoner bring to bear on anyone? Love is all he has left to use."],["p","Parents, managers—please pause here for a moment: when you could give an order, do you choose to ask instead?"],["q","“I beg you for my child, whom I have become the father of in my chains, Onesimus” (1:10)."],["p","The word order in the Greek is remarkable."],["p","Paul first says “my child,” then “whom I fathered in my chains,” and only the very last word is the name."],["p","You can picture the moment. Someone in the room turns his head to look at the man standing by the door."],["p","Before Philemon ever hears the name, he has already heard the place this man holds in Paul’s heart."],["p","Under Roman law he was property. On Paul’s lips he is a son."],["q","“Who once was useless to you, but now is useful to you and to me” (1:11)."],["p","The name Onesimus means “profitable.” A master would name his slave “Useful,” rather like putting a label on a tool."],["p","Yet this man called Useful was once of no use at all."],["p","Paul is fair. He does not whitewash Onesimus. Philemon suffered a loss, and Paul admits it."],["p","This is the lowest point in the whole chapter. Yet Paul uses only one word for his past, and then immediately says: now."],["p","This “now” did not come from his own hard work. It came from his being born in Paul’s chains. The source of the change is the gospel."],["q","At last, the name fits the man."],["p","Brothers and sisters, is there a “once” in your life too—something you would rather never mention again?"],["p","The gospel does not erase your “once.” The gospel gives you a “now.”"],["q","“I am sending him back … that is, my own heart” (1:12)."],["p","“My own heart”—the Greek says literally: he is my very inward parts. What Paul is sending away is his own heart."],["p","But this is the verse most easily preached crookedly. We must see clearly how he went back."],["p","He had Paul’s letter in his hand. He had someone traveling with him:"],["q","“Together with Onesimus, the faithful and beloved brother, who is one of you” (Col 4:9)."],["p","Tychicus walked with him all the way to the door."],["p","This letter was to be read before the whole church, and everyone there was a witness."],["p","Paul had also given his personal guarantee: whatever was owed would be charged to his account."],["q","This was a protected return."],["p","So this verse must never, ever be used to send an abused spouse, a mistreated child or an exploited migrant worker back to the person who is harming them."],["p","If your physical safety is under threat, please protect your life first, seek help through the law, and find someone to report it to."],["p","The church should stand beside you—not stand at the door pushing you back."],["p","If reconciliation is possible at all, it requires repentance, a guarantor and safety. It does not rest on the endurance of the one who was hurt."],["q","“Whom I desired to keep with me, that on your behalf he might serve me in my chains for the Good News” (1:13)."],["p","“Desired”—in the Greek, he kept wanting it. Paul was locked up and needed someone to look after him. Keeping Onesimus would have been the most convenient thing."],["q","“But I was willing to do nothing without your consent, that your goodness would not be as of necessity, but of free will” (1:14)."],["p","Had he kept the man first and then written asking Philemon’s consent, it would have been a fait accompli, and Philemon could only have nodded."],["p","Paul does not do that. He hands the decision back, whole and entire."],["p","The Greek adjective here appears only this once in the New Testament."],["p","A good deed done under compulsion keeps score. A welcome given freely lets both people stand up straight."],["p","An appeal is an appeal—not a command in disguise."],["p","So this letter must not be used to force a wounded person to forgive at once, to accept someone at once. That would run directly against verse 14."],["p","Forgiveness hands judgment over to God. Reconciliation is a road two people walk together; it takes time, and it takes genuine repentance."],["p","Forgiveness is not the same as reconciliation, nor is it the same as wiping the slate clean."],["q","“For perhaps he was therefore separated from you for a while, that you would have him forever” (1:15)"],["p","Please listen to that word: perhaps. Paul does not say that all this was God’s plan. He says, perhaps."],["p","He sees that God’s hand may be in it, but he does not say more than he knows."],["p","So no one may say to a wounded person, “The hurt you suffered—God wanted it to happen.”"],["p","And yet God can also do in broken places what no one could have imagined. We must say both of these things."],["p","Notice, too: where Paul speaks of the separation, the Greek uses the passive—he was parted. He does not say, “He ran away.”"],["p","“For a while” in the Greek is “for an hour.” “Have him” is a word from receipts: paid in full."],["p","What you lost was a slave for an hour. What you receive, paid in full, is a brother forever."],["q","“No longer as a slave, but more than a slave, a beloved brother” (1:16)."],["p","Do you remember the two terms of address in verse 1? Brother. Beloved. Now they come together and land on the man standing at the door."],["q","A thing has been called a brother."],["q","“There is neither slave nor free man, there is neither male nor female; for you are all one in Christ Jesus” (Gal 3:28)."],["p","Here, those words acquire a face."],["p","Let us be clear: the New Testament does not endorse slavery. Paul lists “slave-traders” among the things contrary to sound doctrine (1 Tim 1:10). And to those who were slaves he said:"],["q","“If you get an opportunity to become free, use it” (1 Cor 7:21)."],["p","Philemon was not written as a manifesto."],["p","It lets the gospel into one household and turns the relationship between master and slave inside out."],["q","“Both in the flesh and in the Lord” (1:16)."],["p","In the Lord, he is a brother. In the flesh, he is a brother too. Both are required."],["p","Not only while we sing hymns on Sunday, but at home, in the account books, and tomorrow morning when the day’s work is handed out."],["p","We live in quite a few different countries. Many homes have a live-in caregiver; many factories have migrant workers; many companies have colleagues placed by an agency."],["p","They are not the slaves of the ancient world. Yet they too are easily seen as so much labor, a line of cost."],["p","You call him brother on Sunday—how do you treat him on Monday when it comes to his wages, his time off, the place he lives?"],["p","People matter more than tasks; relationships matter more than things. Even a man the law treated as a thing is a brother."],["p","But something may still be stuck in Philemon’s heart: All right, he is a brother. But what about my loss?"],["p","Paul knows. So he picks up the pen."],["q","Step three: charge it to my account."],["q","“If then you count me a partner, receive him as you would receive me” (1:17)."],["p","For sixteen verses, Paul has been giving thanks, appealing and explaining."],["p","Only here does he use a command for the first time: receive him."],["p","“Partner” means a business partner. The prayer for the fellowship of faith in verse 6 comes down to earth here."],["p","Receiving him does not mean merely forgiving in your heart; it means bringing him in through the door."],["p","Welcome him the way you would welcome Paul. The same table, the same guest room."],["q","“Therefore accept one another, even as Christ also accepted you” (Rom 15:7)"],["q","“But if he has wronged you at all or owes you anything, put that to my account” (1:18)"],["p","Paul does not say, “Let bygones be bygones.” Nor does he say, “He’s a believer now, so the slate is wiped clean.”"],["q","The debt is real. The wrong is real. Someone has to answer for it."],["p","Paul’s solution is not to cancel the debt but to put it under another name: charge it to me."],["q","“I, Paul, write this with my own hand: I will repay it” (1:19)."],["q","In his cell, Paul takes the pen from the scribe’s hand and, stroke by stroke, writes his own name."],["p","An old man in prison may not have had any money in his pocket. But he signed."],["p","Verse 18 is the valley floor: wronged, owes. Verse 19 is immediately a mountain: I will repay."],["p","At this point, people across two thousand years have stopped and pondered."],["p","Martin Luther once said: if only we believe, we are all Christ’s Onesimus."],["p","Paul is not teaching a doctrine of atonement here, nor does he say Onesimus represents the sinner. What he is dealing with is a real debt."],["p","Yet this debt reminds us of another debt. The word for “put that to my account” shares its root with the word in Romans, “sin is not charged when there is no law” (Rom 5:13)."],["q","“For him who knew no sin he made to be sin on our behalf; so that in him we might become the righteousness of God” (2 Cor 5:21)."],["p","The same passage also says that God was “not reckoning to them their trespasses” (2 Cor 5:19)."],["p","Our debt was not pretended away. It was entered under Another’s name."],["p","And that One did not merely sign an IOU. On the cross, he paid it in full."],["q","“Not to mention to you that you owe to me even your own self besides” (1:19)."],["p","Some read this sentence as gentle pressure; others read it as a reminder given with a smile."],["p","Paul has only just said he wants a willing heart, so I would rather hear it as a joke between friends."],["p","Yet for the one receiving the letter, a debt of grace still carries weight."],["p","This sentence must never become a line used from the pulpit to bind people: “Everything you have, I gave you, so you must do as I say.”"],["q","“Yes, brother, let me have joy from you in the Lord. Refresh my heart in the Lord” (1:20)."],["p","“Joy”—the Chinese Union Version’s footnote says it may also be rendered “benefit,” and it shares a root with the name Onesimus."],["p","Paul is as good as saying: may I gain an Onesimus from you."],["p","And then comes the third “heart.”"],["p","You have refreshed the hearts of the saints; my own heart is standing at your door; now please refresh my heart too."],["q","“Having confidence in your obedience, I write to you, knowing that you will do even beyond what I say” (1:21)."],["p","This is trust, not threat. What is “beyond what I say”? Paul does not spell it out; he leaves the room to Philemon."],["q","“Also, prepare a guest room for me” (1:22)"],["p","Paul intends to come in person. He will find out how Onesimus is faring in that house."],["p","The one who is received back is not simply handed over and then left with no one to look after him."],["q","“As do Mark, Aristarchus, Demas, and Luke, my fellow workers” (1:24)."],["p","Epaphras sends greetings together with these four. Mark once turned back partway through; now he is listed among the fellow workers."],["p","Later Paul said that he was useful to him for service. It is the very word used of Onesimus."],["p","Demas later left. A team roster is real, not perfect."],["p","We do not use Demas to shame people who have left the church. What we hold on to is prayer."],["p","Nor do we say that everyone who leaves will come back. Mark’s return was grace, not a guarantee."],["p","And then comes the last sentence."],["q","“The grace of our Lord Jesus Christ be with your spirit. Amen” (1:25)."],["p","The last word is grace. Beginning with the grace of verse 3, the letter ends in grace."],["p","This “your” is plural in the Greek: all of you. Grace is given to the whole household."],["p","Because if Philemon is to open that door, he cannot do it by gritting his teeth. A door opened through gritted teeth soon swings shut again."],["q","First grace, then welcome."],["q","Tychicus finishes reading the letter. No one in the room says a word. Philemon looks at the man standing at the door."],["p","The text does not tell us what Philemon did that evening."],["p","But this letter was preserved. We have good reason to hope that the door opened."],["p","Today, which one are you?"],["p","Perhaps you are like Onesimus, with a “once” you would rather never mention again."],["p","This brings to mind the Lord: God made him who knew no sin to be sin on our behalf (2 Cor 5:21), and before you ever open your mouth, he has already stood guarantor for you."],["p","Perhaps you are Philemon. Don’t grit your teeth—let grace in first. And if that person is still harming you, seek safety first."],["p","Perhaps you are Paul. Try asking instead of ordering; try shouldering a little of someone’s debt."],["p","But brothers and sisters, when you finish reading this letter, please do not come away simply admiring Paul’s eloquence more."],["p","Paul could write this way because his own debt had first been charged to Another’s name."],["p","That One is our Lord Jesus. May his grace be always in your hearts."],["p","This week, please think about this: at the door of your home, at the door of your church—who is standing there?"],["p","Don’t rush to open the door, and don’t rush to shut it. First bring that person’s name before the Lord."],["p","Let us bow our heads together and pray."]]}},"issues":[{"id":"ISS00_1","t":"The Letter’s Setting and Principles: How Should We Read a Private Letter Written to a House Church?","r":"1:1–3; Col 4:7–17","ch":[],"why":"1. A private letter, read aloud before the whole church — the first of these notes’ positions for the whole book (newly set out in this volume). Philemon is the most personal letter in the New Testament: written to one man, about a household matter, concerning whether one slave would stay or go. Yet it has four sets of recipients — Philemon, Apphia, Archippus, “and … the assembly in your house.” Unless we settle at the outset the setting of this letter (Colossae; a slave as property under Roman law; a house church; a letter sent on the same journey as Colossians) and the principles Paul draws out of the gospel, the whole book will be preached in one of two extremes. Either it becomes a private affair between an ancient master and his slave, with nothing to say to us today; or a letter that “begs” is turned straight into a command for today and laid on the backs of people who have been hurt.","pos":[["[1] What the text is asking","","<p>The letter opens at length, naming its recipients one after another: “to Philemon, our beloved fellow worker, to the beloved Apphia, to Archippus our fellow soldier, and to the assembly in your house” (1:1–2). Yet from verse 4 on, the “you” in the letter is almost entirely singular, addressed to Philemon alone. Only the greeting (1:3), the hope of a visit (1:22) and the closing blessing (1:25) use the plural, gathering the whole house church in.<\/p><p>The setting has to be laid out first. Philemon lived in Colossae (Col 4:9 says Onesimus “is one of you”). He had a house large enough to host the church, and he owned slaves; very likely he had come to faith through Paul (1:19). Under Roman law a slave was his master’s property (<em>res<\/em>), with no legal personhood; a slave who left his master could be severely punished if caught and brought back. Colossians and this letter were sent on the same journey: “together with Onesimus, the faithful and beloved brother, who is one of you” (Col 4:9); the same circle of co-workers (Col 4:10–14), the same Archippus (Col 4:17). Why Onesimus was with Paul the text does not say, and there are four readings: a runaway slave; a slave who deliberately sought out his master’s friend to plead for him; a slave Philemon had sent to serve Paul; and, held by a few, that the two men were brothers.<strong>So the text asks: Is this a private letter or a church letter? As we read it, what belongs to the setting and what is principle? And where does that principle land today?<\/strong><\/p>"],["The private-recommendation view (a letter of intercession between friends)","","<p>Many readers see Philemon as one of the letters of recommendation or intercession common in the Greco-Roman world: a friend of some standing pleads for someone who has offended his master. The parallel most often cited is the letter of Pliny the Younger to his friend Sabinianus, interceding for a freedman who had offended his patron and had come running to Pliny for help. The strength of this view is how concretely it reads the letter: it opens by affirming the recipient (1:4–7), moves to the request (1:8–20), and closes with final words (1:21–22). Its rhetorical structure is complete; it is a real letter, full of warmth.<\/p><p><strong>Difficulty: <\/strong>If this were only a private letter between friends, Paul would have had no need to name Apphia and Archippus, still less to write “the assembly in your house.” And the two letters land in completely different places. Pliny urges the patron to forgive the man on account of his tears and repentance, and the dependence of the freedman on his patron goes on as before. Paul says instead, “no longer as a slave, but more than a slave, a beloved brother” (1:16). Treat this simply as a private letter of intercession and you miss what is truly new in it: the gospel has entered a household and changed what everyone in that house calls one another.<\/p>"],["The public-church-letter view (deliberately read before the whole church)","","<p>Another view stresses “the assembly in your house” in 1:2: Paul deliberately made sure the whole church would hear this letter, and so a household matter became a church matter. When Onesimus came back, it would not be the master alone deciding; an entire gathering would be watching how this household received someone who had returned. Paul also says he is coming and asks Philemon to “prepare a guest room” (1:22) — whatever came of this letter, the whole church would see it. The strength of this view is that it sees the smallest unit of what 321 calls “establish God’s system”: a living room, a table, a letter read aloud.<\/p><p><strong>Difficulty: <\/strong>If “public” is taken to mean that Paul used the eyes of the crowd to force Philemon into line, it contradicts Paul’s own words: “that your goodness would not be as of necessity, but of free will” (1:14). The body of the letter is still addressed to a singular “you,” to Philemon alone; the church’s role in this letter is to witness and to support, not to sit as a jury. To preach this letter as a model of “applying pressure in front of everyone” is to fall straight into the most common misuse of this book: turning a letter that begs into a command (see ISS00_4).<\/p>"],["The Archippus view (the real master was Archippus)","","<p>In the twentieth century a scholar (John Knox) proposed that the master of Onesimus was in fact Archippus, and that the letter was read in the church that met in his house. On this view, the line near the end of Colossians — “Tell Archippus, ‘Take heed to the ministry which you have received in the Lord, that you fulfill it’” (Col 4:17) — was meant to make him act on this letter. Knox even argued that “the letter from Laodicea” mentioned in Colossians (Col 4:16) was this very letter. The strength of this view is that it takes seriously the links between the two letters and reminds readers that they must be read together.<\/p><p><strong>Difficulty: <\/strong>The first recipient named is Philemon, and the most natural reading takes “your house” in 1:2 with that first name. Nor does Col 4:17 say what the “ministry” was. This view piles inference on inference, and most interpreters have not accepted it. These notes follow the most natural reading: the master was Philemon; Archippus may have been a member of his household, but the text does not say, and we leave it open.<\/p>"],["[3] Where these notes stand","","<p><strong>Where these notes stand: this is a private letter written to one man, yet read aloud before a house church — a private matter handled within a community of grace. The whole book is read through the three questions for an epistle. (1) What were the recipients facing? A master who hosted the church in his home, and at his door a slave who had once wronged him, returning with a letter from Paul. (2) What principles does Paul draw out of the gospel? In the Lord, a beloved brother; an appeal made out of love, not by command; free will, not compulsion; receive him as you would receive me; the debt of the wrong is underwritten by someone. (3) Where does the principle land today? In homes, churches and workplaces; among migrant workers and caregivers; in broken relationships.<\/strong><\/p><p>On Onesimus’s circumstances, these notes hold two readings side by side as the main ones — “a runaway slave” and “a slave who sought out his master’s friend to plead for him” — without ruling between them. The pulpit speaks only of three things the text makes certain: he “once was useless to you” (1:11); he is Paul’s child, “whom I have become the father of in my chains” (1:10); and he is now being sent back (1:12).<\/p><p><strong>Philemon and Colossians must be read together: in Colossians the household code is a principle; in Philemon it is a person with a name.<\/strong>The Colossian church had just heard Tychicus read their letter — “Masters, give to your servants that which is just and equal, knowing that you also have a Master in heaven” (Col 4:1) — and turned around to see Onesimus standing beside him. The principle holds; where it lands follows the setting. When the setting changes, the principle still has to be tested on a person with a name.<\/p>"],["[4] Should this affect your faith?","","<p>Whether this is a private or a public letter, whether the master was Philemon or Archippus, why Onesimus left — none of these discussions should shake your faith. Every view agrees: this is a letter Paul wrote in chains, pleading for one man, and the church kept it because it brings the gospel down into a household.<\/p><p>But there is one question you should put to yourself:<strong>Is there room at my table for someone who once wronged me?<\/strong>The gospel does not simply save one person into heaven; it places a company of people into one household. In the closing blessing of this letter, the Greek “your” is plural: “The grace of our Lord Jesus Christ be with your spirit” (1:25). Receiving someone is not one person holding on by sheer willpower; it is a whole company held up together by grace.<\/p>"]],"con":[],"say":"These notes’ position for the whole book: Philemon is a private letter written to one man yet read aloud before a house church. Its setting is Colossae, where under Roman law a slave was property, and it was sent on the same journey as Colossians. The whole book is read through the three questions for an epistle — its principles are: in the Lord, a beloved brother; an appeal made out of love; free will, not compulsion; receive him as you would receive me; the debt of the wrong is underwritten by someone. In Colossians the household code is a principle; in Philemon it is a person with a name. The four readings of Onesimus’s circumstances are set side by side, with the first two as the main ones, without ruling between them.","care":"In the congregation will be host families whose homes are the meeting place, worn out and afraid to say so; people who sit in small group at the same table as someone who once wronged them, for whom every meeting feels like an ordeal; and people who are themselves the one who “once was useless,” not knowing whether the church will let them come back. The pastor must let all three hear this: the letter does not ask hosts to sacrifice without limit, nor does it push anyone to declare themselves in front of everyone; it is about a company of people held up together by grace. Do not name anyone publicly in a meeting or ask people to declare on the spot whom they will receive, and do not bring private wounds to the front as a “testimony for the church.” Relationships that need attention should be talked through first in private, slowly, with safe people alongside."},{"id":"ISS00_2","t":"Slavery, Labor and Status: In Sending Onesimus Back, Was Paul Endorsing Slavery?","r":"1:15–16; 1:21","ch":[],"why":"2. The New Testament does not endorse slavery; the gospel enters a particular household and calls a “thing” a “brother” — the second of these notes’ positions for the whole book (carrying over position 3 in the 1 Peter Study Notes, with new material in this volume). Philemon is one of the most cruelly misused books in history. In the nineteenth century, pulpits in the American South said, “Paul himself sent a runaway slave back to his master,” and used the letter to defend slavery and the hunting down of fugitive slaves. Today some turn it the other way: “Paul didn’t even oppose slavery,” and use it to dismiss the whole Bible. This question has to be settled at the outset, and it has to be carried all the way to today’s migrant workers, home caregivers and agency workers — who are sitting in our churches, or working in our homes.","pos":[["[1] What the text is asking","","<p>First, let us admit the weight of the setting. In first-century Roman society, slaves made up a considerable proportion of the urban population: prisoners of war, people kidnapped and sold, people born into their master’s house, people who had sold themselves for debt. Ancient slavery was not identical to the later Atlantic slave trade, which bought and sold people by race from generation to generation; but it too made one human being the property of another — someone who could be bought and sold, beaten, and separated from his family. Onesimus lived within that system.<\/p><p>At the hinge of this letter Paul says: “For perhaps he was therefore separated from you for a while, that you would have him forever, no longer as a slave, but more than a slave, a beloved brother, especially to me, but how much rather to you, both in the flesh and in the Lord” (1:15–16). He also says, “Having confidence in your obedience, I write to you, knowing that you will do even beyond what I say” (1:21).<strong>So the text asks: Did Paul require Philemon to set Onesimus free? Why did he not oppose slavery outright? Does “no longer as a slave” change a person’s status, a relationship, or the system itself? And where does this principle land today?<\/strong><\/p>"],["The implied-manumission view (“beyond what I say” in verse 21 means freedom)","","<p>Many interpreters hold that although Paul never says it, he has brought the word right to the door. He says Onesimus is “no longer as a slave” (1:16); he says he had wanted to keep him, “that on your behalf he might serve me” (1:13); and he says Philemon “will do even beyond what I say” (1:21). The most natural “beyond” is to give him his freedom — perhaps even to let him return to work alongside Paul. The nineteenth-century scholar Lightfoot remarked that the word “emancipation” seems to tremble on Paul’s lips, and yet he never once utters it. The strength of this view is that it gives the reversal of verse 16 its full weight: if a man is truly “a beloved brother,” it becomes very hard to go on treating him as property.<\/p><p><strong>Difficulty: <\/strong>Paul really does not say the word “free.” The “beyond” of verse 21 may simply mean a warmer welcome, or sending Onesimus back to serve Paul, without any change in his legal status. And the text does not record what Philemon went on to do. To preach an inference as Paul’s explicit demand is to make the text say more than it says.<\/p>"],["The changed-relationship view (verse 16 changed the relationship, not the system)","","<p>Another view focuses on the small word ὡς (“as”) in verse 16: Paul says “no longer as a slave,” which concerns how Philemon regards and treats him, not necessarily his legal status. The household codes of the New Testament still address masters and slaves (Col 3:22–4:1; Eph 6:5–9), which shows that the early church included believing masters as well as believing slaves. The strength of this view is its honesty: it does not read today’s abolitionist ideals back into a first-century letter, and it recognizes what a tiny minority could and could not do under the laws of an empire.<\/p><p><strong>Difficulty: <\/strong>If we stop at “the relationship changed, the system did not,” it is all too easy to settle for “a brother in the meeting, still property at home.” Yet Paul pointedly says, “both in the flesh and in the Lord” (1:16) — and “in the flesh” is exactly the level of social relationships, of the household, of the account book. Historically, slaveholders in the South used precisely this reading to persuade themselves: as long as they treated their slaves a little better and let them come and hear the preaching, they had not gone against the Bible.<\/p>"],["The dissolution-from-within view (the seed the gospel planted finally split the system open)","","<p>Yet another view holds that while Paul did not write a declaration of abolition, he planted a seed that would split the system apart: “there is neither slave nor free man … for you are all one in Christ Jesus” (Gal 3:28); “where there can’t be … bondservant, or free person; but Christ is all, and in all” (Col 3:11). When a master shares one loaf with his slave every week, calls on one Lord with him, and is asked to call him “a beloved brother,” the system will sooner or later be hollowed out. Believers who later led the fight to abolish slavery drew their strength from exactly these texts. The strength of this view is that it sees how the gospel changes society: it starts with a household and a table.<\/p><p><strong>Difficulty: <\/strong>The seed was terribly slow to sprout — churches and believers owned slaves for centuries. Appeals to “the seed” sometimes become a way of letting those centuries of silence off the hook. And this view easily turns into self-congratulation after the fact, with no answer for the man standing at the door: tomorrow morning, will I still be handed my work orders as before?<\/p>"],["[3] Where these notes stand","","<p><strong>Where these notes stand: we carry over position 3 in the 1 Peter Study Notes — the New Testament does not endorse slavery; both the reason for submission and its limits are “for the Lord’s sake.” This volume adds one stroke: Philemon shows the gospel entering a particular household and calling a “thing” a “brother.” And Paul says this change must happen “in the flesh” as well as “in the Lord” — not only in the meeting, but at home, in the account book, and tomorrow morning when the work is handed out.<\/strong>Each of the three readings sees something; these notes set them side by side and do not preach an inference as Paul’s explicit words.<\/p><p>That the New Testament does not endorse slavery rests on Scripture. Paul lists “slave-traders” among “the lawless and insubordinate” (1 Tim 1:9–10). The law says, “Anyone who kidnaps someone and sells him, or if he is found in his hand, he shall surely be put to death” (Exod 21:16). Paul urges those called as slaves, “if you get an opportunity to become free, use it” (1 Cor 7:21). Deuteronomy even says, “You shall not deliver to his master a servant who has escaped from his master to you” (Deut 23:15) (see ISS01_6) — though interpreters differ on whether this law applied only to slaves fleeing from foreign nations into Israel; these notes set the views side by side and draw no conclusion from it that Paul broke the law. So these notes do not say the Bible supports slavery, nor that if Onesimus ran away he sinned and deserved to be punished on his return; equally, we do not say, “Paul wrote no declaration of abolition, so the Bible cannot be trusted.” Paul sent Onesimus back with a letter, with a companion, with a guarantee, and with a plea to his master: “receive him as you would receive me” (1:17). That is not sending a man back into a system; it is bringing the system to the foot of the cross.<\/p><p><strong>Today’s migrant workers, home caregivers, foreign domestic helpers and agency workers must be concretely seen.<\/strong>These notes do not say “foreign workers are slaves.” Employment today involves contracts and laws, unlike ancient slavery; saying so is inaccurate and pins yet another label on people. But confiscated passports, no days off, crushing recruitment-agency debts, unpaid wages, being on call twenty-four hours a day, being forbidden to use a phone — these things must be called by their names. Scripture says, “The wages of a hired servant shall not remain with you all night until the morning” (Lev 19:13), and James says, “the wages of the laborers … which you have kept back by fraud, cry out” (Jas 5:4).<strong>Being brothers in the Lord does not make injustice in society unimportant. Precisely because we are brothers, the level that is “in the flesh” — wages, days off, dignity — must be settled all the more honestly.<\/strong>In the same way, these notes do not cast Philemon as the villain: he is someone being invited, not someone being condemned.<\/p>"],["[4] Should this affect your faith?","","<p>Scholars explain in different ways why Paul did not write a declaration of abolition; these discussions should not shake your faith. The Bible is not an outdated book; it is a book that speaks into an unjust world. It does not pretend that world does not exist; yet within that world it calls a man the law treated as a thing “a beloved brother” (1:16).<\/p><p>The real question to ask is this:<strong>In whom do I still see only “labor,” and not a person?<\/strong>The caregiver in your home, the agency colleague at your company, the migrant worker on the building site, the server out front in the restaurant — every one of them has a name. The Lord who “emptied himself, taking the form of a servant” (Phil 2:7) took his stand in the place of a slave first; those who follow him have no reason to stand higher than he did and look down on anyone.<\/p>"]],"con":[],"say":"These notes’ position for the whole book: we carry over position 3 in the 1 Peter Study Notes — the New Testament does not endorse slavery (1 Tim 1:10; Exod 21:16; 1 Cor 7:21). Philemon shows the gospel entering a particular household and calling a “thing” a “brother,” “in the flesh” as well as “in the Lord.” The three readings — “implied manumission,” “changed relationship” and “dissolution from within” — are set side by side. Today’s migrant workers, caregivers and agency workers must be concretely seen: we do not say “foreign workers are slaves,” nor do we let “brothers in the Lord” erase injustice in wages, days off and dignity.","care":"In the congregation will be people whose ancestors were sold or who have themselves been exploited; brothers and sisters working far from home as caregivers, domestic helpers or factory workers, who must watch their employer’s mood even to come to church on Sunday; and employers who have hired a caregiver and feel a quiet unease. The pastor must let the first group feel seen, not told to keep quiet. For those whose documents are being withheld, whose wages are owed, whose freedom is being restricted, help them in concrete ways to reach the local labor authority, a complaints hotline or an organization that cares for migrant workers. For employers, use “in the flesh” in 1:16 to walk with them as they check wages, days off and living conditions. Do not say, “Paul told slaves to submit too, so just bear it”; do not use labels like “foreign laborers” for people from the pulpit; and do not paint every employer as an oppressor."},{"id":"ISS00_3","t":"Forgiveness, Reconciliation and Return: Onesimus Went Back — Must Those Who Have Been Hurt “Go Back” Too?","r":"1:12--17","ch":[],"why":"3. Forgiveness is not the same as reconciliation; reconciliation requires repentance, a guarantee and safety; “going back” does not mean going back into danger — the third of these notes’ positions for the whole book (newly set out in this volume). Philemon is a letter about “coming back”: someone who left is sent back, and a master who suffered loss is asked to receive him. For exactly that reason, it is most often used to say two wounding things: “Even Onesimus went back — you should go back to your husband, your boss, your family too”; and “Even Philemon took him back — why can’t you forgive?” Those two sentences turn a letter that begs into a command, and turn a letter that protects people into one that tells victims to stay in danger. This question has to be settled at the outset.","pos":[["[1] What the text is asking","","<p>Paul says, “I am sending him back. Therefore receive him, that is, my own heart” (1:12); “For perhaps he was therefore separated from you for a while, that you would have him forever” (1:15); “If then you count me a partner, receive him as you would receive me” (1:17); “But if he has wronged you at all or owes you anything, put that to my account” (1:18). In these few verses a broken relationship is being asked to be joined again.<\/p><p>But we must first see clearly that in this letter <strong>the one going back is the one who may have wronged the other, and the one asked to receive him is the one who suffered the loss<\/strong>; and the request is an appeal, not a command (1:9, 14).<strong>So the text asks: Must the person who was harmed forgive? Once he forgives, must the old relationship be restored? Should the debt of the wrong be reckoned? Can this letter be used to send someone back to the person who hurt him?<\/strong><\/p>"],["The restoration view (forgiveness means restoring the old relationship)","","<p>Many devout pulpits teach it this way: Christians are to be “forgiving each other, just as God also in Christ forgave you” (Eph 4:32), and the Lord said to forgive “until seventy times seven” (Matt 18:22); having forgiven, we should take the person back as Philemon did, and the relationship should be as it was. The strength of this view is that it takes the radical nature of the gospel seriously: God does not receive us grudgingly; he throws open his arms to welcome the prodigal home.<\/p><p><strong>Difficulty: <\/strong>This view treats forgiveness and reconciliation as one and the same, and so puts the wounded person in an impossible bind: if he does not return to the old relationship, he is told he has not forgiven. But Paul did not command Philemon; he said, “not … as of necessity, but of free will” (1:14). Nor did he say the debt did not exist; he said, “put that to my account” (1:18). More serious still, when this teaching lands in situations of domestic violence, sexual assault or long-term abuse, it amounts to telling victims to walk back into danger — exactly what red line 2 of this volume is there to prevent.<\/p>"],["The conditional view (forgive only once the other person repents)","","<p>Another view cites the Lord’s words, “If your brother sins against you, rebuke him. If he repents, forgive him” (Luke 17:3), and holds that forgiveness is conditional on the other person’s repentance: where there is no repentance, there is no need to forgive, nor should there be reconciliation. The strength of this view is that it protects justice: it does not let the one who did harm slip away easily, nor does it force the victim to pretend nothing happened.<\/p><p><strong>Difficulty: <\/strong>The Lord also said, “Whenever you stand praying, forgive, if you have anything against anyone” (Mark 11:25), and says nothing there about whether the other person has repented. If forgiveness is bound entirely to the other’s repentance, then the peace of the wounded person’s whole life lies in the hands of the one who wounded him — as long as the other refuses to admit fault, he stays bound to what happened. The conditional view has grasped the conditions for reconciliation, but it may have locked up forgiveness along with it.<\/p>"],["The layered view (forgiveness, reconciliation, responsibility and safety considered separately)","","<p>A third view holds that several things must be kept apart. <strong>Forgiveness<\/strong> is handing judgment over to God — “Don’t seek revenge yourselves, beloved, but give place to God’s wrath” (Rom 12:19) — and it can be completed by the wounded person alone, before God, at his own pace;<strong>reconciliation<\/strong> is a road for both parties; it requires repentance, a guarantee and safety, and it is not something one side can complete alone;<strong>responsibility<\/strong> does not vanish because of forgiveness, for the debt of the wrong is real (1:18);<strong>safety<\/strong> always comes first — “A prudent man sees danger and hides himself; but the simple pass on, and suffer for it” (Prov 22:3). The strength of this view is that it safeguards both the grace of the gospel and the safety of victims.<\/p><p><strong>Difficulty: <\/strong>The layered view is sometimes misused as an excuse — “I’ve forgiven, but I never have to face him again” — leaving relationships that could have been reconciled stalled halfway. And in real life these layers are often tangled together; untangling them takes time, companionship and pastoral wisdom, and no chart can sort them out.<\/p>"],["[3] Where these notes stand","","<p><strong>Where these notes stand: we take the layered view. Forgiveness (handing judgment over to God) is not the same as reconciliation (a road for both parties, requiring repentance, a guarantee and safety), nor is it the same as exemption from responsibility or reinstatement to a former position. No one may be pressed to forgive at once, and no one may say, “Even Philemon took him back — why can’t you?” “Going back” does not mean going back into danger.<\/strong><\/p><p>Look closely at how Onesimus went back:<strong>He carried Paul’s letter<\/strong>, in which Paul calls him “my own heart” (1:12);<strong>he did not go back alone<\/strong> — Tychicus traveled with him (Col 4:7–9);<strong>he returned under the witness of a house church<\/strong>, for the letter was read before “the assembly in your house” (1:2);<strong>he had Paul’s own guarantee<\/strong> — “put that to my account … I will repay it” (1:18–19);<strong>and Paul himself meant to come<\/strong>, asking Philemon to “prepare a guest room for me” (1:22). This was a protected return. And in this letter, the one going back is the party who may have wronged another, and the one asked to receive him is the party who suffered the loss; the text never tells someone who has been abused to go back to the one who abused him.<\/p><p><strong>So verse 12 must never be used to send an abused spouse, an abused child, or an exploited migrant worker or employee back to the one who harmed them.<\/strong>When someone’s physical safety is under threat, protect life first: seek help, call the police or file a report in accordance with local law. God established those in authority to be “an avenger for wrath to him who does evil” (Rom 13:4). If reconciliation ever comes, it comes after repentance, a guarantee and safety are all in place — a step the wounded person freely chooses to take. Paul said “perhaps” (1:15); he did not pronounce God’s will as settled, and neither may we pronounce it settled on behalf of the one who was wounded.<\/p>"],["[4] Should this affect your faith?","","<p>Churches sincerely disagree over whether forgiveness should be conditional on repentance, and this should not shake your faith. Every view agrees that God’s forgiveness of us is free grace, and that forgiving others is a lesson we keep learning over a lifetime of following the Lord.<\/p><p>But if you have ever been condemned for “not having forgiven yet,” please hear this:<strong>Forgiveness is a road, not a threshold.<\/strong>You can first hand judgment over to God and then walk on slowly. You can forgive and, at the same time, protect yourself, hold the other person accountable and refuse to go back into danger. The Lord who said, “put that to my account,” did not pretend your wound does not exist — he charged that debt to himself, so that you no longer have to carry it alone, and no longer have to go back to the place that hurt you in order to prove you are spiritual.<\/p>"]],"con":[],"say":"These notes’ position for the whole book: forgiveness (handing judgment over to God) is not the same as reconciliation (a road for both parties, requiring repentance, a guarantee and safety), nor is it exemption from responsibility or reinstatement to a former position; no one may be pressed to forgive at once. Onesimus’s return was a protected return — with a letter, with Tychicus at his side, with the church as witness, with Paul’s guarantee. Verse 12 must not be used to send victims back to those who harmed them; when physical safety is under threat, protect life first, seek help according to the law, and report.","care":"In the congregation will be spouses suffering domestic violence who dare not speak of it; people abused as children who, now grown, are told by older relatives to “come home and be a dutiful child”; migrant workers whose employers withhold their wages and restrict their freedom; and people wounded a second time because their church told them to “hurry up and forgive, hurry up and reconcile.” The pastor first makes sure the person is safe now, and then walks with them, slowly, as they learn to tell forgiveness and reconciliation apart. Where violence, sexual assault or child abuse is involved, help them call the police, file a report, and find shelter and professional counseling, and fulfill your own legal duty to report. Do not say, “Why can’t you forgive him?” “Even Onesimus went back,” or “For the sake of keeping the family together, just bear it a little longer”; and do not arrange for victim and perpetrator to meet face to face for a “reconciliation prayer.” But for someone who truly repents and wants to come back, do as Paul did: write the letter for him, walk with him, and stand surety for him."},{"id":"ISS00_4","t":"Authority and Appeal: Why Did the One Who Could Command Choose to Appeal in Love?","r":"1:8–14; 1:19–21","ch":[],"why":"4. The one who could command chooses to appeal on the basis of love; free will is not compulsion; the debt of gratitude in verse 19 must not be used to bind people — the fourth of these notes’ positions for the whole book (carrying over position 5 in the 1 Peter Study Notes and position 4 in the 1 Timothy Study Notes, with this volume adding verses 8–9, 14 and 19–21). Philemon is the New Testament letter that sets out its view of authority in the finest detail: Paul states plainly that he has “all boldness … to command,” yet he chooses to “beg.” But the same letter also contains “you owe to me even your own self” and “having confidence in your obedience,” and pulpits often use these words to press people down: “Your life was given to you by the church — you owe the church.” “What the pastor says, you must obey.” This question has to be settled at the outset.","pos":[["[1] What the text is asking","","<p>Paul says, “though I have all boldness in Christ to command you that which is appropriate, yet for love’s sake I rather beg, being such a one as Paul, the aged, but also a prisoner of Jesus Christ” (1:8–9); and again, “But I was willing to do nothing without your consent, that your goodness would not be as of necessity, but of free will” (1:14). Yet a few verses later he writes, “I, Paul, write this with my own hand: I will repay it (not to mention to you that you owe to me even your own self besides)” (1:19); and, “Having confidence in your obedience, I write to you, knowing that you will do even beyond what I say” (1:21).<\/p><p>At the opening of this letter Paul does not call himself an “apostle,” as he does in his other letters; he calls himself only “a prisoner of Christ Jesus” (1:1).<strong>So the text asks: When Paul lays down his authority, does he truly lay it down, or is he simply applying pressure by other means? Is verse 19 emotional blackmail? To whom is the “obedience” of verse 21 owed? How may today’s spiritual leaders use these verses — and how may they not?<\/strong><\/p>"],["The gentle-pressure view (Paul pulls every lever)","","<p>A good number of scholars read this letter through the lens of rhetoric. Paul first praises Philemon (1:4–7), then calls himself an old man and a prisoner to win sympathy (1:9), has the letter read before the whole church (1:2), reminds Philemon that he owes Paul his very life (1:19), and finally says he will come in person to see for himself (1:22). Every lever is pulled, and Philemon is left almost no room to refuse. The strength of this view is its honesty: it does not idealize Paul as a man who carried no weight, and it admits that relationships and debts of gratitude carry weight of their own.<\/p><p><strong>Difficulty: <\/strong>If Paul were merely issuing a command by other means, verse 14 — “not … as of necessity, but of free will” — would be empty words. Moreover, verse 19 uses the rhetorical device of paraleipsis — “not to mention to you” — deliberately setting this debt to one side rather than pressing it as a demand. The greater danger lies in the pulpit: once these verses are read as “a masterful pressure technique,” they hand today’s leaders a template for dressing up commands as requests.<\/p>"],["The humorous-reminder view (banter between old friends)","","<p>Another view hears warmth and a smile in verses 19–20. Paul has just written out an IOU in his own hand — “I will repay it” — and then turns around to say, in effect, “Mind you, you still owe me your very self.” The next sentence follows with a pun on Onesimus’s name: “let me have joy from you in the Lord” (1:20). The verb behind “have joy,” ὀναίμην in the Greek, shares its root with the name Onesimus (the Chinese Union Version’s footnote offers “benefit” as an alternative rendering). This is a knowing smile between old friends, not debt collection. The strength of this view is that it catches the letter’s tone of voice and the genuine friendship between Paul and Philemon.<\/p><p><strong>Difficulty: <\/strong>We cannot hear Paul’s tone of voice; the humorous reading is an inference too. And in a relationship of unequal power, a joke can carry weight all the same — when an aged apostle jokes, the one receiving the letter may not find it easy to laugh. Speaking only of “humor” may lead people to overlook the reality of power.<\/p>"],["[3] Where these notes stand","","<p><strong>Where these notes stand: we carry over position 5 in the 1 Peter Study Notes and position 4 in the 1 Timothy Study Notes — spiritual authority exists for service, not domination. This volume adds one stroke: the whole of Philemon is a view of authority — the one who could command chooses to appeal in love (1:8–9), and an appeal is not a command in disguise (1:14). On verse 19, the “gentle pressure” and “humorous reminder” readings are set side by side without a ruling; but under either reading, the verse must never become a pulpit template for binding people with debts of gratitude or for emotional blackmail. Nor may “your obedience” in verse 21 be used to silence the congregation’s questions.<\/strong><\/p><p>Paul did not lose his authority; he chose not to use it. He laid down the power to command and gained in exchange one man’s freely given goodness. This reminds us of the Lord’s words: “But it shall not be so among you, but whoever wants to become great among you shall be your servant” (Mark 10:43). Peter likewise tells elders to shepherd the flock “not under compulsion, but voluntarily,” “not as lording it over those entrusted to you, but making yourselves examples to the flock” (1 Pet 5:2–3). On verse 19 the two readings stand side by side, and these notes lean slightly toward the humorous one; yet for the recipient a debt of gratitude still carries weight, which is all the more reason never to use it to bind anyone. The “obedience” of verse 21 is also read in different ways — obedience to Paul’s request, or obedience to the gospel itself. These notes set both side by side and make just one thing clear: this is obedience to what Paul asks in the Lord (and so, in the end, obedience to the Lord), not unconditional submission to an individual.<\/p><p>Here is a boundary you can check for yourself:<strong>A request that cannot be refused is a command.<\/strong>If a pulpit says, “Your life was given to you by the church; you owe the church, so you must obey,” it has already crossed the line. What a pastor says is not the same as what God says. The congregation has the right to ask questions and the right to say no, without fear of being labeled “rebellious.”<\/p>"],["[4] Should this affect your faith?","","<p>Scholars see verse 19 differently — pressure or humor — and this should not shake your faith. Both sides agree: Paul could have commanded, yet he chose to appeal.<\/p><p>But if you have ever been bound in church by a “debt of gratitude” — afraid to leave, afraid to ask, afraid to say no, for fear of being called ungrateful — then hear verse 14: the goodness God wants is goodness “of free will.”<strong>The Lord who could have commanded everything did not, on the cross, command us to love him; he loved us first.<\/strong>Those gripped by grace become willing; those bound by a debt of gratitude only become afraid. God tells the two apart very clearly.<\/p>"]],"con":[],"say":"These notes’ position for the whole book: we carry over position 5 in the 1 Peter Study Notes and position 4 in the 1 Timothy Study Notes — spiritual authority exists for service, not domination. Paul could command, yet appealed in love (1:8–9); an appeal is not a command in disguise (1:14). On verse 19, the “gentle pressure” and “humorous reminder” readings are set side by side, but neither may serve as a template for binding people with debts of gratitude or for emotional blackmail; verse 21 must not be used to silence questions. A request that cannot be refused is a command.","care":"In the congregation will be people whom spiritual leaders have bound with lines like “The church has been so good to you” and “I’m the one who led you to faith,” so that they dare neither to leave nor to ask questions. There will also be people at work or in their extended families who are blackmailed with debts of gratitude, so that every refusal brands them as ingrates. The pastor must let them hear the “free will” of verse 14 and walk with them as they learn to tell gratitude apart from being controlled. Where spiritual abuse is involved, refer back to how position 5 in the 1 Peter Study Notes handles it, and where necessary help them find a trustworthy third party. Do not say, “You owe the church,” “What the pastor says is what God says,” or “Not obeying is rebellion.” And pastors must first examine themselves: is there room in their own requests for a “no”?"},{"id":"ISS00_5","t":"Charging the Account and Standing Surety: Is “Put That to My Account” in Verses 18–19 a Gospel Parable?","r":"1:17--19","ch":[],"why":"5. Verses 18–19 may “remind us” of Christ, but must not be made into Paul’s typology or his teaching on the atonement; the debt of the wrong is real, and someone must take responsibility — the fifth of these notes’ positions for the whole book (newly set out in this volume). For two thousand years, readers of this letter have paused at “put that to my account … I will repay it.” In his preface to Philemon, Luther wrote, “we are all his [Christ’s] Onesimus, if we believe.” That sense of being moved is genuine, but it easily goes too far: preaching Onesimus as a type of the sinner, Philemon as the angry Father, and a letter of intercession as a doctrine of atonement. On the other hand, in preaching “grace,” the pulpit can just as easily make the debt of the wrong sound as if it did not exist. This question has to draw both boundaries clearly.","pos":[["[1] What the text is asking","","<p>Paul writes, “But if he has wronged you at all or owes you anything, put that to my account. I, Paul, write this with my own hand: I will repay it” (1:18–19). This is the language of bookkeeping and law: ἐλλόγα means “charge it to the account,” and ἀποτίσω means “I will repay, I will make restitution.” Paul takes the pen from his scribe and writes in his own hand — in effect issuing a legally binding IOU. In the verse before, he has said, “receive him as you would receive me” (1:17).<\/p><p>Paul does not deny that Onesimus may really have caused a loss — “if he has wronged you at all or owes you anything.” Nor does he ask Philemon to write the debt off; he asks him to transfer it into Paul’s own name.<strong>So the text asks: Is this a gospel parable? Is Paul teaching the ato
