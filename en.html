const voiceName = () => (TTS_VOICES[S.set.voice] || TTS_VOICES.andrew).name;
const rateAttr  = () => (S.set.rate >= 0 ? '+' : '') + (S.set.rate * 5) + '%';

/* The English voices cannot pronounce Greek or Hebrew script.
   If a transliteration follows in parentheses, read only the transliteration; if there is none,
   skip the original word entirely, so each word is read once and never twice. */
const ORIG_CH  = '\\u0590-\\u05FF\\u0370-\\u03FF\\u1F00-\\u1FFF';
const ORIG_RUN = '[' + ORIG_CH + '][' + ORIG_CH + "\\s'\u2019\\-\u05be\u05f3\u05f4\u00b7]*";
const RE_ORIG_ROMAN = new RegExp(ORIG_RUN + "\\s*\\(\\s*([A-Za-z\u00c0-\u024f][A-Za-z\u00c0-\u024f'\u2019\\- ]*)\\s*\\)", 'g');
const RE_ORIG_RUN   = new RegExp(ORIG_RUN, 'g');

/* Pronunciation fixes: change only the text sent to the voice, never the text on screen.
   Add a row here whenever a word is read wrongly. */
const TTS_SAY = [
  [/\bLXX\b/g, 'Septuagint'],
  [/\be\.g\.,?\s*/g, 'for example, '],
  [/\bi\.e\.,?\s*/g, 'that is, '],
  [/\bcf\.\s*/g, 'compare '],
  [/\bvv\.\s*(?=\d)/g, 'verses '],
  [/\bv\.\s*(?=\d)/g, 'verse '],
  [/\bchs?\.\s*(?=\d)/g, 'chapter '],
];
/* SBL book abbreviations that appear before a reference, spoken in full */
const BOOKS_SAY = { Gen:'Genesis', Exod:'Exodus', Lev:'Leviticus', Num:'Numbers', Deut:'Deuteronomy',
  Josh:'Joshua', Judg:'Judges', Sam:'Samuel', Kgs:'Kings', Chr:'Chronicles', Neh:'Nehemiah', Ps:'Psalm',
  Pss:'Psalms', Prov:'Proverbs', Isa:'Isaiah', Jer:'Jeremiah', Ezek:'Ezekiel', Dan:'Daniel', Hab:'Habakkuk',
  Hag:'Haggai', Mal:'Malachi', Matt:'Matthew', Mk:'Mark', Lk:'Luke', Jn:'John', Rom:'Romans',
  Cor:'Corinthians', Gal:'Galatians', Eph:'Ephesians', Phil:'Philippians', Col:'Colossians',
  Thess:'Thessalonians', Tim:'Timothy', Tit:'Titus', Phlm:'Philemon', Heb:'Hebrews', Jas:'James',
  Pet:'Peter', Rev:'Revelation' };
const RE_BOOK = new RegExp('\\b(' + Object.keys(BOOKS_SAY).join('|') + ')\\.?\\s+(?=\\d)', 'g');

/* Clean up text before it is read aloud */
function sanitize(t){
  t = String(t || '').replace(/<[^>]+>/g, ' ');
  t = t.replace(/&nbsp;/g, ' ').replace(/&amp;/g, ' and ').replace(/&lt;|&gt;/g, ' ')
       .replace(/&quot;/g, '"').replace(/&#39;/g, '\u2019');
  // the original language is read once: the transliteration if there is one, otherwise nothing
  t = t.replace(RE_ORIG_ROMAN, ' $1 ').replace(RE_ORIG_RUN, '\u0000');
  t = t.replace(/\(\s*\u0000\s*\)/g, '\u0000');
  t = t.replace(/\s*\u0000\s*/g, ' ');
  t = t.replace(/\(\s*[,;]?\s*\)/g, ' ');
  // markdown and symbols
  t = t.replace(/\*\*/g, '').replace(/[\[\]]/g, '');
  t = t.replace(/^[ \t]*#{1,6}[ \t]*/gm, '').replace(/^[ \t]*>[ \t]?/gm, '');
  t = t.replace(/\s+·\s+/g, ', ');
  t = t.replace(/★|⚠|✓|❌|🟢|🟡|🔴|📋|📖|⚖|▸|▾|◆|💡|·/g, ' ');
  t = t.replace(/\s*\|\s*/g, ': ');
  // references spoken naturally: Heb 1:3 -> Hebrews 1 verse 3; 1:1–4 -> 1 verse 1 to 4
  t = t.replace(RE_BOOK, (m, b) => BOOKS_SAY[b] + ' ');
  t = t.replace(/\b(\d{1,3}):(\d{1,3})(?:\s*[\u2013\u2014-]{1,2}\s*(\d{1,3})(?::(\d{1,3}))?)?/g, (m, a, b, c, d) =>
    a + ' verse ' + b + (c ? (d ? ' to ' + c + ' verse ' + d : ' to ' + c) : ''));
  t = t.replace(/(\d)\s*[\u2013]\s*(\d)/g, '$1 to $2');
  t = t.replace(/\b321\b/g, 'three-two-one').replace(/\b920\b/g, 'nine-two-zero').replace(/\b235\b/g, 'two-three-five');
  TTS_SAY.forEach(r => { t = t.replace(r[0], r[1]); });
  t = t.replace(/\s+([,.!?;:])/g, '$1');
  return t.replace(/[ \t]{2,}/g, ' ').replace(/\s{2,}/g, ' ').trim();
}
/* Split for synthesis: break after . ! ? ; once a chunk reaches about 220 characters; never longer than 500 */
function ttsChunks(t){
  t = sanitize(t); if (!t) return [];
  const out = []; let buf = '';
  for (let i = 0; i < t.length; i++){
    const ch = t[i]; buf += ch;
    if ((/[.!?;]/.test(ch) && (i + 1 >= t.length || /\s/.test(t[i + 1])) || ch === '\n') && buf.length >= 220){
      out.push(buf.trim()); buf = '';
    }
  }
  if (buf.trim()) out.push(buf.trim());
  const fin = [];
  out.forEach(s => {
    while (s.length > 500){
      let k = s.lastIndexOf(' ', 500); if (k < 200) k = 500;
      fin.push(s.slice(0, k).trim()); s = s.slice(k).trim();
    }
    if (s) fin.push(s);
  });
  return fin.length ? fin : [t];
}

async function ttsFetch(piece){
  const key = voiceName() + '|' + rateAttr() + '|' + piece;
  const cached = await new Promise(r => ttsGet(key, r));
  if (cached) return cached;
  const res = await fetch(SVC.tts, { method:'POST', headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ voice:voiceName(), rate:rateAttr(), sil:TTS_SIL.s, silc:TTS_SIL.c, sile:TTS_SIL.e, text:piece }) });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  ttsPut(key, blob);
  return blob;
}

let PL = null;
function playSegs(segs, title, lesson){

  PL = { tok:my, segs, blobs:new Array(segs.length), pend:new Array(segs.length).fill(0),
         try:new Array(segs.length).fill(0),

function plFetch(k){

                               () => { if (PL){ PL.fail++; PL.try[k] = (PL.try[k] || 0) + 1; } })
    .then(() => {
      if (!PL || PL.tok !== SPK.tok) return;

    if (ready) return plPlay(0);

      const txt = PL.segs.map(s => s.t).join('\n');

  return s.replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
}
/* Split into sentences. HTML tags are never cut, and a closing quote or bracket stays with its
   sentence. English rule: break after . ! ? (plus any closing quotes/brackets) when whitespace
   follows, except after common abbreviations and initials, or when the next word starts in
   lower case (e.g. "?” he asked"). A colon never breaks, so "1:3" stays whole.
   This one function serves both the tappable sentences and the read-aloud units. */
const SENT_ABBR = /(?:^|[\s(\u201c\u2018"'\[])(?:e\.g|i\.e|cf|vs|viz|al|ca|approx|ibid|Mr|Mrs|Ms|Dr|Rev|St|Jr|Sr|ch|chs|v|vv|ff|pp|lit|Gen|Exod|Ex|Lev|Num|Deut|Josh|Judg|Sam|Kgs|Chr|Neh|Esth|Ps|Pss|Prov|Eccl|Isa|Jer|Lam|Ezek|Dan|Hos|Obad|Mic|Nah|Hab|Zeph|Hag|Zech|Mal|Matt|Mk|Lk|Jn|Rom|Cor|Gal|Eph|Phil|Col|Thess|Tim|Tit|Phlm|Heb|Jas|Pet|Jud|Macc|Sir|Wis|[A-HJ-Z])\.$/;
const SENT_CLOSE = ['\u201d', '\u2019', ')', ']', '"', "'", '&quot;', '&#39;'];
function splitHTML(html){
  const out = []; let cur = '', depth = 0, inTag = false, tag = '';
  for (let i = 0; i < html.length; i++){
    const ch = html[i];
    if (!inTag && ch === '<'){ inTag = true; tag = '<'; cur += ch; continue; }
    if (inTag){
      cur += ch; tag += ch;
      if (ch === '>'){
        inTag = false;
        if (/^<\//.test(tag)) depth--;
        else if (!/\/>$/.test(tag) && !/^<(br|img|hr|input|wbr)\b/i.test(tag)) depth++;
      }
      continue;
    }
    cur += ch;
    if (depth !== 0) continue;                       // never split inside a tag
    if (ch !== '.' && ch !== '!' && ch !== '?') continue;
    if (ch === '.' && SENT_ABBR.test(cur.slice(-14).replace(/<[^>]*>/g, ''))) continue;
    if (ch === '.' && /^\s*\d{1,3}\.$/.test(cur.replace(/<[^>]*>/g, ''))) continue;   // list numbering "1. " at the start
    // take any closing quotes or brackets with the sentence
    let k = i + 1, tail = '';
    for (let more = true; more && k < html.length; ){
      more = false;
      for (const c of SENT_CLOSE) if (html.startsWith(c, k)){ tail += c; k += c.length; more = true; break; }
    }
    // a sentence ends only where whitespace (or the end) follows
    if (k < html.length && !/\s/.test(html[k])) continue;
    let w = k; while (w < html.length && /\s/.test(html[w])) w++;
    if (w < html.length && /[a-z]/.test(html[w])) continue;   // "?” he asked" / "e.g. this"
    cur += tail; i = k - 1;
    while (i + 1 < html.length && (html[i + 1] === ' ' || html[i + 1] === '\n')){ i++; cur += html[i]; }
    out.push(cur); cur = '';
  }
  if (cur.replace(/<[^>]*>|\s|&nbsp;/g, '').length) out.push(cur);
  else if (cur && out.length) out[out.length - 1] += cur;
  return out.length ? out : [html];
}

function sentsOf(html){
  const out = [];
  String(html || '').replace(/<p>([\s\S]*?)<\/p>/g, (m, inner) => { splitHTML(inner).forEach(t => out.push(t)); return m; });
  return out;
}
function tagParas(html, kp){
  if (!html) return '';

  return html.replace(/<p>([\s\S]*?)<\/p>/g, (m, inner) => {

}

/* ===== Full-screen modes: pulpit teleprompter + small-group leading ===== */
let F = null, FT = null, WAKE = null;
function fOpen(mode, n){
  F = { mode, n, i:0, run:true, left:0, tele:mode !== 'live' };
  document.documentElement.setAttribute('data-tele', F.tele ? '1' : '0');
  if (mode === 'lesson'){                       // the lesson manuscript
    const s = (D.lesson || {})[n];
    // “Think deeper” is a reserve of questions and answers; it does not go on the teleprompter
    F.pages = s ? telePages(s.blocks.filter(b => b[0] !== 'd')) : outlinePages(n);
    F.total = (s ? s.min : 40) * 60;
    F.left = F.total;
    // the title bar shows only the main title; the subtitle is too long and would wrap
    $('#ftitle').textContent = q2(s ? titleMain(s.title) : meta(n).t);
  } else if (mode === 'tele'){
    const s = D.serm[n];
    F.pages = s ? telePages(s.blocks) : outlinePages(n);
    F.total = (s ? s.min : 35) * 60;
    F.left = F.total;
    $('#ftitle').textContent = q2(meta(n).t);
  } else {
    F.pages = livePages(n);
    F.total = F.pages.reduce((a, p) => a + p.sec, 0);
    F.left = F.pages[0].sec;
    $('#ftitle').textContent = 'Chapter ' + n + ' · Small group';
  }
  $('#full').classList.add('on');
  keepAwake(true);
  fDraw(); fTick();
}
function fClose(){
  F = null; clearInterval(FT); FT = null;
  document.documentElement.setAttribute('data-tele', '0');
  $('#full').classList.remove('on'); keepAwake(false);
}
async function keepAwake(on){
  try {
    if (on && navigator.wakeLock) WAKE = await navigator.wakeLock.request('screen');
    else if (WAKE) { WAKE.release(); WAKE = null; }
  } catch(e){}
}
function telePages(bl){
  const pages = []; let cur = [];
  const push = () => { if (cur.length){ pages.push(cur); cur = []; } };
  bl.forEach(b => {
    if (b[0] === 'h' || b[0] === 's'){ push(); cur = [b]; return; }
    if (b[0] === 'w'){ cur.push(b); push(); return; }   // a pause in the script = a new page
    cur.push(b);
    const chars = cur.reduce((a, x) => a + (typeof x[1] === 'string' ? x[1].length : 0), 0);
    if (cur.length >= 6 || chars > 420) push();
  });
  push();
  return pages.map(p => ({ blocks:p }));
}
function outlinePages(n){
  const m = meta(n), ps = [{ blocks:[['h', q2(m.t)], ['p', m.sub], ['q', m.mv.t + ' ' + m.mv.r]] }];
  m.serm.pts.forEach(p => ps.push({ blocks:[['h', p[0]], ['p', 'Text: ' + rng(p[1])], ['p', p[2]]] }));
  ps.push({ blocks:[['h','Conclusion'], ['p', m.truth]] });
  return ps;
}
function livePages(n){
  const m = meta(n), ps = [];
  ps.push({ sec:600, ttl:'① Icebreaker · 10 minutes', q:m.grp[0], tip:'Let everyone say one sentence. The leader shares first.' });
  ps.push({ sec:900, ttl:'② Reading the text together · 15 minutes', q:'“' + m.mv.t + '” ' + m.mv.r,
            tip:'Take turns reading the chapter’s core verses. When you finish, sit in silence for thirty seconds; don’t rush to explain.' });
  m.grp.slice(1).forEach((q, i) => ps.push({
    sec:450, ttl:'③ Discussion · Question ' + (i + 2), q,
    tip: i === 1 ? 'This is the deepest question. The leader shares first. Don’t probe for details; if someone cries, stop and pray for them rather than moving on to the next question.'
       : i === 3 ? 'Ask a group member to check in with each person on day seven.' : '' }));
  ps.push({ sec:900, ttl:'④ Practice and prayer · 15 minutes', q:m.prac.main,
            tip:'Each person chooses just one practice. Name the companion who will check in with you on day seven, then pray for one another.' });
  return ps;
}
function fDraw(){
  if (!F) return;
  const p = F.pages[F.i], b = $('#fbody');
  if (F.tele){
    b.className = 'fbody tele';
    b.innerHTML = p.blocks.map(x =>
      x[0] === 'h' ? `<h5>${esc(x[1])}</h5>` :
      x[0] === 's' ? `<h5>${esc(x[1])}</h5>` :
      x[0] === 't' ? `<p class="qq">${esc(x[1])}</p>` :
      x[0] === 'm' ? `<p class="pause">${esc(x[1])}</p>` :
      x[0] === 'q' ? `<p class="qq">${esc(x[1])}</p>` :
      x[0] === 'w' ? `<p class="pause">Pause <b>${x[1]}</b> seconds</p>` :
      `<p>${esc(x[1])}</p>`).join('');
  } else {
    b.className = 'fbody live';
    b.innerHTML = `<h5>${esc(p.ttl)}</h5><p class="qq">${esc(p.q)}</p>` +
      (p.tip ? `<div class="tipbox"><b>💡 Leader’s note</b><br>${esc(p.tip)}</div>` : '');
    F.left = p.sec;
  }
  b.scrollTop = 0;
  $('#frail').style.width = ((F.i + 1) / F.pages.length * 100) + '%';
  $('#fplay').textContent = F.run ? 'Pause' : 'Resume';
  fClock();
}
function fClock(){
  const s = Math.max(0, Math.round(F.left)), over = F.left < 0;
  const t = (over ? '-' : '') + String(Math.floor(Math.abs(F.left) / 60)).padStart(2, '0') + ':' +
            String(Math.floor(Math.abs(F.left) % 60)).padStart(2, '0');
  const c = $('#fclock'); c.textContent = t; c.classList.toggle('over', F.left < 0);
}
function fTick(){
  clearInterval(FT);
  FT = setInterval(() => { if (!F) return clearInterval(FT); if (F.run) F.left--; fClock(); }, 1000);
}
function fGo(d){
  if (!F) return;
  const i = F.i + d;
  if (i < 0) return;
  if (i >= F.pages.length){ toast('This is the last page'); return; }
  F.i = i; fDraw();
}
$('#fx').onclick = () => { if (confirm('Leave this mode?')) fClose(); };
$('#fprev').onclick = () => fGo(-1);
$('#fnext').onclick = () => fGo(1);
$('#fplay').onclick = () => { F.run = !F.run; $('#fplay').textContent = F.run ? 'Pause' : 'Resume'; };
$('#fA').onclick = () => { S.set.fs = (S.set.fs + 1) % 5; save(); applyFS(); };
if ($('#fLang')) $('#fLang').onclick = toggleSC;
document.addEventListener('keydown', e => {
  if (!F) return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); fGo(1); }
  if (e.key === 'ArrowLeft') fGo(-1);
  if (e.key === 'Escape') fClose();
});

/* ===== Search ===== */
function vSearch(){
  setTitle('Search', false);
  const q = (R.q || '').trim();
  let h = `<div class="sect"><p class="eyebrow">Search</p>
    <input class="sbox" id="sq" placeholder="Verse, Greek, key word… (e.g. 1:16, brother, σπλάγχνα)" value="${esc(q)}">
    <p class="xs muted" style="margin:8px 0 0">Searches the chapter study, the lesson manuscripts, the verse expositions, the word tracks and the contested questions.</p></div>`;
  if (q.length >= 1){
    /* English search ignores case */
    const ql = q.toLowerCase();
    const hit = (t) => !!t && String(t).toLowerCase().indexOf(ql) >= 0;
    const qre = new RegExp(esc(q).replace(/[.*+?^$(){}|[\]\\]/g, '\\$&'), 'gi');
    const mk = (t) => esc(t).replace(qre, x => '<mark>' + x + '</mark>');
    let r = '';
    // verses
    const vs = [];
    Object.keys(D.txt).forEach(c => (D.txt[c] || []).forEach((t, i) => {
      const ref = c + ':' + (i + 1);
      if (hit(t) || hit(ref)) vs.push([ref, t]);
    }));
    const ex = [];
    Object.keys(BLK).forEach(c => BLK[c].forEach(b => {
      if (hit(b.exp) || hit(b.gram) || hit(b.grk) || hit(b.key) || hit(b.lit)) ex.push(b);
    }));
    if (vs.length){ r += `<h3 class="sec">Scripture · ${vs.length}</h3>`;
      vs.slice(0, 15).forEach(v => r += `<button class="chrow" onclick="openV('${v[0]}')">
        <span class="chn">${esc(v[0])}</span><span style="flex:1"><b style="font-weight:400;font-size:15px;line-height:1.7">${mk(v[1])}</b></span></button>`);
      if (vs.length > 15) r += `<p class="xs muted">(Showing the first 15)</p>`; }
    const my = Object.keys(S.mk).filter(k => hit(mkText(k)) || hit(mkNote(k)));
    if (my.length){ r += `<h3 class="sec">My highlights · ${my.length}</h3>`;
      my.slice(0, 10).forEach(k => r += `<button class="chrow" onclick="mkSheet('${k}')">
        <span class="chn">✍</span><span style="flex:1"><b style="font-weight:400;font-size:15px;line-height:1.7">${mk(mkText(k).slice(0, 110))}…</b>
        ${mkNote(k) ? `<span class="s">${mk(mkNote(k).slice(0, 90))}</span>` : ''}</span></button>`); }
    if (ex.length){ r += `<h3 class="sec">Exposition · ${ex.length}</h3>`;
      ex.slice(0, 12).forEach(b => r += `<button class="chrow" onclick="openV('${b.ch}:${b.a}')">
        <span class="chn">${b.ch}:${b.a === b.z ? b.a : b.a + '–' + b.z}</span>
        <span style="flex:1"><b style="font-weight:400;font-size:15px;line-height:1.7">${mk(((D.txt[b.ch] || [])[b.a - 1] || '').slice(0, 90))}…</b></span></button>`);
      if (ex.length > 12) r += `<p class="xs muted">(Showing the first 12)</p>`; }
    // chapters
    const chs = CH.filter(c => hit(c.t) || hit(c.sub) || hit(c.truth) || hit(c.self) ||
      c.card.some(x => hit(x)) || c.grp.some(x => hit(x)) || c.safe.some(x => hit(x)) || hit(c.mv.t));
    if (chs.length){ r += `<h3 class="sec">Chapter studies · ${chs.length}</h3>`;
      chs.forEach(c => r += `<button class="chrow" onclick="go('course',${c.n})">
        <span class="chn">${String(c.n).padStart(2,'0')}</span>
        <span style="flex:1"><b>${mk(c.t)}</b><span class="s">${mk(c.truth)}</span></span></button>`); }
    // lesson manuscripts
    const ls = [];
    Object.keys(D.lesson || {}).forEach(k => {
      const L = D.lesson[k];
      if (hit(L.title)) { ls.push([k, L.title]); return; }
      for (const x of L.blocks){
        const parts = Array.isArray(x[1]) ? x[1] : [x[1]];   // “Think deeper” is a question and an answer
        const p = parts.find(y => hit(y));
        if (p) { ls.push([k, p]); break; }
      }
    });
    if (ls.length){ r += `<h3 class="sec">Lessons · ${ls.length}</h3>`;
      ls.slice(0, 12).forEach(x => {
        /* show the part of the paragraph around the match */
        const at = Math.max(0, String(x[1]).toLowerCase().indexOf(ql) - 40);
        const piece = String(x[1]).slice(at, at + 130);
        r += `<button class="chrow" onclick="go('course',${x[0]},'lesson')">
        <span class="chn">${String(x[0]).padStart(2,'0')}</span>
        <span style="flex:1"><b style="font-weight:400;font-size:15px;line-height:1.7">${at ? '…' : ''}${mk(piece)}${String(x[1]).length > at + 130 ? '…' : ''}</b></span></button>`; });
      if (ls.length > 12) r += `<p class="xs muted">(Showing the first 12)</p>`; }
    // word tracks
    const tk = D.tracks.filter(t => hit(t.gk) || hit(t.gl) || hit(t.tr) || hit(t.ins) || hit(t.head));
    if (tk.length){ r += `<h3 class="sec">Word tracks · ${tk.length}</h3>`;
      tk.forEach(t => r += `<button class="chrow" onclick="go('tools',0,'tracks')">
        <span class="chn">α</span><span style="flex:1"><b>${mk(t.gk)}</b><span class="s">${mk(t.gl)} &nbsp;·&nbsp; ${mk(t.ins)}</span></span></button>`); }
    // contested questions
    const is = D.issues.filter(i => hit(i.t) || hit(i.why) || hit(i.say));
    if (is.length){ r += `<h3 class="sec">Contested questions · ${is.length}</h3>`;
      is.forEach(i => r += `<button class="chrow" onclick="openIssue('${i.id}')">
        <span class="chn">⚖</span><span style="flex:1"><b>${mk(i.t)}</b><span class="s">Phlm ${esc(i.r)}</span></span></button>`); }
    h += r || `<p class="sm muted" style="margin-top:18px">Nothing found for “${esc(q)}”. Try a verse (1:16), a Greek word (σπλάγχνα) or a key word (brother, receive, account).</p>`;
  }
  return h;
}
