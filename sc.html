、19），提摩太聯名；這幾乎是全新約作者爭議最少的一卷，連馬吉安都收入；十九世紀鮑爾的託名說並陳，不嘲諷。可以寫「保羅說」，但焦點落在保羅的主身上。","care":"席上會有讀過一點聖經批判、以為「學者都說聖經是假的」而不安的人。牧者可以用這一卷當作安心的例子：連最懷疑的學者，多數也承認這是保羅的信。不要嘲諷學者，也不要用「問這種問題就是不信」堵住發問的人；讓他知道，認真的提問與堅定的信心可以同在。"},{"id":"ISS00_7","t":"寫作地點與年代：羅馬、以弗所，還是該撒利亞？","r":"1:22--24","ch":[],"why":"七、羅馬、以弗所、該撒利亞三說並陳；與歌羅西書同時寫成、同一趟送出，這一點三說都同意。保羅在信中四次提到自己的捆鎖（1:1、9、10、13），又請腓利門預備住處（1:22），地點的判斷會影響我們怎樣想像阿尼西謀的路程，以及保羅「要來」的盼望有多近。","pos":[["【一】經文問的是甚麼","","<p>保羅說自己是「為基督耶穌被囚的」（1:1），阿尼西謀是他「在捆鎖中所生的兒子」（1:10），又說「此外你還要給我預備住處；因為我盼望藉著你們的禱告，必蒙恩到你們那裡去」（1:22）。以巴弗是「與我同坐監的」（1:23），路加、亞里達古、馬可都在身邊（1:24）。<strong>經文問的是：保羅在哪裡坐監？甚麼時候寫的？一個從歌羅西來的奴僕，怎麼會遇見獄中的保羅？</strong></p>"],["羅馬說（約主後 60--62 年；傳統讀法）","","<p>傳統認為這封信寫於保羅在羅馬第一次被軟禁時：「保羅在自己所租的房子裡住了足足兩年。凡來見他的人，他全都接待」（徒 28:30）。路加與亞里達古都隨他到羅馬（徒 27:2），名單吻合；羅馬是大城，若阿尼西謀是逃走的奴僕，最容易在那裡隱身；若是去找保羅求情，羅馬的保羅也找得到。這派的優點是有使徒行傳的直接記載，早期教會的傳統也支持。</p><p><strong>難處：</strong>羅馬離歌羅西一千多公里，要跨海；保羅請腓利門「預備住處」，好像很快就要去，可是他原本的計畫是從羅馬往西去士班雅（羅 15:24、28）。不論阿尼西謀是逃走的，還是去找主人的朋友求情，走這麼遠、又被送回這麼遠，都要有合理的解釋。</p>"],["以弗所說（約主後 54--55 年）","","<p>另一派認為保羅在以弗所住了兩年多（徒 19:10），很可能在那裡坐過監——他說自己「多下監牢」（林後 11:23）。以弗所離歌羅西只有約一百六十公里，阿尼西謀去找保羅、保羅說要來住，都近得多，也最符合「主動去找主人的朋友求情」的讀法。這派的優點是讓 1:22 的盼望變得很實際。</p><p><strong>難處：</strong>使徒行傳沒有記載保羅在以弗所坐監；路加是否在以弗所與保羅同在，也沒有證據。這一說建立在推論上，雖然合理，卻不能定案。</p>"],["該撒利亞說（約主後 57--59 年）","","<p>還有一派主張寫於該撒利亞：保羅被看守在「希律的衙門裡」（徒 23:35），一關就是兩年（徒 24:27），路加與亞里達古也可能在附近。這派的優點是有使徒行傳記載的長期監禁。</p><p><strong>難處：</strong>該撒利亞離歌羅西同樣很遠，若阿尼西謀是逃走的，那裡也不是容易藏身的大城；若是去求情，路程同樣太遠；保羅當時一心要上訴到羅馬，說要去歌羅西住，不太合情理。這一說的支持者最少。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：三說並陳，不定案；講台照傳統以羅馬為最常見的讀法，但不排除以弗所。三說都同意的是：腓利門書與歌羅西書同時寫成、同一趟送出——推基古帶著歌羅西書，阿尼西謀同行（西 4:7--9）。</strong></p><p>不論在哪一座監牢，這封信的重點都一樣：一個被關的人，生了一個兒子（1:10），又為那兒子寫了一張欠條（1:19）。保羅的捆鎖沒有攔住福音，反而讓一個離開了家的人，在捆鎖中遇見了主。</p>"]],"con":[],"say":"本講義的全卷立場：寫作地點羅馬（約主後 60--62 年）、以弗所（約 54--55 年）、該撒利亞（約 57--59 年）三說並陳，不定案；三說都同意腓利門書與歌羅西書同時寫成、同一趟由推基古與阿尼西謀送出（西 4:7--9）。","care":"這一題主要是背景知識，但席上會有覺得自己「被關住」的人——病床上、照顧失智家人、身在監所、或困在一份離不開的工作裡。牧者可以借這一題讓他們看見：保羅在捆鎖中仍生了一個兒子。不要把地點與年代講成考試，也不要因為學者意見不一，就讓人覺得聖經的歷史是不可靠的。"},{"id":"ISS00_8","t":"腓利門書為甚麼被收進正典？","r":"1:1--25","ch":[],"why":"八、一封沒有一句教義綱領的私人短信，為甚麼被教會收進正典？第四世紀就有人認為這封信太私人、沒有造就人的教訓，不配與保羅其他書信並列；耶柔米與屈梭多模為它辯護。這一題要說明：腓利門書被收進正典，正因為它把福音落在一個家、一個人、一筆帳上。","pos":[["【一】經文問的是甚麼","","<p>這封信只有一章、二十五節，沒有討論稱義、復活或教會的次序；它談的是一個奴僕的去留，收尾是「此外你還要給我預備住處」（1:22）。可是它從很早就被列在保羅的書信裡。<strong>經文問的是：一封這麼私人、這麼短的信，為甚麼是神的話？它在正典裡的位置是甚麼？</strong></p>"],["質疑說（太私人、沒有造就）","","<p>耶柔米在他的腓利門書註釋序言裡提到，當時有人認為這封信不是保羅寫的，或者就算是，也沒有甚麼造就人的內容——使徒不是每一句話都是在聖靈感動下說的，一封處理家務事的信不該當作聖經。這派的優點是嚴肅看待「聖經」這兩個字的份量，不讓任何文字隨便進入正典。</p><p><strong>難處：</strong>這種看法預設了「屬靈的」只在教義裡，家務事與帳本不屬靈；可是保羅偏偏說「不拘是按肉體說，是按主說」（1:16）。而且這封信很早就被教會普遍接受：馬吉安的保羅書信集、穆拉多利殘篇都有它，教會讀它、念它、保存它，遠早於有人質疑它。</p>"],["辯護說（小信裡有大福音）","","<p>耶柔米與屈梭多模都為這封信辯護：屈梭多模說，這封信教導我們不可輕看任何一個人，連一個奴僕、一個曾經犯錯的人，都值得使徒親筆為他寫信；耶柔米則在序言裡反駁質疑者，大意是說：這封信雖短，仍是保羅的信，也帶著使徒的教導與造就，不可因為它談的是日常的事就輕看它。宗教改革時，路德更在這裡看見基督為我們的代求。這派的優點是看見正典的意義不在篇幅，在於它怎樣見證基督。</p><p><strong>難處：</strong>辯護時若把這封信過度寓意化——把每一個人物都講成預表——反而失去了它最珍貴的地方：它是真實的人、真實的帳、真實的一扇門（見 ISS00_5 的界線）。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：腓利門書屬於正典，從最早的保羅書信集就在其中；它在正典裡的位置，是讓福音落地——福音不只改變一個人的永遠，也改變一個家怎樣稱呼門口那個人。</strong></p><p>這使我們想起保羅說的「聖經都是神所默示的，於教訓、督責、使人歸正、教導人學義都是有益的」（提後 3:16）——這裡的「有益」（ὠφέλιμος）與 1:11 的「有益處」（εὔχρηστος）原文不是同一個字，只是中文上的呼應；但這份呼應仍可以提醒我們：神所默示的話，連一封為「沒有益處」的人寫的信都包括在內。全本聖經若少了腓利門書，我們就少了一頁：看見福音站在一扇門前，面對一筆真實的帳，會發生甚麼事。</p>"]],"con":[],"say":"本講義的全卷立場：腓利門書從最早的保羅書信集（馬吉安、穆拉多利殘篇）就在正典裡；第四世紀的質疑並陳，耶柔米、屈梭多模的辯護並陳。它被收進正典，正因為它把福音落在一個家、一個人、一筆帳上。","care":"席上會有覺得自己的生活太瑣碎、太平凡，「沒有甚麼屬靈的」的人——家務、帳單、照顧家人、管理員工。牧者可以讓他們看見：神把一封處理家務事的信放進聖經，表示他在乎廚房、帳本與門口。不要把這卷書講得只有教義才算重要，也不要把它寓意化到每一個人物都成了符號。"},{"id":"ISS00_9","t":"這些爭議該不該影響一個人的信心？","r":"1:1--25","ch":[],"why":"九、派別之爭不該影響信心；但「我在這封信裡是哪一個人，那扇門開不開」該——恩常在你們的心裡。腓利門書只有二十五節，卻碰到新約最敏感的幾件事：奴隸制、饒恕與和好、屬靈權柄、福音的比喻界線，還有阿尼西謀的處境、寫作地點等種種討論。一位認真讀完議題頁的信徒，很可能會問：這麼多不確定，我還能確定甚麼？這一題要把全卷的爭議放回正確的位置。","pos":[["【一】經文問的是甚麼","","<p>這封信本身就留下許多經文沒有回答的問題：阿尼西謀為甚麼離開？腓利門後來有沒有接納他、有沒有釋放他？保羅有沒有去成歌羅西？保羅甚至在最關鍵的地方用了「或者」——「他暫時離開你，或者是叫你永遠得著他」（1:15）。</p><p>同時，這封信的開頭與結尾放了兩件不會改變的事：開頭是「願恩惠、平安從神我們的父和主耶穌基督歸與你們」（1:3），結尾是「願我們主耶穌基督的恩常在你的心裡」（1:25）。<strong>經文問的是：面對這卷書裡的種種爭議與未知，一個信徒該怎樣自處？有沒有甚麼是不會因爭議而動搖的？</strong></p>"],["爭議證明聖經不可靠","","<p>這是懷疑者常有的推論：連保羅對奴隸制的態度都講不清楚，阿尼西謀的處境有四種讀法，寫作地點有三說——可見聖經不過是古人的作品，不值得全然信靠。這派的優點是誠實，它不假裝問題不存在，也逼著教會不能只用「信就對了」回答。</p><p><strong>難處：</strong>這些爭議幾乎全部發生在「怎樣理解」的層次，不在「耶穌是誰、他作成了甚麼」的層次。主張暗示釋放的，和主張只改變關係的，都同意阿尼西謀是「親愛的兄弟」（1:16）；主張 19 節是施壓的，和主張是幽默的，都同意保羅「寧可憑著愛心求你」（1:9）。爭議多，表示這封信被認真讀了兩千年，不表示它不可信。</p>"],["只要信，不要問","","<p>這是教會裡常見的反應：這些爭議會絆倒人，最好不要在教會裡講，信徒只要單純地信就好。這派的優點是保護軟弱的信徒不被過多的資訊淹沒，也提醒我們信心不是靠學問得來的。</p><p><strong>難處：</strong>正是因為教會沒有講清楚，腓利門書才會被拿來為奴隸制辯護、被拿來叫受害者回去、被拿來逼人饒恕。不准問的信心最脆弱，也最容易被誤用經文的人利用；而把提問的人看成不屬靈，正是 ISS00_4 所說那種權柄的越界。保羅自己用「或者」，就是在示範：誠實面對未知，是信心的一部分。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：分層看待——在根基上站穩，在枝節上並陳、謙卑、不定案。</strong>全卷的爭議，本講義已在 ISS00_1--8 交代：書信的處境與原則（ISS00_1）、奴隸制與勞動（ISS00_2）、饒恕與和好（ISS00_3）、權柄與請求（ISS00_4）、歸帳與擔保（ISS00_5）、作者（ISS00_6）、地點與年代（ISS00_7）、正典（ISS00_8）。每一題都列出各家的理由與難處，因為只給結論不給過程，是剝奪讀者思考的權利。</p><p>但有幾件事，全卷沒有任何一個爭議動搖過：<strong>恩惠與平安是「從神我們的父和主耶穌基督」來的（1:3）；一個曾經「沒有益處」的人，在福音裡成了「親愛的兄弟」（1:11、16）；有一位擔保者願意說「都歸在我的帳上」（1:18）；而且「願我們主耶穌基督的恩常在你的心裡」（1:25）。</strong>這是腓利門書的根基，也是本講義全卷的根基。</p>"],["【四】這件事該不該影響你的信心","","<p>派別之爭不該影響你的信心。問問題不是不信；保羅自己也說「或者」，他沒有假裝知道神全部的計畫。</p><p>但有一件事該影響你：<strong>讀完這封信，我在三個人裡面看見了哪一個自己？</strong>是那個能命令卻選擇求的保羅，是那個有權利、有理由、被邀請放下的腓利門，還是那個曾經沒有益處、現在站在門口的阿尼西謀？不論是哪一個，那位說「歸在我的帳上」的主都已經先走過那扇門。爭議可以慢慢想，這份恩今天就可以領受。</p>"]],"con":[],"say":"本講義的全卷立場：腓利門書的爭議都發生在「怎樣理解」的層次，本講義分層看待——在根基上站穩，在枝節上並陳、謙卑、不定案。恩惠平安從神而來，一個沒有益處的人成了親愛的兄弟，有一位擔保者說「歸在我的帳上」，這些沒有一個爭議動搖過。","care":"席上會有正在信仰危機裡、問題多到不敢說出口的人；有一聽到「學者有爭論」就不安的長輩；還有曾經被人用這封信傷過——被叫回危險裡、被逼著饒恕、被恩情綁住——因此連神也不敢信的人。對第一種人，不要說「你就是信心不夠」，先陪他；對第二種人，指給他看 1:3 與 1:25；對第三種人，讓他知道傷他的是人錯用了經文，不是那位替他擔保的主。疑惑若伴隨長期失眠或無望感，會後單獨關心，必要時協助尋求專業協助。"},{"id":"ISS01_1","t":"四種讀法：阿尼西謀是逃走的奴僕嗎？","r":"1:10--16；西 4:9","ch":[1],"why":"華人教會講腓利門書，幾乎都從「逃奴阿尼西謀」講起，好像這是經文明說的事實。可是經文從來沒有用「逃」這個字，保羅只說他「暫時離開你」，而且用的是被動語態。阿尼西謀是怎樣來到保羅身邊的，決定了我們怎樣看他的過去、怎樣看腓利門的處境，也決定了講台會不會不知不覺地給一個人定了罪。","pos":[["【一】經文問的是甚麼","","<p>經文確定的事只有三件：阿尼西謀「從前與你沒有益處」（1:11）；他在保羅的捆鎖中信了主（1:10）；保羅現在把他送回腓利門那裡（1:12）。另外，1:18 說「他若虧負你，或欠你甚麼」，用的是條件句。問題是：他為甚麼會在一個坐監的使徒身邊？是逃出主人家、碰巧遇見保羅，還是另有原因？這一題沒有一節經文直接回答，所以只能從線索推想。</p>"],["逃走的奴僕說（傳統讀法）","","<p>從屈梭多模以來，多數讀者認為阿尼西謀從主人家逃走，可能還帶走了財物（1:18），輾轉到了大城市，在那裡遇見保羅、信了主。1:15 的「暫時離開你」、1:18 的虧負與欠，以及保羅謹慎、委婉的整封信語氣，都很符合這個讀法：一個犯了羅馬法的奴僕，需要有人替他求情。</p><p><strong>難處：</strong>一個逃奴最不該去的地方，就是主人的朋友身邊；而保羅很可能是腓利門的屬靈父親（1:19）。「碰巧在監裡遇見保羅」的機率不高；經文也從來沒有說「逃」，把這個讀法講成定案，就是替經文多加了一個罪名。</p>"],["找調停人說（amicus domini）","","<p>羅馬法學家的文獻提到：與主人起了衝突的奴僕，可以去找主人的朋友（amicus domini）代為求情，這種情況在法律上不算逃亡。照這個讀法，阿尼西謀是在家裡出了事、怕受重罰，特意去找主人敬重的保羅，請他寫信說情；他在保羅那裡信了主，是意料之外的恩典。這也解釋了為甚麼保羅的信寫得像一封調停信。</p><p><strong>難處：</strong>這一說倚賴羅馬法的旁證，經文本身沒有說阿尼西謀是特意來找保羅的；而且他信主之後似乎在保羅身邊停留了一段日子（1:11、13），這與一趟短暫的求情之旅不完全吻合。</p>"],["腓利門差來說，與親兄弟說","","<p>還有兩種較少人採的讀法。一是差派說：阿尼西謀是腓利門或歌羅西教會差來服事坐監的保羅的，1:13「替你伺候我」似乎可以支持；保羅的請求是讓他留下，或請腓利門釋放他。二是親兄弟說：根據 1:16「按肉體說」，認為阿尼西謀與腓利門是血親，兩人是失和的兄弟。</p><p><strong>難處：</strong>差派說很難解釋 1:11 的「沒有益處」、1:15 的「離開」與 1:18 的虧負；親兄弟說則把 1:16 的「奴僕」讀成比喻，與整封信的語氣不合，支持的學者很少。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義以前兩讀——逃走的奴僕、找保羅當調停人——並為主要讀法，不作裁判；差派說與親兄弟說只作並陳。</strong>講台只講經文確定的事：他曾經沒有益處，他在捆鎖中被生，他現在被保羅送回主人家，帶著一封信、一位同行者和一份擔保。</p><p>所以本講義不說「逃奴阿尼西謀犯了罪，回去受罰是應該的」——經文沒有這樣定他的罪；也不把他講成無辜的英雄——保羅承認他「從前與你沒有益處」。兩頭都不加，讓經文自己的分寸留著。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。四種讀法都同意：一個在法律上是財產的人，在保羅的捆鎖中成了神的兒子，如今被叫成「親愛的兄弟」；保羅憑愛心求，又親筆擔保。這些才是這封信要人看見的。</p><p>我們不知道阿尼西謀是怎樣離開的，正好提醒我們：對一個人的過去，常常知道得比自己以為的少。在不清楚的地方說得謹慎，在清楚的地方說得堅定——這本身就是讀經的操練。全卷的處境與爭議見 ISS00_1、ISS00_9。</p>"]],"con":[],"say":"本講義的立場：阿尼西謀怎樣來到保羅身邊有四種讀法，本講義以「逃走的奴僕」與「找保羅當調停人」兩讀並為主要讀法，不作裁判；講台只講經文確定的事，不給他定罪，也不替他粉飾。本講義的全卷立場見 ISS00_1。","care":"會眾席上可能有人曾經「逃走」——離開一個家、一份工作、一間教會，至今被人叫作「那個跑掉的」。講這一題時不要用「逃奴」當笑話或標籤；牧者可以私下陪他說出離開的真實原因，先聽，不急著判斷。不要說「你跑掉就是不負責任」，因為有些人是為了保命才離開的。"},{"id":"ISS01_2","t":"保羅有沒有要求腓利門釋放阿尼西謀？","r":"1:21；1:13--16","ch":[1],"why":"保羅在 1:21 說「知道你所要行的必過於我所說的」，卻沒有說出那「過於」的是甚麼。有人認為這是在暗示釋放，有人認為保羅只要腓利門改變對待他的方式。這一題關係到我們怎樣理解福音與社會制度的關係，也關係到今天的基督徒雇主、主管，聽完這封信要不要做出制度上的改變。","pos":[["【一】經文問的是甚麼","","<p>保羅說了三句話：「不再是奴僕，乃是高過奴僕，是親愛的兄弟」（1:16）；「就收納他，如同收納我一樣」（1:17）；「深信你必順服，知道你所要行的必過於我所說的」（1:21）。另外 1:13 說他「本來有意將他留下」。問題是：保羅要的是腓利門在法律上釋放阿尼西謀，還是在同一個身分裡換一種眼光看他？1:16 的 ὡς（hōs）「作為」，和 1:21 沒有說出口的「過於」，是這一題的兩個關鍵。</p>"],["暗示釋放說","","<p>許多解經家認為保羅雖然沒有明說，卻已經講得很清楚：1:13 他想把阿尼西謀留在身邊服事福音，1:21「過於我所說的」最自然的意思，就是釋放他，讓他自由地回到保羅身邊。而且一個「親愛的兄弟」若仍然是你的財產，「按肉體說」的兄弟關係就很難成立；保羅用委婉的方式，把決定權交給腓利門的甘心。</p><p><strong>難處：</strong>保羅如果真的要釋放，為甚麼不直說？他在 1:8 明明說自己可以吩咐。這一說必須假設保羅刻意保留，而經文沒有給出確證。</p>"],["關係改變說","","<p>另一些解經家注意到 1:16 的 ὡς（hōs）：「不再作為奴僕」，說的是腓利門看待他的方式，沒有直接說他的法律身分已經改變。照這個讀法，保羅要的是在同一個家裡，主人與奴僕成為弟兄，同桌吃飯、彼此尊重；「過於我所說的」可能指更多的善待，例如讓他參與服事、恢復他的名譽。</p><p><strong>難處：</strong>這一說若講得太快，容易變成「只要心態改變，制度不必動」；而 1:16 的「按肉體說」正是要把改變帶到日常的社會關係裡，不只停在聚會中。</p>"],["從內部瓦解說","","<p>還有學者採取較寬的角度：不論保羅心裡有沒有「釋放」這兩個字，他放進這個家的原則——奴僕是親愛的兄弟、主人要收納他如同收納使徒——終究會從裡面瓦解主奴的制度。教會歷史後來確實有信徒為奴僕贖身，也有基督徒在廢奴運動中引用這封信。</p><p><strong>難處：</strong>這一說描述的是長遠的果效，不是保羅在這封信裡具體要求的事；而且教會歷史上也有人讀了同一封信，卻繼續擁有奴僕，可見原則不會自動變成行動。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義將「暗示釋放」「關係改變」「從內部瓦解」三讀並陳，不作定案。</strong>但三讀共同的底線很清楚：保羅要的不只是腓利門心裡原諒，是「按肉體」也「按主」的改變——在家裡、帳本上、派工的時候。</p><p>所以本講義不說「保羅只要人換個心態就好」，也不說「保羅明明要求釋放，腓利門不放就是不順服」。經文把那「過於」留給腓利門的甘心，講台也要把空間留給聽的人，同時清楚指出方向：尊嚴、公平與自由。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。三讀都同意：福音進到一個家，就不能讓人照舊把弟兄當成財產。保羅沒有寫一篇廢奴宣言，卻寫了一封讓一個主人無法再照舊生活的信。</p><p>今天你不必知道腓利門最後有沒有簽下釋放文書，才能知道自己該怎樣做。你只要問：在我手裡握著權力的那個關係裡，我做的，有沒有「過於」別人要求的？奴隸制與身分的全卷立場見 ISS00_2。</p>"]],"con":[],"say":"本講義的立場：1:21「必過於我所說的」是否暗示釋放，本講義將「暗示釋放」「關係改變」「從內部瓦解」三讀並陳，不作定案；三讀都同意改變必須「按肉體」也「按主」，落在家裡、帳本上與派工時。本講義的全卷立場見 ISS00_2。","care":"會眾席上可能有雇主、主管，也可能有被不公平對待的員工、移工與看護。不要只對員工講「順服」，也不要只對老闆講「心態」；牧者可以陪雇主具體檢查工時、休假與薪資，也陪受委屈的勞工找到正當的管道。不要說「在主裡是弟兄，薪水的事就別計較了」。"},{"id":"ISS01_3","t":"為甚麼保羅不直接反對奴隸制？","r":"1:16；林前 7:21；提前 1:10","ch":[1],"why":"這是今天讀腓利門書最常被問、也最刺痛人的問題：一位使徒把一個奴僕送回主人家，卻沒有一句話譴責奴隸制度。有人因此懷疑新約的道德，也有人曾經拿這封信替奴隸制辯護。這一題處理不好，會讓慕道友卻步，也會讓今天被剝削的勞工覺得教會站在有權的人那一邊。","pos":[["【一】經文問的是甚麼","","<p>腓利門書沒有一句「奴隸制是罪」，卻說阿尼西謀「不再是奴僕，乃是高過奴僕，是親愛的兄弟」，而且「這也不拘是按肉體說，是按主說」（1:16）。保羅在別處勸作奴僕的「若能以自由，就求自由更好」（林前 7:21；此節原文另有讀法），又把搶人口的列在違背正道的事裡（提前 1:10）。問題是：保羅為甚麼不在這封信裡直接要求廢除制度？他的沉默，代表默許，還是另有原因？</p>"],["處境限制說","","<p>不少學者指出：一世紀的教會是一小群沒有政治力量的人，奴僕佔羅馬帝國人口的很大比例，整個經濟建立在這個制度上。斯巴達克斯的奴隸起義被血腥鎮壓，數千人被釘十字架。保羅若公開號召廢奴，最先受害的正是那些奴僕自己。所以他在現實可行的範圍裡，從一個家、一個人開始改變。</p><p><strong>難處：</strong>這一說解釋了保羅「為甚麼不能」，卻容易被延伸成「所以基督徒不必理會社會制度」；而且它不能完全回答：保羅為甚麼連在私人信裡都沒有把話說明。</p>"],["福音種子說","","<p>另一說認為：保羅選擇的不是街頭運動，而是把一顆會瓦解制度的種子放進教會——在基督裡「自主的、為奴的」都成為一（這使我們想起加 3:28），主人與奴僕在同一張桌子上擘餅，主人被提醒「你們也有一位主在天上」（西 4:1）。一個主人若真的把奴僕當成親愛的兄弟，制度就從裡面空掉了。</p><p><strong>難處：</strong>種子長大花了將近十八個世紀，其間許多自稱基督徒的人仍然擁有奴僕，甚至引用聖經辯護；這一說必須誠實承認：教會常常沒有活出自己手中的原則。</p>"],["批判說：新約的道德受時代限制","","<p>也有學者與一般讀者認為，保羅終究是他那個時代的人，沒有超越古代社會的視野；腓利門書顯示新約在奴隸制上的倫理是不足的，今天的讀者必須用更完整的人權觀念來補足。這一說的長處是不替歷史上的錯誤找藉口，也認真聆聽受壓迫者的聲音。</p><p><strong>難處：</strong>這一說常常忽略新約自己已經有的方向：搶人口是罪、求自由更好、奴僕是親愛的兄弟、主人要公平待人；後來廢奴運動的許多推動者，正是從這些經文得到力量。把新約整體判為落後，並不符合經文本身。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：新約不為奴隸制背書。</strong>保羅在一個無力改變法律的處境裡，把福音放進一個具體的家，把一件「東西」叫成「弟兄」，而且要求這個改變「按肉體」也「按主」發生。處境限制與福音種子兩說可以並取；批判說提醒我們不要替教會歷史的失敗辯護。</p><p>所以本講義不說「聖經支持奴隸制」，也不因保羅沒有寫廢奴宣言就說聖經不再有權威；同樣，不說「今天的外勞就是奴僕」，但要求教會具體看見今天的移工、看護與派遣勞工，不以「在主裡是弟兄」抹去工資、休假與尊嚴的不公。</p>"],["【四】這件事該不該影響你的信心","","<p>它值得你認真面對，但不必動搖你對福音的信靠。福音從來不是先改法律再改人心，而是一位主「反倒虛己，取了奴僕的形像」（腓 2:7），從最底層把人的尊嚴贖回來。</p><p>真正該讓我們不安的，不是保羅寫得不夠，而是我們讀了這封信之後，仍然可以在主日稱人弟兄、週一照舊把他當成人力。奴隸制、勞動與身分的全卷立場見 ISS00_2；爭議與信心見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：新約不為奴隸制背書；保羅在無力改變法律的處境裡，把福音放進一個家，要求「按肉體」也「按主」的改變。不說聖經支持奴隸制，也不說「外勞就是奴僕」；今天的勞工要被具體看見。本講義的全卷立場見 ISS00_2。","care":"會眾席上可能有祖先曾被奴役或剝削的人，也可能有正在異鄉打工、被扣證件或欠薪的移工，還有因為這個問題對信仰起疑的慕道友。不要急著護教、說「當時的奴隸其實過得不錯」；先承認歷史的傷，再指出經文的方向。若有人正在被剝削，陪他找到勞工求助的管道，比贏一場辯論重要。"},{"id":"ISS01_4","t":"「與人所同有的信心顯出功效」是甚麼意思？","r":"1:6；1:17","ch":[1],"why":"1:6 被公認是全卷最難的一句，和合本、新譯本、現代譯本的翻法差別很大；華人教會常把它講成「傳福音要有果效」，也有人讀成個人的信心成長。這一句其實是保羅在提出請求之前的禱告，讀法不同，整封信的重心也會跟著移動。","pos":[["【一】經文問的是甚麼","","<p>和合本作「願你與人所同有的信心顯出功效，使人知道你們各樣善事都是為基督做的」（1:6）。關鍵是 ἡ κοινωνία τῆς πίστεώς σου（hē koinōnia tēs pisteōs sou）這個屬格片語：κοινωνία（koinōnia）可以是「分享」「團契」「參與」。問題是：保羅為腓利門求的，是他把信心分享出去、他與眾聖徒在信心裡的夥伴關係，還是他自己更深地活在信心裡？</p>"],["分享信心說","","<p>有些譯本與解經家讀作「你分享出去的信心」，帶有傳福音的意思：願腓利門向人傳講、分享的信心有功效，叫人認識基督裡一切的善。和合本「你與人所同有的信心」可兼容這一讀與下面的團契說；這一說的長處是看見信心不是私有的，它要流向別人。</p><p><strong>難處：</strong>整封信的處境不是向外傳福音，而是一個家庭教會內部的接納；把 1:6 讀成佈道的果效，與 1:7 以後的請求接不太上。</p>"],["信心團契說","","<p>另一讀把 κοινωνία（koinōnia）讀作信徒之間的夥伴關係：你因信與我們成為一體的那份團契。最有力的理由在 1:17：「你若以我為同伴」，「同伴」κοινωνόν（koinōnon）是同一個字根。保羅在 1:6 為這份夥伴關係禱告，到 1:17 就把它落在一個具體的動作上——收納阿尼西謀。</p><p><strong>難處：</strong>這一說倚賴前後呼應的文學讀法，若讀得太緊，會把 1:6 只縮成對 1:17 的預告，忽略保羅的禱告本身也有更廣的意思。</p>"],["參與信心說","","<p>還有一讀把屬格當成主觀的：腓利門自己對信心的參與，也就是他活在信心裡的整個生命。願他的信心在「認識一切的善」中更有活力，生出行動。這一說貼近 ἐνεργὴς（energēs）「有功效、起作用」的意思，也和雅各書「信心沒有行為也是死的」（雅 2:26）的關切相近。</p><p><strong>難處：</strong>這一說把重點放在個人的屬靈成長，κοινωνία（koinōnia）原本「與人共有」的味道就淡了；而全卷的重心正是一個人與一群人的關係。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採信心團契說為主：信心的團契要在一個具體的接納裡「顯出功效」，與 1:17「你若以我為同伴」呼應；分享說與參與說並陳。</strong></p><p>講台上不必展開三種讀法，只要抓住一件事：一個教會的信心有多真，不只看它的信仰告白寫得多完整，也看它門口站著一個曾經虧負人的人時，門開不開得了。善事的終點是「為基督」，不是為了表現自己寬宏大量。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。三種讀法都同意：信心不是只停在心裡的感受，它要做出來，而且是在人與人之間做出來。爭的只是保羅這一句話的重點落在哪裡。</p><p>對你今天最重要的問題是：我的信心，最近一次「顯出功效」是在甚麼時候、對甚麼人？如果答案都是容易愛的人，這一節正在溫柔地為你禱告。爭議與信心的全卷立場見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：1:6 本講義採「信心團契」說為主——信心的團契要在一個具體的接納裡顯出功效，與 1:17「同伴」呼應；分享說與參與說並陳，講台不展開辯論。爭議與信心的全卷立場見 ISS00_9。","care":"會眾席上可能有人覺得自己的信心「沒有功效」——傳福音沒有人信、服事沒有果子，聽到這一節更加自責。不要把 1:6 講成績效考核；牧者可以提醒他：一次真實的接納、一張被拉開的椅子，就是信心的功效。不要拿別人的成果和他比較。"},{"id":"ISS01_5","t":"「有年紀的」還是「使者」？","r":"1:9；弗 6:20","ch":[1],"why":"1:9 的 πρεσβύτης（presbytēs）所有抄本都作「老年人」，可是部分譯本（如 RSV）與注釋譯作「使者」。這一字之差，牽涉到經文鑑別的原則——沒有抄本支持的推測可以改經文嗎？也牽涉到保羅在這裡是在亮出權柄，還是在放下權柄，直接影響全卷權柄觀的讀法。","pos":[["【一】經文問的是甚麼","","<p>和合本作「然而像我這有年紀的保羅，現在又是為基督耶穌被囚的，寧可憑著愛心求你」（1:9）。全部抄本都作 πρεσβύτης（presbytēs），「老年人」；有學者主張改讀作 πρεσβευτής（presbeutēs），「使者」；也有學者認為不必改字，πρεσβύτης（presbytēs）本身就可以作「使者」解；兩字只差一個字母。問題是：保羅在這裡稱自己是一個老人，還是基督的使者？前者是軟弱的身分，後者是權柄的頭銜。</p>"],["老年人說（照抄本）","","<p>所有希臘文抄本都作 πρεσβύτης（presbytēs），和合本「有年紀的」照這個讀法。上下文也支持：保羅剛說他「能放膽吩咐」卻「寧可憑著愛心求」，接著把自己放在兩個軟弱的身分上——老了，又被關著。「老年人」與「囚犯」配成一對，正是一個放下權柄的人在懇求。</p><p><strong>難處：</strong>保羅寫這封信時大約五十多歲，在當時是否算「老年人」有討論；而且古代抄寫時這兩個字的拼寫偶有混用，單憑抄本一致，仍有學者覺得不能完全排除另一讀。</p>"],["使者說之一：改字推測（Bentley）","","<p>十八世紀的本特利（Bentley）提出推測：原文應是 πρεσβευτής（presbeutēs），「使者」，抄寫時少了一個字母。理由是保羅在以弗所書說「我為這福音的奧祕作了帶鎖鍊的使者」（弗 6:20），與「現在又是為基督耶穌被囚的」非常相似；照這個讀法，保羅一面請求，一面提醒腓利門：寫信的是基督的代表。</p><p><strong>難處：</strong>這個改字推測沒有任何抄本支持，等於為了一個意思去改動經文；而且在 1:8--9 的上下文裡，亮出「使者」的頭銜，正好與保羅「不吩咐、只懇求」的方向相反。</p>"],["使者說之二：同形異義（萊特富特）","","<p>萊特富特（Lightfoot）等學者則不改經文：他們指出在當時的希臘文裡，πρεσβύτης（presbytēs）這個拼法本身有時就被用來表示「使者」，兩個字的拼寫常常互通。照這個讀法，抄本的字不必動，只是意思可作「使者」，部分譯本（如 RSV）的「大使」即走這條路，也同樣可以連到弗 6:20 的「帶鎖鍊的使者」。</p><p><strong>難處：</strong>這一說不需改字，所以「沒有抄本支持」的反駁對它不成立；它的難處在上下文：保羅剛說他不用權柄，把自己放在軟弱的身分上，緊接著亮出「使者」的身分，語氣不順；而且同形異義在這一節是否成立，學界仍有爭論。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義照抄本與和合本作「有年紀的」；「使者」的兩種說法並陳。</strong>對本特利的改字推測：沒有抄本支持，不宜改動經文；對萊特富特的同形異義說：字可以不改，但上下文的方向是放下權柄，「老年人」與「囚犯」正好同路，所以本講義仍取「有年紀的」。</p><p>所以講台上不必替保羅加一個頭銜。一個老囚犯能拿甚麼壓人？他只剩下愛可以用。這是全卷的權柄觀：能命令的人，選擇憑愛心求。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。兩種讀法都同意保羅「寧可憑著愛心求你」——不論他是老人還是使者，他都沒有用權柄壓人。這一類一個字母的差別，正好讓我們看見經文鑑別是誠實、公開的工作，不是隱藏的。</p><p>對你今天更重要的問題是：在你有權柄的地方，你最近一次是命令，還是懇求？權柄與請求的全卷立場見 ISS00_4；爭議與信心見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：1:9 照抄本與和合本作「有年紀的」，「使者」的改字推測與同形異義兩說並陳；上下文的方向是放下權柄，憑愛心求，不憑命令。本講義的全卷立場見 ISS00_4。","care":"會眾席上可能有年長的弟兄姊妹，覺得自己老了、沒用了、說話沒人聽。保羅正是以「有年紀的」身分寫下這封改變一個家的信。不要把年長講成只剩回憶；牧者可以邀請長輩用禱告與愛心「求」，那常常比年輕人的命令更有力量。"},{"id":"ISS01_6","t":"羅馬法與收容逃奴：保羅可以把阿尼西謀留下嗎？","r":"1:13--14；申 23:15--16","ch":[1],"why":"保羅說他「本來有意將他留下」，卻把他送回去。按羅馬法，收容別人的奴僕要對主人負責；可是摩西律法卻規定不可把逃來的奴僕交還主人（申 23:15--16）。保羅為甚麼不照申命記留下他？這一題關係到我們怎樣看保羅的「送回去」，也關係到今天的教會怎樣面對逃離傷害、前來求助的人。","pos":[["【一】經文問的是甚麼","","<p>「我本來有意將他留下，在我為福音所受的捆鎖中替你伺候我。但不知道你的意思，我就不願意這樣行，叫你的善行不是出於勉強，乃是出於甘心」（1:13--14）。保羅給的理由不是「法律不允許」，而是「不知道你的意思」。問題是：保羅送阿尼西謀回去，是被羅馬法逼的、是遵守某種道德義務，還是為了一個更大的目的？</p>"],["法律義務說","","<p>有學者強調羅馬法的背景：收容他人的逃奴，在法律上等於侵占財產，收容者要賠償主人的損失。保羅身為羅馬公民、又是腓利門的朋友，若留下阿尼西謀，就是在法律與情理上都虧欠腓利門；送他回去，是保羅守法、也保護阿尼西謀免於被追捕的做法。</p><p><strong>難處：</strong>保羅自己給的理由完全不是法律，而是 1:14 的「甘心」；而且若阿尼西謀是找保羅調停（amicus domini），收容逃奴的法律問題本身就不成立。</p>"],["律法張力說","","<p>另一些讀者指出申 23:15--16 的規定：奴僕從主人那裡逃來，不可把他交還主人，要讓他在你中間隨意居住。保羅熟悉律法，卻選擇送回；有人因此認為保羅在羅馬制度下做了妥協，也有人認為申命記說的是從外邦逃到以色列的奴僕，不能直接套在一個信徒家中的奴僕身上。</p><p><strong>難處：</strong>這一說若推得太遠，會把保羅讀成違背律法的人；可是保羅並不是把一個無助的人丟回危險，而是帶著擔保、同行者與一整個教會的見證送他回去，處境與申命記不同。</p>"],["關係與甘心說","","<p>還有一說認為：保羅留下阿尼西謀，對自己最方便，在法律上也許可以處理；但他要的不只是一個奴僕的去留，而是兩個弟兄的和好，以及腓利門出於甘心的善行。如果先斬後奏，腓利門只能點頭，那份接納會帶著勉強，阿尼西謀在那個家裡永遠是「主人輸了」的提醒。</p><p><strong>難處：</strong>這一說很美，卻要小心不被誤用成「為了和好，受傷的人一定要回去面對」；阿尼西謀的回去有保護，不是每一個回去都有這些條件。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採關係與甘心說為主，法律義務說與律法張力說並陳：保羅送阿尼西謀回去，最直接的理由是 1:14 的「甘心」，要讓腓利門自己作決定，也讓斷裂的關係有機會在真相與擔保中恢復。</strong></p><p>同時本講義清楚劃線：阿尼西謀的回去是被保護的回去——有信、有推基古同行（西 4:7--9）、有教會見證、有保羅擔保。這一節不可拿來叫受家暴、受虐待、被剝削的人回到傷害他的人那裡；人身安全受威脅時，先保護生命、依法求助、通報。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。保羅的選擇讓我們看見，福音處理一件事時，不只問「法律允不允許」，也問「這樣做能不能讓人甘心、讓關係真實」。這是一位不用權柄替別人作決定的使徒。</p><p>如果你正在一段傷害你的關係裡，請你聽清楚：這一節不是要你回去。教會該做的，是像保羅那樣保護你、陪你、替你說話。饒恕與回歸的全卷立場見 ISS00_3；權柄與請求見 ISS00_4。</p>"]],"con":[],"say":"本講義的立場：保羅送阿尼西謀回去，最直接的理由是 1:14 的「甘心」；而那是一個有信、有同行者、有見證、有擔保的保護性回去，不可拿來叫受害者回到危險。本講義的全卷立場見 ISS00_3、ISS00_4。","care":"會眾席上可能有正在受家暴的配偶、逃離剝削雇主的移工、離家出走的青少年。他們聽到「保羅把他送回去」時，心裡可能一沉。不要說「你也應該回去面對」；牧者要先問他現在安不安全，提供庇護與通報的資訊，陪他走正當的求助管道。保護生命永遠先於和好。"},{"id":"ISS01_7","t":"「他暫時離開你」——神使用人的錯誤嗎？","r":"1:15；創 50:20；羅 8:28","ch":[1],"why":"保羅說「他暫時離開你，或者是叫你永遠得著他」（1:15），似乎暗示阿尼西謀的離開背後有神的手。華人教會常把這種讀法延伸成「一切都是神的安排」，用來安慰受傷的人，卻也常常傷了人。這一題關係到神的主權與人的責任，也關係到我們在別人受苦時該怎樣說話。","pos":[["【一】經文問的是甚麼","","<p>1:15 有兩個關鍵字。τάχα（tacha）「或者」，新約只出現兩次；ἐχωρίσθη（echōristhē）「被分開了」，是被動語態。保羅沒有說「他逃走了」，也沒有說「這是神的計畫」。問題是：這個被動語態暗示神在背後作工嗎？如果是，保羅是在說神「使用」了阿尼西謀可能的錯誤，還是說神「安排」了這件事？</p>"],["神的被動說（護理讀法）","","<p>許多解經家把 ἐχωρίσθη（echōristhē）讀成「神的被動」：表面上是阿尼西謀離開，背後是神在作工，要讓腓利門永遠得著一個弟兄。這與約瑟對哥哥們說的話相似：你們的意思是要害我，但神的意思原是好的（創 50:20）；也與「萬事都互相效力，叫愛神的人得益處」（羅 8:28）相呼應。</p><p><strong>難處：</strong>這一說若拿掉保羅的「或者」，很容易變成「這一切都是神預定要發生的」，把人的過錯與他人的損失一起歸給神，也讓受傷的人不敢說出真實的痛。</p>"],["委婉說","","<p>另一些學者認為這個被動語態只是保羅的委婉：他避開「逃走」「背叛」這類刺耳的字，不讓腓利門一讀就想起損失，好讓請求能被聽進去。照這個讀法，1:15 主要是修辭上的體貼，不是在宣告一個神學上的結論。</p><p><strong>難處：</strong>這一說若講得太徹底，會錯過保羅確實在邀請腓利門「改變觀點」——從暫時看到永遠，從損失看到收據上「全數收訖」的那個字；那不只是修辭，是信心的眼光。</p>"],["謹慎護理說","","<p>還有一種讀法把兩者合起來：保羅確實看見神的手可能在其中，所以用了被動語態；但他用 τάχα（tacha）「或者」管住整句，不把神的旨意說死。神能在人的錯誤與破碎中作工，卻不因此說那錯誤是好的，也不叫受損的一方假裝沒有受損——保羅在 1:18 仍然處理那筆帳。</p><p><strong>難處：</strong>這一說要求講的人在確定與不確定之間拿捏分寸，講台上比宣告式的說法難講；會眾也可能覺得「或者」不夠有力，不夠安慰。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採謹慎護理說：神能在人的錯誤裡作工，帶出永遠的好處；但保羅用「或者」，本講義也不把話說滿。</strong>不說「你受的傷害都是神的計畫」，不把背叛、虐待或罪包裝成神的旨意，也不因為神能轉化，就取消加害者的責任。</p><p>1:15 的落點是「改變觀點」：從「他離開了」看到「或者是叫你永遠得著他」。這個眼光是給受損的人自己在神面前慢慢看見的，不是別人可以替他宣告的。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各說都同意：神沒有缺席，人的責任也沒有消失。保羅既看見神可能的作為，也處理了真實的虧欠（1:18--19）。</p><p>如果你正在一段破碎裡，你可以同時說兩句話：「這件事是錯的，我很痛」；以及「主啊，或者你能在這裡作工」。神不需要你把傷害說成好事，才能在其中作工。饒恕與回歸的全卷立場見 ISS00_3；爭議與信心見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：1:15 保羅用「或者」——神能在人的錯誤中作工，但本講義不把傷害、背叛或罪說成神的計畫，也不取消人的責任；改變觀點是受傷的人在神面前慢慢看見的。本講義的全卷立場見 ISS00_3、ISS00_9。","care":"會眾席上可能有被配偶背叛、被合夥人捲款、被至親傷害的人；他們最怕聽到的一句話，就是「這一切都是神的安排」。不要在傷口還在流血的時候引用 1:15 或羅 8:28；牧者先陪他哭、承認那件事是錯的，等他自己在神面前問「或者」，再陪他一起看。"},{"id":"ISS01_8","t":"「都歸在我的帳上」是代贖的比喻嗎？","r":"1:18--19；林後 5:19、21；羅 5:13","ch":[1],"why":"路德說「我們都是他（基督）的阿尼西謀，只要我們信」，這句話讓 1:18 成了華人講台上最常被用來講福音的經文之一。可是保羅自己有沒有把這筆帳當成代贖的比喻？若講成保羅的教義，經文會被寓意化；若完全不提，又似乎錯過讀者兩千年來在這裡想起十字架的感動。這一題關係到我們怎樣讀經，也關係到怎樣講福音。","pos":[["【一】經文問的是甚麼","","<p>「他若虧負你，或欠你甚麼，都歸在我的帳上；我必償還，這是我－保羅親筆寫的」（1:18--19）。ἐλλόγα（elloga）是商業用字「記入帳上」，與羅 5:13 的 ἐλλογεῖται（ellogeitai）同字根。問題是：保羅在這裡是有意用一個福音的圖畫，還是單純在處理一筆真實的帳？讀者從這裡想起基督，是保羅的意思，還是讀者的回應？</p>"],["福音比喻說","","<p>從路德以來，許多傳道人把這兩節讀成福音的縮影：我們像阿尼西謀，虧欠了主人；基督像保羅，說「歸在我的帳上」；父神像腓利門，因著擔保者收納我們。這一說的力量在於它真實地觸動人心，而且新約確實有「不將他們的過犯歸到他們身上」（林後 5:19）的說法。</p><p><strong>難處：</strong>保羅在這封信裡從來沒有說這是比喻；把每一個人物對號入座，會讓阿尼西謀變成一個符號，讓腓利門變成父神的代表——那麼腓利門可以拒絕嗎？寓意一推下去，經文就承受不住了。</p>"],["真實擔保說","","<p>另一些解經家強調：保羅寫的是一張具法律效力的欠條，ἀποτίσω（apotisō）是法律上賠償的字，親筆簽名是當時借據的格式。保羅是在處理阿尼西謀可能造成的真實損失，讓腓利門的收納不必建立在吞下虧損上。這封信的重點是一個有名字的人，不是一套教義。</p><p><strong>難處：</strong>這一說若講得太乾，會忽略保羅自己的神學語言——他在羅馬書、哥林多後書都用「算」「歸」來講福音，很難想像他寫下這兩節時完全沒有想到自己被基督接納的經驗。</p>"],["回響說（這使我們想起）","","<p>還有一說站在兩者之間：保羅處理的是一筆真實的帳，他沒有把它寫成比喻；但因為保羅自己先被基督這樣接納，他的做法帶著福音的回響。讀者在這裡想起十字架，是正當的回應——「神使那無罪的，替我們成為罪」（林後 5:21）——只是要說成「這使我們想起」，不說成保羅的論證。</p><p><strong>難處：</strong>「使我們想起」與「保羅的意思」之間的界線，講台上不容易拿捏；稍不小心，回響又會滑回寓意。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採回響說：1:18--19 是保羅親筆的真實擔保；這使我們想起基督（羅 5:13；林後 5:19、21），但不說成保羅的預表或代贖論教導，也不說阿尼西謀預表罪人。</strong>路德的話只放在「這使我們想起」。</p><p>這一題還有一個牧養上的要點：虧負的帳是真的，有人要負責。恩典不是假裝沒有虧負，是有人把虧負扛起來。這使我們不會把饒恕講成「當作沒發生」，也不會叫受損的人吞下損失。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。不論保羅有沒有意識到，十字架的福音都不靠這兩節來證明；它在羅馬書、哥林多後書都講得清清楚楚。腓利門書給我們的，是福音落在一筆真實的帳上的樣子。</p><p>你可以在這裡停下來感謝：你的帳也有人扛了。只是記得，讓你感動的那一位，不是保羅的口才，是保羅背後那位先扛了他的主。歸帳與擔保的全卷立場見 ISS00_5。</p>"]],"con":[],"say":"本講義的立場：1:18--19 是保羅親筆的真實擔保，這使我們想起基督，但不說成保羅的預表或代贖論，也不說阿尼西謀預表罪人；虧負的帳是真的，有人要負責。本講義的全卷立場見 ISS00_5。","care":"會眾席上可能有人背著真實的債——欠錢、欠人一個道歉、欠家人多年的陪伴，聽到「歸在我的帳上」會很想哭；也可能有人是受損的一方，怕「恩典」被拿來叫他吞下損失。不要說「信了主，帳就一筆勾銷，別再計較」；牧者可以陪欠帳的人具體彌補，也陪受損的人被看見。"},{"id":"ISS01_9","t":"阿尼西謀就是後來以弗所的監督嗎？","r":"1:10；西 4:9","ch":[1],"why":"約在主後 110 年，安提阿的伊格那丟寫信給以弗所教會，提到他們的監督名叫阿尼西謀。有學者據此推想：當年的奴僕後來成了監督，甚至是他收集了保羅書信，所以這封短短的私人信才被保存下來。這個故事很動人，常在講台上被當成結局講；但它有多可靠，值得分辨。","pos":[["【一】經文問的是甚麼","","<p>腓利門書沒有告訴我們阿尼西謀後來怎樣。我們只知道保羅叫他「我在捆鎖中所生的兒子」（1:10），歌羅西書稱他「親愛忠心的兄弟」（西 4:9）。問題是：伊格那丟書信裡的以弗所監督阿尼西謀，與腓利門書的阿尼西謀是同一個人嗎？如果是，這是否能解釋腓利門書為甚麼被收進保羅書信集？</p>"],["同一人說","","<p>二十世紀有學者提出：伊格那丟的以弗所書信中，前幾章似乎有意回應腓利門書的字句，例如以「願我從你得益處」作名字的雙關（這使我們想起 1:20 的 ὀναίμην（onaimēn））。若阿尼西謀後來成了以弗所的監督，他很可能參與了保羅書信的收集，這封私人信因此被珍藏，一個曾經沒有益處的人，成了教會的牧者。</p><p><strong>難處：</strong>兩者相隔約五十年，當年的年輕奴僕到時已經是老人，雖非不可能，卻需要假設；伊格那丟的雙關也可能只是當時常見的文字遊戲——他在其他書信也多次用 ὀναίμην（onaimēn）（致羅馬人書 5:2、致坡旅甲書 1:1 等），不足以證明他心裡想的是腓利門書。</p>"],["同名不同人說","","<p>多數學者採較謹慎的看法：「阿尼西謀」（有益處）是當時極常見的奴僕名字，碑文與文獻裡有許多同名的人；以弗所與歌羅西雖然相距不遠，同名並不足以證明同一人。腓利門書被收進正典，也可以用它與歌羅西書同時寫成、同一趟送出，而被一起保存來解釋。</p><p><strong>難處：</strong>這一說仍要面對一個巧合：以弗所監督的名字、地點與年代，都落在腓利門書的阿尼西謀可能的人生範圍裡；完全排除同一人的可能，也不見得比肯定它更有根據。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義兩說並陳，不定案：同一人的可能性存在，但沒有足夠證據。</strong>講台上可以說「有學者推想」，不可以說成「阿尼西謀後來成了以弗所的監督」這樣的定論。</p><p>更要緊的是：腓利門書的盼望不倚靠這個結局。即使阿尼西謀一生只是一位忠心的弟兄，沒有任何職分，「如今與你我都有益處」（1:11）這句話已經成就了。福音的價值，不在一個人後來爬到多高。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。這是一個歷史上的問號，不是信仰的根基。腓利門書被收進正典，是因為它把福音落在一個家、一個人、一筆帳上，不是因為它有一個好看的結局。</p><p>我們常想替別人的故事寫一個圓滿的結尾——浪子回頭、從奴僕到監督。神給阿尼西謀的，已經是最好的結局：一個被叫成「親愛的兄弟」的名字。為甚麼收進正典的全卷立場見 ISS00_8；爭議與信心見 ISS00_9。</p>"]],"con":[],"say":"本講義的立場：伊格那丟書信中的以弗所監督阿尼西謀是否就是腓利門書的阿尼西謀，本講義兩說並陳、不定案；講台只說「有學者推想」，福音的盼望不倚靠這個結局。本講義的全卷立場見 ISS00_8。","care":"會眾席上可能有曾經走錯路、正在努力重新開始的人，聽到「奴僕成了監督」會很受鼓舞，也可能有人覺得「我沒有那麼了不起的結局」。不要把從谷底翻身講成恩典的標準樣本；牧者可以提醒他：被神叫成兒子、被弟兄姊妹接住，就已經是完整的恩典。也不要拿別人的成功見證和他比較。"}],"terrain":{"points":[[0.56,60,2,"以及在你家的教會",null],[0.76,78,7,"因眾聖徒的心從你得了暢快","top"],[0.84,66,9,"寧可憑著愛心求你",null],[0.88,72,10,"為我在捆鎖中所生的兒子",null],[0.92,14,11,"他從前與你沒有益處","bot"],[1.08,30,15,"他暫時離開你","bot"],[1.12,98,16,"不再是奴僕，乃是高過奴僕，是親愛的兄弟","top"],[1.2,26,18,"他若虧負你，或欠你甚麼","bot"],[1.24,90,19,"我必償還","top"],[1.48,84,25,"願我們主耶穌基督的恩常在你的心裡",null]]},"tracks":[{"gk":"Χριστός／κύριος","tr":"Christos / kyrios","gl":"基督、主（在基督裡、在主裡）","code":"G5547","root":"Χριστός——受膏者、彌賽亞；κύριος——主、主人。κύριος 也是奴僕稱呼主人的字：腓利門家裡，阿尼西謀每天叫腓利門 κύριε。保羅在這封短信裡用了八次「基督」、五次「主」，把這個家放在一位更高的主人底下","ins":"全信的第一個字族落在一個囚犯身上：「為基督耶穌被囚的保羅」（1:1）——保羅不稱自己是使徒，稱自己是基督的囚犯。問安把恩惠與平安的源頭定在「神我們的父和主耶穌基督」（1:3）。腓利門的信心是「向主耶穌」的（1:5），他的善事終點是「為基督做的」（1:6，εἰς Χριστόν）。8 節出現第一個翻轉：保羅「靠著基督能放膽吩咐」，他有權柄，而那權柄是從基督來的；下一節他卻說自己是「為基督耶穌被囚的」（1:9）——權柄的源頭，正好是一個被綁住的人。16 節是頂點：「這也不拘是按肉體說，是按主說」——κύριος 本來是奴僕叫主人的字，現在主人與奴僕同有一位主；在這位主面前，阿尼西謀是「親愛的兄弟」。20 節保羅請腓利門讓他「在主裡」得益處、「在基督裡」得暢快。23 節連同坐監的以巴弗也是「為基督耶穌」坐監。最後一站：「願我們主耶穌基督的恩常在你的心裡」（1:25）——全信從被囚開始，在恩裡結束。這個家真正的主人是誰，決定了門口那個人是誰。","stops":[["1:1","為基督耶穌被囚的保羅","top"],["1:3","願恩惠、平安從神我們的父和主耶穌基督歸與你們",""],["1:5","你向主耶穌和眾聖徒的信心",""],["1:6","使人知道你們各樣善事都是為基督做的",""],["1:8","我雖然靠著基督能放膽吩咐你合宜的事",""],["1:9","現在又是為基督耶穌被囚的",""],["1:16","這也不拘是按肉體說，是按主說","top"],["1:20","望你使我在主裡因你得快樂，並望你使我的心在基督裡得暢快",""],["1:23","為基督耶穌與我同坐監的以巴弗問你安",""],["1:25","願我們主耶穌基督的恩常在你的心裡","top"]]},{"gk":"ἀγάπη／ἀγαπητός／σπλάγχνα","tr":"agapē / agapētos / splanchna","gl":"愛心、親愛的、心（心腸）","code":"G26","root":"ἀγάπη——愛；ἀγαπητός——被愛的、親愛的；σπλάγχνα——內臟、心腸，希臘人感情的所在（像中文說「心肝」）。這封信三次說「愛」、兩次說「親愛的」、三次說「心」","ins":"第一站，「親愛的」是腓利門的稱號：「寫信給我們所親愛的同工腓利門」（1:1）。保羅聽說了他的愛心（1:5），而且那份愛已經落地：「因眾聖徒的心從你得了暢快」（1:7）——σπλάγχνα 第一次出現，眾人的心在他家裡得了安息。9 節愛心換了方向：不是腓利門的愛，是保羅的請求方式——「寧可憑著愛心求你」。12 節是第一個翻轉：「心」這個字變成了一個人——「他是我心上的人」，直譯是「他就是我的心腸」；保羅把自己的心打發回去了。16 節是第二個翻轉：原本屬於腓利門的稱號「親愛的」，給了阿尼西謀——「是親愛的兄弟」。最後一站把三個「心」接起來：你使眾聖徒的心得暢快（7），我的心就站在你門口（12），現在「望你使我的心在基督裡得暢快」（1:20）。愛不是一種感覺，是一顆心被打發到別人家門口。","stops":[["1:1","寫信給我們所親愛的同工腓利門",""],["1:5","因聽說你的愛心",""],["1:7","我為你的愛心，大有快樂，大得安慰，因眾聖徒的心從你得了暢快","top"],["1:9","寧可憑著愛心求你",""],["1:12","他是我心上的人","top"],["1:16","是親愛的兄弟","top"],["1:20","並望你使我的心在基督裡得暢快",""]]},{"gk":"ἀδελφός／ἀδελφή／συν-／κοινων-","tr":"adelphos / adelphē / syn- / koinōn-","gl":"兄弟、妹子、同工、同當兵、同坐監、同伴","code":"G80","root":"ἀδελφός——兄弟（同一個母腹）；συνεργός——同工；συστρατιώτης——同當兵的；συναιχμάλωτος——同被俘的；κοινωνία／κοινωνός——同有、夥伴（生意上的合夥人也用這個字）。一封短信裡滿是「同」字：保羅把每一個人都放在同一條船上","ins":"信一開頭就是一家人：「同兄弟提摩太」、「同工腓利門」（1:1）、「妹子亞腓亞」、「同當兵的亞基布」（1:2）。6 節的 κοινωνία——「與人所同有的信心」——信心是一份共有的產業。7 節保羅第一次直接叫腓利門「兄弟啊」。16 節是第一個翻轉：同一個字給了一個奴僕——「是親愛的兄弟」；腓利門多了一個他不曾選擇的兄弟。17 節是第二個翻轉：κοινωνός 是生意上的合夥人——「你若以我為同伴，就收納他」：同伴的資格，就是接納我所接納的人。20 節保羅再叫一次「兄弟啊」，這一次是在請求的高處。最後兩站是一張名單：「與我同坐監的以巴弗」（1:23）、「與我同工的馬可、亞里達古、底馬、路加」（1:24）。這張名單裡有一個曾經半途離開又回來的人，也有一個後來離開的人（這使我們想起提後 4:10–11）——同伴是真實的，不是完美的；阿尼西謀就是被接進這樣一張名單裡。","stops":[["1:1","同兄弟提摩太寫信給我們所親愛的同工腓利門",""],["1:2","和妹子亞腓亞並與我們同當兵的亞基布",""],["1:6","願你與人所同有的信心顯出功效",""],["1:7","兄弟啊",""],["1:16","是親愛的兄弟","top"],["1:17","你若以我為同伴，就收納他","top"],["1:20","兄弟啊",""],["1:23","為基督耶穌與我同坐監的以巴弗問你安",""],["1:24","與我同工的馬可、亞里達古、底馬、路加也都問你安",""]]}],"lesson":{"1":{"no":1,"vol":"《321腓利門書講義》第一課·腓利門書第一章","title":"都歸在我的帳上——心腸、欠條、兄弟","chars":5164,"min":60,"deep":8,"dchars":1691,"tchars":1473,"blocks":[["h","一、借據上的第二個簽名"],["p","弟兄姊妹平安。很多華人家裡的長輩，都交代過同一句話：千萬不要替人作保。為甚麼？因為一張借據上，除了借錢的人，還有第二個簽名。哪一天借錢的人不見了，債主上門，不找他，找那個簽了第二個名字的人。那一筆，是把別人的債簽進自己的名字裡。"],["p","新約裡有一封信，信的後半就有這樣一個簽名。寫信的人坐在監牢裡，多半是請人代筆的，寫到這裡，他把筆接過來，自己寫：「他若虧負你，或欠你甚麼，都歸在我的帳上；」（1:18）「我必償還，這是我－保羅親筆寫的。」（1:19）這就是腓利門書。一章，二十五節，一張寫在信裡的擔保書。"],["p","借錢的人是誰？他叫阿尼西謀，是歌羅西一位信徒腓利門家裡的奴僕。在羅馬法裡，奴僕是財產，是一件東西。他離開了主人的家，可能還讓主人虧了錢，後來在保羅的捆鎖中信了主。他是逃走的，還是去找保羅調停？議題頁有整理，這一課不裁判。確定的是：現在，他要帶著保羅的信，回到那個家門口。"],["p","所以這封信裡有三個人。寫信的保羅，能命令卻求，能留人卻送回，能算帳卻扛起來。收信的腓利門，有權利、有理由，被邀請放下。送信的阿尼西謀，曾經沒有益處，現在站在門口。信本身走三步：愛、求、收。這一課，我們用三個詞把它教一遍：心腸、欠條、兄弟。"],["p","先聽第一句：「為基督耶穌被囚的保羅」（1:1）。保羅寫別的信，開口常說自己是使徒。這一封，他只說被囚的，原文 δέσμιος（desmios），被綁住的人。第一行先把權柄放下。收信人還有「在你家的教會」（1:2）。一件家務事，為甚麼在全教會面前念？因為一個人被接回來，從來不只是兩個人的事。教會在場，是見證，也是保護。然後是恩惠、平安（1:3）：這封信從恩開始，也在恩裡結束，那個很難的請求夾在兩層恩典中間。"],["d",["阿尼西謀到底是不是逃走的奴僕？如果不是，這封信還讀得通嗎？","讀得通。學者有四種讀法：一是傳統的讀法，他逃離主人，在保羅坐監的地方遇見保羅；二是他和主人起了衝突，主動去找保羅當調停人，羅馬法裡有這種做法；三是腓利門差他去服事保羅；四是少數人說他和腓利門是親兄弟。本講義以前兩種為主要讀法，但不裁判。教的時候只要抓住經文確定的事：他離開了主人一段時間，從前與主人沒有益處，可能造成了虧損，在保羅的捆鎖中信了主，現在帶著信回去。不論哪一種，信的力量都一樣。"]],["h","二、愛：一個讓人歇一口氣的家"],["p","保羅沒有一開口就求，他先感謝：「我禱告的時候提到你，常為你感謝我的神」（1:4），因為他一直聽見腓利門的愛心和信心（1:5）。先感謝，後請求，可是這不是說服技巧：保羅把腓利門當成值得信任的弟兄。"],["p","第六節是全卷最難譯的一句：「願你與人所同有的信心顯出功效，使人知道你們各樣善事都是為基督做的。」（1:6）「與人所同有的信心」，原文的關鍵字是 κοινωνία（koinōnia），團契、同夥、分享。各家讀法不同，可是有一件事是一樣的：信心要「顯出功效」，就是要做出來。到了第十七節，保羅會用同一個字根說「你若以我為同伴」（1:17）。換句話說，信心的團契有多真，要看門口站著一個曾經虧負你的人時，門開不開得了。"],["p","第七節：「兄弟啊，我為你的愛心，大有快樂，大得安慰，因眾聖徒的心從你得了暢快。」（1:7）「暢快」原文 ἀναπέπαυται（anapepautai），是讓人停下來，歇一口氣，而且是完成式：已經歇下來，一直歇著。到他家的人，進門是累的，出門是輕省的。"],["p","這使我們想起主耶穌說「我就使你們得安息」，用的是同一個動詞（太 11:28）。主使人得安息，腓利門是那安息經過的一雙手。腓利門不是壞人，保羅是請他把一向在做的事，做在一個最難的人身上。我們的愛心都有一張名單，上面是容易愛的人。保羅只是先感謝，然後輕輕地，放上一個名字。"],["d",["第六節說「與人所同有的信心顯出功效」，到底是甚麼意思？","這是全卷最難譯的一句，各家讀法不同。關鍵字 κοινωνία（koinōnia）可以讀成三種：一，你與人分享出去的信心；二，你因信心和我們有的團契、夥伴關係；三，你對信心本身的參與。和合本的譯法比較接近第二種。本講義的判斷是：這個字和第十七節「你若以我為同伴」的同伴同字根，所以保羅在第六節為團契禱告，到了第十七節就要落地：信心的團契，要在一個具體的接納裡顯出功效。一個小組的信心有多真，要看一個曾經虧負人的人回來時，大家怎樣接他。"]],["h","三、求：能命令的人選擇開口求"],["p","第八節，保羅說他「能放膽吩咐你合宜的事」（1:8）。「吩咐」原文 ἐπιτάσσειν（epitassein），是有權柄的人下命令的字，他有這個權柄。可是下一句是：「寧可憑著愛心求你」（1:9）。他沒有失去權柄，他選擇不用。命令換得到照做，請求才換得到一顆心。他又說自己是「有年紀的」，原文 πρεσβύτης（presbytēs），老人。一個上了年紀、又被關著的人，拿甚麼壓人？他只剩下愛可以用。"],["p","第十節的字序很特別。原文先說「我的孩子」，再說「我在捆鎖中所生的」，最後一個字，才是名字 Ὀνήσιμον（Onēsimon）。腓利門聽見名字以前，先聽見這個人在保羅心裡的位置。在羅馬法裡他是財產，在保羅口中他是兒子。接著是全卷最低的一句：「他從前與你沒有益處，但如今與你我都有益處。」（1:11）保羅不替他粉飾，可是講他的過去只用一個詞，立刻接上「如今」。這個如今是在捆鎖中被生的，源頭是福音。"],["p","「我現在打發他親自回你那裡去；他是我心上的人。」（1:12）教這一節，一定要看清楚他怎樣回去：手上有保羅的信；有推基古同行；信在全教會面前念，大家都是見證人；保羅還親筆擔保（1:17–19）。這是一個被保護的回去。"],["p","保羅在另一封信裡這樣介紹他：「我又打發一位親愛忠心的兄弟阿尼西謀同去；他也是你們那裡的人。」（西 4:9）他不是一個人回去的。所以，這一節絕不可以拿來叫受家暴的配偶、受虐的孩子、被剝削的移工，回到傷害他的人那裡。如果你的人身安全正受到威脅，請先保護生命，依法求助，找人通報。教會要站在你旁邊，不是站在門口把你推回去。"],["p","第十三、十四節，保羅說他本來有意把阿尼西謀留在身邊伺候自己，「但不知道你的意思，我就不願意這樣行，叫你的善行不是出於勉強，乃是出於甘心。」（1:14）先把人留下再請人同意，叫先斬後奏。保羅把決定權完整地交回去。「甘心」原文 ἑκούσιον（hekousion），是自己願意的。請求就是請求，不是包裝過的命令。"],["p","第十五節：「他暫時離開你，或者是叫你永遠得著他」（1:15）。請聽「或者」兩個字，原文 τάχα（tacha），或許。保羅不把話說滿。「離開」原文 ἐχωρίσθη（echōristhē）是被動：他被分開了，保羅沒有說他逃走了。「得著」原文 ἀπέχῃς（apechēs），是收據上的字：全數收訖。你以為是一筆損失，保羅說，你收到的是全數，而且是永遠的。可是請小心：「神能在破碎裡作工」和「傷害是神的計畫」，是兩句不一樣的話。"],["p","然後是全卷最高的一句：「不再是奴僕，乃是高過奴僕，是親愛的兄弟。」（1:16）第一節裡，提摩太是兄弟，腓利門是親愛的；兩個稱呼現在合在一起，落在門口那個人身上。一件東西，被叫成了弟兄。保羅還加一句：「這也不拘是按肉體說，是按主說。」（1:16）按主說是弟兄，按肉體說也是弟兄。不只在聚會裡，也在帳本上、在明天早上派工的時候。"],["p","我們要說清楚：新約不為奴隸制背書。保羅對作奴僕的人說「若能以自由，就求自由更好」（林前 7:21），又把搶人口的列在違背正道的事裡（提前 1:10）。腓利門書沒有寫成一篇宣言，它讓福音進到一個家，把主奴關係從裡面翻過來。"],["d",["保羅為甚麼不直接要求腓利門釋放阿尼西謀？這是不是表示他默許奴隸制？","不是默許。新約不為奴隸制背書：保羅對作奴僕的人說，若能以自由就求自由更好（林前 7:21），又把搶人口的列在違背正道的事中（提前 1:10）。他沒有寫廢奴宣言，學者有幾種理解：一是處境的限制，幾間小小的家庭教會推不動羅馬的制度；二是福音像種子，從一個家的裡面翻轉主奴關係；三是保羅其實暗示了釋放，第二十一節「必過於我所說的」可能就是指這個。本講義不把話說死。可以確定的是，第十六節要腓利門看他「不再是奴僕」，而且按肉體說也是兄弟，這已經挖空了把人當成東西的根基。方向是尊嚴與自由。"]],["d",["「他暫時離開你，或者是叫你永遠得著他」，是不是說我受的傷害也是神安排的？","不能這樣讀。保羅用的是 τάχα（tacha），或者、或許。他看見神的手可能在這件事裡，卻沒有把話說死，更沒有說阿尼西謀可能做錯的事、腓利門受的損失，是神要它發生的。神能在破碎的地方作工，這是真的；可是傷害本身是錯的，傷人的人要負責，這也是真的，兩句話都要說。把傷害說成神的計畫，會讓受傷的人不敢求助。如果你正在一段傷害裡，第一件事不是找出神的旨意，是先求安全、找人幫忙。"]],["h","四、原文亮光：心腸、有益處、記在帳上"],["p","到了第十七節，前面十六節都在感謝、懇求、說明，這裡第一次用命令的語氣：「你若以我為同伴，就收納他，如同收納我一樣。」（1:17）「同伴」原文 κοινωνόν（koinōnon），生意上的合夥人；「收納」原文 προσλαβοῦ（proslabou），接到自己身邊。收納是把人接進門，同一張桌子，同一間客房。接下來，請和我一起拆三個原文。"],["p","第一個字：σπλάγχνα（splanchna），和合本譯作「心」，原文是心腸，人裡面最深、最軟的地方。它在信裡出現三次，把三段串起來。第七節，眾聖徒的心從你得了暢快；第十二節，阿尼西謀是我心上的人，直譯就是：他就是我的心腸；第二十節，「望你使我的心在基督裡得暢快」（1:20）。連起來聽：你讓眾人的心歇了一口氣；現在我的心站在你門口；也請讓我的心歇一口氣。保羅送回去的不是一份財產，是他自己的心。"],["p","第二個字其實是一組雙關。阿尼西謀這個名字 Ὀνήσιμος（Onēsimos），意思就是有益處的。保羅說他從前 ἄχρηστον（achrēston），沒有益處；如今 εὔχρηστον（euchrēston），有益處。名叫有益處的人，從前沒有益處；現在名字終於名副其實了。到第二十節，保羅又說一次：「望你使我在主裡因你得快樂」（1:20），「快樂」原文 ὀναίμην（onaimēn），和名字同一個字根，和合本註腳說也可譯作益處。福音沒有抹掉一個人的從前，福音給他一個如今。"],["p","第三個字：ἐλλόγα（elloga），記在帳上，是商業用字。「他若虧負你，或欠你甚麼，都歸在我的帳上」（1:18）。保羅沒有說過去的就算了。虧負是真的，欠也是真的，有人要負責。保羅不撕帳本，是換一個名字：記在我名下。他把筆接過來：「我必償還」（1:19），原文 ἀποτίσω（apotisō），是當時欠條上的法律用語。"],["p","保羅在這裡沒有教導代贖論，也沒有說阿尼西謀代表罪人，他處理的是一筆真實的帳。可是這一筆帳，使我們想起另一筆帳：「神使那無罪的，替我們成為罪，好叫我們在他裡面成為神的義。」（林後 5:21）同一位保羅也說，神在基督裡「不將他們的過犯歸到他們身上」（林後 5:19）。我們的帳沒有被假裝不存在，它被記到另一位的名下。那一位不是寫了一張欠條，是在十字架上付清了。"],["p","第十九節後半，「連你自己也是虧欠於我」（1:19），可讀成溫和的施壓，也可讀成帶笑的提醒；我略傾向後者，恩情仍有重量，但不論哪一種，都不可以變成講台上以恩情綁人的話。「深信你必順服」（1:21）是信任，不是威脅：順服甚麼，經文沒有說明：可能是保羅的請求，也可能是福音本身；不論哪一種，都不是對一個人無條件服從，也不是拿來壓制提問的話。他還要來住（1:22），被接回來的人，不是交出去就沒人管了。"],["p","最後是五個問安的人：以巴弗、馬可、亞里達古、底馬、路加。馬可從前半途離開過，後來保羅說他「於我有益處」（提後 4:11），用的正是有益處那個字。底馬後來離開了（提後 4:10）。名單是真實的，不是完美的。我們不拿底馬羞辱離開教會的人，也不說離開的人都會回來。"],["p","然後是最後一句：「願我們主耶穌基督的恩常在你的心裡。阿們！」（1:25）「你的」原文是複數，恩給了整個家。咬著牙開的門，很快又會關上。先有恩，才有接納。"],["d",["「都歸在我的帳上」可以說成是代贖的比喻嗎？阿尼西謀代表我們嗎？","要分兩層講。第一層，保羅在這裡處理的是一筆真實的帳，他沒有說這是福音的比喻，也沒有教導代贖論；把阿尼西謀、腓利門、保羅一一對號入座，是講過頭了。第二層，兩千年來讀這封信的人都在這裡停下來，是有理由的：ἐλλόγα（elloga）記在帳上，和羅馬書說罪也不算罪的那個算字同字根（羅 5:13）；保羅在別處也說，神不將人的過犯歸到他們身上（林後 5:19）。所以本講義的說法是：這一筆帳，使我們想起另一筆帳。路德說，我們都是基督的阿尼西謀，只要我們信；這句話也是放在這個位置。這樣，人不會忘了阿尼西謀是一個有名字的人，也在這裡看見十字架的形狀。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是先講 321 的人比事重要、關係比東西重要，再拿阿尼西謀的故事當插圖，或把整封信教成說服技巧課。次序是先有福音，321 在末端認出它；焦點在那位扛帳的主，不在保羅的口才。"],["p","第二個偏差，是錯誤地說保羅把奴僕送回主人那裡，可見聖經支持奴隸制；或反過來說，保羅沒有要求廢除奴隸制，所以這卷書已經不合時宜。兩種說法都把信讀反了：新約不為奴隸制背書，第十六節要腓利門看他不再是奴僕。"],["p","第三個偏差，是錯拿第十二節叫受家暴的配偶、受虐的孩子、被剝削的移工或員工，回到傷害他的人那裡。阿尼西謀的回去有信、有同行者、有教會見證、有擔保。人身安全受威脅時，先保護生命、依法求助、通報。"],["p","第四個偏差，是錯誤地逼受傷的人立刻饒恕、立刻接納，說腓利門那麼大的損失都放下了，你為甚麼放不下；或把饒恕講成一筆勾銷、馬上恢復原職。饒恕是把審判交給神，可以先在神面前開始；和好是雙方的路，需要悔改與安全。饒恕不等於和好，也不等於免責：十八、十九節的帳是真的，有人負責。"],["p","第五個偏差，是錯把第十八節講成保羅的預表，說阿尼西謀就是罪人、腓利門就是父神；或錯把第十五節講成你受的傷都是神的計畫；或把第十九節當成以恩情綁人的範本：你是我帶信主的，所以你要聽我的，這也是錯的。保羅處理的是一筆真實的帳，他只說或者，他要的是甘心。"],["h","六、兩個華人處境的真實問題"],["p","第一個問題：家裡的看護。很多家庭請了外籍看護照顧長輩，她可能也坐在我們的聚會裡。主日稱她姊妹，週一她幾點起床、一個月休幾天、手機能不能用、房間有沒有門？她不是古代的奴僕，可是一樣容易被看成一份人力、一筆成本。「這也不拘是按肉體說，是按主說。」（1:16）按主說，她是姊妹；按肉體說，她的工時、休假、薪水和名字，也要照姊妹那樣對待。第一步，是叫得出她的本名。"],["p","第二個問題：要不要回去，要不要原諒。華人家庭講家和萬事興。也許你的父親多年前捲走家裡的錢離開，現在老了、病了，親戚打電話來說：他是你爸，回來吧。腓利門書給的不是一句快點原諒，是一條有層次的路：饒恕可以先在神面前開始，把審判交給神；和好需要對方真實的悔改，需要有人把話說清楚，也需要你的安全。如果那個人過去曾經對你動手，今天仍讓你害怕，你不必回去，先保護自己，找信得過的人和專業的協助。帳是真的，你可以慢慢走。"],["d",["我家請了外籍看護，要怎樣才算按肉體說、也按主說地待她？","可以從三件小事開始。第一，名字：叫她的本名，不叫「我們家那個」；記得她家鄉孩子的名字，問一句近況。第二，帳本：照法規給足薪水、加班費和休假，不扣她的證件，給她一個有門的房間和可以聯絡家人的時間，這些就是按肉體說。第三，桌子：讓她在家裡吃飯不必躲在廚房；她若是信徒，幫她找到母語的聚會。她不是古代的奴僕，這封信提醒的是：一個人在合約上的位置，不能決定她在神眼中的價值。主日稱她姊妹，週一也這樣待她。"]],["h","七、活出321——門邊多一把椅子"],["p","經文講完了，321 才在末端認出它。"],["p","耶穌是我的榜樣：保羅不稱使徒，只稱被囚的；能命令卻求；把別人的債寫在自己名下。這三筆不是保羅發明的，是照著一位主描下來的，那位「反倒虛己，取了奴僕的形像」（腓 2:7）。主自己先站到了奴僕的位置上。"],["p","聖經是我的準則：「這也不拘是按肉體說，是按主說。」（1:16）準則不只管聚會，也管帳本、家規和派工表。"],["p","聖靈是我的引導：第十五節只說或者。在不確定裡，聖靈叫我們看見神的手，卻不替神把話說死，也不把傷害說成神的旨意。"],["p","讓耶穌作王：當時奴僕稱主人為 κύριος（kyrios），西 4:1 你們作主人的，就是這個字。可是保羅說「在主裡」（1:20），這個家有一位更高的主。讓他作王，就是讓出三個位子：審判官的位子、所有權人的位子、面子的位子。"],["p","讓耶穌得著一切的榮耀：保羅禱告，要「使人知道你們各樣善事都是為基督做的」（1:6）。一個家把回來的人接進門，被看見的不是主人有多大量，是基督。"],["p","建立屬神的體系：體系最小的單位是「在你家的教會」（1:2），一個客廳，一張桌子。它的考驗不在聚會多熱鬧，在一個回來的人坐不坐得上那張桌子。國度321空中團契散在各國，接回一個人，也不是一個人的英雄行為，是一群人一起托住。"],["h","八、四種心，站在門的哪一邊"],["p","驕傲型的心，站在門裡面，手握門把：我是對的，我吃了虧，他要先低頭、先賠完、先證明，我才考慮。保羅沒有否認你吃了虧，他只是請你看那張欠條：帳已經有人扛了。能命令的保羅先放下，被邀請的腓利門才放得下；謙卑帶動謙卑。"],["p","恐懼型的心，怕開了門會再被傷一次，怕人家說我軟弱，也怕不開門被說不屬靈。請你聽第十四節：保羅要的是甘心，不是勉強。你可以慢慢來，也可以先只為那個人禱告。害怕不是罪。"],["p","羞恥型的心，站在門外面，手舉起來又放下：我從前沒有益處，我欠過人，我離開過。請你記得，保羅講阿尼西謀的過去只用了一個詞，就接上如今。在你敲門以前，已經有一位替你簽好了擔保。"],["p","受傷型的心，也許曾經被家人、被老闆，甚至被教會裡的人虧負過，還被催著趕快原諒。那些話本來就不是腓利門書的意思。饒恕不等於和好，也不等於當作沒發生。如果那個人還在傷害你，請先求安全，找一位信得過的人陪你，必要時尋求專業協助。那位扛帳的主，看見你的帳。"],["d",["曾經虧負我的人回來了，教會也勸我接納他，可是我還沒準備好，怎麼辦？","先說清楚：你沒有準備好，不是罪。保羅要腓利門的善行「不是出於勉強，乃是出於甘心」（1:14），饒恕和和好是兩件事。饒恕是你在神面前把審判交出去，可以先從禱告開始，一次說一點；和好是兩個人的路，需要對方真實的悔改，需要有人把話說清楚，也需要你的安全。饒恕也不等於當作沒發生、不等於恢復原職：第十八節的帳是真的，有人要負責。如果對方曾經對你動手，或者今天仍讓你害怕，你不必見他，請找牧者或信得過的人陪你，必要時尋求專業協助。"]],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，每天早上讀 1:15–19 一次，讀到「都歸在我的帳上」就停下來，向主說出一筆你自己的帳，然後說：主，謝謝你把它記在你的名下。"],["p","第二，在你家、公司或教會裡，找一位常被當成一份人力的人：看護、清潔阿姨、派遣來的同事。星期五以前記住他的名字，當面叫他一次；如果你是雇主或主管，檢查一次他的工時、休假與薪水。"],["p","第三，寫下一個你一直在記帳的人，問自己：我願不願意把審判交給神？寫完不必馬上去找他。"],["p","第四，如果你曾經虧負過誰，寫一則短訊，不要求對方原諒，只是承認，並且問可以怎樣彌補；如果你們之間有過暴力，先不要聯絡，請先和牧者談。"],["p","第五，這個主日，在餐桌或線上小組裡，邀一個平常不會被邀的人。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：我的帳，主耶穌已經記在自己的名下；我不再用過去定義自己。"],["p","我宣告：按肉體說，也按主說，我身邊的每一個人都是有名字的人，不是一份人力。"],["p","我宣告：我的接納要出於甘心，不出於勉強；我把審判交給神，也看重每一個人的安全。"],["p","我宣告：願主耶穌基督的恩常在我的心裡，也在我們這個家裡。"],["d",["如果我自己就是那個虧負過人的阿尼西謀，第一步該怎麼走？","先回到第十八節：保羅沒有替阿尼西謀說過去就算了，他承認可能有虧負、有欠。所以第一步是誠實：在神面前把那一筆帳說出來，不辯解，也不縮小。第二步是承認，不是要求：寫一則短訊或一封信，說出你做了甚麼、對對方造成了甚麼，然後問我可以怎樣彌補；不要在訊息裡要對方原諒你，那是他的路。第三步是找一個保羅：一位牧者，陪你想清楚怎樣賠償、怎樣開口。如果你過去對對方有過暴力，請不要自己去找他，先和牧者談，尊重對方的安全和意願。在你敲門以前，主耶穌已經把你的帳記在他的名下。"]],["h","十、結語"],["p","這一課從一張借據開始。腓利門書最動人的，正是一個坐監的老人，替一個從前沒有益處的人，在欠條上簽了第二個名字。經文沒有告訴我們腓利門後來怎麼做，可是這封信被保存下來，一代一代地念，我們有理由盼望，那扇門開了。"],["p","這一課的焦點，不在腓利門夠不夠寬宏大量，也不在保羅的口才多好，焦點在那一位把我們的帳記在自己名下的主。所以這一章的次序是：先有恩，「願我們主耶穌基督的恩常在你的心裡」（1:25）；才有接納，「就收納他，如同收納我一樣」（1:17）；才看得見一個人「是親愛的兄弟」（1:16）。請你不要更佩服保羅，請你更愛那位說「歸在我的帳上」的主。"],["p","我們一起低頭禱告。天父，謝謝你，我們的帳沒有被假裝不存在，主耶穌把它記在自己的名下，在十字架上付清了。求你給站在門裡的人甘心，不是勉強；給站在門外的人勇氣，相信你給的如今。求你保護那些正在受傷害、被剝削、被催著回去的人，讓他們找到安全和幫助。也叫我們看見身邊每一位看護和移工的名字。願主耶穌基督的恩常在我們的心裡。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","小組不比誰最寬宏大量，是讓每一個人說出自己站在門的哪一邊、心裡那本帳簿上的一個名字，和這一週要拉開的一把椅子；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是心腸、欠條、兄弟。席上可能有人正被催著原諒或回去，有人在異鄉工作，也有人剛剛回來，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：講得出三個觀念：權柄放下、憑愛心求；一件東西被叫成兄弟，按肉體也按主；虧負的帳是真的，有人扛起來。"],["n","1. ★ 開場那句千萬不要替人作保，你家裡有人說過嗎？你或家人有沒有替人作保、被人連累的經驗？"],["n","2. ★★★ 請用自己的話說：保羅能命令，為甚麼選擇求？第十四節的甘心和勉強，差在哪裡？舉一個你生活裡看起來是請求、其實是命令的例子。"],["n","3. ★★ 第十六節說按肉體說，是按主說。為甚麼兩個都要？只有其中一個，會缺了甚麼？舉一個例子說說看。"],["n","4. ★★ 保羅說都歸在我的帳上，卻沒有說帳一筆勾銷。帳是真的、又有人扛，這兩件事為甚麼都重要？這使你想起主耶穌為你做的哪一件事？"],["m","帶領提醒：阿尼西謀是不是逃走的、保羅有沒有要求釋放，這些問題一句指向議題頁，不在組裡辯論；不點名組裡誰是腓利門、誰是阿尼西謀。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：讓每一個人說出自己站在門的哪一邊、心裡帳簿上的一個名字，並說出這一週要走的一小步。"],["t","【看】看見自己"],["n","5. ★★★ 在這封信的三個人裡，你最像哪一個：寫信的保羅、門裡的腓利門，還是門外的阿尼西謀？說出最近一件事，不必說細節。"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀 1:15–19 兩遍。哪一個詞讓你停下來：或者、永遠、兄弟、收納，還是我必償還？它對你說了甚麼？"],["t","【想】想通關卡"],["n","7. ★★★ 如果你是腓利門，開不了門卡在哪裡：損失太大、面子放不下、怕再被傷，還是不安全？如果你是阿尼西謀，不敢敲門又卡在哪裡？選一個說出來。"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說一句：我那一筆帳，主耶穌已經記在他的名下。下一位只回一句：歸在他的帳上了，不給建議。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你要走的一小步：哪一天、對哪一個人、做哪一件事。若那個人仍在傷害你，這一步就是找一位信得過的人談你的安全。"],["m","帶領提醒：這一化可能碰到家庭傷害、家暴、被剝削與長期無望感。不追問細節，不要求任何人原諒誰，也不要求任何人和好，不對正在流淚的人說「你要有信心」。若有人說出仍在暴力或危險之中，人身安全受威脅時先保護生命、依法求助；不在組裡處理，會後單獨關心，必要時協助尋求專業協助。第七題之後請留三十秒安靜。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：一個要叫出名字的人、一把要拉開的椅子、一位 920 的「2」、一位要講給他聽的朋友。"],["n","10. ★★ 說出一位常被當成一份人力的人，他叫甚麼名字？這一週星期幾，你要當面叫他的名字，並做哪一件具體的善待？"],["n","11. ★ 這一週你每天早上幾點、在哪裡讀 1:15–19？讀到都歸在我的帳上時，你要對主說的那一句話是甚麼？"],["n","12. ★★ 這個主日或下一次小組，你要邀哪一位平常不會被邀的人坐到你的桌邊？說出名字、時間和地點。"],["n","13. ★★★ 這是本課的 920 操練：找出你的那一個「2」，最難的那一個，也許是一位曾經虧負你的人，也許是一位你虧負過的人。當場說出來，可以說名字，也可以只用代稱（例如「一位家人」）。若是你虧負過的人，說出這一週哪一天、用甚麼方式向他承認，並分享這一課；若是曾經虧負你的人，這一週只為他禱告，分享留給安全而且你自己願意的時候。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，兩千年前有一個奴僕或許虧負了主人，一個坐監的老人寫信替他作保：都歸在我的帳上。第二句，那封信把一個被當成東西的人，叫成親愛的兄弟。第三句，我自己的帳，耶穌也替我扛了，所以我在學著開門。下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會多包容」這類答案。920 的那一位可以只用代稱；若是曾經虧負你的人，預設只為他禱告。涉及受傷、暴力或剝削時，不追問細節，不要求原諒、不要求和好，不對正在流淚的人說「你要有信心」，先顧安全，會後單獨關心，必要時協助尋求專業協助。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週要叫出名字的那一個人，和要拉開的那一把椅子。"],["p","然後彼此代禱，為三種人指名禱告：一位曾經虧負人、想回來卻不敢敲門的人；一位受了傷、卻被催著趕快原諒的人，求主保護他，給他時間與安全；一位在異鄉工作的移工或家庭看護，求主讓他被公平對待。"],["p","最後由組長慢慢讀一遍：「願我們主耶穌基督的恩常在你的心裡。阿們！」（1:25）"]]}}}</script>

   *

    onShare: null,         // fn(text, question)；沒給就用 navigator.share／剪貼簿
    shareTail: '',
    toast: null,
    onChange: null,
    labels: {
      hello: '陪你讀經的小幫手。',
      caveat: '我不是聖靈，也不能代替你的牧者——有疑問，還是要回到聖經，並找真實的屬靈同伴談。',
      placeholder: '問小智…', send: '送出', clear: '清空', close: '✕',
      thinking: '正在想…',
      more: '展開全文 ▾', less: '收合 ▴',
      speak: '🔊', save: '☆ 收藏', saved: '★ 已收藏', del: '刪除',
      share: '↗ 分享', card: '🖼 美圖', copied: '已複製，可以貼上分享',
      foldAll: '收合', foldedAll: '已收合所有長回答', foldNone: '目前沒有需要收合的回答',
      cont: '小智還在接著寫…', contAsk: '請從中斷的地方直接接著寫完，不要重複前面已經寫過的內容，也不要加開場白。',
      fuT: '追問：',
      didSave: '已加入收藏', didUnsave: '已取消收藏', didDel: '已刪除',
      offline: '目前沒有網路，小智暫時陪不了你。',
      slow: '小智等候得有點久，先暫停一下。',
      down: '小智暫時連不上線，請稍後再試。',
      comfort: '別忘了——最好的同伴是聖靈與神的話，你隨時可以直接向主傾心吐意。',
      empty: '小智一時想不出合適的話，但神的話永不落空。要不要換個方式再問一次？',
      exportTitle: '# 小智收藏', exportFile: 'sage-saved.md'
    }
  };

  var C = null;
  var XZ = { open: false, msgs: [], busy: false };

  function ext(a, b) { for (var k in b) if (b.hasOwnProperty(k)) a[k] = b[k]; return a; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function escA(s) {
    return String(s == null ? '' : s).replace(/'/g, '&#39;').replace(/"/g, '&quot;')
      .replace(/\n/g, ' ').slice(0, 300);
  }
  function L(k) { return (C && C.labels && C.labels[k]) || DEF.labels[k] || ''; }
  function toast(m) { if (C && C.toast) C.toast(m); }
  function saved() { return (C.store && C.store.get && C.store.get()) || []; }
  function keep() { if (C.store && C.store.save) C.store.save(); if (C.onChange) C.onChange(); }
  function link(html) {
    if (!C.linkify) return html;
    try { return C.linkify(html); } catch (e) { return html; }
  }
  function nl(text) { return esc(text).split('\n').join('<br>'); }
  function body(text) {
    if (C.rich !== false && typeof NAR321 !== 'undefined' && NAR321.html) {
      try { return NAR321.html(text); } catch (e) {}
    }
    return nl(text);
  }
  function toSpeech(text) {
    var t = String(text == null ? '' : text);
    if (typeof NAR321 !== 'undefined' && NAR321.speech) {
      try { t = NAR321.speech(t); } catch (e) {}
    }
    if (C.speechClean) { try { t = C.speechClean(t); } catch (e) {} }
    return t;
  }
  function plainOf(text) {
    if (typeof NAR321 !== 'undefined' && NAR321.text) {
      try { return NAR321.text(text); } catch (e) {}
    }
    return String(text || '').replace(/^#{1,6}\s+/gm, '').replace(/\*\*([^*]+)\*\*/g, '$1')
      .replace(/^>\s?/gm, '').replace(/^\s*[-*]\s+/gm, '・').replace(/\|/g, ' ');
  }
  function isLong(m) {
    return !!(m && m.role === 'assistant' && !m.cont && String(m.text || '').length > C.longChars);
  }
  function qOf(i) {
    for (var p = i - 1; p >= 0; p--) if (XZ.msgs[p].role === 'user') return XZ.msgs[p].text;
    return '';
  }

  /* ── 送出與接收 ───────────────────────────────────────────────── */

  function open() { XZ.open = true; draw(); }
  function close() {
    XZ.open = false;
    var el = document.getElementById(C.el);
    if (el) el.className = el.className.replace(/\bon\b/g, '').replace(/\s+/g, ' ');
  }
  function push(role, text, extra) {
    var m = { role: role, text: text };
    if (extra) ext(m, extra);
    XZ.msgs.push(m);
    return m;
  }

  function send(text) {
    var t = text;
    if (t == null) {
      var i = document.getElementById('xzin');
      t = (i && i.value) || '';
      if (i) i.value = '';
    }
    t = String(t).replace(/^\s+|\s+$/g, '');
    if (!t || XZ.busy) return;
    XZ.open = true;
    push('user', t);
    draw(); call();
  }
  function pick(q) { send(q); }

  function ask(quote, note, tmpl) {
    XZ.open = true;
    var q = (tmpl || C.askTemplate || function (s, n) {
      return '我讀到這一句：\n「' + s + '」\n' + (n ? n + '\n' : '') +
             '請幫我更明白這句話，並幫助我活出來。';
    })(String(quote || '').slice(0, 300), note || '');
    if (XZ.busy) { draw(); return; }
    push('user', q);
    draw(); call();
  }

  /* 切換回答長度：把最後一組問答拿掉，用同一個問題重新問一次 */
  function reask() {
    if (XZ.busy) return false;
    var ui = -1, i;
    for (i = XZ.msgs.length - 1; i >= 0; i--) if (XZ.msgs[i].role === 'user') { ui = i; break; }
    if (ui < 0 || ui === XZ.msgs.length - 1) return false;
    var q = XZ.msgs[ui].text;
    XZ.msgs.splice(ui);
    push('user', q);
    draw(); call();
    return true;
  }

  function truncated(text, stop) {
    if (stop === 'max_tokens' || stop === 'length') return 'sure';
    if (stop) return '';
    var x = String(text || '').replace(/\s+$/, '');
    if (x.length < 280) return '';
    if (/[。！？.!?」』）)”"…~|]$/.test(x) || /(阿們|阿门|amen\.?)$/i.test(x)) return '';
    return 'guess';
  }
  function join(acc, piece) {
    piece = String(piece || '').replace(/^\s*(好的|好|OK|Okay|Sure)[，,。.!！]?\s*/i, '');
    var max = Math.min(40, acc.length, piece.length), k;
    for (k = max; k >= 4; k--) {
      if (acc.slice(-k) === piece.slice(0, k)) { piece = piece.slice(k); break; }
    }
    var head = piece.replace(/^\s+/, '');
    if (/^(#{1,6} |>|---)/.test(head)) return acc.replace(/\s+$/, '') + '\n\n' + head;
    if (/^([-*] |\d+[.)] |\|)/.test(head)) return acc.replace(/\s+$/, '') + '\n' + head;
    return acc + piece;
  }

  function post(sys, msgs, cb) {
    var ctrl = null, timer = null, done = false;
    try { if (window.AbortController) ctrl = new AbortController(); } catch (e) {}
    if (ctrl) timer = setTimeout(function () { try { ctrl.abort(); } catch (e) {} }, C.timeoutMs);
    function fin(out, why, stop) {
      if (done) return; done = true;
      if (timer) clearTimeout(timer);
      cb(out, why, stop);
    }
    fetch(C.worker, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      signal: ctrl ? ctrl.signal : undefined,
      body: JSON.stringify({ model: C.model, max_tokens: C.maxTokens, system: sys, messages: msgs })
    }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function (data) {
      var t = '';
      if (data && data.content && data.content.length) {
        t = data.content.filter(function (b) { return !b.type || b.type === 'text'; })
          .map(function (b) { return b.text || ''; }).join('\n');
      } else if (data) {
        t = data.reply || data.text || data.message ||
          (data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message.content : '') || '';
      }
      var stop = (data && (data.stop_reason || data.finish_reason ||
        (data.choices && data.choices[0] && data.choices[0].finish_reason))) || '';
      fin(String(t).replace(/^\s+|\s+$/g, ''), '', stop);
    })['catch'](function (e) {
      fin('', (e && e.name === 'AbortError') ? 'slow' : 'down', '');
    });
  }

  function foldOld() {
    var last = -1, i;
    for (i = 0; i < XZ.msgs.length; i++) if (XZ.msgs[i].role === 'assistant') last = i;
    for (i = 0; i < XZ.msgs.length; i++) {
      var m = XZ.msgs[i];
      if (isLong(m)) m.col = (i !== last);
    }
  }

  function call() {
    XZ.busy = true; draw();
    var off = false;
    try { off = (navigator.onLine === false); } catch (e) {}
    if (off) {
      push('assistant', L('offline') + '\n' + L('comfort'));
      XZ.busy = false; return draw();
    }
    var hist = [], i, src = XZ.msgs.slice(-C.history);
    for (i = 0; i < src.length; i++) {
      if (src[i].cont) continue;
      hist.push({ role: src[i].role, content: src[i].text });
    }
    while (hist.length && hist[0].role !== 'user') hist.shift();
    var sys = (C.system ? C.system() : '');
    if (C.sysExtra) { try { sys += C.sysExtra() || ''; } catch (e) {} }
    var m = null, n = 0;

    function finish(acc, why) {
      if (m) XZ.msgs.splice(XZ.msgs.indexOf(m), 1);
      if (acc) push('assistant', acc, { ok: true });
      else push('assistant', (why === 'slow' ? L('slow') : (why ? L('down') : L('empty'))) + '\n' + L('comfort'));
      XZ.busy = false;
      foldOld();
      draw();
    }
    function step(acc, why, stop) {
      if (!acc) return finish('', why);
      var tr = truncated(acc, stop);
      if (!tr || n >= (tr === 'sure' ? C.maxCont : 1)) return finish(acc, '');
      n++;
      if (!m) m = push('assistant', acc, { cont: true }); else m.text = acc;
      draw();
      post(sys, hist.concat([{ role: 'assistant', content: acc }, { role: 'user', content: L('contAsk') }]),
        function (out, w2, st2) {
          if (!out) return finish(acc, '');
          step(join(acc, out), '', st2);
        });
    }
    post(sys, hist, function (out, why, stop) { step(out, why, stop); });
  }

  /* ── 收藏、刪除、分享 ─────────────────────────────────────────── */

  function savedIdx(i) {
    var a = XZ.msgs[i];
    if (!a) return -1;
    var arr = saved(), j;
    for (j = 0; j < arr.length; j++) if (arr[j].a === a.text) return j;
    return -1;
  }
  function star(i) {
    var a = XZ.msgs[i];
    if (!a) return;
    var arr = saved(), k = savedIdx(i);
    if (k >= 0) {
      arr.splice(k, 1); keep(); draw();
      return toast(L('didUnsave'));
    }
    arr.unshift({
      q: qOf(i), a: a.text,
      ch: (C.chapter ? C.chapter() : 0) || 0,
      at: (new Date()).getTime()
    });
    keep(); draw(); toast(L('didSave'));
  }
  function drop(i) {
    XZ.msgs.splice(i, 1);
    if (i > 0 && XZ.msgs[i - 1] && XZ.msgs[i - 1].role === 'user') XZ.msgs.splice(i - 1, 1);
    draw(); toast(L('didDel'));
  }
  function unstar(i) {
    var arr = saved();
    arr.splice(i, 1); keep();
    toast(L('didDel'));
  }
  function share(i) {
    var m = XZ.msgs[i]; if (!m) return;
    var q = qOf(i);
    if (C.onShare) return C.onShare(m.text, q);
    var t = (q ? q + '\n\n' : '') + plainOf(m.text) + (C.shareTail ? '\n\n' + C.shareTail : '');
    try {
      if (navigator.share) { navigator.share({ text: t })['catch'](function () {}); return; }
    } catch (e) {}
    try {
      navigator.clipboard.writeText(t).then(function () { toast(L('copied')); }, function () {});
    } catch (e) {}
  }
  function card(i) {
    var m = XZ.msgs[i]; if (!m || !C.onCard) return;
    C.onCard(m.text, qOf(i));
  }
  function exportMd(opt) {
    opt = opt || {};
    var arr = saved(), t = (opt.title || L('exportTitle')) + '\n\n', i;
    for (i = 0; i < arr.length; i++) {
      var x = arr[i];
      t += '## ' + new Date(x.at).toLocaleDateString() +
           (x.ch ? '　' + (opt.chapterLabel ? opt.chapterLabel(x.ch) : '第 ' + x.ch + ' 章') : '') + '\n\n';
      if (x.q) t += '**Q:** ' + x.q + '\n\n';
      t += x.a + '\n\n---\n\n';
    }
    try {
      var b = new Blob([t], { type: 'text/markdown' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = opt.file || L('exportFile');
      a.click();
    } catch (e) {}
    return t;
  }

  /* ── 面板 ─────────────────────────────────────────────────────── */

  function fuHtml(m, i) {
    if (!C.followups || m.role !== 'assistant' || !m.ok || m.cont || XZ.busy || i !== XZ.msgs.length - 1) return '';
    var l = [];
    try { l = C.followups() || []; } catch (e) { l = []; }
    if (!l.length) return '';
    var h = '<div class="xzfu"><span class="xzfut">' + esc(L('fuT')) + '</span>', k;
    for (k = 0; k < l.length; k++) {
      h += '<button class="xzfuc" onclick="SAGE321.pick(this.getAttribute(\'data-q\'))" data-q="' +
        esc(l[k][2]) + '">' + esc(l[k][0] + ' ' + l[k][1]) + '</button>';
    }
    return h + '</div>';
  }

  function bubble(m, i) {
    if (m.role !== 'assistant') {
      return '<div class="xzm user">' + nl(m.text) + '</div>';
    }
    if (m.cont) {
      return '<div class="xzm assistant" id="xzm' + i + '"><div class="xzt">' + link(body(m.text)) + '</div>' +
        '<div class="xzcont">' + esc(L('cont')) + '</div></div>';
    }
    var long = isLong(m);
    var col = long && m.col !== false;
    var sav = savedIdx(i) >= 0;
    return '<div class="xzm assistant" id="xzm' + i + '">' +
      '<div class="xzt ' + (col ? 'clip' : '') + '">' + link(body(m.text)) + '</div>' +
      (long ? '<button class="xzmore" onclick="SAGE321.fold(' + i + ')">' +
        esc(col ? L('more') : L('less')) + '</button>' : '') +
      (m.ok ? '<div class="xzact">' +
      (C.onSpeak ? '<button onclick="SAGE321.speak(' + i + ')">' + esc(L('speak')) + '</button>' : '') +
      '<button class="' + (sav ? 'on' : '') + '" onclick="SAGE321.star(' + i + ')">' +
      esc(sav ? L('saved') : L('save')) + '</button>' +
      '<button onclick="SAGE321.share(' + i + ')">' + esc(L('share')) + '</button>' +
      (C.onCard ? '<button onclick="SAGE321.card(' + i + ')">' + esc(L('card')) + '</button>' : '') +
      '<button onclick="SAGE321.drop(' + i + ')">' + esc(L('del')) + '</button>' +
      '</div>' : '<div class="xzact"><button onclick="SAGE321.drop(' + i + ')">' + esc(L('del')) + '</button></div>') +
      fuHtml(m, i) + '</div>';
  }

  /* 只改這一則——不重畫整個對話，正在朗讀的那一則才不會斷 */
  function fold(i) {
    var m = XZ.msgs[i];
    if (!m || !isLong(m)) return;
    m.col = (m.col === false);
    var el = document.getElementById('xzm' + i);
    if (!el) return draw();
    var t = el.querySelector('.xzt'), b = el.querySelector('.xzmore');
    if (t) t.className = 'xzt' + (m.col ? ' clip' : '');
    if (b) b.textContent = m.col ? L('more') : L('less');
    if (m.col) { try { el.scrollIntoView({ block: 'nearest' }); } catch (e) {} }
  }
  function foldAll() {
    var n = 0, i;
    for (i = 0; i < XZ.msgs.length; i++) if (isLong(XZ.msgs[i])) { XZ.msgs[i].col = true; n++; }
    if (!n) return toast(L('foldNone'));
    draw(true);
    toast(L('foldedAll'));
  }
  function speak(i) {
    var m = XZ.msgs[i];
    if (m && C.onSpeak) C.onSpeak(toSpeech(m.text), C.name);
  }

  function draw(keepScroll) {
    var el = document.getElementById(C.el);
    if (!el) {
      el = document.createElement('div');
      el.id = C.el; el.className = 'xz';
      document.body.appendChild(el);
    }
    el.className = ('xz ' + (XZ.open ? 'on' : '')).replace(/\s+$/, '');
    if (!XZ.open) return;
    var oldB = document.getElementById('xzb'), oldTop = oldB ? oldB.scrollTop : 0;
    var inp = document.getElementById('xzin'), typed = inp ? inp.value : '';

    var bd = '', i;
    if (XZ.msgs.length) {
      for (i = 0; i < XZ.msgs.length; i++) bd += bubble(XZ.msgs[i], i);
    } else {
      bd = '<div class="xzhi"><b>' + esc(L('iam') || ('我是' + C.name + '。')) + '</b><br>' +
        esc(C.hello || L('hello')) + '<br>' +
        '<span class="xs muted">' + esc(L('caveat')) + '</span></div>';
    }
    var quicks = '';
    if (!XZ.msgs.length && C.quicks) {
      var qs = [];
      try { qs = C.quicks() || []; } catch (e) { qs = []; }
      if (qs.length) {
        quicks = '<div class="xzq">';
        for (i = 0; i < qs.length; i++) {
          quicks += '<button onclick="SAGE321.pick(this.getAttribute(\'data-q\'))" data-q="' + esc(qs[i]) + '">' +
            esc(qs[i]) + '</button>';
        }
        quicks += '</div>';
      }
    }
    var ctl = '';
    if (C.controls) { try { ctl = C.controls() || ''; } catch (e) { ctl = ''; } }
    var anyLong = false;
    for (i = 0; i < XZ.msgs.length; i++) if (isLong(XZ.msgs[i])) { anyLong = true; break; }

    el.innerHTML =
      '<div class="xzmask" onclick="SAGE321.close()"></div>' +
      '<div class="xzcard">' +
      '<div class="xzh"><b>' + esc(C.emoji + ' ' + C.name) + '</b>' +
      '<span class="xs muted" style="flex:1">' + esc(C.tagline) + '</span>' +
      (anyLong ? '<button class="ico" onclick="SAGE321.foldAll()">' + esc(L('foldAll')) + '</button>' : '') +
      (XZ.msgs.length ? '<button class="ico" onclick="SAGE321.clear()">' + esc(L('clear')) + '</button>' : '') +
      '<button class="ico" onclick="SAGE321.close()">' + esc(L('close')) + '</button></div>' +
      (ctl ? '<div class="xzctl">' + ctl + '</div>' : '') +
      '<div class="xzb" id="xzb">' + bd + quicks +
      (XZ.busy && !(XZ.msgs.length && XZ.msgs[XZ.msgs.length - 1].cont)
        ? '<div class="xzm assistant xzwait">' + esc(C.name + L('thinking')) + '</div>' : '') +
      '</div>' +
      '<div class="xzf">' +
      '<input id="xzin" placeholder="' + esc(L('placeholder')) + '"' +
      ' onkeydown="if(event.key===\'Enter\'&&!event.isComposing)SAGE321.send()">' +
      '<button class="btn pri" onclick="SAGE321.send()">' + esc(L('send')) + '</button>' +
      '</div></div>';
    var ni = document.getElementById('xzin');
    if (ni && typed) ni.value = typed;
    setTimeout(function () {
      var b = document.getElementById('xzb');
      if (!b) return;
      b.scrollTop = keepScroll ? oldTop : b.scrollHeight;
    }, 30);
  }

  function clear() { XZ.msgs = []; draw(); }

  function init(cfg) {
    C = ext(ext({}, DEF), cfg || {});
    C.labels = ext(ext({}, DEF.labels), (cfg && cfg.labels) || {});
    if (!C.worker) throw new Error('SAGE321.init 需要 worker');
    return API;
  }

  var API = {
    init: init,
    open: open, close: close, clear: clear,
    ask: ask, send: send, pick: pick, reask: reask,
    star: star, drop: drop, unstar: unstar, savedIdx: savedIdx,
    share: share, card: card,
    fold: fold, foldAll: foldAll, speak: speak, draw: draw,
    exportMd: exportMd,
    saved: saved,
    msgs: function () { return XZ.msgs; },
    isOpen: function () { return !!XZ.open; },
    speechOf: toSpeech,
    plainOf: plainOf,
    isBusy: function () { return !!XZ.busy; },
    linkify: link,
    _truncated: truncated, _join: join,
    version: '2.0.0'
  };
  return API;
})();

   ② 讀經樂：小智照創世記各章出題（測驗＋猜謎）、錯題本、最佳成績

var GX = (function () {

  const GXD = {"keys": ["adult", "teen", "kid", "seeker", "elder", "single_parent", "single", "parent", "couple", "pastor"], "icon": {"adult": "🧑", "teen": "🧒", "kid": "🧸", "seeker": "🌱", "elder": "👴", "single_parent": "👩‍👧", "single": "🙋", "parent": "👨‍👩‍👧", "couple": "💑", "pastor": "⛪"}, "names": {"adult": "成人", "teen": "青少年", "kid": "兒童", "seeker": "慕道友", "elder": "長輩", "single_parent": "單親", "single": "單身", "parent": "父母", "couple": "夫妻", "pastor": "牧者"}, "hints": {"adult": "有深度，貼近工作、家庭與關係", "teen": "幽默風趣、不說教，用你的世界來比喻", "kid": "非常簡單好懂，像在聽故事", "seeker": "還沒信主也聽得懂，不說教，給實際的幫助", "elder": "尊敬溫和、慢慢說，句子清楚好懂", "single_parent": "先接住你的辛苦，給做得到的小步驟與盼望", "single": "真誠平等，不催婚，談身分、等待與使命", "parent": "貼近養兒育女的日常：溝通、管教、陪伴與禱告", "couple": "夫妻同行：溝通、饒恕、同心與一起禱告", "pastor": "同工口吻：牧養、講道預備、團隊與不倦怠"}, "lenNames": {"brief": "簡要", "mid": "適中", "full": "詳細"}, "len": {"brief": " 回答長度：簡要。整段回答控制在 3～5 句話（約 150 字內）：直接給核心答案、一句關鍵經文或一個比喻，最後一句禱告或一個小步驟。不用表格、不列長清單。", "full": " 回答長度：詳細。請完整、有條理地回答（約 800～1200 字）：說明經文脈絡、關鍵字詞的意思、相關經文對照、清楚的321應用、這星期可以操練的具體步驟，最後以禱告結束。可用簡短小標題。"}, "aud": {"adult": {"sys": " 回答對象：成年人。請用成熟、沉穩而溫暖的口吻，可以有適度的深度：點出經文脈絡與關鍵字詞的意思，連結工作、婚姻、教養、人際與屬靈爭戰，最後帶出一個這星期就能操練的具體步驟。", "write": "\n讀者是成年人：口吻成熟、溫暖、真誠。", "style": "風格：沉穩清楚；其中一兩題帶出生命應用。", "res": ["再讀一遍這章，細細品味，下次會更好。", "不錯！這章的信息已經進到你裡面了。", "太棒了！經文的話已經住在你心裡。"], "q": ["這段經文讓我看見神是怎樣的一位神？", "這段經文照出我裡面什麼樣的舊人有己？", "若讓耶穌在這件事上作王，我會怎麼做？", "這段經文中，耶穌給我看見什麼樣的榜樣？", "聖靈要藉這段話引導我今天走哪一步？", "這裡的人為什麼會失敗？根源是驕傲還是恐懼？", "這段經文如何幫助我操練無己的生命？", "我可以把這段經文用在與誰的關係上？", "這段經文與主禱文「願你的國降臨」有什麼關聯？", "請用一個比喻幫我明白這段經文的核心。"], "fu": [["💍", "婚姻", "請針對你剛才的回答，說明怎麼把它應用在夫妻關係與婚姻裡，並給我一個這個星期可以做的具體小步驟。"], ["👨‍👩‍👧", "家庭", "請針對你剛才的回答，說明怎麼把它應用在家庭與教養孩子（或與父母相處）上，並給我一個這個星期可以做的具體小步驟。"], ["💼", "職場", "請針對你剛才的回答，說明怎麼把它應用在工作與職場上（同事、主管、壓力、誠信），並給我一個這個星期可以做的具體小步驟。"], ["🏡", "日常", "請針對你剛才的回答，說明怎麼把它應用在日常生活的小事上（時間、金錢、習慣），並給我一個這個星期可以做的具體小步驟。"], ["💭", "內心", "請針對你剛才的回答，說明怎麼把它應用在面對內心的情緒與軟弱上（焦慮、憤怒、驕傲），並給我一個這個星期可以做的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段簡短、真誠的禱告，讓我可以拿來禱告。"]]}, "teen": {"sys": " 回答對象：青少年（約12–18歲）。請用幽默風趣、輕鬆有梗的口吻，像一位很酷的大哥哥大姊姊在聊天，不說教、不居高臨下。多用他們熟悉的世界來比喻：手機剩1%電量、遊戲過關、追劇、社群按讚與追蹤數、考試、同儕壓力、打球。可以適度用一點流行說法和小玩笑，但絕不拿聖經、神或耶穌開玩笑，也不輕看罪與傷痛；笑完一定要回到經文的真理上。答案精簡，重點先講，段落要短，結尾給一個今天就能試的小挑戰。若他提到被欺負、受傷害或想傷害自己，要溫柔回應，並鼓勵他馬上告訴信任的大人（爸媽、老師、牧者）。", "write": "\n讀者是青少年：口氣輕鬆幽默、像朋友聊天，可以有一點梗，但不說教、不輕浮、不拿神和聖經開玩笑；不要用表情符號。", "style": "風格：題目與解析的口氣幽默風趣、輕鬆有梗（像在跟朋友鬥嘴），選項可以有趣，但正確答案必須明確、不含糊，絕不拿神與聖經開玩笑。", "res": ["哎呀，這章有點滑溜～再讀一次，下一局你就是王者！", "不賴喔！再練幾次就可以去嘲笑你的朋友了（開玩笑的）。", "滿分級的操作！聖經達人就是你！"], "q": ["這段經文跟我的日常（學校、朋友、手機）有什麼關係？", "如果這段經文是神傳給我的一則訊息，它想說什麼？", "朋友都那樣做，我不跟會不會很怪？經文怎麼看？", "用遊戲或電影來比喻這段經文，可以嗎？", "這段經文有什麼讓人意外、很少人知道的地方？", "考試壓力好大，這段經文能給我什麼力量？", "我很難原諒一個人，這段經文能幫我什麼？", "神真的看得到我嗎？我哪裡值得被愛？"], "fu": [["🏫", "學校", "用你剛才講的，幫我想想怎麼用在學校與課業上，給我一個今天就能試的小招。"], ["🤝", "朋友", "用你剛才講的，幫我想想怎麼用在朋友相處上，給我一個今天就能試的小招。"], ["🏠", "家人", "用你剛才講的，幫我想想怎麼用在跟爸媽、家人的相處上，給我一個今天就能試的小招。"], ["📱", "手機網路", "用你剛才講的，幫我想想怎麼用在手機、網路與社群上，給我一個今天就能試的小招。"], ["💭", "壓力", "用你剛才講的，幫我想想怎麼用在壓力和情緒上，給我一個今天就能試的小招。"], ["🌟", "未來", "用你剛才講的，幫我想想怎麼用在未來和夢想上，給我一個今天就能試的小招。"], ["🎯", "今天挑戰", "請給我一個跟剛才有關、今天就能完成的小挑戰，要具體、有點好玩。"]]}, "kid": {"sys": " 回答對象：兒童（約5–11歲）。請用非常淺顯易懂的話，像說故事給小朋友聽。句子要短，一句只講一件事；用具體的小事當比喻（種子、小熊、手牽手、捉迷藏、生日蛋糕）；不用艱深的神學名詞，必須用時馬上用一句話解釋。語氣親切活潑，可以說「你知道嗎？」「一起想一想」，並適度加幾個可愛的表情符號。整個回答控制在五到七句短句。不要用表格；只引用一節簡短的經文。遇到暴力或可怕的經文，用孩子能承受的方式溫柔帶過，不渲染細節。最後用一句小禱告或一個孩子答得出來的簡單問題作結。若孩子說有人傷害他、或他很難過，要親切回應，並告訴他馬上跟信任的大人（爸爸媽媽、老師、牧者）說。", "write": "\n讀者是小朋友：用非常簡單的字詞和短句，像說故事，一句只講一件事，不用艱深名詞；不要用表情符號。", "style": "風格：給5到11歲的小朋友，字詞非常簡單、句子很短，像在說故事；選項要短；解析一句話、親切，最多加一個可愛的表情符號。", "res": ["沒關係！我們再讀一次故事，再玩一次就會了！🌱", "好棒喔！你記得好多！🌟", "哇！太厲害了！神一定很高興！🎉"], "q": ["這段故事在說什麼？請講給我聽。", "神在這個故事裡做了什麼事？", "耶穌愛我嗎？我怎麼知道？", "這個故事裡誰最勇敢？為什麼？", "我可以怎樣學習故事裡的人？", "請教我一句可以背起來的短經文。", "我跟好朋友吵架了，耶穌會怎麼做？", "可以教我做一個小禱告嗎？"], "fu": [["🏠", "在家", "剛剛講的，我在家裡可以怎麼做呢？請用簡單的話告訴我。"], ["🏫", "在學校", "剛剛講的，我在學校可以怎麼做呢？請用簡單的話告訴我。"], ["🤝", "跟朋友", "剛剛講的，我在跟好朋友相處時可以怎麼做呢？請用簡單的話告訴我。"], ["🙏", "小禱告", "請教我一個很短的小禱告，我可以跟耶穌說。"], ["📖", "小故事", "可以再講一個跟這個有關的小故事給我聽嗎？"]]}, "seeker": {"sys": " 回答對象：慕道友（還沒有信主、正在了解基督信仰的朋友）。請完全站在他的立場和角度：他可能沒讀過聖經、不懂教會用語，心裡有疑問，甚至有些保留。①先從他真實的生活處境、感受或疑問切入，再帶到經文，讓他覺得「這跟我有關」。②用最平常的話說；321理念只是你心裡的方向，不要在回答裡出現「無己、作王、得勝、屬靈」這類內部用語，也不用教會與神學術語；一定要提到的詞（如恩典、罪、救恩），馬上用生活的說法解釋。③誠實、尊重、不說教、不施壓、不要求他現在就相信，也不論斷他；有疑問或質疑很正常，先認真承認那個問題的份量，再誠實回答。④清楚說出聖經在這件事上的真理（神是怎樣的神、耶穌為我們做了什麼），用故事、比喻和日常例子，讓他聽得懂、記得住。⑤一定要有實際有用的幫助：給一兩個他這個星期就能自己試試看的小步驟（一個觀察、一個提問、一個簡單的行動）。⑥合適時，可以溫和邀請他繼續探索（例如讀一小段、問一個問題），不要硬把話題轉到決志。⑦不要說「我們基督徒都知道」這類預設他已經信的話。引用經文用和合本，並用白話解釋它的意思。若寫到禱告，只當作「若你願意，可以這樣對神說」的邀請，不強迫。整個回答要簡明、段落要短。", "write": "\n讀者是還沒信主的朋友：用生活化、親切、不說教的話，不用教會術語，不預設他已經信；不要用表情符號。", "style": "風格：給還沒信主、沒讀過聖經的人。題目要把背景交代清楚（人物、事件的名字直接寫出來），不假設他懂聖經或教會用語；用字平實，解析用一句白話說明這件事對一般人有什麼意義。", "res": ["沒關係，剛接觸這些內容本來就不容易，再看一遍會更清楚。", "不錯喔！你已經抓到這一章的重點了。", "太厲害了！你對這一章的內容很清楚。"], "q": ["這段話跟我現在的生活有什麼關係？", "我還不是基督徒，這段話對我有什麼意義？", "神真的存在嗎？有什麼理由可以相信？", "聖經為什麼說每個人都需要耶穌？", "我壓力很大，聖經能給我什麼實際的幫助？", "這段話裡的「罪」是什麼意思？跟我有關嗎？", "基督徒常說的「恩典」，用白話說是什麼？", "如果我想多了解，可以從哪裡開始？"], "fu": [["🤝", "人際", "剛才說的放在人際關係裡（家人、朋友、同事），對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["💍", "婚姻家庭", "剛才說的放在婚姻與家庭裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["💼", "工作", "剛才說的放在工作與職場裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["😟", "壓力焦慮", "剛才說的放在壓力與焦慮裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["🌍", "人生意義", "剛才說的放在尋找人生的意義與方向裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["❓", "我的疑問", "我心裡還有疑問，請誠實告訴我：信耶穌對一個人的生活到底有什麼實際的幫助？也請告訴我可以怎麼自己去查證。"], ["🌱", "下一步", "如果我想進一步了解，下一步可以做什麼？請給我一兩個不會有壓力的建議。"]]}, "elder": {"sys": " 回答對象：長輩（約65歲以上）。請用尊敬、溫和、慢慢說的口吻，像晚輩敬重地陪長輩讀經；句子清楚、不拐彎，不用網路用語和英文縮寫；比喻取自一生的閱歷（田地、家人、歲月、病痛、孫子、老街坊）。重點先講，分成短段落，不要太長。肯定他們一生走過的路與在主裡的忠心，不說教、不指責、不用「你應該」。可以談健康與軟弱、孤單、放下與交託、把信仰傳給下一代、永恆的盼望與感恩。結尾給一件簡單、容易做到的小事（一句禱告、打電話問候家人、數算一件感謝）。若提到身體不適、孤單或失去親人，要先溫柔安慰，並鼓勵他和家人、教會關懷同工聯絡。", "write": "\n讀者是長輩：用語尊敬、溫和、清楚好懂，不用網路用語；不要用表情符號。", "style": "風格：給長輩，字詞平實、句子清楚，題目不要繞、不要太冷僻，選項簡短；解析用一句溫和的話。", "res": ["沒關係，慢慢來，再讀一遍會更清楚。", "很好！這一章的話您記得不少。", "太好了！神的話已經住在您心裡。"], "q": ["這段經文用最簡單的話，是在說什麼？", "這段經文對年紀大的人有什麼安慰？", "身體漸漸衰弱了，神怎麼看顧我？", "我常常覺得孤單，這段經文能給我什麼？", "我該怎麼把信仰傳給兒孫？", "有些事放不下，這段經文怎麼教我交託？", "我老了，還能為神做什麼？", "請幫我寫一段簡短的禱告，我想念給主聽。"], "fu": [["🩺", "健康", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在身體的軟弱與健康，並給我一個這個星期做得到的具體小步驟。"], ["🤍", "孤單", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在孤單與思念，並給我一個這個星期做得到的具體小步驟。"], ["👨‍👩‍👧‍👦", "兒孫", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在和兒孫、家人的關係，並給我一個這個星期做得到的具體小步驟。"], ["🕊️", "交託", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在放下心中的牽掛、交託給主，並給我一個這個星期做得到的具體小步驟。"], ["🌅", "盼望", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在永恆的盼望與感恩，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，用簡單的話寫成一段短短的禱告，讓我可以慢慢念給主聽。"]]}, "single_parent": {"sys": " 回答對象：單親爸爸或媽媽（一個人撐起一個家）。請先接住他的辛苦：他常常很累、有愧疚、有孤單，也有經濟、時間與教養的壓力。口吻溫暖、接納、不評斷，不追問過去的原因，不說「你應該再找個伴」，也不把單親說成缺憾。引用神的心意：神是孤兒的父、寡婦的伸冤者（詩篇68:5），祂與我們同在。再給盼望與實際：每一個小步驟都要在忙碌中做得到（五分鐘禱告、跟孩子的一個小儀式、開口向弟兄姊妹求助）。內容簡短、段落要短。結尾給一個這個星期做得到的小步驟。若他提到被暴力對待、疲憊到撐不下去或想傷害自己，要溫柔回應，並鼓勵他立刻聯絡信任的人、教會同工或專業協助。", "write": "\n讀者是單親爸媽：口吻溫暖、接納、不評斷，肯定他的辛苦；不要用表情符號。", "style": "風格：給單親爸媽，題目貼近日常的忙碌、教養與盼望；口氣溫暖，解析一句話帶出安慰。", "res": ["沒關係，您已經很努力了，有空再讀一遍就好。", "不錯！在這麼忙的日子裡還記得這麼多。", "太棒了！神的話正在托住您。"], "q": ["這段經文對一個人撐起一個家的我，有什麼安慰？", "我常常覺得累，也覺得對孩子有虧欠，神怎麼看？", "神怎麼看顧孤兒和寡婦？這跟我有什麼關係？", "經濟壓力很大，這段經文能給我什麼？", "孩子在頂嘴、情緒很大，我該怎麼辦？", "我不知道怎麼跟孩子說爸爸（或媽媽）不在身邊的事。", "我真的很孤單，可以怎麼向教會或弟兄姊妹開口求助？", "請幫我寫一段五分鐘內能禱告完的短禱告。"], "fu": [["😮‍💨", "疲累", "請針對你剛才的回答，說明怎麼把它用在一個人撐家的疲累與內疚，並給我一個這個星期做得到的具體小步驟。"], ["👧", "孩子", "請針對你剛才的回答，說明怎麼把它用在陪伴孩子與教養，並給我一個這個星期做得到的具體小步驟。"], ["💰", "經濟", "請針對你剛才的回答，說明怎麼把它用在經濟與時間的壓力，並給我一個這個星期做得到的具體小步驟。"], ["🤝", "求助", "請針對你剛才的回答，說明怎麼把它用在向弟兄姊妹或教會開口求助，並給我一個這個星期做得到的具體小步驟。"], ["🌤️", "盼望", "請針對你剛才的回答，說明怎麼把它用在在這個階段看見神的同在與盼望，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段我在忙碌中五分鐘內就能禱告完的短禱告。"]]}, "single": {"sys": " 回答對象：單身的人（可能未婚、離婚、喪偶，或正在等候；不要預設他想結婚或不想結婚）。請不要把單身說成缺憾、「預備期」或「還沒到的人生」，也不要用催婚的口氣。談在基督裡的身分已經完整、被愛；談孤單時怎麼與神、與朋友、與團契連結；談時間、金錢與恩賜的運用與使命；談等待中的信靠；談感情與婚姻的智慧，以及在情感與身體上的聖潔，態度要尊重、不論斷。口吻真誠、平等、輕鬆。結尾給一個這個星期可以做的小步驟。若他提到孤單到想傷害自己，要溫柔回應並鼓勵他立刻聯絡信任的人或專業協助。", "write": "\n讀者是單身朋友：口吻真誠、平等、輕鬆，不催婚、不把單身說成缺憾；不要用表情符號。", "style": "風格：給單身的朋友，題目貼近孤單、身分、等待、友誼與使命；口氣真誠平等，不催婚。", "res": ["沒關係，慢慢來，再讀一遍就會更清楚。", "不錯喔！你把這一章的重點抓到了。", "太棒了！你很認真，神的話正在你裡面扎根。"], "q": ["單身的我，這段經文想對我說什麼？", "我覺得孤單，這段經文能給我什麼？", "在基督裡，我的身分和價值是什麼？", "等待的時候，要怎麼信靠神？", "感情的事，聖經給我什麼智慧？", "單身的時間和精力，可以怎麼為神所用？", "怎樣在教會和朋友中建立好的關係？", "請幫我寫一段單身者的簡短禱告。"], "fu": [["🫶", "孤單", "請針對你剛才的回答，說明怎麼把它用在孤單時怎麼與神、與朋友連結，並給我一個這個星期做得到的具體小步驟。"], ["💝", "身分", "請針對你剛才的回答，說明怎麼把它用在我在基督裡的身分與價值，並給我一個這個星期做得到的具體小步驟。"], ["⏳", "等待", "請針對你剛才的回答，說明怎麼把它用在等待中的信靠，並給我一個這個星期做得到的具體小步驟。"], ["💞", "感情", "請針對你剛才的回答，說明怎麼把它用在感情與交友的智慧，並給我一個這個星期做得到的具體小步驟。"], ["🎯", "使命", "請針對你剛才的回答，說明怎麼把它用在把時間與恩賜用在神的使命上，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段簡短、真誠的禱告，讓我可以拿來禱告。"]]}, "parent": {"sys": " 回答對象：正在養育孩子的父母（孩子可能從嬰幼兒到成年）。請站在父母的位置：他們常常疲累、擔心孩子、也常常內疚。口吻溫暖、貼近生活、不評斷；承認每個孩子與每個家庭都不同。談陪伴與榜樣、管教與恩典的平衡、親子溝通（怎麼聽、怎麼說）、為孩子禱告、夫妻同心、面對自己的軟弱與失敗；可用日常場景當比喻（吃飯、功課、手機、睡前）。結尾給一個這個星期可以做的具體小步驟（一句話、一個擁抱、一段睡前禱告）。若提到孩子遭受傷害、家庭暴力或孩子有自傷的念頭，要溫柔回應並鼓勵立刻尋求專業協助與信任的人。", "write": "\n讀者是正在養育孩子的父母：口吻溫暖、貼近生活、不評斷；不要用表情符號。", "style": "風格：給養育孩子的父母，題目貼近親子溝通、管教、陪伴與為孩子禱告；口氣溫暖，解析一句話帶出提醒。", "res": ["沒關係，慢慢來，有空再讀一遍就會更清楚。", "不錯！這一章的重點您已經抓到了。", "太棒了！神的話正在您的家裡扎根。"], "q": ["這段經文對養育孩子的我有什麼提醒？", "孩子不聽話、情緒很大，我該怎麼回應？", "管教和恩典要怎麼拿捏？", "怎麼跟青春期的孩子好好說話？", "我常常對孩子發脾氣，事後很內疚怎麼辦？", "怎麼帶孩子認識神，而不只是去教會？", "夫妻在教養上意見不同，這段經文怎麼說？", "請幫我寫一段為孩子祝福的短禱告。"], "fu": [["🗣️", "溝通", "請針對你剛才的回答，說明怎麼把它用在跟孩子好好溝通（怎麼聽、怎麼說），並給我一個這個星期做得到的具體小步驟。"], ["⚖️", "管教", "請針對你剛才的回答，說明怎麼把它用在管教與恩典的平衡，並給我一個這個星期做得到的具體小步驟。"], ["😔", "內疚", "請針對你剛才的回答，說明怎麼把它用在對孩子發脾氣或覺得虧欠的內疚，並給我一個這個星期做得到的具體小步驟。"], ["💑", "夫妻", "請針對你剛才的回答，說明怎麼把它用在夫妻在教養上同心，並給我一個這個星期做得到的具體小步驟。"], ["📖", "信仰", "請針對你剛才的回答，說明怎麼把它用在帶孩子認識神、一起親近神，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段我可以為孩子祝福的短禱告。"]]}, "couple": {"sys": " 回答對象：夫妻（正在經營婚姻的丈夫與妻子，可能是新婚、有孩子的中年夫妻，或相伴多年的伴侶）。請站在夫妻同行的位置：口吻溫暖、真誠、不評斷，不偏袒任何一方；承認每段婚姻都有磨合、疲累與受傷的時候。談愛是決定與付出、彼此饒恕、傾聽與表達（怎麼說、怎麼聽）、尊重與同心、金錢與家務的分工、姻親與孩子的教養、一起禱告與一起讀經、在主裡成為一體；可用日常場景當比喻（飯桌、手牽手、吵完架之後、睡前）。結尾給一個這個星期兩個人就能一起做的具體小步驟（一句感謝的話、一段兩人的禱告、一次不看手機的散步）。不要教導妻子順服或丈夫掌權的單方面要求，要強調彼此相愛、彼此順服。若提到家庭暴力、外遇、對方的威脅或有自傷念頭，要溫柔回應，把安全放在第一位，並鼓勵立刻尋求專業協助與信任的人，不要勸人一味忍耐。", "write": "\n讀者是夫妻：口吻溫暖、貼近生活、不評斷、不偏袒任何一方；不要用表情符號。", "style": "風格：給夫妻，題目貼近溝通、饒恕、同心、共同禱告與彼此相愛；口氣溫暖，解析一句話帶出提醒。", "res": ["沒關係，慢慢來，找個晚上兩個人再一起讀一遍。", "不錯！這一章的重點你們抓到了。", "太棒了！神的話正在你們的婚姻裡扎根。"], "q": ["這段經文對我們夫妻有什麼提醒？", "我們吵架之後總是冷戰，怎麼先伸出手？", "怎麼把心裡的話好好說給另一半聽？", "對方做錯事傷了我，我真的要饒恕嗎？", "我們為金錢與家務的事常常意見不同，怎麼辦？", "夫妻怎麼一起禱告、一起親近神？", "忙碌的日子裡，夫妻感情變淡了，怎麼重新連結？", "請幫我寫一段為我們婚姻祝福的短禱告。"], "fu": [["🗣️", "溝通", "請針對你剛才的回答，說明夫妻怎麼把它用在好好說、好好聽，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["🤝", "饒恕", "請針對你剛才的回答，說明夫妻怎麼把它用在彼此認錯與饒恕，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["💞", "親密", "請針對你剛才的回答，說明夫妻怎麼把它用在重新連結感情、表達愛與感謝，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["👨‍👩‍👧", "同心", "請針對你剛才的回答，說明夫妻怎麼把它用在金錢、家務與教養上同心，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["📖", "同讀", "請針對你剛才的回答，說明夫妻怎麼一起讀經、一起親近神，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段夫妻可以一起禱告的短禱告。"]]}, "pastor": {"sys": " 回答對象：牧者與傳道同工（教會的牧師、傳道人、小組長與事奉的同工）。請站在同工的位置：他們常常肩負許多人的重擔，自己也會疲累、孤單、被誤解或灰心。口吻尊重、平等、真誠，像同工之間彼此扶持，不說教、不居高臨下。可以有適度的深度：點出經文脈絡、原文語境與關鍵字詞的意思，談牧養羊群與生命建造、預備講道與教導、帶領小組與門徒訓練、團隊同心與衝突、面對批評與孤單、屬靈爭戰、自己的靈命與家庭，以及不倦怠的安息與依靠；也可提供講章或查經的切入點、段落與應用建議，但要提醒最後仍須自己在神面前領受。結尾給一個這個星期可以做的具體小步驟（一段安靜親近神的時間、一通關心的電話、一次向同工的坦誠分享）。若提到極度疲憊、憂鬱、想放棄或有自傷念頭，要溫柔回應，並鼓勵立刻尋求信任的同工、屬靈長輩與專業協助。", "write": "\n讀者是牧者與傳道同工：口吻尊重、平等、真誠，像同工彼此扶持；不要用表情符號。", "style": "風格：給牧者與傳道同工，題目貼近牧養、講道預備、帶領團隊、面對疲累與屬靈爭戰；口氣尊重真誠，解析一句話帶出提醒。", "res": ["沒關係，慢慢來，有空再讀一遍就會更清楚。", "不錯！這一章的重點您已經抓到了。", "太棒了！神的話先餵養了牧者，也必流向羊群。"], "q": ["這段經文對事奉中的我有什麼提醒？", "請幫我找這段經文的講道架構與切入點。", "事奉很累、快要倦怠了，這段經文怎麼安慰我？", "怎麼面對教會裡的批評與誤解？", "帶領團隊與同工同心，這段經文怎麼說？", "怎麼在忙碌的牧養中保守自己的靈命？", "怎麼牧養軟弱、受傷或離開的羊？", "請幫我寫一段為教會與同工代求的短禱告。"], "fu": [["📖", "講道", "請針對你剛才的回答，提供一個可用於講道或查經的架構（三個要點與一個應用），並提醒我自己先在神面前領受。"], ["🐑", "牧養", "請針對你剛才的回答，說明怎麼把它用在牧養羊群與關心個別的人，並給我一個這個星期做得到的具體小步驟。"], ["🤝", "團隊", "請針對你剛才的回答，說明怎麼把它用在帶領團隊、同工同心與處理衝突，並給我一個這個星期做得到的具體小步驟。"], ["🕊️", "安息", "請針對你剛才的回答，說明怎麼把它用在自己的疲累與靈命保守，並給我一個這個星期做得到的具體小步驟。"], ["⚔️", "爭戰", "請針對你剛才的回答，說明怎麼把它用在面對批評、孤單與屬靈爭戰，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "代禱", "請把你剛才說的重點，寫成一段我可以為教會與同工代求的短禱告。"]]}}};

  async function aiRaw(sys, ask, ms, maxT) {

    for (let a = 0; a <= waits.length; a++) {

      try {
        const r = await fetch(SVC.xz, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ model: SVC.model, max_tokens: maxT || 1600, system: sys, messages: [{ role: 'user', content: ask }] }),
          signal: ac ? ac.signal : undefined
        });
        if (!r.ok) throw new Error('http ' + r.status);
        const d = await r.json().catch(() => null);
        if (d && d.content && d.content.length) out = d.content.map(b => b.text || '').join('');
        else if (d) out = d.reply || d.text || d.message || '';
        if (!out) why = T('回覆是空的', 'empty reply');
        clearTimeout(tm);

      } catch (e) {
        clearTimeout(tm);
        why = (e && e.name === 'AbortError') ? T('逾時', 'timeout') : ((e && e.message) ? String(e.message) : 'network');
        if (a === waits.length) break;
        await new Promise(rs => setTimeout(rs, waits[a]));
      }
    }
    return { out: String(out || '').trim(), why };
  }

${st}請用繁體中文。只回傳 JSON，不要任何說明、不要 markdown 圍欄：{"r":[{"t":"人物","h":["提示1","提示2","提示3"],"a":"答案","alt":["別名"],"v":"3","e":"亮點"}]}`;

  function plParse(text) {
    let s = String(text || '').replace(/```(?:json)?/gi, '').trim();
    const st = s.indexOf('{'); if (st < 0) return null;
    s = s.slice(st);
    try { return JSON.parse(s.slice(0, s.lastIndexOf('}') + 1)); } catch (e) {}
    const m = s.match(/"(q|r)"\s*:\s*\[/); if (!m) return null;
    let i = m.index + m[0].length; const items = [];
    while (i < s.length) {
      while (i < s.length && s[i] !== '{') i++;
      if (i >= s.length) break;
      let depth = 0, inStr = false, es = false, j = i;
      for (; j < s.length; j++) {
        const c = s[j];
        if (inStr) { if (es) es = false; else if (c === '\\') es = true; else if (c === '"') inStr = false; }
        else if (c === '"') inStr = true;

      try { items.push(JSON.parse(s.slice(i, j + 1))); } catch (e) {}

  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
  function vOf(v) {

  function normQuiz(list, src, k) {

      const as = String(x.a).trim();
      const ai = /^[A-Da-d]$/.test(as) ? 'abcd'.indexOf(as.toLowerCase()) : (as === '' ? NaN : +x.a);

function mx_u32(b,p){return b[p]*16777216+b[p+1]*65536+b[p+2]*256+b[p+3];}
function mx_i32(b,p){const v=mx_u32(b,p);return v>=2147483648?v-4294967296:v;}
function mx_u64(b,p){return mx_u32(b,p)*4294967296+mx_u32(b,p+4);}
function mx_typ(b,p){return String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]);}

function mx_boxes(b,start,end){
  const out=[];let p=start;
  while(p+8<=end){
    let size=mx_u32(b,p),hs=8;
    if(size===1){size=mx_u64(b,p+8);hs=16;}
    else if(size===0)size=end-p;
    if(size<8||p+size>end)break;
    out.push({type:mx_typ(b,p+4),start:p,size:size,hs:hs,body:p+hs,end:p+size});
    p+=size;
  }
  return out;
}
function mx_find(list,t){return list.filter(x=>x.type===t);}
function mx_one(list,t){const r=mx_find(list,t);return r.length?r[0]:null;}
function mx_children(b,mx_box){return mx_boxes(b,mx_box.body,mx_box.end);}

function mx_parseTrun(b,tr,tfhd,baseOffset){
  const flags=mx_u32(b,tr.body)&0xffffff;
  const cnt=mx_u32(b,tr.body+4);
  let p=tr.body+8;
  let dataOff=0;
  if(flags&0x1){dataOff=mx_i32(b,p);p+=4;}
  let firstFlags=null;
  if(flags&0x4){firstFlags=mx_u32(b,p);p+=4;}
  const samples=[];
  let off=baseOffset+dataOff;
  for(let i=0;i<cnt;i++){
    let dur=tfhd.defDur, size=tfhd.defSize, fl=tfhd.defFlags, cto=0;
    if(flags&0x100){dur=mx_u32(b,p);p+=4;}
    if(flags&0x200){size=mx_u32(b,p);p+=4;}
    if(flags&0x400){fl=mx_u32(b,p);p+=4;}
    if(flags&0x800){cto=mx_i32(b,p);p+=4;}
    if(i===0&&firstFlags!==null)fl=firstFlags;
    samples.push({off:off,size:size,dur:dur,cto:cto,sync:!(fl&0x10000)});
    off+=size;
  }
  return {samples:samples,dataOff:dataOff};
}

function mx_parseTfhd(b,mx_box){
  const flags=mx_u32(b,mx_box.body)&0xffffff;
  const trackId=mx_u32(b,mx_box.body+4);
  let p=mx_box.body+8;
  let base=null;
  if(flags&0x1){base=mx_u64(b,p);p+=8;}
  if(flags&0x2){p+=4;}
  let defDur=0,defSize=0,defFlags=0;
  if(flags&0x8){defDur=mx_u32(b,p);p+=4;}
  if(flags&0x10){defSize=mx_u32(b,p);p+=4;}
  if(flags&0x20){defFlags=mx_u32(b,p);p+=4;}
  return {trackId:trackId,base:base,defDur:defDur,defSize:defSize,defFlags:defFlags,
          defaultBaseIsMoof:!!(flags&0x020000),hasBase:!!(flags&0x1)};
}

/* ---- 產生 mx_box ---- */
function mx_box(type,...parts){
  let len=8;parts.forEach(p=>len+=p.length);
  const head=new Uint8Array(8);
  head[0]=(len>>>24)&255;head[1]=(len>>>16)&255;head[2]=(len>>>8)&255;head[3]=len&255;
  for(let i=0;i<4;i++)head[4+i]=type.charCodeAt(i);
  const out=new Uint8Array(len);out.set(head,0);
  let p=8;parts.forEach(x=>{out.set(x,p);p+=x.length;});
  return out;
}
function mx_b32(v){return new Uint8Array([(v>>>24)&255,(v>>>16)&255,(v>>>8)&255,v&255]);}
function mx_b64(v){const hi=Math.floor(v/4294967296),lo=v>>>0;
  return new Uint8Array([(hi>>>24)&255,(hi>>>16)&255,(hi>>>8)&255,hi&255,
                         (lo>>>24)&255,(lo>>>16)&255,(lo>>>8)&255,lo&255]);}
function mx_cat(arr){let n=0;arr.forEach(a=>n+=a.length);const o=new Uint8Array(n);let p=0;
  arr.forEach(a=>{o.set(a,p);p+=a.length;});return o;}

function mx_remux(bytes){
  const b=bytes;
  const top=mx_boxes(b,0,b.length);
  const ftyp=mx_one(top,"ftyp");
  const moov=mx_one(top,"moov");
  if(!moov)throw new Error("no moov");
  const moofs=mx_find(top,"moof");
  if(!moofs.length)return null;              /* 不是分段 MP4，不用處理 */

  const mvBoxes=mx_children(b,moov);
  const mvhd=mx_one(mvBoxes,"mvhd");
  const mvTimescale=mx_u32(b,mvhd.body+(b[mvhd.body]===1?20:12));
  const traks=mx_find(mvBoxes,"trak");

  /* 收集每個 track 的所有 sample */
  const tracks={};
  traks.forEach(tk=>{
    const tkhd=mx_one(mx_children(b,tk),"tkhd");
    const v=b[tkhd.body];
    const id=mx_u32(b,tkhd.body+(v===1?20:12));
    tracks[id]={trak:tk,samples:[]};
  });

  moofs.forEach(mf=>{
    const trafs=mx_find(mx_children(b,mf),"traf");
    trafs.forEach(tf=>{
      const tfc=mx_children(b,tf);
      const tfhdBox=mx_one(tfc,"tfhd");
      if(!tfhdBox)return;
      const tfhd=mx_parseTfhd(b,tfhdBox);
      const t=tracks[tfhd.trackId];
      if(!t)return;
      /* 基準位移：預設是 moof 起點（default-base-is-moof） */
      const base=tfhd.hasBase?tfhd.base:mf.start;
      let running=null;
      mx_find(tfc,"trun").forEach(tr=>{
        const flags=mx_u32(b,tr.body)&0xffffff;
        const hasOff=!!(flags&0x1);
        const r=mx_parseTrun(b,tr,tfhd,hasOff?base:(running===null?base:running));
        r.samples.forEach(s=>t.samples.push(s));
        if(r.samples.length){
          const last=r.samples[r.samples.length-1];
          running=last.off+last.size;
        }
      });
    });
  });

  /* 依序把 sample 資料集中成一個 mdat */
  const order=[];
  Object.keys(tracks).forEach(id=>{
    tracks[id].samples.forEach((s,i)=>order.push({id:+id,i:i,off:s.off,size:s.size}));
  });
  order.sort((a,b2)=>a.off-b2.off);
  let mdatSize=0;order.forEach(o=>mdatSize+=o.size);

  const newOff={};
  let cur=0;
  order.forEach(o=>{
    if(!newOff[o.id])newOff[o.id]=[];
    newOff[o.id][o.i]=cur;cur+=o.size;
  });

  /* ---- 為每個 track 重建 stbl ---- */
  function buildStbl(id,stblOld,mediaTimescale){
    const ss=tracks[id].samples;
    const offs=newOff[id]||[];
    const old=mx_children(b,stblOld);
    const keep=[];
    ["stsd"].forEach(t=>{const x=mx_one(old,t);if(x)keep.push(b.slice(x.start,x.end));});

    /* stts */
    const stts=[];
    let runDur=-1,runCnt=0;
    ss.forEach(s=>{
      if(s.dur===runDur){runCnt++;}
      else{if(runCnt)stts.push([runCnt,runDur]);runDur=s.dur;runCnt=1;}
    });
    if(runCnt)stts.push([runCnt,runDur]);
    const sttsBody=[mx_b32(0),mx_b32(stts.length)];
    stts.forEach(e=>{sttsBody.push(mx_b32(e[0]));sttsBody.push(mx_b32(e[1]));});
    keep.push(mx_box("stts",mx_cat(sttsBody)));

  const PUN = /[\s，。、；：？！「」『』（）《》〈〉“”‘’—…·,.;:?!"'()\[\]\-–]/g;
  function normV(x) {

    const q = normV(text);
    if (q.length < 4 || !D || !D.txt) return null;
    const head = q.slice(0, 30), tail = q.slice(-30);
    const order = [];
    const N = GX.NCH();
    if (hint >= 1 && hint <= N) order.push(hint);
    for (let c = 1; c <= N; c++) if (c !== hint) order.push(c);
    for (const c of order) {
      const vs = D.txt[c] || [];
      let joined = '', starts = [];
      vs.forEach(v => { starts.push(joined.length); joined += normV(v); });
      const i = joined.indexOf(head);
      if (i < 0) continue;
      let j = joined.indexOf(tail, i);
      if (j < 0) j = i + head.length - 1; else j = j + tail.length - 1;
      let a = 0, b = 0;
      for (let k = 0; k < starts.length; k++) { if (starts[k] <= i) a = k; if (starts[k] <= j) b = k; }
      return { ch: c, v: a + 1, v2: b + 1 };
