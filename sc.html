<title>321腓利門書講義</title>
<link rel="manifest" id="MF" href="./manifest.webmanifest">
<style>
:root{
  --ink:#12181B; --paper:#EEF0EB; --card:#FFFFFF; --line:#D6DAD2;
  --pine:#1F4D3D; --pine2:#2E6B55; --brass:#9C6B18; --clay:#8C3A2E; --dusk:#54636B;
  --fs:17px; --r:14px;
  --hl-gold:rgba(156,107,24,.32);
  --hl-green:#CFE6CC; --hl-blue:#CFDFF4; --hl-pink:#F7D3DC; --hl-purple:#E3D5F1;
  --hl-maroon:#EBD0D0; --hl-brown:#E9D9BF; --hl-charcoal:#DBDAD4;
  --hb-green:#5E9E63; --hb-blue:#5583C7; --hb-pink:#DB7A90; --hb-purple:#9377C0;
  --hb-maroon:#8C4A4E; --hb-brown:#8A6740; --hb-charcoal:#54534E;
  --hl-now:#FFE9A8;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Source Han Serif TC","Songti TC",serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
html[data-dark="1"]{
  --ink:#E8EDE9; --paper:#0E1412; --card:#161E1A; --line:#28332D;
  --pine:#7FBFA4; --pine2:#9BD3BA; --brass:#D6A250; --clay:#D98A78; --dusk:#93A29A;
  --hl-gold:rgba(214,162,80,.34);
  --hl-green:#22402A; --hl-blue:#1F3350; --hl-pink:#45222E; --hl-purple:#332A48;
  --hl-maroon:#3D2525; --hl-brown:#3B3020; --hl-charcoal:#34342F;
  --hb-green:#7BC28C; --hb-blue:#7FA0DE; --hb-pink:#E58FA0; --hb-purple:#A48AC9;
  --hb-maroon:#C08084; --hb-brown:#B99168; --hb-charcoal:#8E8D86;
  --hl-now:#4A3C16;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:var(--fs); line-height:1.85;
  padding-bottom:calc(66px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}

/* ── 頁首 ── */
header.top{
  position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
header .bar{display:flex;align-items:center;gap:8px;height:52px;max-width:720px;margin:0 auto;padding:0 12px}
header h1{font-family:var(--serif);font-size:17px;font-weight:700;margin:0;flex:1;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{
  width:40px;height:40px;border:0;background:transparent;color:var(--ink);
  font-size:17px;border-radius:10px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto;
}
.ico:active{background:var(--line)}
.ico.hide{display:none}
.ico.lang{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:0}
.ico.lang.on{color:var(--pine)}

/* ── 分頁 ── */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{
  flex:1;border:0;background:transparent;color:var(--dusk);
  font-family:var(--sans);font-size:11px;padding:8px 0 7px;cursor:pointer;line-height:1.3;
}
nav.tabs button b{display:block;font-family:var(--serif);font-size:17px;font-weight:600;margin-bottom:1px}
nav.tabs button.on{color:var(--pine)}

/* ── 通用 ── */
.eyebrow{
  font-size:11px;letter-spacing:.22em;color:var(--dusk);
  margin:0 0 6px;text-transform:none;font-weight:600;
}
h2.big{font-family:var(--serif);font-size:25px;line-height:1.5;margin:0 0 14px;font-weight:700}
h3.sec{font-family:var(--serif);font-size:19px;margin:26px 0 10px;font-weight:700;color:var(--pine)}
.sect{padding:20px 0}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin:12px 0;
}
.muted{color:var(--dusk)}
.sm{font-size:calc(var(--fs) * .82)}
.xs{font-size:calc(var(--fs) * .74)}
.btn{
  display:inline-block;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:9px 14px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer;
}
.btn.pri{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .btn.pri{color:#0E1412}
.btn:active{transform:translateY(1px)}
.bigbtn{
  display:block;width:100%;text-align:left;background:var(--pine);color:#fff;
  border:0;border-radius:var(--r);padding:16px 18px;cursor:pointer;font:inherit;
}
html[data-dark="1"] .bigbtn{color:#0E1412}
.bigbtn small{display:block;font-size:12px;opacity:.82;letter-spacing:.1em}
.bigbtn b{display:block;font-family:var(--serif);font-size:19px;margin:5px 0 0;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pill{
  border:1px solid var(--line);background:var(--card);color:var(--dusk);
  border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;font:inherit;
}
.pill.on{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .pill.on{color:#0E1412}

/* ── 地形圖（招牌元素）── */
.terrain{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px 6px;margin:6px 0 0}
.terrain svg{display:block;width:100%;height:auto}
.tlab{font-family:var(--mono);font-size:8.5px;fill:var(--dusk)}
.tlab.hi{fill:var(--brass);font-weight:700}
.tpath{fill:none;stroke:var(--pine);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tdot{fill:var(--brass)}
.tdot.low{fill:var(--clay)}
.tnow{fill:none;stroke:var(--ink);stroke-width:1.5}

/* ── 章清單 ── */
.chrow{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px 14px;margin:8px 0;cursor:pointer;font:inherit;color:inherit;
}
.chn{
  font-family:var(--mono);font-size:12px;color:var(--dusk);
  min-width:26px;padding-top:3px;letter-spacing:-.04em
}
.chrow b{font-family:var(--serif);font-size:17px;display:block;line-height:1.45}
.chrow .s{font-size:13px;color:var(--dusk);display:block;margin-top:2px;line-height:1.6}
.chrow .done{color:var(--pine);font-size:12px}

/* ── 經文 ── */
.vs{
  display:flex;gap:9px;padding:7px 0 7px 10px;border-left:2px solid transparent;
  cursor:pointer;align-items:flex-start;
}
.vs:active{background:var(--card)}
.vs.has{border-left-color:var(--pine)}
.vs.star{border-left-color:var(--brass);border-left-width:3px}
.vs.warn{border-left-color:var(--clay);border-left-width:3px}
.vn{font-family:var(--mono);font-size:11.5px;color:var(--dusk);min-width:20px;padding-top:5px;text-align:right}
.vt{flex:1;line-height:1.95}
.vs .flag{font-size:11px;color:var(--clay);margin-left:4px}

/* ── 六層 ── */
.layer{border-top:1px solid var(--line);padding:12px 0}
.layer:first-child{border-top:0}
.lh{
  display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;
  letter-spacing:.14em;color:var(--dusk);font-weight:600;user-select:none
}
.lh .n{font-family:var(--mono);color:var(--pine)}
.lh .caret{margin-left:auto;font-size:11px;opacity:.6}
.lb{margin-top:8px}
.lb.grk{font-family:var(--serif);font-size:16px;line-height:2.05;color:var(--pine)}
.lb.lit{font-family:var(--serif)}
.kw{
  display:inline-block;border:1px solid var(--line);border-radius:8px;
  padding:3px 9px;margin:3px 5px 3px 0;font-size:13px;cursor:pointer;background:var(--card)
}
.kw i{font-style:normal;font-family:var(--serif);color:var(--pine)}

/* ── 表 ── */
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{color:var(--dusk);font-weight:600;font-size:12.5px}

/* ── 軌跡 ── */
.track{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.track .gk{font-family:var(--serif);font-size:22px;color:var(--pine)}
.stops{margin:12px 0 4px;padding-left:0;list-style:none}
.stop{display:flex;gap:10px;align-items:baseline;padding:5px 0}
.stop .r{font-family:var(--mono);font-size:12px;min-width:44px;color:var(--dusk)}
.stop .d{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--dusk);margin-top:6px}
.stop.dark .d{background:var(--clay)} .stop.light .d{background:var(--brass)}
.insight{border-left:3px solid var(--brass);padding:8px 0 8px 12px;margin:10px 0 0;font-family:var(--serif);font-size:16px}

/* ── 爭議 ── */
.iss{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.pos{border:1px solid var(--line);border-radius:10px;padding:11px;margin:8px 0;font-size:14px}
.pos b{color:var(--pine)}
.consensus{background:rgba(156,107,24,.09);border-radius:10px;padding:11px;margin:10px 0;font-size:14px}
.say{border-left:3px solid var(--pine);padding-left:12px;margin:10px 0;font-family:var(--serif)}

/* ── 分級 ── */
.lv{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;font-weight:700;margin-right:6px}
.lv.g{background:rgba(31,77,61,.13);color:var(--pine)}
.lv.y{background:rgba(156,107,24,.16);color:var(--brass)}
.lv.r{background:rgba(140,58,46,.14);color:var(--clay)}

/* ── 打卡 ── */
.chk{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.box{
  width:21px;height:21px;border:1.5px solid var(--line);border-radius:6px;flex:0 0 auto;margin-top:3px;
  display:grid;place-items:center;font-size:13px;color:#fff
}
.chk.on .box{background:var(--pine);border-color:var(--pine)}
.chk.on .t{color:var(--dusk);text-decoration:line-through}
.chk .t{flex:1;font-size:15px;line-height:1.7}

/* ── 底部抽屜 ── */
.sheet{
  position:fixed;inset:0;z-index:90;background:rgba(10,16,14,.42);
  display:none;align-items:flex-end;
}
.sheet.on{display:flex}
.sheet .inner{
  background:var(--paper);width:100%;max-height:88vh;overflow:auto;
  border-radius:20px 20px 0 0;padding:8px 18px calc(28px + env(safe-area-inset-bottom));
  animation:up .22s ease;
}
@keyframes up{from{transform:translateY(24px);opacity:.5}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.sheet h4{font-family:var(--serif);font-size:20px;margin:4px 0 2px}

/* ── 其他 ── */
.toast{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;
  font-size:13.5px;z-index:120;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap
}
.toast.on{opacity:1}
.note{
  width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);
  color:inherit;font:inherit;font-size:15px;padding:11px;min-height:88px;resize:vertical
}
.q{font-family:var(--serif);font-size:var(--fs);line-height:1.75;margin:0 0 4px}
.tip{font-size:calc(var(--fs) * .8);color:var(--dusk);background:rgba(31,77,61,.07);border-radius:9px;padding:9px 11px;margin-top:8px}
.blank i{font-style:normal;color:var(--clay);letter-spacing:.05em}

/* ── 教學講義逐字稿（長文閱讀）── */
.les p{font-family:var(--serif);font-size:var(--fs);line-height:1.95;margin:0 0 15px;text-align:justify}
.les h4{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.18);font-weight:700;color:var(--pine);
  margin:30px 0 12px;padding-top:14px;border-top:1px solid var(--line);scroll-margin-top:64px
}
.les h4:first-child{margin-top:6px;padding-top:0;border-top:0}
.les p.dec{color:var(--pine);font-weight:600;margin-bottom:9px}
/* 想更深：收起來的一問一答 */
.les details.deeper{
  border:1px solid var(--line);border-radius:12px;background:var(--card);
  padding:10px 13px;margin:0 0 16px
}
.les details.deeper summary{
  font-family:var(--serif);font-size:calc(var(--fs) * .92);line-height:1.65;color:var(--pine);
  font-weight:600;cursor:pointer;list-style:none
}
.les details.deeper summary::-webkit-details-marker{display:none}
.les details.deeper summary::before{content:"＋　";opacity:.6}
.les details.deeper[open] summary::before{content:"−　"}
.les details.deeper[open] summary{margin-bottom:8px}
.les .deeper-a p{font-size:calc(var(--fs) * .95);line-height:1.9;margin:0;color:var(--dusk)}
/* 三個化 */
.les p.t3s{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.06);font-weight:700;color:var(--pine);
  margin:26px 0 10px
}
.les p.t3t{font-family:var(--serif);font-size:calc(var(--fs) * .95);font-weight:700;color:var(--brass);margin:16px 0 6px}
.les p.t3m{
  font-size:calc(var(--fs) * .85);line-height:1.8;color:var(--dusk);background:rgba(31,77,61,.07);
  border-radius:11px;padding:10px 13px;margin:0 0 13px;text-align:left
}
.les p.t3n{margin:0 0 12px}
.toc button{
  display:block;width:100%;text-align:left;border:0;background:transparent;color:inherit;
  font-family:var(--serif);font-size:16px;line-height:1.6;padding:7px 0;cursor:pointer;
  border-bottom:1px solid var(--line)
}
.toc button:last-child{border-bottom:0}
.toc button:active{color:var(--pine)}
.hr{height:1px;background:var(--line);margin:22px 0}
.center{text-align:center}
a{color:var(--pine)}
.foot{padding:26px 0 8px;font-size:12px;color:var(--dusk);line-height:1.9}

/* ── 全螢幕模式（講台／小組）── */
.full{position:fixed;inset:0;z-index:200;background:var(--paper);display:none;flex-direction:column}
.full.on{display:flex}
html[data-tele="1"]{--paper:#0C1210;--ink:#EDF2EE;--card:#141C18;--line:#26332C;--dusk:#8FA098;--pine:#7FBFA4;--brass:#D9A94F;--clay:#D98A78}
.fbar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line)}
.fbar .clock{font-family:var(--mono);font-size:15px;color:var(--dusk);letter-spacing:-.02em}
.fbar .clock.over{color:var(--clay)}
.fbar b{font-family:var(--serif);font-size:15px;flex:1;text-align:center}
.fbody{flex:1;overflow:auto;padding:22px 20px 30px;-webkit-overflow-scrolling:touch}
.ffoot{display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.rail{height:3px;background:var(--line)}
.rail i{display:block;height:3px;background:var(--brass);width:0;transition:width .3s}
/* 提詞機 */
.tele p{font-size:calc(var(--fs) * 1.45);line-height:2.05;margin:0 0 20px;font-weight:600}
.tele .qq{font-family:var(--serif);color:var(--brass);border-left:3px solid var(--brass);padding-left:14px}
.tele h5{font-family:var(--serif);color:var(--pine);font-size:calc(var(--fs) * 1.1);margin:34px 0 18px;letter-spacing:.04em}
.tele .pause{color:var(--dusk);font-family:var(--mono);font-size:13px;letter-spacing:.2em;margin:26px 0;text-align:center}
.tele .pause b{color:var(--brass)}
/* 小組 */
.live h5{font-family:var(--serif);font-size:15px;color:var(--pine);letter-spacing:.1em;margin:0 0 18px}
.live .qq{font-family:var(--serif);font-size:calc(var(--fs) * 1.5);line-height:1.85;margin:0 0 20px}
.live .tipbox{background:rgba(156,107,24,.12);border-radius:12px;padding:14px;font-size:15px;line-height:1.8}
/* 搜尋 */
.sbox{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card);color:inherit;font:inherit;font-size:16px;padding:12px 14px}
mark{background:rgba(156,107,24,.3);color:inherit;padding:0 2px;border-radius:3px}

/* ── 品牌與啟動畫面 ── */
.brand{width:26px;height:26px;border-radius:7px;flex:0 0 auto;display:block}
.brand.hide{display:none}
#splash{
  position:fixed;inset:0;z-index:300;background:#12305E;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:opacity .45s ease;
}
#splash.gone{opacity:0;pointer-events:none}
#splash img{width:132px;height:132px;border-radius:28px;box-shadow:0 12px 40px rgba(0,0,0,.4);margin-bottom:20px}
#splash h2{font-family:var(--serif);font-size:25px;margin:0;letter-spacing:.06em;font-weight:700}
#splash p{margin:4px 0 0;font-size:15px;opacity:.85;letter-spacing:.3em}
#splash small{margin-top:26px;font-size:11.5px;opacity:.55;letter-spacing:.16em}

/* ── 畫線與領受 ── */
.vs.hl .vt{background:linear-gradient(transparent 58%, rgba(156,107,24,.32) 58%)}
.mkw{margin:0 0 14px}
.mks{
  cursor:pointer;border-radius:5px;transition:background .12s;
  -webkit-tap-highlight-color:transparent;box-decoration-break:clone;-webkit-box-decoration-break:clone
}
.mks:active{background:var(--line)}
.mks.hl{background:linear-gradient(transparent 60%, var(--hl-gold) 60%)}
.mks.hl[data-c="green"]{background:linear-gradient(transparent 60%, var(--hl-green) 60%)}
.mks.hl[data-c="blue"]{background:linear-gradient(transparent 60%, var(--hl-blue) 60%)}
.mks.hl[data-c="pink"]{background:linear-gradient(transparent 60%, var(--hl-pink) 60%)}
.mks.hl[data-c="purple"]{background:linear-gradient(transparent 60%, var(--hl-purple) 60%)}
.mks.hl[data-c="maroon"]{background:linear-gradient(transparent 60%, var(--hl-maroon) 60%)}
.mks.hl[data-c="brown"]{background:linear-gradient(transparent 60%, var(--hl-brown) 60%)}
.mks.hl[data-c="charcoal"]{background:linear-gradient(transparent 60%, var(--hl-charcoal) 60%)}
/* 正在朗讀的那一句 */
.spk-now{
  background:var(--hl-now)!important;border-radius:4px;
  box-shadow:0 0 0 3px var(--hl-now);transition:background .2s
}
.les h4 .spk-now,.les details.deeper.spk-now{box-shadow:none}
.les details.deeper.spk-now{background:var(--hl-now)!important}
.mkp{cursor:pointer;border-radius:5px;transition:background .12s}
.mkp.hl{background:linear-gradient(transparent 62%, var(--hl-gold) 62%)}
.mkp.hl[data-c="green"]{background:linear-gradient(transparent 62%, var(--hl-green) 62%)}
.mkp.hl[data-c="blue"]{background:linear-gradient(transparent 62%, var(--hl-blue) 62%)}
.mkp.hl[data-c="pink"]{background:linear-gradient(transparent 62%, var(--hl-pink) 62%)}
.mkp.hl[data-c="purple"]{background:linear-gradient(transparent 62%, var(--hl-purple) 62%)}
.mkp.hl[data-c="maroon"]{background:linear-gradient(transparent 62%, var(--hl-maroon) 62%)}

function bootReset(){
  try {
    if (window.caches) caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k)))).then(go);

  } catch(e){ go(); }

    else location.reload(true);
  }
}

<script id="DATA" type="application/json">{"ch":[{"n":1,"t":"不再是奴僕，乃是高過奴僕，是親愛的兄弟","sub":"愛、求、收","lv":"A","arc":"愛・求・收","sec":[["1:1--3","以及在你家的教會：被囚的保羅與一個家"],["1:4--7","因眾聖徒的心從你得了暢快：感恩與代禱"],["1:8--12","寧可憑著愛心求你：捆鎖中所生的兒子"],["1:13--16","不再是奴僕，乃是高過奴僕，是親愛的兄弟：暫時與永遠"],["1:17--22","都歸在我的帳上：收納、擔保與盼望"],["1:23--25","願我們主耶穌基督的恩常在你的心裡：五個同工與恩"]],"serm":{"pts":[["一個讓人心得暢快的家","1:1--7","「因眾聖徒的心從你得了暢快」——腓利門的家已經是一個教會，他的愛心已經讓許多人得安息；保羅的請求，是從感謝開始的"],["從奴僕到兄弟","1:8--16","「不再是奴僕，乃是高過奴僕，是親愛的兄弟」——能命令的人選擇憑愛心求；曾經沒有益處的人在捆鎖中被生；一件東西被叫成了弟兄，按肉體，也按主"],["都歸在我的帳上","1:17--25","「就收納他，如同收納我一樣」——接納有一個具體的動作：開門、記帳、擔保；虧負是真的，有人願意扛；最後一句是恩"]]},"q":"你家門口有沒有站過這樣一個人：他曾經讓你損失一筆錢、一段信任，或者一個家的平靜；他離開的時候沒有說再見，現在卻帶著一封信回來了，站在門外，不知道門會不會開。\n也許他是當年捲款離職的員工、和你翻臉多年的兄弟、偷拿過家裡東西的孩子、一聲不響離開小組又回來的人；也許，你自己就是那個站在門口、手舉起來卻不敢敲門的人。\n這一章要問的是：一個曾經被當成東西、曾經虧負人、曾經離開的人，能不能被叫成親愛的兄弟？而開門的那一方，靠的究竟是咬緊牙關的意志力，還是一份先托住他的恩？","truth":"一個在法律上被當成東西的人，在主裡被叫成親愛的兄弟；接納他，不是假裝那筆帳不存在，而是有人說：「他若虧負你，或欠你甚麼，都歸在我的帳上」（1:18）。\n所以我們能夠「收納他，如同收納我一樣」（1:17），不是因為我們夠寬宏大量，是因為那位主早已把我們的帳記在自己名下——1:18 使我們想起這件事。","mv":{"t":"不再是奴僕，乃是高過奴僕，是親愛的兄弟。","r":"門1:16"},"card":["腓利門書只有一章，這一章就是全卷愛・求・收的整條路。先是愛（1:1--7）：腓利門的家已經是一個教會，眾聖徒的心從他得了暢快；再是求（1:8--16）：能命令的人憑愛心求，一個曾經沒有益處的人被叫成兄弟；最後是收（1:17--25）：收納他如同收納我，虧負的帳有人擔保，末了一句是恩。全章拎起來就是一句話：一個曾經被當成東西、曾經虧負人、曾經離開的人，怎樣被接回一個家。","這封信表面上是三個人之間的往來，真正的主詞藏在被動語態和祝福裡。恩惠平安「從神我們的父和主耶穌基督」而來（1:3）；阿尼西謀在捆鎖中被生（1:10）——改變他的不是一套改善計畫，是福音；他「被分開」一時（1:15），保羅謹慎地說「或者」，卻看見神的手可能在其中；保羅能不能出監，是神的恩賜（1:22）；最後，主耶穌基督的恩臨到整個家庭教會（1:25）。神把一件「東西」變成一個兒子，把一個客廳變成教會。","1:15「或者是叫你永遠得著他」，「得著」原文 ἀπέχῃς（apechēs），是當時商業收據上的字：全數收訖。腓利門以為自己記下的是一筆損失；保羅用收據的字告訴他，你收到的是全數，而且是永遠的。這改變今天的讀法：那個讓你損失過的人站在門口，神或許不是要你再吃一次虧，而是要你收下一位永遠的弟兄。保羅只說「或者」，不替神把話說滿；但他讓腓利門換一本帳簿來看這件事。","這一章有三個人，每一個都照得出我。我可能是腓利門：有權利、有理由，愛眾聖徒，可是心裡那張名單上，沒有那個讓我損失、讓我在人前丟臉的人。我可能是阿尼西謀：站在門口，把自己的過去看得比神給的新名字還大，手舉起來又放下。我也可能是一個想當保羅卻只會下命令的人：明明可以求，卻習慣替別人作決定。","「他若虧負你，或欠你甚麼，都歸在我的帳上」（1:18）。全章最該被記住的，是一個動作：一支筆從代筆人手上被接過來，寫下「我必償還，這是我－保羅親筆寫的」（1:19）。恩典不是把帳本撕掉、假裝沒有虧負，也不是叫受損的一方吞下去；是有人把虧負記在自己名下。這使我們想起那位「不將他們的過犯歸到他們身上」（林後 5:19）的神——帳是真的，扛帳的也是真的。","這一週，在你的家、你的公司或你的教會裡，找出一位常被當成「一份人力」的人：家裡的看護、公司的清潔阿姨、派遣來的同事、總是在廚房忙的那位姊妹。在星期五以前，記住他的名字，當面叫他一次；問他家鄉的家人好不好；如果你是雇主或主管，順手確認他這週的休假與薪資是否公平。在主日稱他弟兄，週一也這樣待他——「這也不拘是按肉體說，是按主說」（1:16）。","最終整合：歌羅西，一個星期日的傍晚。\n腓利門家的客廳坐滿了人——亞腓亞、亞基布、隔街來的弟兄姊妹。這就是「以及在你家的教會」（1:2）。\n門開了。推基古走進來，後面跟著一個大家都認得的人。屋裡忽然安靜。有人想起那段不愉快的往事，有人偷偷看腓利門的臉。\n推基古展開一封信，在全教會面前念。腓利門先聽見「我的兒子」，最後才聽見那個名字。再往下念：\n「不再是奴僕，乃是高過奴僕，是親愛的兄弟」（1:16）。\n沒有人說話。書房抽屜裡的帳本還在；若真有虧負，那筆帳也是真的。可是信念到後面，筆跡忽然變了：\n「我必償還，這是我－保羅親筆寫的」（1:19）。\n經文沒有記下那一晚的結局。可是整封信，都是為了這樣一個畫面寫的：\n腓利門站起來，他沒有假裝帳本不存在——只是不論帳上有甚麼，都已經有人說要扛了。他走到桌邊，把自己身旁的椅子拉開。\n同一張桌子，同一個餅。按肉體說，是同一個家；按主說，是同一個身體。\n今天，我們每一個人都站在這扇門的某一邊：有人手裡握著門把，有人站在門外。\n信的最後一句，不是給腓利門的命令，也不是給阿尼西謀的警告，是給屋裡所有人的：\n「願我們主耶穌基督的恩常在你的心裡」（1:25）。\n門打得開，不是因為誰的意志力夠強。是因為那位主，早就把我們每一個人的帳，記在自己的名下。"],"self":"這一章照出來的「有己」，是一個「我是對的」的人：我有權利、我有理由、我吃了虧，所以要等對方先低頭、先賠完、先證明自己變好了，我才考慮要不要開門；我愛眾聖徒，可是那張名單上，偏偏少了那個傷過我的名字。\n有己也會換一件衣服：站在門口的人，把自己的過去看得比神給他的新名字還大，不肯相信「如今」；站在高處的人，明明可以求，卻習慣命令，用地位和恩情替別人作決定。這一章的出路，不是更用力地原諒，是先被那位說「歸在我的帳上」的主接住。","t321":{"k":"耶穌是我的榜樣：保羅在信的第一行不稱使徒，只稱「被囚的」；在 1:9 能命令卻求；在 1:18 把別人的債寫在自己名下。這三筆都不是保羅發明的，他是照著一位主描下來的——那位本有神的形像，「反倒虛己，取了奴僕的形像」（腓 2:7）。耶穌在地上怎樣接人？他到稅吏撒該家裡坐下吃飯，沒有先要撒該把帳還清；是主先進了門，撒該自己說要把訛詐的還四倍（路 19:8）。所以這個榜樣有兩筆：先接納，帳也是真的。我學的不是保羅的修辭，是那位先進門、又扛帳的主。","g":"讓耶穌作王：這一章要人讓出「主人」的位置。腓利門在家裡是 κύριος（kyrios），那是奴僕叫主人用的字；可是保羅說「這也不拘是按肉體說，是按主說」（1:16），又求他「在主裡」使自己得益處（1:20）——這個家有一位更高的主。讓耶穌作王，就是承認我的家、我的公司、我的帳本都不是終審法院。具體要讓出三個位子：審判官的位子（那筆帳我說了算）、所有權人的位子（他是我的人力、我的資產）、面子的位子（我在眾人面前不能輸）。可以自己檢查：你家或你公司裡，有沒有一個人，你天天使喚他，卻叫不出他的名字？","p":"建立屬神的體系：體系最小的單位是「以及在你家的教會」（1:2）——一個家，一個客廳。它的考驗不在聚會多熱鬧，而在一個回來的人坐不坐得上那張桌子。保羅示範了一群人怎樣接回一個人：有書信（把事情說清楚）、有同行者（推基古一起去，西 4:7--9）、有見證人（全教會在場聽信）、有擔保人（保羅親筆寫欠條）、有後續（「此外你還要給我預備住處」（1:22），保羅要親自來看）。國度321空中團契的小組散在各地，也可以這樣接人：有組員離開又回來，不只說一句「歡迎回來」，而是有人陪、有人說清楚、有人願意分擔代價、有人持續關心。接納不是一個人的英雄行為，是一群人一起托住。"},"grp":["【一、破冰】你的名字有甚麼意思？是誰替你取的？你有沒有過被人叫錯名字、或只被人用職稱、編號叫的經驗——那一刻你心裡是甚麼感覺？","【二、扎心】經文說：「他從前與你沒有益處，但如今與你我都有益處」（1:11）。在你的生活裡，有沒有一個人在你心裡一直停在「從前」——家人、前同事、離開又回來的組員？說出他的稱呼。反過來，你自己有沒有一段「從前」，到今天還怕別人提起？","【三、福音】讀 1:18--19：「他若虧負你，或欠你甚麼，都歸在我的帳上」（1:18）。這使我們想起，神在基督裡「不將他們的過犯歸到他們身上」（林後 5:19）。如果你自己的那一筆帳，早已有人扛了，這會怎樣改變你看那個欠你的人？又會怎樣改變你看你自己？","【四、行動】說出這一週你要「按肉體說」好好善待的一個人：家裡的看護、公司的派遣或清潔同事、一位常被忽略的組員——說出他的名字或稱呼、哪一天、做哪一件具體的事。如果你心裡有一個「門口的人」，也說出這週你願意跨出的一小步——可以只是為他禱告，不必立刻見面。","【五、代禱】為三種人指名禱告：一位曾經虧負人、想回來卻不敢敲門的人，求主給他真實的悔改與勇氣；一位受了傷、卻被催著「趕快原諒」的人，求主保護他，給他時間與安全；一位在異鄉工作的移工或家庭看護，求主讓他在雇主家裡被叫名字、被公平對待，也在教會裡被稱為親愛的弟兄姊妹。"],"prac":{"main":"這一週，我先讓那位說「歸在我的帳上」的主接住我，再學習在一個具體的人面前開門——按肉體，也按主。","items":["對神：每天讀 1:15--19 一次，讀到「都歸在我的帳上」這一句就停下來，向主說出一筆你自己的帳（一件虧欠神或虧欠人的事），然後說：「主，謝謝你把它記在你的名下。」","對自己：打開心裡那本帳簿，寫下一個你一直在記帳的人，以及那筆帳的內容。問自己三個問題：這筆帳是真的嗎？我要他怎樣才算還清？我願不願意把審判交給神？饒恕可以先在神面前開始，不必等和好；和好需要對方的悔改，也需要你的安全。","對人：挑一位在你家、公司或教會裡常被當成「人力」的人，這週記住他的名字，星期五以前當面叫他一次，做一件具體的善待；若你是雇主或主管，檢查一次他的工時、休假與薪資是否公平。","對生活：這週在你家的餐桌上，邀一個平常不會被邀的人坐下——新來的同事、離開又回來的組員、獨居的長輩；如果你曾經虧負過誰，寫一封短信或傳一則訊息，不是要求對方原諒，只是承認，並且問可以怎樣彌補。","對使命：在小組裡談一個具體安排：當有人離開又回來、或兩位組員之間有虧欠時，小組怎樣像保羅那樣——有人把事情說清楚、有人同行、有人在場見證、有人願意分擔代價；並為一位在異鄉工作的移工或看護每天指名禱告，看看小組能為他做一件實際的事。"]},"safe":["① 先講 321「人比事重要、關係比東西重要」，再拿 1:16 和阿尼西謀的故事當插圖印證；或把整封信講成一堂「人際關係修復課」。","腓利門書的次序是先有福音——阿尼西謀在捆鎖中被生（1:10），一件東西被叫成兄弟「是按主說」（1:16）；321 只能在末端認出：人比事重要，是因為主先這樣看人（鐵律五）。把經文當理念的插圖，會眾記得的是一個原則，不是那位主。","檢驗標準：講完 1:16，會眾記得的第一個畫面，是一張 321 的圖表，還是一個被叫成「親愛的兄弟」的人和那位叫他的主？","② 誤用 1:12 說「保羅把逃奴送回主人那裡，可見聖經支持奴隸制，奴僕就該順從到底」。","新約不為奴隸制背書：保羅勸作奴僕的「若能以自由，就求自由更好」（林前 7:21），又把搶人口的列在違背正道的事裡（提前 1:10）；1:16 要腓利門看他「不再是奴僕」。把這封信講成奴隸制的證據，正好說反了（全卷立場見 ISS00_2）。","檢驗標準：講完這一段，會眾是更清楚福音的方向是尊嚴與自由，還是聽起來像聖經默許了人可以擁有人？","③ 把阿尼西謀講成「逃奴犯了罪，回去受罰是應該的」；或反過來說「保羅沒有要求廢除奴隸制，所以這卷書已經不合時宜」。","經文從來沒有給阿尼西謀定罪，保羅講他的過去只用了「沒有益處」，立刻接上「如今」（1:11）；他的處境也有四種讀法，不能當成定案（議題見 ISS01_1、ISS01_3）。另一頭，用古代制度否定經文，會錯過福音從一個家裡面翻轉主奴關係的力量。","檢驗標準：會眾聽完，是更看見一個人被福音改變、被接回，還是只聽見一場對阿尼西謀的審判或對聖經的審判？","④ 誤用 1:12「我現在打發他親自回你那裡去」叫受家暴的配偶、受虐的孩子、被剝削的移工回到傷害他的人那裡：「阿尼西謀都回去了，你也要回去面對。」","阿尼西謀的回去是被保護的回去：有保羅的信、有推基古同行（西 4:7--9）、有全教會作見證（1:2）、有保羅親筆擔保（1:17--19）。人身安全受威脅時，先保護生命、依法求助、通報；把這一節講成叫人回到危險，是拿一封保護人的信去傷人（全卷立場見 ISS00_3）。","檢驗標準：一位正在受家暴的姊妹聽完，是更知道她可以求助、教會會保護她，還是更覺得她應該回去忍耐？","⑤ 錯誤地逼受傷的人立刻饒恕、立刻接納：「腓利門那麼大的損失都放下了，你為甚麼放不下？今天就去跟他和好。」","保羅給腓利門留了空間，要他的善行「不是出於勉強，乃是出於甘心」（1:14）；經文也沒有記下腓利門的回應。饒恕是向神交出審判，可以先在神面前開始；和好是雙方的路，需要悔改與安全。催人趕快原諒，只會教他把傷口藏起來（全卷立場見 ISS00_3）。","檢驗標準：一位受了深傷的弟兄姊妹聽完，是覺得被看見、可以按神的時間走，還是覺得自己又多了一條罪名：不肯饒恕？","⑥ 把饒恕講成「帳一筆勾銷、一切恢復原狀」：教會同工挪用了奉獻，認罪之後就該立刻恢復原職，再提那筆錢就是不屬靈。","1:18 承認「他若虧負你，或欠你甚麼」——帳是真的，保羅的辦法不是取消它，而是有人負責償還（1:19）。饒恕不等於免除責任，不等於恢復原職，也不等於和好；保護群體、恢復信任需要時間與具體的承擔。","檢驗標準：講完 1:18--19，會眾是更明白恩典有人扛帳，還是以為恩典就是假裝沒有發生過？","⑦ 把「請求」講成包裝過的命令：同工會先把事情定了，再說「我們是憑愛心求你」，誰拒絕就被說是沒有順服。","保羅能「放膽吩咐」卻「寧可憑著愛心求你」（1:9），而且「不知道你的意思，我就不願意這樣行」（1:14）——他把決定權完整交回。一個不能被拒絕的請求，就是命令；講台用這種語氣，會叫甘心變成勉強（全卷立場見 ISS00_4）。","檢驗標準：會眾聽完，是覺得自己被尊重、可以真實地回應，還是覺得「求」只是另一種沒有選擇的命令？","⑧ 用 1:19「連你自己也是虧欠於我」作屬靈領袖的範本：「你是我帶信主的，你的一切都是教會給的，所以你要聽我的。」","這一句歷來有「溫和的施壓」與「帶著笑的提醒」兩種讀法，但保羅剛說完他要的是甘心（1:14）；把它變成以恩情綁人、情緒勒索的工具，正好違背整封信的方向，也是屬靈虐待的開始（全卷立場見 ISS00_4；屬靈虐待回指彼得前書立場五）。","檢驗標準：一位曾經被教會領袖用「你欠我」控制過的人聽完，是更自由，還是又被綁緊了一圈？","⑨ 拿 1:21「深信你必順服」壓制提問：「保羅說了必順服，你再問為甚麼就是悖逆。」","保羅給了腓利門十幾節的理由，尊重他的思考，又說「知道你所要行的必過於我所說的」（1:21）——這是信任，不是恐嚇；這裡的順服有兩種讀法並陳：順服保羅在主裡所求的（終究是順服主），或順服福音本身；兩讀都不是對個人無條件的服從（見 ISS00_4）。","檢驗標準：會眾聽完，是更敢把真實的疑問帶到神和弟兄姊妹面前，還是更覺得提問就是不屬靈？","⑩ 誤把 1:18 講成「阿尼西謀預表罪人，腓利門預表父神，保羅預表基督，這一節就是保羅在教導代贖」。","保羅在這裡處理的是一筆真實的帳，他沒有把它說成福音的比喻；歸帳只能「使我們想起」基督——神「不將他們的過犯歸到他們身上」（林後 5:19），羅 5:13 的「不算」與 1:18 同字根。把寓意講成保羅的教義，會讓人忘了這是一個有名字的人（議題見 ISS01_8；全卷立場見 ISS00_5）。","檢驗標準：講完這一段，會眾記得的是一套對號入座的預表圖，還是一筆真實的帳被人扛起、並因此想起十字架？","⑪ 只講「在主裡都是弟兄」，卻不碰工資、休假、住處；或反過來說「今天的外勞就是古代的奴僕」。","1:16 說「這也不拘是按肉體說，是按主說」——兩者都要：在主日稱弟兄的人，週一派工、算薪水時也要這樣待他（西 4:1）。今天的移工、家庭看護、外傭、派遣勞工要被具體看見，但他們的身分與處境和古代奴僕不同，不可畫上等號；用「在主裡」抹去階級的不公，或把勞工貶成奴僕，都是再一次把人當成東西（全卷立場見 ISS00_2）。","檢驗標準：一位在雇主家工作的看護坐在會眾席上，她聽完，是覺得被當成一個有名字的人，還是覺得自己被歸到「奴僕」那一類？","⑫ 用 1:15 宣告「你受的傷害、對方的背叛，都是神的計畫，是為了叫你得益處」。","保羅只說「或者」（τάχα）——他看見神可能在其中作工，卻沒有把阿尼西謀可能的過錯、腓利門的損失說成神要它發生（議題見 ISS01_7）。把傷害說成神的旨意，會讓受害者不敢憤怒、不敢求助，也讓加害者有了屬靈的藉口。","檢驗標準：一位剛被背叛、被傷害的人聽完，是更相信神能在破碎裡作工，還是更覺得神站在傷害他的人那一邊？","⑬ 誤用 1:24 的底馬羞辱離開教會的人：「你看底馬後來離開了，離開教會的人都是貪愛世界」；或用馬可安慰人「離開的人一定會回來」。","這份同工名單是真實的，不是完美的：馬可曾經離開，後來「在傳道的事上於我有益處」（提後 4:11）；底馬後來離開（提後 4:10），我們不知道他的結局。離開的原因很多，有人是被傷害才走；馬可的回轉是恩典，不是保證。","檢驗標準：一位曾經離開教會、今天剛回來坐在後排的人聽完，是覺得門開著，還是覺得自己被貼上了「底馬」的標籤？","⑭ 用處境取消原則：「這是一世紀羅馬奴隸制的私人信，跟今天沒有關係」；或把處境硬搬：「今天的員工就是老闆的阿尼西謀，犯了錯就要回來任憑處置。」","書信三問要走完：處境是一個在家裡接待教會的主人和一個曾經虧負他的奴僕；原則是在主裡是親愛的兄弟、憑愛心求、甘心不是勉強、虧負的帳有人擔保；今天的落點是家、教會、職場、移工與看護、斷裂的關係——原則照守，落點隨處境（全卷立場見 ISS00_1）。","檢驗標準：會眾聽完，是知道這封信今天在自己的家裡、公司裡怎樣活，還是覺得它要嘛太遙遠、要嘛被拿來壓人？","⑮ 把腓利門講成冷血的反派、把阿尼西謀講成無辜的英雄；或在講台上點名會眾裡某一位「腓利門」，要他當眾表態接納。","保羅先為腓利門的愛心感謝神，說眾聖徒的心從他得了暢快（1:7）——他不是被當成問題處理的人，是被信任的人；這封信在全教會面前念（1:2），是見證與保護，不是公開施壓。講台若製造羞辱，就把一封信任的信講成一場公審。","檢驗標準：一位手裡握著權利、心裡還在掙扎的「腓利門」聽完，是覺得被信任、被邀請，還是覺得被逼到牆角？","⑯ 把整章講成保羅的口才示範：「看保羅多會說話，先讚美、再請求、最後提恩情，你們也要學這套說服技巧。」","保羅的每一筆——不稱使徒、憑愛心求、把別人的帳寫在自己名下——都是從那位「反倒虛己，取了奴僕的形像」（腓 2:7）的主學來的。焦點落在保羅的修辭上，會眾學到的是說服人的技巧，失去的是那位扛帳的主（鐵律七）。","檢驗標準：會眾聽完，是更佩服保羅的口才，還是更愛那位說「歸在我的帳上」的主？"]}],"txt":{"1":["為基督耶穌被囚的保羅，同兄弟提摩太寫信給我們所親愛的同工腓利門，","和妹子亞腓亞並與我們同當兵的亞基布，以及在你家的教會。","願恩惠、平安從神我們的父和主耶穌基督歸與你們！","我禱告的時候提到你，常為你感謝我的神；","因聽說你的愛心並你向主耶穌和眾聖徒的信心。","願你與人所同有的信心顯出功效，使人知道你們各樣善事都是為基督做的。","兄弟啊，我為你的愛心，大有快樂，大得安慰，因眾聖徒的心從你得了暢快。","我雖然靠著基督能放膽吩咐你合宜的事，","然而像我這有年紀的保羅，現在又是為基督耶穌被囚的，寧可憑著愛心求你，","就是為我在捆鎖中所生的兒子阿尼西謀求你。","他從前與你沒有益處，但如今與你我都有益處。","我現在打發他親自回你那裡去；他是我心上的人。","我本來有意將他留下，在我為福音所受的捆鎖中替你伺候我。","但不知道你的意思，我就不願意這樣行，叫你的善行不是出於勉強，乃是出於甘心。","他暫時離開你，或者是叫你永遠得著他，","不再是奴僕，乃是高過奴僕，是親愛的兄弟。在我實在是如此，何況在你呢！這也不拘是按肉體說，是按主說。","你若以我為同伴，就收納他，如同收納我一樣。","他若虧負你，或欠你甚麼，都歸在我的帳上；","我必償還，這是我－保羅親筆寫的。我並不用對你說，連你自己也是虧欠於我。","兄弟啊，望你使我在主裡因你得快樂，並望你使我的心在基督裡得暢快。","我寫信給你，深信你必順服，知道你所要行的必過於我所說的。","此外你還要給我預備住處；因為我盼望藉著你們的禱告，必蒙恩到你們那裡去。","為基督耶穌與我同坐監的以巴弗問你安。","與我同工的馬可、亞里達古、底馬、路加也都問你安。","願我們主耶穌基督的恩常在你的心裡。阿們！"]},"blk":{"1":[{"a":1,"z":1,"star":1,"grk":"<p lang=\"grc\">Παῦλος δέσμιος Χριστοῦ Ἰησοῦ καὶ Τιμόθεος ὁ ἀδελφὸς Φιλήμονι τῷ ἀγαπητῷ καὶ συνεργῷ ἡμῶν</p>","lit":"<p>保羅，基督耶穌的囚犯，和那弟兄提摩太，寫給腓利門——那親愛的，也是我們的同工，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Παῦλος δέσμιος Χριστοῦ Ἰησοῦ</td><td>Paulos desmios Christou Iēsou</td><td>保羅，基督耶穌的囚犯</td><td>不稱使徒，先稱囚犯；1:9 再說一次</td></tr><tr><td>Τιμόθεος ὁ ἀδελφὸς</td><td>Timotheos ho adelphos</td><td>那弟兄提摩太</td><td>追蹤三第一站：「兄弟」</td></tr><tr><td>Φιλήμονι τῷ ἀγαπητῷ</td><td>Philēmoni tō agapētō</td><td>給親愛的腓利門</td><td>追蹤二第一站：「親愛的」</td></tr><tr><td>συνεργῷ ἡμῶν</td><td>synergō hēmōn</td><td>我們的同工</td><td>「同」字頭：同工、同兵、同囚</td></tr></table>","gram":"<p><strong>保羅在這封信裡沒有用他最常用的頭銜。</strong>羅馬書、哥林多前後書、以弗所書、歌羅西書開頭，保羅多半稱自己是 ἀπόστολος（apostolos）；腓立比書稱 δοῦλοι（douloi）。只有這一封，第一個名詞是 δέσμιος（desmios）：被綁住的人、囚犯。這個字在 1:9 又出現一次，緊貼在「寧可憑著愛心求你」（1:9）旁邊。一封請求信，作者先把權柄放在門外。</p><p>δέσμιος Χριστοῦ Ἰησοῦ（desmios Christou Iēsou） 的屬格有兩種讀法：一是原因，「為基督耶穌的緣故被囚」，和合本取這個；一是歸屬，「屬於基督耶穌的囚犯」——綁住保羅的不是羅馬，是基督。兩讀不衝突，本講義兩者並取。</p><p>稱呼裡藏著伏筆。提摩太是 ὁ ἀδελφὸς（ho adelphos），腓利門是 τῷ ἀγαπητῷ（tō agapētō）。到了 1:16，這兩個字會合在一起，落在阿尼西謀身上：ἀδελφὸν ἀγαπητόν（adelphon agapēton）。保羅第一行就先把要給阿尼西謀的稱號，分別放在兩個受尊重的人身上。</p>","exp":"<p>「為基督耶穌被囚的保羅，同兄弟提摩太寫信給我們所親愛的同工腓利門」（1:1）。寫信的人坐在監裡，收信的人坐在自己家裡。一個沒有自由的人，要寫信給一個有房子、有奴僕的人，請他做一件很難的事。</p><p>保羅大可以先亮出使徒的身分。他沒有。他先說自己是囚犯，等於先告訴腓利門：這封信不是公文，是一個被綁住的人寫的。本系列腓立比書講義第 1 章講過，保羅的捆鎖不是失敗，「我受的捆鎖……已經顯明是為基督的緣故」（腓 1:13）。在這封信裡，捆鎖多了一個用處：它讓請求聽起來像請求。</p><p>腓利門被稱為「同工」，不是門徒，也不是下屬。保羅把他放在和自己、和提摩太同一排。接下來要求他的事，不是上級對下級的指示，是同工之間的商量。</p><p>這使我們想起那位「反倒虛己，取了奴僕的形像」（腓 2:7）的主。保羅自稱囚犯，不是演出來的謙卑；他真的被綁著。321 說耶穌是我的榜樣：有權柄的人先把權柄放下，信的第一行就看得見。</p>"},{"a":2,"z":3,"star":2,"grk":"<p lang=\"grc\">καὶ Ἀπφίᾳ τῇ ἀδελφῇ καὶ Ἀρχίππῳ τῷ συστρατιώτῃ ἡμῶν καὶ τῇ κατʼ οἶκόν σου ἐκκλησίᾳ·</p><p lang=\"grc\">χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.</p>","lit":"<p>和那姊妹亞腓亞，和我們的同兵亞基布，和那在你家中的教會：</p><p>恩典給你們，和平安，從神我們的父和主耶穌基督。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ἀπφίᾳ τῇ ἀδελφῇ</td><td>Apphia tē adelphē</td><td>給那姊妹亞腓亞</td><td>◆ 經文鑑別：RP 作「親愛的」</td></tr><tr><td>Ἀρχίππῳ τῷ συστρατιώτῃ ἡμῶν</td><td>Archippō tō systratiōtē hēmōn</td><td>給我們的同兵亞基布</td><td>西 4:17 的亞基布</td></tr><tr><td>τῇ κατʼ οἶκόν σου ἐκκλησίᾳ</td><td>tē kat' oikon sou ekklēsia</td><td>給在你家中的教會</td><td>σου 單數：一個人的家</td></tr><tr><td>χάρις ὑμῖν καὶ εἰρήνη</td><td>charis hymin kai eirēnē</td><td>恩典和平安給你們</td><td>ὑμῖν 複數；與 1:25 首尾呼應</td></tr></table>","gram":"<p><strong>收信人有四組。</strong>腓利門、亞腓亞、亞基布，最後是 τῇ κατʼ οἶκόν σου ἐκκλησίᾳ（tē kat' oikon sou ekklēsia），「在你家的教會」。κατʼ οἶκόν（kat' oikon） 是「按著家」、「在家中」，羅 16:5、林前 16:19、西 4:15 都用這個說法稱家庭教會。σου（sou） 是單數，最自然的讀法是指名單第一位的腓利門；少數學者認為指緊接在前的亞基布，但全信的「你」都是腓利門，本講義照多數讀法。一封私人信，收信人卻包括一整個聚會：這封信是要在教會面前念出來的。</p><blockquote><p>◆ 經文鑑別：SBLGNT、WH、Treg、NA28 作 ἀδελφῇ（adelphē），「姊妹」，和合本「妹子」照這個讀法；RP 作 ἀγαπητῇ（agapētē），「親愛的」。ἀγαπητῇ（agapētē） 很可能是抄寫的人受 1:1 τῷ ἀγαπητῷ（tō agapētō） 影響，把兩個稱呼排成一樣；ἀδελφῇ（adelphē） 是較早抄本的讀法，也是較不整齊、較難被改出來的讀法。本講義從 SBLGNT 與和合本。亞腓亞常被認為是腓利門的妻子，經文沒有明說。</p></blockquote><p>1:3 的 ὑμῖν（hymin） 是複數，全信第一個「你們」。從 1:4 起，「你」又回到單數。到了 1:22 和 1:25，複數再出現：這封信開頭和結尾都把整個家庭教會包進來。</p>","exp":"<p>〔西〕西 4:9--17（歌羅西書講義第 4 章）</p><p>「和妹子亞腓亞並與我們同當兵的亞基布，以及在你家的教會」（1:2）。這幾個名字，在歌羅西書的末尾也看得見。推基古帶著歌羅西書去，「我又打發一位親愛忠心的兄弟阿尼西謀同去；他也是你們那裡的人」（西 4:9）。同一趟路，兩封信；歌羅西書寫給全城的教會，腓利門書寫給其中一個家。亞基布在那裡也被點名：「務要謹慎，盡你從主所受的職分」（西 4:17）。</p><p>為甚麼一件家務事，要放在全教會面前念？不是為了施壓，讓腓利門在眾人面前下不了台。比較好的理解是：一個人被接回來，從來不只是兩個人之間的事。阿尼西謀回來，要回到一個家，也要回到一張聚會的桌子。教會在場，是見證，也是保護——之後每一個人都知道保羅求的是甚麼，也都知道阿尼西謀被託付給誰。</p><p>問安用的是保羅慣用的「恩惠、平安」。這封信從恩開始，也在恩裡結束（1:25）。中間的請求，是夾在兩層恩典之間的。</p><p>本系列歌羅西書講義第 3 章講過「為奴的、自主的」那幾句家規。家規在歌羅西書是原則，在這裡是一個有名字的人，站在一個有地址的家門口。321 說建立屬神的體系，體系最小的單位就在這節：一個家，一個客廳，一群人。它的考驗也在這裡：一個回來的奴僕，坐不坐得上那張桌子。</p>"},{"a":4,"z":5,"star":1,"grk":"<p lang=\"grc\">Εὐχαριστῶ τῷ θεῷ μου πάντοτε μνείαν σου ποιούμενος ἐπὶ τῶν προσευχῶν μου,</p><p lang=\"grc\">ἀκούων σου τὴν ἀγάπην καὶ τὴν πίστιν ἣν ἔχεις πρὸς τὸν κύριον Ἰησοῦν καὶ εἰς πάντας τοὺς ἁγίους,</p>","lit":"<p>我感謝我的神，總是在我的禱告中提到你，</p><p>因為一直聽見你的愛，和那信，就是你所有的、向著主耶穌、也向著眾聖徒的，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Εὐχαριστῶ τῷ θεῷ μου πάντοτε</td><td>Eucharistō tō theō mou pantote</td><td>我總是感謝我的神</td><td>現在式：不是一次</td></tr><tr><td>μνείαν σου ποιούμενος</td><td>mneian sou poioumenos</td><td>提到你</td><td>禱告時點名</td></tr><tr><td>ἀκούων</td><td>akouōn</td><td>一直聽見</td><td>現在分詞：消息不斷傳來</td></tr><tr><td>τὴν ἀγάπην καὶ τὴν πίστιν</td><td>tēn agapēn kai tēn pistin</td><td>愛和信</td><td>追蹤二：「你的愛心」</td></tr><tr><td>πρὸς τὸν κύριον Ἰησοῦν καὶ εἰς πάντας τοὺς ἁγίους</td><td>pros ton kyrion Iēsoun kai eis pantas tous hagious</td><td>向著主耶穌，也向著眾聖徒</td><td>交錯排列</td></tr></table>","gram":"<p><strong>1:5 是一個交錯排列。</strong>原文的次序是：愛——信——向主——向聖徒。最自然的讀法是把它交叉配起來：信向著主耶穌，愛向著眾聖徒。和合本正文把「向主耶穌和眾聖徒」都掛在「信心」上；和合本註腳另譯：因聽說你向主耶穌和眾聖徒有愛心有信心，讓兩個對象同時掛在愛與信上。還有一讀把 πίστιν（pistin） 解作「忠誠」，向聖徒的忠誠也說得通。本講義取交錯讀法，正文與註腳並陳。</p><p>ἀκούων（akouōn） 是現在分詞：保羅不是聽過一次，是一直聽見。消息從哪裡來？以巴弗從歌羅西來（西 1:7--8），阿尼西謀也從那個家來。那個從主人家來的人，可能正是告訴保羅「我主人很愛弟兄姊妹」的人。</p>","exp":"<p>「我禱告的時候提到你，常為你感謝我的神」（1:4）。修辭學上，這叫開場博取好感：先肯定對方，再提出請求。但保羅的感謝不是包裝。他說的每一樣，都是腓利門真實有的：愛、信、眾聖徒的心因他得了安歇。保羅的稱讚有根據，所以下面的請求站得穩。</p><p>「眾聖徒」這三個字值得多看一眼。腓利門愛「眾聖徒」，這句話寫下時是真的。可是當阿尼西謀在捆鎖中信了主，「眾聖徒」的名單就多了一個人。保羅接下來的請求，其實只是把 1:5 的「眾」字照字面讀：你愛眾聖徒，現在這眾聖徒裡，有一位是你的奴僕。</p><p>一個人的愛心常常有一張看不見的名單，名單上是容易愛的人。保羅沒有批評腓利門的名單太短，他只是先感謝，然後輕輕地把一個名字放上去。感謝在前，請求在後，這個次序本身就是對腓利門的尊重：他先被看見，才被邀請。</p>"},{"a":6,"z":6,"star":2,"grk":"<p lang=\"grc\">ὅπως ἡ κοινωνία τῆς πίστεώς σου ἐνεργὴς γένηται ἐν ἐπιγνώσει παντὸς ἀγαθοῦ τοῦ ἐν ἡμῖν εἰς Χριστόν</p>","lit":"<p>好使你那信心的團契，在認識我們中間一切的善上，成為有功效的，歸向基督。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὅπως</td><td>hopōs</td><td>好使</td><td>接 1:4 的禱告：禱告的內容</td></tr><tr><td>ἡ κοινωνία τῆς πίστεώς σου</td><td>hē koinōnia tēs pisteōs sou</td><td>你信心的團契</td><td>全卷最難的一句；讀法三種</td></tr><tr><td>ἐνεργὴς γένηται</td><td>energēs genētai</td><td>成為有功效的</td><td>起作用、做出來</td></tr><tr><td>ἐν ἐπιγνώσει παντὸς ἀγαθοῦ</td><td>en epignōsei pantos agathou</td><td>在認識一切善上</td><td>ἀγαθοῦ 接 1:14 τὸ ἀγαθόν σου</td></tr><tr><td>εἰς Χριστόν</td><td>eis Christon</td><td>歸向基督</td><td>◆ RP 加「耶穌」</td></tr></table>","gram":"<p><strong>1:6 是全卷最難的一句。</strong>問題在 ἡ κοινωνία τῆς πίστεώς σου（hē koinōnia tēs pisteōs sou） 這個屬格片語，至少有三種讀法：</p><p>①<strong>分享出去的信心</strong>：你把信心與人分享，帶有傳福音的意思，和合本的譯法可兼容①分享說與②團契說。②<strong>因信心而有的團契</strong>：你因信與我們成為夥伴，κοινωνία（koinōnia） 指信徒之間的夥伴關係。③<strong>你對信心的參與</strong>：主觀的屬格，指腓利門自己活在信心裡。</p><p>本講義取第二讀，理由在 1:17：Εἰ οὖν με ἔχεις κοινωνόν（Ei oun me echeis koinōnon），「你若以我為同伴」，同一個字根。保羅在 1:6 為這個夥伴關係禱告，到 1:17 就把它落在一個具體的動作上：收納他。信心的團契要「顯出功效」，ἐνεργὴς（energēs） 的意思就是做出來、起作用。</p><p>ἐν ἐπιγνώσει（en epignōsei） 是誰的認識？和合本譯「使人知道」，把它當作別人的認識；也可以讀成腓利門自己更深地認識。παντὸς ἀγαθοῦ（pantos agathou） 與 1:14 的 τὸ ἀγαθόν σου（to agathon sou） 遙相呼應：抽象的「一切善」，到 1:14 變成一件具體的善行。</p><blockquote><p>◆ 句末 SBLGNT 作 εἰς Χριστόν（eis Christon）；RP 作「歸向基督耶穌」，多一個 Ἰησοῦν（Iēsoun）。意思相同，和合本「為基督」與 SBLGNT 一致。</p></blockquote>","exp":"<p>「願你與人所同有的信心顯出功效，使人知道你們各樣善事都是為基督做的」（1:6）。保羅為腓利門禱告，求的不是更多的感受，是功效。信心如果只停在心裡，就像一張沒有兌現的支票。</p><p>這個禱告很快就要被回答，而且是用腓利門想不到的方式。保羅還沒提阿尼西謀的名字，可是他已經先為「信心的團契顯出功效」禱告了。等到門打開、那個人站在門口，這個禱告就有了一張臉。信心的團契不是在聚會唱詩時最清楚，是在一個難接納的人面前最清楚。</p><p>「都是為基督做的」，原文的方向是 εἰς Χριστόν（eis Christon），歸向基督。善事的終點不是腓利門的名聲，也不是保羅的請求得到回應，是基督。321 說讓耶穌得榮耀：同一件善事，可以是為了表現自己寬宏大量，也可以是為了基督。外面看不出分別，終點不一樣。</p><p>這一句各家讀法不同，講台上不必展開。只要抓住一件事：信心在一個具體的接納裡，才算顯出功效。一個教會的信心有多真，不只看它的信仰告白寫得多完整，也看它門口站著一個曾經虧負人的人時，門開不開得了。</p>"},{"a":7,"z":7,"star":2,"grk":"<p lang=\"grc\">χαρὰν γὰρ πολλὴν ἔσχον καὶ παράκλησιν ἐπὶ τῇ ἀγάπῃ σου, ὅτι τὰ σπλάγχνα τῶν ἁγίων ἀναπέπαυται διὰ σοῦ, ἀδελφέ.</p>","lit":"<p>因為我在你的愛上得了許多喜樂和安慰，因為眾聖徒的心腸已經藉著你得了歇息，弟兄啊。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>χαρὰν γὰρ πολλὴν ἔσχον</td><td>charan gar pollēn eschon</td><td>因為我有了許多喜樂</td><td>◆ 經文鑑別：RP 作「恩典」</td></tr><tr><td>παράκλησιν</td><td>paraklēsin</td><td>安慰</td><td>與 1:9--10 παρακαλῶ 同字根</td></tr><tr><td>τὰ σπλάγχνα τῶν ἁγίων</td><td>ta splanchna tōn hagiōn</td><td>眾聖徒的心腸</td><td>全卷第一個「心」（7、12、20）</td></tr><tr><td>ἀναπέπαυται</td><td>anapepautai</td><td>已經得了歇息</td><td>完成式：歇息至今仍在</td></tr><tr><td>διὰ σοῦ ἀδελφέ</td><td>dia sou adelphe</td><td>藉著你，弟兄啊</td><td>呼格放在句末</td></tr></table>","gram":"<p><strong>σπλάγχνα（splanchna） 是全信的鑰匙字。</strong>本意是內臟，古人認為情感發自腹中，所以譯作「心腸」。它在這封信出現三次：1:7 眾聖徒的心從你得了暢快；1:12 阿尼西謀就是我的心；1:20 求你也使我的心得暢快。三次連起來，就是全卷的路。</p><p>ἀναπέπαυται（anapepautai） 是完成式被動，ἀναπαύω（anapauō） 的意思是使人停下來歇一口氣。主說「我就使你們得安息」（太 11:28），用的是同一個動詞的將來式 ἀναπαύσω（anapausō）。這使我們想起主的話，不是保羅在引用。διὰ σοῦ（dia sou） 說明管道：主使人得安息，腓利門是那安息經過的手。</p><blockquote><p>◆ 經文鑑別：SBLGNT、WH、Treg、NA28 作 χαρὰν（charan），「喜樂」，和合本「大有快樂」照這個讀法；RP 作 χάριν（charin），「恩典」。兩字只差一兩個字母，抄寫時很容易互換。χαρὰν（charan） 有較早的抄本支持，又與 παράκλησιν（paraklēsin） 配成「喜樂與安慰」一對，文意通順；χάριν（charin） 可能受 χάριν ἔχω（charin echō）「感謝」這種慣用語影響。本講義從 SBLGNT 與和合本。</p></blockquote><p>ἀδελφέ（adelphe） 放在句末，是呼格。在要開口請求之前，保羅先叫他一聲「弟兄」。</p>","exp":"<p>「兄弟啊，我為你的愛心，大有快樂，大得安慰，因眾聖徒的心從你得了暢快」（1:7）。全卷地勢圖本章的第一座山在這裡。腓利門不是一個需要被改造的人，他已經是一個讓人歇得下來的人。到他家聚會的人，進門時累，出門時輕省。</p><p>這一點要先講清楚，因為它決定了下面的請求是甚麼性質。保羅不是要腓利門變成另一個人，是請他做回自己：你一向使聖徒的心暢快，現在有一個聖徒，他的心就是我的心（1:12）。到 1:20，保羅說「並望你使我的心在基督裡得暢快」（1:20）——同一個「心」，同一個「暢快」。保羅只是請他把一向做的事，多做一次，做在一個最難的人身上。</p><p>這也提醒讀信的人：一個人的好名聲，最真實的考驗不在大家都喜歡的人身上。腓利門已經是許多人的安息；問題是，那個曾經讓他損失、讓他沒面子的人，能不能也在他家裡歇一口氣。</p><p>保羅的語氣很溫柔，卻不含糊。他先把腓利門的好說得清清楚楚，讓腓利門知道：你不是被當作問題處理的人，你是被信任的人。一個被信任的人，比較容易做出超過自己的事。</p>"},{"a":8,"z":9,"star":2,"grk":"<p lang=\"grc\">Διό, πολλὴν ἐν Χριστῷ παρρησίαν ἔχων ἐπιτάσσειν σοι τὸ ἀνῆκον,</p><p lang=\"grc\">διὰ τὴν ἀγάπην μᾶλλον παρακαλῶ, τοιοῦτος ὢν ὡς Παῦλος πρεσβύτης νυνὶ δὲ καὶ δέσμιος Χριστοῦ Ἰησοῦ —</p>","lit":"<p>所以，雖然我在基督裡有許多的放膽，可以吩咐你那合宜的事，</p><p>因著愛，我寧可懇求——我是這樣的一個人：像保羅這老年人，如今又是基督耶穌的囚犯——</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Διό</td><td>Dio</td><td>所以</td><td>接回 1:4--7：因為你是這樣的人</td></tr><tr><td>πολλὴν ἐν Χριστῷ παρρησίαν ἔχων</td><td>pollēn en Christō parrēsian echōn</td><td>在基督裡有許多放膽</td><td>讓步分詞：雖然有</td></tr><tr><td>ἐπιτάσσειν σοι τὸ ἀνῆκον</td><td>epitassein soi to anēkon</td><td>吩咐你合宜的事</td><td>保羅真的有命令的權柄</td></tr><tr><td>διὰ τὴν ἀγάπην μᾶλλον παρακαλῶ</td><td>dia tēn agapēn mallon parakalō</td><td>因著愛，我寧可懇求</td><td>權柄放下，愛心開口</td></tr><tr><td>Παῦλος πρεσβύτης</td><td>Paulos presbytēs</td><td>老年人保羅</td><td>◆ 經文鑑別：推測讀法「使者」</td></tr><tr><td>νυνὶ δὲ καὶ δέσμιος</td><td>nyni de kai desmios</td><td>如今又是囚犯</td><td>接回 1:1</td></tr></table>","gram":"<p><strong>1:8--9 是一個讓步句。</strong>ἔχων（echōn） 是讓步分詞：「雖然有」。保羅有 παρρησίαν（parrēsian），在基督裡放膽說話的自由；他可以 ἐπιτάσσειν（epitassein），這是有權柄者下命令的字，新約也用在耶穌吩咐污鬼、吩咐風浪（可 1:27；路 8:25），以及希律下令（可 6:27）。τὸ ἀνῆκον（to anēkon），「合宜的事」，西 3:18 ὡς ἀνῆκεν ἐν κυρίῳ（hōs anēken en kyriō） 同字根：保羅知道這件事在主裡是合宜的，他有權直接說。主要動詞卻是 παρακαλῶ（parakalō），「懇求」，前面加 μᾶλλον（mallon）：寧可。</p><p>διὰ τὴν ἀγάπην（dia tēn agapēn） 是誰的愛？可以是保羅的愛，也可以是 1:5、1:7 腓利門的愛，或是兩人之間共有的那份愛。冠詞讓它指向前文剛提過的那個愛，本講義讀作：就憑著我們都知道的那份愛。</p><blockquote><p>◆ 經文鑑別：所有抄本都作 πρεσβύτης（presbytēs），「老年人」，和合本「有年紀的」照這個讀法。「使者」的讀法其實分兩種。一是改字的推測讀法（Bentley），把經文改成 πρεσβευτής（presbeutēs）；二是萊特富特的同形異義說：當時拼寫偶有混用，πρεσβύτης（presbytēs） 這個字形本身就可以作「使者」解，不必改經文。部分譯本（如 RSV）取「使者」。兩說都有弗 6:20 πρεσβεύω（presbeuō） 可以對照：「我為這福音的奧祕作了帶鎖鍊的使者」（弗 6:20）。改字說沒有任何抄本支持；同形異義說不必改字，較有分量。但在這裡，「使者」是權柄的頭銜，正好與上下文放下權柄的方向相反；「老年人」和「囚犯」配成一對，都是軟弱的身分。本講義照抄本與和合本作「有年紀的」，「使者」兩說並陳。</p></blockquote><p>1:9 句末 SBLGNT 用破折號：保羅講到自己是囚犯，句子斷開，1:10 才又拾起 παρακαλῶ（parakalō） 重說一次。</p>","exp":"<p>「我雖然靠著基督能放膽吩咐你合宜的事，然而像我這有年紀的保羅，現在又是為基督耶穌被囚的，寧可憑著愛心求你」（1:8--9）。這是全卷的權柄觀。保羅沒有說他沒有權柄，他說他有，而且很多；然後他選擇不用。</p><p>命令能得到順從，請求才能得到心。保羅要的不是腓利門的一個動作，是腓利門的一顆心。如果他下令，阿尼西謀或許會被收留，卻是被一個不情願的主人收留；那樣的接納，回家第一天就會露出縫來。所以他不下令。</p><p>這兩節常被用在兩個相反的方向，都要小心。一是拿 1:8 來合理化屬靈的命令：「保羅也說他可以吩咐」。不要這樣讀；保羅講這句，是為了說他不這樣做。二是把「請求」講成包裝過的命令，表面上說「求」，其實不容拒絕。1:14 會把這條路堵住：保羅要的是甘心。</p><p>他把自己放在兩個軟弱的身分上：老了，又被關著。一個老囚犯能拿甚麼壓人？他只剩下愛可以用。321 說謙卑是放下權力、回到本位。保羅沒有失去使徒的身分，他放下的是權力。而腓利門很快也會被邀請放下一樣東西：主人的權利。謙卑帶動謙卑。</p>"},{"a":10,"z":11,"star":3,"grk":"<p lang=\"grc\">παρακαλῶ σε περὶ τοῦ ἐμοῦ τέκνου, ὃν ἐγέννησα ἐν τοῖς δεσμοῖς Ὀνήσιμον,</p><p lang=\"grc\">τόν ποτέ σοι ἄχρηστον νυνὶ δὲ σοὶ καὶ ἐμοὶ εὔχρηστον,</p>","lit":"<p>我為我的孩子懇求你，就是我在捆鎖中所生的：阿尼西謀，</p><p>他從前對你是沒有用處的，但如今對你、也對我是很有用處的；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>παρακαλῶ σε περὶ τοῦ ἐμοῦ τέκνου</td><td>parakalō se peri tou emou teknou</td><td>我為我的孩子求你</td><td>τέκνου 是親子的字</td></tr><tr><td>ὃν ἐγέννησα ἐν τοῖς δεσμοῖς</td><td>hon egennēsa en tois desmois</td><td>就是我在捆鎖中所生的</td><td>被綁的人生了孩子</td></tr><tr><td>Ὀνήσιμον</td><td>Onēsimon</td><td>阿尼西謀</td><td>名字放在句子最後；和合本註腳「有益處」</td></tr><tr><td>τόν ποτέ σοι ἄχρηστον</td><td>ton pote soi achrēston</td><td>從前對你沒有用處的</td><td>全卷地勢最低點</td></tr><tr><td>νυνὶ δὲ σοὶ καὶ ἐμοὶ εὔχρηστον</td><td>nyni de soi kai emoi euchrēston</td><td>如今對你也對我很有用處</td><td>從前／如今：轉變的公式</td></tr></table>","gram":"<p><strong>名字放在句子最後。</strong>1:10 的字序是：我求你——為我的孩子——就是我在捆鎖中所生的——阿尼西謀。Ὀνήσιμον（Onēsimon） 是最後一個字。保羅先讓腓利門聽見「我的孩子」「我在捆鎖中生的」，最後才說出那個名字。腓利門聽到名字之前，已經先聽到了這個人在保羅心中的位置。</p><p>ἐγέννησα（egennēsa） 是「生」。保羅用同樣的意象說哥林多人是他用福音生的（這使我們想起林前 4:15），對加拉太人也說「我為你們再受生產之苦」（加 4:19）。被關在監裡的人，生了一個兒子。</p><p>名字與 1:11 是雙關。和合本註腳：「阿尼西謀：就是有益處的意思」。這是當時常見的奴僕名字，主人給奴僕取名「有用的」，像給工具貼標籤。1:11 用 ἄχρηστον（achrēston）「沒有用處」和 εὔχρηστον（euchrēston）「很有用處」，兩個字都帶 χρηστός（chrēstos） 的字根，與名字的意思合成一個文字遊戲：叫「有益處」的人，從前沒有益處；如今，名副其實了。</p><blockquote><p>有學者再往前推一步：當時 χρηστός（chrēstos） 與 Χριστός（Christos） 讀音很接近，ἄχρηστον（achrēston） 聽起來像「沒有基督的」，εὔχρηστον（euchrēston） 像「好基督的」。這個諧音在古代確有人注意到，但保羅是否有意，無法證實。本講義並陳，不定論，講台上不以此為重點。</p></blockquote><p>ποτέ（pote）……νυνὶ δὲ（nyni de） 是新約描寫歸信的公式，「從前……如今」，弗 2:13 也是 νυνὶ δὲ（nyni de）。σοὶ καὶ ἐμοὶ（soi kai emoi）：有益處的對象，先是腓利門，再是保羅。εὔχρηστος（euchrēstos） 這個字，保羅後來也用在馬可身上：「他在傳道的事上於我有益處」（提後 4:11）。</p>","exp":"<p>「就是為我在捆鎖中所生的兒子阿尼西謀求你。他從前與你沒有益處，但如今與你我都有益處」（1:10--11）。全卷地勢圖本章最低的一點，就在 1:11 的前半句。保羅沒有替阿尼西謀粉飾：他從前確實沒有益處。這句話對腓利門很公道，他吃過虧，保羅承認。</p><p>阿尼西謀為甚麼會在保羅身邊？經文沒有直接說，歷來有四種讀法。①<strong>逃走的奴僕</strong>：傳統讀法，他從主人家逃出，輾轉遇見保羅。②<strong>來找調停人</strong>：羅馬法學家的文獻裡，與主人起了衝突的奴僕，可以去找主人的朋友（<em>amicus domini</em>）代為求情，這樣不算逃亡；阿尼西謀可能是特意來找保羅的。③<strong>腓利門差來的</strong>：他是被派來服事保羅的，1:13「替你伺候我」或可支持。④<strong>親兄弟</strong>：少數人根據 1:16「按肉體」，認為兩人是血親，這一讀支持的人很少。本講義以前兩讀並為主要讀法，不作裁判。講台只講經文確定的三件事：他曾經沒有益處；他在保羅的捆鎖中被生；他現在被保羅送回主人家。</p><p>無論哪一讀，都要避開一個方向：把阿尼西謀的離開講成「這個逃奴犯了罪，活該回去受罰」。經文從來沒有這樣說。保羅講他的過去，只用了一個詞：沒有益處。然後立刻講如今。</p><p>這個「如今」是從哪裡來的？不是阿尼西謀自己努力變成有用的人，是他在捆鎖中被生了。改變的源頭是福音，不是一套改善計畫。名字終於名副其實，因為他被一位主改變了。</p><p>保羅叫他「我的孩子」。一個在羅馬法裡是財產的人，在保羅口中是兒子。321 的 235，「3」是屬靈的父母與兒女。這裡看得見那種關係的樣子：父親沒有隱藏孩子的過去，卻把孩子的名字放在自己的名字旁邊。</p>"},{"a":12,"z":12,"star":2,"grk":"<p lang=\"grc\">ὃν ἀνέπεμψά σοι αὐτόν, τοῦτʼ ἔστιν τὰ ἐμὰ σπλάγχνα ·</p>","lit":"<p>我把他送回給你——他本人，這就是我自己的心腸。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὃν ἀνέπεμψά σοι</td><td>hon anepempsa soi</td><td>我把他送回給你</td><td>書信式過去式；也是法律上「移送」的字</td></tr><tr><td>αὐτόν</td><td>auton</td><td>他本人</td><td>多餘的代名詞，加強語氣；和合本「親自」</td></tr><tr><td>τοῦτʼ ἔστιν</td><td>tout' estin</td><td>這就是</td><td>解釋的公式</td></tr><tr><td>τὰ ἐμὰ σπλάγχνα</td><td>ta ema splanchna</td><td>我自己的心腸</td><td>第二個「心」：心變成了一個人</td></tr></table>","gram":"<p><strong>ἀνέπεμψά（anepempsa） 是書信式過去式。</strong>寫信時，保羅還沒有把人送出去；但腓利門讀信時，人已經站在他面前了。保羅從讀信人的時間來寫，所以用過去式，和合本譯作「現在打發」很準確。這個動詞也是法律用語，指把案子移送給有權裁決的人，路 23:7 彼拉多把耶穌 ἀνέπεμψεν（anepempsen） 給希律，用的就是它。保羅把這個案子交給腓利門裁決。</p><p>句子在文法上不完整：ὃν（hon） 之後又來一個 αὐτόν（auton），接著是 τοῦτʼ ἔστιν τὰ ἐμὰ σπλάγχνα（tout' estin ta ema splanchna）。直譯是：他就是我的心腸。和合本譯作「他是我心上的人」（1:12），把比喻化開。σπλάγχνα（splanchna） 在 1:7 是眾聖徒的心，在這裡變成一個人。</p><blockquote><p>◆ 經文鑑別：SBLGNT、WH、Treg、NA28 在這一節沒有命令動詞；RP 多一個 προσλαβοῦ（proslabou），「你要收納他」。這個字很可能是抄寫的人為了補足不完整的句子，從 1:17 借過來的。較早的抄本沒有它，和合本也沒有。本講義從 SBLGNT 與和合本。效果很要緊：保羅在 1:12 還不說「收納」，他要先講完 1:13--16 的理由，等到 1:17 才第一次開口用命令語氣。</p></blockquote>","exp":"<p>〔西〕西 4:7--9（歌羅西書講義第 4 章）</p><p>「我現在打發他親自回你那裡去；他是我心上的人」（1:12）。這一句最容易被講歪，所以要先看清楚，阿尼西謀是怎樣回去的。</p><p>他不是一個人走回去的。第一，他手上有保羅的信，信裡寫著他的新身分。第二，他有同行的人：推基古帶著歌羅西書同去，「他是忠心的執事，和我一同作主的僕人」（西 4:7），保羅特別說阿尼西謀與他「同去」（西 4:9）。第三，這封信要在全教會面前念（1:2），整個家庭教會都是見證人。第四，保羅以自己擔保：收納他如同收納我，虧欠算在我帳上（1:17--19）。這是一個被保護的回去。</p><p>所以這一節不可以拿來叫受家暴的配偶、受虐的孩子、被剝削的移工或員工，回到傷害他的人那裡。那不是阿尼西謀的處境，也不是保羅的做法。人身安全受到威脅的時候，先保護生命、依法求助、通報，這是本講義的底線。和好如果有可能，需要悔改、擔保與安全，不是靠受傷一方的忍耐。</p><p>這一節還有另一面：保羅送走的，是他的心。他留得住，卻送回去。送一個人回去面對過去，對保羅也是代價。他不是把麻煩推回原處，是把自己的一部分交出去，託付給腓利門。</p><p>「心」這個字在全卷走了三步，這裡是中間那一步：你使眾聖徒的心暢快（1:7），現在我的心站在你門口。</p>"},{"a":13,"z":14,"star":2,"grk":"<p lang=\"grc\">ὃν ἐγὼ ἐβουλόμην πρὸς ἐμαυτὸν κατέχειν, ἵνα ὑπὲρ σοῦ μοι διακονῇ ἐν τοῖς δεσμοῖς τοῦ εὐαγγελίου,</p><p lang=\"grc\">χωρὶς δὲ τῆς σῆς γνώμης οὐδὲν ἠθέλησα ποιῆσαι, ἵνα μὴ ὡς κατὰ ἀνάγκην τὸ ἀγαθόν σου ᾖ ἀλλὰ κατὰ ἑκούσιον·</p>","lit":"<p>他，我一直想把他留在我自己身邊，好叫他替你在福音的捆鎖中服事我；</p><p>但沒有你的同意，我甚麼都不願意做，好叫你的善不是像出於強迫，乃是出於甘願。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἐβουλόμην</td><td>eboulomēn</td><td>我一直想要</td><td>未完成過去式：持續的心願</td></tr><tr><td>πρὸς ἐμαυτὸν κατέχειν</td><td>pros emauton katechein</td><td>留在我自己身邊</td><td>κατέχειν：抓住、扣住</td></tr><tr><td>ὑπὲρ σοῦ μοι διακονῇ</td><td>hyper sou moi diakonē</td><td>替你服事我</td><td>阿尼西謀服事保羅＝腓利門服事保羅</td></tr><tr><td>χωρὶς δὲ τῆς σῆς γνώμης</td><td>chōris de tēs sēs gnōmēs</td><td>但沒有你的同意</td><td>γνώμης：意見、同意</td></tr><tr><td>κατὰ ἀνάγκην</td><td>kata anankēn</td><td>出於強迫</td><td>勉強</td></tr><tr><td>κατὰ ἑκούσιον</td><td>kata hekousion</td><td>出於甘願</td><td>新約只此一處；甘心</td></tr></table>","gram":"<p><strong>兩個動詞的時態，畫出保羅的心。</strong>1:13 的 ἐβουλόμην（eboulomēn） 是未完成過去式：一直想、想了很久，卻沒有去做。1:14 的 ἠθέλησα（ēthelēsa） 是不定過去式：一個決定。保羅的心願是留下他，保羅的決定是不留。</p><p>ὑπὲρ σοῦ（hyper sou） 是巧妙的一筆：阿尼西謀如果留下，就是「替你」服事保羅。保羅把腓利門算進這份服事裡，好像腓利門已經在獄中服事他了。διακονῇ（diakonē） 是執事、服事的字，西 4:7 稱推基古為忠心的執事，用的是同一個字族。</p><p>1:14 的對照是 κατὰ ἀνάγκην（kata anankēn） 與 κατὰ ἑκούσιον（kata hekousion）：強迫與甘願。ἑκούσιον（hekousion） 這個形容詞在新約只出現這一次；彼得勸長老牧養群羊「不是出於勉強，乃是出於甘心」（彼前 5:2），用的是同字根的副詞 ἑκουσίως（hekousiōs）。τὸ ἀγαθόν σου（to agathon sou） 接回 1:6 παντὸς ἀγαθοῦ（pantos agathou）：那個抽象的「一切善」，在這裡變成腓利門要做的一件善事。</p><p>ὡς κατὰ ἀνάγκην（hōs kata anankēn） 前面有 ὡς（hōs），「好像」：保羅連「看起來像被迫」都不要。羅馬法對收容別人的奴僕有規定，保羅若留下他，在法律與情理上都要面對腓利門；他選擇不替腓利門作決定。</p>","exp":"<p>「我本來有意將他留下，在我為福音所受的捆鎖中替你伺候我。但不知道你的意思，我就不願意這樣行，叫你的善行不是出於勉強，乃是出於甘心」（1:13--14）。保羅有一個很真實的需要：他被關著，需要人照顧。阿尼西謀已經在照顧他。留下他，對保羅最方便。</p><p>但保羅不願意替腓利門作決定。這一節把 1:8--9 說到底：請求不是包裝過的命令。如果保羅先把人留下，再寫信「請」腓利門同意，那就是先斬後奏，腓利門只能點頭。保羅不這樣做，他把決定權完整地交回去。</p><p>「甘心」是這兩節的核心。一件善事若出於勉強，做的人會記帳，被接納的人也感覺得到。被迫收留的奴僕，在那個家裡永遠是一個提醒：主人輸了。出於甘心的接納不一樣，它讓兩個人都站得直。</p><p>這一點對今天的牧養很要緊。不可拿這封信逼一個受傷的人立刻接納、立刻饒恕；那正好違背 1:14。饒恕是把審判交給神，和好是雙方的路，需要時間、悔改和安全。保羅給腓利門留了空間，講台也要給聽的人留空間。</p><p>321 說謙卑對謙卑，達到雙贏。保羅先放下命令的權力，放下自己留人的心願；腓利門才有可能甘心地放下主人的權利。一方先讓，另一方才有地方站。</p>"},{"a":15,"z":16,"star":3,"grk":"<p lang=\"grc\">τάχα γὰρ διὰ τοῦτο ἐχωρίσθη πρὸς ὥραν ἵνα αἰώνιον αὐτὸν ἀπέχῃς,</p><p lang=\"grc\">οὐκέτι ὡς δοῦλον ἀλλὰ ὑπὲρ δοῦλον, ἀδελφὸν ἀγαπητόν, μάλιστα ἐμοί, πόσῳ δὲ μᾶλλον σοὶ καὶ ἐν σαρκὶ καὶ ἐν κυρίῳ.</p>","lit":"<p>因為或許他正是為了這個緣故被分開一時，好叫你永遠地全數得著他，</p><p>不再作為奴僕，乃是高過奴僕，作為親愛的弟兄——對我尤其是，何況對你，無論在肉身上，也在主裡。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>τάχα γὰρ</td><td>tacha gar</td><td>因為或許</td><td>保羅沒有把神的旨意說死</td></tr><tr><td>ἐχωρίσθη</td><td>echōristhē</td><td>他被分開了</td><td>被動語態：不說「他逃走了」</td></tr><tr><td>πρὸς ὥραν</td><td>pros hōran</td><td>一時</td><td>直譯「一個鐘頭」</td></tr><tr><td>αἰώνιον αὐτὸν ἀπέχῃς</td><td>aiōnion auton apechēs</td><td>你永遠全數得著他</td><td>ἀπέχῃς：收據上「全數收訖」</td></tr><tr><td>οὐκέτι ὡς δοῦλον</td><td>ouketi hōs doulon</td><td>不再作為奴僕</td><td>ὡς：看待他的方式</td></tr><tr><td>ἀλλὰ ὑπὲρ δοῦλον ἀδελφὸν ἀγαπητόν</td><td>alla hyper doulon adelphon agapēton</td><td>乃是高過奴僕，作為親愛的弟兄</td><td>全卷樞紐</td></tr><tr><td>καὶ ἐν σαρκὶ καὶ ἐν κυρίῳ</td><td>kai en sarki kai en kyriō</td><td>在肉身上，也在主裡</td><td>兩者都要</td></tr></table>","gram":"<p><strong>τάχα（tacha） 是「或許」。</strong>這個副詞在新約只出現兩次，另一次是「為仁人死，或者有敢做的」（羅 5:7）。保羅在 1:15 解釋阿尼西謀的離開，用的第一個字就是「或許」。他看見神的手可能在這件事裡，卻不把它說死。</p><p>ἐχωρίσθη（echōristhē） 是被動語態，「他被分開了」。保羅沒有說「他逃走了」，也沒有說「他離開了你」。這個被動有兩種讀法：一是「神的被動」，暗示背後有神的作為；一是保羅的委婉，避開一個刺耳的字，不讓腓利門一讀就想起損失。兩讀並陳。即使讀作神的被動，前面還有 τάχα（tacha） 管著。</p><p>πρὸς ὥραν（pros hōran） 直譯「一個鐘頭」，對比 αἰώνιον（aiōnion）「永遠」。ἀπέχῃς（apechēs） 是商業收據的字，意思是「全數收訖」：主說假冒為善的人「他們已經得了他們的賞賜」（太 6:2），原文是 ἀπέχουσιν（apechousin），同一個字。腓利門失去的是一時的奴僕，收到的是一個永遠的弟兄，而且是全數收到。</p><p>1:16 的 ὡς（hōs） 要看清楚。οὐκέτι ὡς δοῦλον（ouketi hōs doulon） 是「不再作為奴僕」：保羅說的是腓利門看待他的方式，沒有直接說他的法律身分已經改變。也有學者認為這裡連同 1:21 暗示釋放，兩讀並陳，見議題頁。ὑπὲρ δοῦλον（hyper doulon） 是「高過奴僕」，不是「不再有關係」，是關係往上升。ἀδελφὸν ἀγαπητόν（adelphon agapēton） 正是 1:1 提摩太的「弟兄」與腓利門的「親愛的」合在一起。</p><p>最後一句是 καὶ ἐν σαρκὶ καὶ ἐν κυρίῳ（kai en sarki kai en kyriō）：在肉身上，也在主裡。ἐν σαρκὶ（en sarki） 指日常的人際與社會關係，家裡、工作上；ἐν κυρίῳ（en kyriō） 指在主裡的身分。保羅用 καὶ（kai）……καὶ（kai），兩個都要。</p>","exp":"<p>〔加〕加 3:28（加拉太書講義第 3 章）</p><p>「他暫時離開你，或者是叫你永遠得著他」（1:15）。全卷地勢圖本章的第二個低谷：他離開了。下一節就是全卷最高的山。中間只隔一個「或者」。</p><p>「或者」這兩個字很重要。保羅沒有說「這都是神的計畫」，他說或許。在一段斷掉的關係裡，人常常急著替神說話：「這一切都是神的安排」。保羅比我們謹慎。他看見神可能在其中作工，卻不把阿尼西謀可能的過錯、腓利門受的損失，說成是神要它發生的。這不是說神不在掌權，是說人不該把傷害包裝成神的旨意。321 說聖靈是我的引導：在不確定裡看見神的手，卻不把話說滿。也說要改變觀點：從人眼中的「他離開了」看到「或者是叫你永遠得著他」，從暫時看到永遠。</p><p>「不再是奴僕，乃是高過奴僕，是親愛的兄弟」（1:16）。這是全卷的樞紐。在羅馬法裡，奴僕是 <em>res</em>，一件東西。現在，一件東西被叫成弟兄。保羅自己在加拉太書說過：「自主的、為奴的……因為你們在基督耶穌裡都成為一了」（加 3:28）；歌羅西書也說「為奴的、自主的，惟有基督是包括一切」（西 3:11）。在這裡，那幾句話有了一張臉。</p><p>新約不為奴隸制背書。保羅勸作奴僕的「若能以自由，就求自由」（林前 7:21；此節原文另有讀法），又把「搶人口和說謊話的」（提前 1:10）列在違背正道的事裡。腓利門書沒有寫成一篇廢奴宣言，它做的是另一件事：福音進到一個具體的家，把主人與奴僕的關係從裡面翻轉過來。</p><p>「這也不拘是按肉體說，是按主說」（1:16）。按主說，兩人是弟兄；按肉體說，也是。這個改變不只發生在聚會裡唱詩的時候，也要發生在家裡、帳本上、明天早上派工的時候。不能說「我們在主裡是弟兄」，然後在工資、休假、住處上照舊。歌羅西書早就說了：「你們作主人的，要公公平平地待僕人，因為知道你們也有一位主在天上」（西 4:1）。</p><p>這一點今天特別具體。家裡的看護、工廠的移工、派遣的員工，他們的處境和古代奴僕不同，不能直接畫上等號；但他們同樣容易被看成一份人力、一個成本。1:16 要求的，是在主日稱他弟兄的人，週一也這樣待他。</p><p>321 說人比事重要，關係比東西重要。腓利門書把這句話推到底：連一個被法律當成東西的人，都是弟兄。920 的「2」，在這裡是最難的那一個：一個曾經虧負你的人。</p>"},{"a":17,"z":19,"star":3,"grk":"<p lang=\"grc\">Εἰ οὖν με ἔχεις κοινωνόν, προσλαβοῦ αὐτὸν ὡς ἐμέ.</p><p lang=\"grc\">εἰ δέ τι ἠδίκησέν σε ἢ ὀφείλει, τοῦτο ἐμοὶ ἐλλόγα</p><p lang=\"grc\">ἐγὼ Παῦλος ἔγραψα τῇ ἐμῇ χειρί, ἐγὼ ἀποτίσω· ἵνα μὴ λέγω σοι ὅτι καὶ σεαυτόν μοι προσοφείλεις.</p>","lit":"<p>所以你若以我為夥伴，就接納他，如同接納我。</p><p>他若在甚麼事上虧負了你，或欠你甚麼，這個要記在我的帳上。</p><p>我保羅親手寫了：我必償還——免得我對你說，連你自己也另外欠我。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Εἰ οὖν με ἔχεις κοινωνόν</td><td>Ei oun me echeis koinōnon</td><td>所以你若以我為夥伴</td><td>κοινωνός：生意上的合夥人</td></tr><tr><td>προσλαβοῦ αὐτὸν ὡς ἐμέ</td><td>proslabou auton hōs eme</td><td>接納他，如同接納我</td><td>全信第一個命令語氣</td></tr><tr><td>ἠδίκησέν σε ἢ ὀφείλει</td><td>ēdikēsen se ē opheilei</td><td>虧負了你，或欠你</td><td>保羅沒有否認損失</td></tr><tr><td>τοῦτο ἐμοὶ ἐλλόγα</td><td>touto emoi elloga</td><td>這個記在我帳上</td><td>商業用字；RP 作 ἐλλόγει</td></tr><tr><td>ἐγὼ Παῦλος ἔγραψα τῇ ἐμῇ χειρί</td><td>egō Paulos egrapsa tē emē cheiri</td><td>我保羅親手寫了</td><td>一張具法律效力的欠條</td></tr><tr><td>ἐγὼ ἀποτίσω</td><td>egō apotisō</td><td>我必償還</td><td>法律用語；新約只此一處</td></tr><tr><td>σεαυτόν μοι προσοφείλεις</td><td>seauton moi prosopheileis</td><td>你自己也另外欠我</td><td>略過法：說「不用說」，其實說了</td></tr></table>","gram":"<p><strong>1:17 是全信第一個命令語氣。</strong>前面十六節，保羅都在感謝、懇求、說明；到這裡才說 προσλαβοῦ（proslabou），「收納他」。這也是 1:12 RP 異文借去的那個字：保羅真正的命令句，要等理由講完才出現。條件句 Εἰ οὖν με ἔχεις κοινωνόν（Ei oun me echeis koinōnon） 是當作事實的條件：你既然以我為夥伴。κοινωνόν（koinōnon） 與 1:6 的 κοινωνία（koinōnia） 同字根，1:6 的禱告在這裡落地。</p><p>προσλαβοῦ（proslabou） 是接到自己身邊來。保羅在羅馬書用同一個字說：「你們要彼此接納，如同基督接納你們一樣」（羅 15:7）。</p><p>1:18 的 εἰ δέ τι ἠδίκησέν σε ἢ ὀφείλει（ei de ti ēdikēsen se ē opheilei） 也是條件句。保羅說「若」，既沒有指控阿尼西謀，也沒有否認可能的損失。ἐλλόγα（elloga） 是商業用語，「記入帳上」。RP 作 ἐλλόγει（ellogei），同一個動詞的另一種變化，意思相同。同字根的 ἐλλογεῖται（ellogeitai） 出現在羅 5:13：「但沒有律法，罪也不算罪」（羅 5:13），「不算」就是「不記帳」。</p><p>1:19 保羅把筆從代筆人手上接過來，ἔγραψα τῇ ἐμῇ χειρί（egrapsa tē emē cheiri）：親手寫了。這是當時欠條的格式，ἀποτίσω（apotisō） 是法律上賠償的字。接著是修辭上的「略過法」：ἵνα μὴ λέγω σοι（hina mē legō soi），我並不用說——其實已經說了。腓利門很可能是透過保羅信主的，他欠保羅的是自己的生命。這句話有兩種讀法：一是溫和的施壓，一是帶著笑意的提醒。本講義兩讀並陳，略傾向幽默讀法，因為整封信的方向是 1:14 的甘心；但對收信人而言，恩情仍有重量。</p>","exp":"<p>「你若以我為同伴，就收納他，如同收納我一樣」（1:17）。接納有一個具體的動作：開門。保羅不要腓利門只在心裡原諒，他要腓利門把人接進門，用接待保羅的方式接待他：同一張桌子，同一間客房。</p><p>「他若虧負你，或欠你甚麼，都歸在我的帳上」（1:18）。全卷地勢圖本章的第三個低谷。保羅沒有說「過去的就算了」，沒有說「信了主，帳就一筆勾銷」。如果真有虧負，帳就是真的，有人要負責。經文沒有說阿尼西謀偷了甚麼，保羅只說「若」；但他預先把可能的帳都接過來。保羅的辦法不是取消那筆帳，是把它換一個名字：記在我名下。這是饒恕與和好不同的地方：和好不等於假裝沒有虧欠，也不等於免除責任。腓利門可能的損失被看見了，也被承擔了。</p><p>「我必償還，這是我－保羅親筆寫的」（1:19）。又一座山，緊接在谷底之後。每一次往下看見虧欠，下一節就有人把它扛起來。</p><p>讀到這裡，兩千年來許多讀者都停下來。路德在 1522 年的腓利門書序言裡說，我們都是基督的阿尼西謀，只要我們信——這是路德的話，不是經文。這使我們想起基督：神「不將他們的過犯歸到他們身上」（林後 5:19），又「使那無罪的，替我們成為罪」（林後 5:21）；羅 5:13 用的正是同字根的「記帳」。但要說清楚：保羅在這裡沒有教導代贖論，也沒有說阿尼西謀代表罪人。他是在處理一筆真實的帳。我們在這筆帳上想起十字架，是讀者的回應，不是保羅的論證。</p><p>「我並不用對你說，連你自己也是虧欠於我」（1:19）。這一句不可以拿來作講台上以恩情綁人的範本，好像屬靈領袖可以說：你的一切都是我給的，所以你要聽我的。保羅剛說完他要甘心（1:14）。他提這筆舊帳，較可能是朋友之間帶著笑的一句：我替他扛帳，你那邊其實也欠我一點，我就不提了。兩讀並陳，略傾向幽默讀法；但對收信人而言，恩情仍有重量，所以這句話只能由被欠的人輕輕說，不能由講台拿來要求人。</p><p>這三節要讓人記得的，不是保羅的口才，是那位把我們的帳記在自己名下的主。321 說無己：把別人的債寫在自己名下。保羅這樣做了，因為他先被這樣對待過。</p>"},{"a":20,"z":22,"star":1,"grk":"<p lang=\"grc\">ναί, ἀδελφέ, ἐγώ σου ὀναίμην ἐν κυρίῳ· ἀνάπαυσόν μου τὰ σπλάγχνα ἐν Χριστῷ</p><p lang=\"grc\">πεποιθὼς τῇ ὑπακοῇ σου ἔγραψά σοι, εἰδὼς ὅτι καὶ ὑπὲρ ἃ λέγω ποιήσεις.</p><p lang=\"grc\">ἅμα δὲ καὶ ἑτοίμαζέ μοι ξενίαν, ἐλπίζω γὰρ ὅτι διὰ τῶν προσευχῶν ὑμῶν χαρισθήσομαι ὑμῖν.</p>","lit":"<p>是的，弟兄，願我在主裡從你得著益處；請使我的心腸在基督裡得歇息。</p><p>我因確信你的順從，寫信給你，知道你所要行的，甚至會過於我所說的。</p><p>同時也請為我預備客房，因為我盼望藉著你們的禱告，我必被恩賜給你們。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἐγώ σου ὀναίμην ἐν κυρίῳ</td><td>egō sou onaimēn en kyriō</td><td>願我在主裡從你得益處</td><td>ὀναίμην：與阿尼西謀的名字同字根</td></tr><tr><td>ἀνάπαυσόν μου τὰ σπλάγχνα</td><td>anapauson mou ta splanchna</td><td>使我的心腸得歇息</td><td>第三個「心」；呼應 1:7</td></tr><tr><td>πεποιθὼς τῇ ὑπακοῇ σου</td><td>pepoithōs tē hypakoē sou</td><td>確信你的順從</td><td>順從誰？</td></tr><tr><td>ὑπὲρ ἃ λέγω ποιήσεις</td><td>hyper ha legō poiēseis</td><td>會過於我所說的</td><td>是否暗示釋放？</td></tr><tr><td>ἑτοίμαζέ μοι ξενίαν</td><td>hetoimaze moi xenian</td><td>為我預備客房</td><td>保羅要親自來</td></tr><tr><td>χαρισθήσομαι ὑμῖν</td><td>charisthēsomai hymin</td><td>我必被恩賜給你們</td><td>被動語態；你們：複數</td></tr></table>","gram":"<p><strong>ὀναίμην（onaimēn） 是全卷最後一個雙關。</strong>它是 ὀνίνημι（oninēmi） 的祈願語氣，新約只此一處，意思是「願我得益處」。阿尼西謀的名字 Ὀνήσιμος（Onēsimos） 就是從這個字根來的。保羅等於說：願我從你那裡得著「阿尼西謀」。和合本註腳：「快樂：或譯益處」，和合本正文「因你得快樂」取引申義，註腳保留字根的意思。</p><p>ἀνάπαυσόν μου τὰ σπλάγχνα（anapauson mou ta splanchna） 是 1:7 的回音：同一個動詞，同一個「心腸」。◆ 句末 SBLGNT 作 ἐν Χριστῷ（en Christō），和合本「在基督裡」照它；RP 作 ἐν κυρίῳ（en kyriō），可能受同節前半 ἐν κυρίῳ（en kyriō） 影響而改得一致。</p><p>1:21 的 ὑπακοῇ（hypakoē） 是「順從」，順從的對象沒有說明：可能是保羅的請求，也可能是福音本身。兩讀並陳；無論哪一讀，都是順服保羅在主裡所求的（終究是順服主），不是對個人無條件的服從。ὑπὲρ ἃ λέγω（hyper ha legō） 是「過於我所說的」，有人讀作暗示釋放阿尼西謀，有人讀作泛指更多的善待，兩讀並陳，見議題頁。1:22 的 προσευχῶν ὑμῶν（proseuchōn hymōn） 和 χαρισθήσομαι ὑμῖν（charisthēsomai hymin） 都是複數，整個家庭教會一起禱告；χαρισθήσομαι（charisthēsomai） 是被動語態：保羅能不能出監，是神的恩賜。</p>","exp":"<p>「兄弟啊，望你使我在主裡因你得快樂，並望你使我的心在基督裡得暢快」（1:20）。保羅最後一次叫他「兄弟」。他求的益處，不是錢，是一個人被好好接住。阿尼西謀被接納，保羅的心就得了歇息。</p><p>「我寫信給你，深信你必順服，知道你所要行的必過於我所說的」（1:21）。這句話是信任，不是威脅。腓利門要順服的，是保羅在主裡所求的（終究是順服主），不是對個人無條件的服從。它也不可以被拿來壓制提問，好像「順服」就是不准問為甚麼。保羅給了腓利門十幾節的理由，正是因為他尊重腓利門的思考。</p><p>「此外你還要給我預備住處」（1:22）。保羅要親自來。這讓整封信有了後續：這不是一次寫完就算的請求，保羅會來看，阿尼西謀在那個家過得怎樣，他會知道。被接回來的人，不是交出去就沒人管了。保羅的盼望也不是靠自己的手段，是靠「你們的禱告」（1:22），他把出監的事交在神手裡，把阿尼西謀的事交在一個會禱告的家裡。</p>"},{"a":23,"z":25,"star":2,"grk":"<p lang=\"grc\">Ἀσπάζεταί σε Ἐπαφρᾶς ὁ συναιχμάλωτός μου ἐν Χριστῷ Ἰησοῦ,</p><p lang=\"grc\">Μᾶρκος, Ἀρίσταρχος, Δημᾶς, Λουκᾶς, οἱ συνεργοί μου.</p><p lang=\"grc\">Ἡ χάρις τοῦ κυρίου Ἰησοῦ Χριστοῦ μετὰ τοῦ πνεύματος ὑμῶν</p>","lit":"<p>以巴弗，我在基督耶穌裡的同囚，問候你，</p><p>還有馬可、亞里達古、底馬、路加，我的同工們。</p><p>主耶穌基督的恩典與你們的靈同在。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ἐπαφρᾶς ὁ συναιχμάλωτός μου</td><td>Epaphras ho synaichmalōtos mou</td><td>以巴弗，我的同囚</td><td>戰俘的字；歌羅西教會的創立者</td></tr><tr><td>Μᾶρκος, Ἀρίσταρχος, Δημᾶς, Λουκᾶς</td><td>Markos, Aristarchos, Dēmas, Loukas</td><td>馬可、亞里達古、底馬、路加</td><td>西 4:10--14 同一批人</td></tr><tr><td>οἱ συνεργοί μου</td><td>hoi synergoi mou</td><td>我的同工們</td><td>接回 1:1「同工」</td></tr><tr><td>Ἡ χάρις τοῦ κυρίου Ἰησοῦ Χριστοῦ</td><td>Hē charis tou kyriou Iēsou Christou</td><td>主耶穌基督的恩典</td><td>◆ RP 加「我們」</td></tr><tr><td>μετὰ τοῦ πνεύματος ὑμῶν</td><td>meta tou pneumatos hymōn</td><td>與你們的靈同在</td><td>ὑμῶν 複數；◆ RP 加「阿們」</td></tr></table>","gram":"<p><strong>συναιχμάλωτός（synaichmalōtos） 本是戰俘的字。</strong>αἰχμάλωτος（aichmalōtos） 是在戰場上被擄的人，前面加上「同」的字首，就是一同被擄。歌羅西書用它稱亞里達古（西 4:10），這裡用它稱以巴弗。保羅用一串「同」字頭的字把同伴串起來：同工、同兵、同囚。</p><p>1:23 的動詞 Ἀσπάζεταί（Aspazetai） 是單數，後面卻掛了五個名字：以巴弗是主詞，1:24 的四個人是補上的。</p><p>1:25 的 ὑμῶν（hymōn） 是複數。全信從 1:4 起幾乎都用單數「你」，對腓利門一個人說話；最後一句卻換成複數：恩典與你們的靈同在。這封私人信，把恩給了整個家庭教會。和合本作「你的心裡」，用單數，這裡要靠原文補回來。</p><blockquote><p>◆ 經文鑑別：SBLGNT、WH、Treg、NA28 作 τοῦ κυρίου Ἰησοῦ Χριστοῦ（tou kyriou Iēsou Christou），句末沒有 ἀμήν（amēn）；RP 在 κυρίου（kyriou） 後加 ἡμῶν（hēmōn），句末加 Ἀμήν（Amēn）。和合本「我們主」「阿們」跟 RP。書信結尾的「阿們」很容易在教會誦讀時被加上去；部分重要抄本（如 A、D*）沒有，ℵ、C 等有，本講義從 SBLGNT；講台照和合本讀，不必更改。和合本的「常」是小字補字，原文沒有這個字，是譯者為了文意通順補上的。</p></blockquote>","exp":"<p>〔背景〕徒 15:37--39（使徒行傳講義第 15 章）</p><p>〔提後〕提後 4:10--11（提摩太後書講義第 4 章）</p><p>「為基督耶穌與我同坐監的以巴弗問你安。與我同工的馬可、亞里達古、底馬、路加也都問你安」（1:23--24）。以巴弗是把福音帶到歌羅西的人（西 1:7），腓利門很可能認識他。亞里達古陪保羅坐船去羅馬（徒 27:2）。</p><p>馬可的名字值得停一下。使徒行傳講義第 15 章講過，「馬可從前在旁非利亞離開他們」（徒 15:38），保羅與巴拿巴為他起了爭論。現在他站在保羅身邊，名列同工。後來保羅還說：「你來的時候，要把馬可帶來，因為他在傳道的事上於我有益處」（提後 4:11）。「有益處」正是 1:11 說阿尼西謀的那個字。名單上有兩個曾經「沒有益處」、後來有益處的人。</p><p>底馬也在名單上。後來保羅寫：「底馬貪愛現今的世界，就離棄我往帖撒羅尼迦去了」（提後 4:10）。團隊名單是真實的，不是完美的。不要用底馬羞辱離開教會的人，我們不知道他的結局，保留的是禱告與盼望；也不要用馬可說「離開的人一定會回來」，馬可的回轉是恩典，不是保證。321 的 235，「5」是團隊：一份真實的名單，有人回來，有人離開，都在神手裡。</p><p>「願我們主耶穌基督的恩常在你的心裡。阿們」（1:25）。全卷的最後一個字是恩。腓利門要接納阿尼西謀，不能只靠意志力；一個人咬著牙開門，門很快又會關上。這封信的次序是：先有恩，才有接納。全家庭教會一起被恩托住，那張桌子才坐得下一個回來的人。</p>"}]},"serm":{"1":{"min":18,"blocks":[["h","《不再是奴僕，乃是高過奴僕，是親愛的兄弟》"],["p","弟兄姊妹平安，今天我們一起讀腓利門書。整卷只有一章，二十五節。"],["q","歌羅西，黃昏。炊煙升起來，街上的人往家裡走。"],["p","有一戶人家，院子裡有說話的聲音，有碗盤碰在一起的聲音。"],["p","今天是聚會的日子。主人站在門口招呼弟兄姊妹。他叫腓利門。"],["p","這時候，巷口走來兩個人，腳上都是灰。"],["p","走在前面的叫推基古，懷裡揣著一封信，是保羅從監牢裡寄出來的。"],["p","走在後面的那一個，一直低著頭。"],["p","這條巷子他太熟了。哪一塊石板是鬆的，他都知道。"],["p","因為他從前就住在這裡。他是這一家的奴僕。"],["q","他的名字，叫阿尼西謀。"],["p","他從前與主人沒有益處，可能還欠了主人甚麼。"],["p","推基古抬手敲門。院子裡的聲音，停了一下。"],["q","門開了。"],["p","腓利門看見推基古，臉上先是笑。然後，他看見推基古身後那張臉。"],["p","弟兄姊妹，請你停在這一刻。"],["p","門裡面，是一屋子的弟兄姊妹，和一個受過損失的主人。"],["p","門外面，是一個曾經離開、現在回來的人。"],["p","兩個人中間，只隔著一封信。"],["p","這封信裡有三個人。"],["p","寫信的保羅：能命令，卻求；能把人留下，卻送回；能把帳算清，卻扛起來。"],["p","收信的腓利門：有權利，有理由，卻被邀請放下。"],["p","送信的阿尼西謀：曾經沒有益處，現在站在門口。"],["p","你可能會在這三個人當中看見自己。"],["p","可是我盼望，你最後看見的是另一位。"],["p","這一章有三個字：愛，求，收。"],["p","我們走三步：一個讓人心得暢快的家；從奴僕到兄弟；都歸在我的帳上。"],["q","第一步：一個讓人心得暢快的家。"],["p","推基古把信打開。客廳安靜下來，聽第一句。"],["q","「為基督耶穌被囚的保羅，同兄弟提摩太寫信給我們所親愛的同工腓利門」（1:1）"],["p","保羅在別的書信，開口常說自己是使徒。這一封，他說：被囚的。"],["p","原文這個字，就是被綁住的人。"],["p","一封要請人做難事的信，第一行，作者先把權柄放在門外。"],["p","他叫腓利門「親愛的同工」。不是下屬，是同工。"],["p","請你記住兩個稱呼：提摩太是「兄弟」，腓利門是「親愛的」。"],["p","等一下，這兩個稱呼會合在一起，落在門口那個人身上。"],["q","「和妹子亞腓亞並與我們同當兵的亞基布，以及在你家的教會。」（1:2）"],["p","一件家務事，為甚麼要在全教會面前念？"],["p","不是要讓腓利門下不了台。是因為一個人被接回來，從來不只是兩個人之間的事。"],["p","他要回到一個家，也要回到一張聚會的桌子。教會在場，是見證，也是保護。"],["p","屬神的體系，最小的單位就在這裡：一個家，一個客廳，一群人。"],["p","它的考驗也在這裡：一個回來的奴僕，坐不坐得上那張桌子。"],["q","「願恩惠、平安從神我們的父和主耶穌基督歸與你們！」（1:3）"],["p","這封信從恩開始，也會在恩裡結束。"],["p","中間那個很難的請求，是夾在兩層恩典之間的。"],["p","然後，保羅沒有馬上開口求。他先感謝。"],["q","「我禱告的時候提到你，常為你感謝我的神」（1:4）"],["q","「因聽說你的愛心並你向主耶穌和眾聖徒的信心。」（1:5）"],["p","「聽說」，原文是一直在聽見。消息不斷地傳進監牢裡。"],["p","請你聽那個「眾」字。保羅寫這句話的時候，眾聖徒的名單上，已經多了一個人。"],["p","我們每個人的愛心，常常有一張看不見的名單。名單上，是容易愛的人。"],["p","保羅沒有批評腓利門的名單太短。他只是先感謝，然後輕輕地放上一個名字。"],["q","「願你與人所同有的信心顯出功效，使人知道你們各樣善事都是為基督做的。」（1:6）"],["p","這一句各家讀法不同。我們只抓住一個詞：功效，就是做出來。"],["p","一個教會的信心有多真，要看它門口站著一個曾經虧負人的人時，門開不開得了。"],["q","「兄弟啊，我為你的愛心，大有快樂，大得安慰，因眾聖徒的心從你得了暢快。」（1:7）"],["p","「心」，原文是心腸，人裡面最深、最軟的地方。"],["p","「暢快」，是讓人停下來，歇一口氣。這使我們想起主耶穌的話，同一個動詞："],["q","「凡勞苦擔重擔的人可以到我這裡來，我就使你們得安息。」（太 11:28）"],["p","主使人得安息。腓利門，是那安息經過的一雙手。"],["p","到他家的人，進門是累的，出門是輕省的。"],["p","弟兄姊妹，你有沒有這樣一個家？一進門，就可以把肩膀放下來的家？"],["p","腓利門不是壞人。他已經是一個好弟兄。"],["p","保羅不是要他變成另一個人，是請他做回自己。"],["p","把一向在做的事，多做一次，做在一個最難的人身上。"],["p","可是一個好人的愛，最真實的考驗，不在大家都喜歡的人身上。"],["p","推基古翻到下一段。腓利門大概已經猜到，接下來要說的是誰了。"],["q","第二步：從奴僕到兄弟。"],["q","「我雖然靠著基督能放膽吩咐你合宜的事」（1:8）"],["p","「吩咐」，是有權柄者下命令的字。保羅有這個權柄，而且很多。"],["q","「然而像我這有年紀的保羅，現在又是為基督耶穌被囚的，寧可憑著愛心求你」（1:9）"],["p","然後，他選擇不用。"],["p","命令能得到順從。請求，才能得到心。"],["p","被迫收留的人，回家第一天，那份接納就會露出縫來。"],["p","有年紀的，又是被囚的。一個老囚犯拿甚麼壓人？他只剩下愛可以用。"],["p","作父母的、作主管的，請你在這裡停一下：能下命令的時候，你選擇開口求嗎？"],["q","「就是為我在捆鎖中所生的兒子阿尼西謀求你。」（1:10）"],["p","原文的字序很特別。"],["p","保羅先說「我的孩子」，再說「在捆鎖中所生的」，最後一個字，才是那個名字。"],["p","你可以想像那一刻。客廳裡有人轉過頭，看向站在門邊的那個人。"],["p","腓利門聽見名字以前，已經先聽見了這個人在保羅心裡的位置。"],["p","在羅馬法裡，他是財產。在保羅口中，他是兒子。"],["q","「他從前與你沒有益處，但如今與你我都有益處。」（1:11）"],["p","阿尼西謀這個名字，就是有益處的意思。主人給奴僕取名叫「有用的」，像給工具貼標籤。"],["p","可是這個叫有用的人，從前沒有用。"],["p","保羅很公道，他沒有替阿尼西謀粉飾。腓利門吃過虧，保羅承認。"],["p","這是全章最低的地方。可是保羅只用一個詞講他的過去，然後立刻說：如今。"],["p","這個如今不是他自己努力來的。是他在捆鎖中被生了。改變的源頭是福音。"],["q","名字，終於名副其實了。"],["p","弟兄姊妹，你身上也有一個不想再提的從前嗎？"],["p","福音沒有抹掉你的從前。福音給你一個如今。"],["q","「我現在打發他親自回你那裡去；他是我心上的人。」（1:12）"],["p","「心上的人」，原文直譯是：他就是我的心腸。保羅送走的，是自己的心。"],["p","可是這一節最容易被講歪。我們一定要看清楚，他是怎樣回去的。"],["p","他手上有保羅的信。他有同行的人："],["q","「我又打發一位親愛忠心的兄弟阿尼西謀同去；他也是你們那裡的人。」（西 4:9）"],["p","推基古陪他一路走到門口。"],["p","這封信要在全教會面前念，大家都是見證人。"],["p","保羅還親自擔保，虧欠記在他的帳上。"],["q","這是一個被保護的回去。"],["p","所以，這一節絕不可以拿來叫受家暴的配偶、受虐的孩子、被剝削的移工，回到傷害他的人那裡。"],["p","如果你的人身安全受到威脅，請你先保護生命，依法求助，找人通報。"],["p","教會要站在你旁邊，不是站在門口把你推回去。"],["p","和好如果有可能，需要悔改、擔保和安全，不是靠受傷那一方的忍耐。"],["q","「我本來有意將他留下，在我為福音所受的捆鎖中替你伺候我。」（1:13）"],["p","「有意」，原文是一直想。保羅被關著，需要人照顧。留下他，最方便。"],["q","「但不知道你的意思，我就不願意這樣行，叫你的善行不是出於勉強，乃是出於甘心。」（1:14）"],["p","如果先把人留下，再寫信請腓利門同意，那是先斬後奏，腓利門只能點頭。"],["p","保羅不這樣做。他把決定權，完整地交回去。"],["p","原文這個形容詞，在新約只出現這一次。"],["p","出於勉強的善事，做的人會記帳。出於甘心的接納，讓兩個人都站得直。"],["p","請求就是請求，不是包裝過的命令。"],["p","所以這封信不可以拿來逼一個受傷的人立刻饒恕、立刻接納。那正好違背第十四節。"],["p","饒恕，是把審判交給神。和好，是兩個人的路，需要時間，也需要真實的悔改。"],["p","饒恕不等於和好，也不等於一筆勾銷。"],["q","「他暫時離開你，或者是叫你永遠得著他」（1:15）"],["p","請你聽那兩個字：或者。保羅沒有說這一切都是神的計畫。他說，或許。"],["p","他看見神的手可能在這裡面，卻不把話說滿。"],["p","所以，沒有人可以對一個受傷的人說：你受的傷，是神要它發生的。"],["p","可是神也能在破碎的地方，作出人想不到的事。這兩句話，我們都要說。"],["p","還有，保羅說「離開」，原文用的是被動：他被分開了。他沒有說「他逃走了」。"],["p","暫時，原文是一個鐘頭。「得著」，是收據上的字：全數收訖。"],["p","你失去的，是一時的奴僕。你全數收到的，是一個永遠的弟兄。"],["q","「不再是奴僕，乃是高過奴僕，是親愛的兄弟。」（1:16）"],["p","還記得第一節那兩個稱呼嗎？兄弟，親愛的。現在合在一起，落在門口那個人身上。"],["q","一件東西，被叫成了弟兄。"],["q","「自主的、為奴的，或男或女，因為你們在基督耶穌裡都成為一了。」（加 3:28）"],["p","這句話在這裡，有了一張臉。"],["p","我們要說清楚：新約不為奴隸制背書。保羅把「搶人口」的列在敵正道的事裡（提前 1:10）。他對作奴僕的人說："],["q","「若能以自由，就求自由更好。」（林前 7:21）"],["p","腓利門書沒有寫成一篇宣言。"],["p","它讓福音進到一個家，把主人和奴僕的關係，從裡面翻過來。"],["q","「這也不拘是按肉體說，是按主說。」（1:16）"],["p","按主說，是弟兄。按肉體說，也是弟兄。兩個都要。"],["p","不只在主日唱詩的時候，也在家裡，在帳本上，在明天早上派工的時候。"],["p","我們在好幾個國家生活。很多家裡有看護，很多工廠有移工，很多公司有派遣的同事。"],["p","他們不是古代的奴僕。可是他們一樣容易被看成一份人力，一筆成本。"],["p","你主日稱他弟兄，週一的工資、休假、住處，怎麼待他？"],["p","人比事重要，關係比東西重要。連一個被法律當成東西的人，都是弟兄。"],["p","可是腓利門心裡可能還卡著一件事：好，他是弟兄。那我的損失呢？"],["p","保羅知道。所以，他拿起了筆。"],["q","第三步：都歸在我的帳上。"],["q","「你若以我為同伴，就收納他，如同收納我一樣。」（1:17）"],["p","前面十六節，都在感謝、懇求、說明。"],["p","到這裡，才第一次用命令的語氣：收納他。"],["p","「同伴」，是生意上的合夥人。第六節為信心的團契禱告，在這裡落地了。"],["p","收納，不是只在心裡原諒，是把人接進門。"],["p","用接待保羅的方式接待他。同一張桌子，同一間客房。"],["q","「所以，你們要彼此接納，如同基督接納你們一樣」（羅 15:7）"],["q","「他若虧負你，或欠你甚麼，都歸在我的帳上」（1:18）"],["p","保羅沒有說：過去的就算了。也沒有說：信了主，帳就一筆勾銷。"],["q","帳是真的。虧負是真的。有人要負責。"],["p","保羅的辦法，不是取消那筆帳，是換一個名字：記在我名下。"],["q","「我必償還，這是我－保羅親筆寫的。」（1:19）"],["q","牢房裡，保羅把筆從代筆的人手上接過來，一筆一筆，寫下自己的名字。"],["p","一個坐監的老人，口袋裡未必有錢。可是他簽了。"],["p","第十八節是谷底：虧負，欠。第十九節，馬上是一座山：我必償還。"],["p","讀到這裡，兩千年來許多人都停了下來。"],["p","馬丁路德說過：只要我們信，我們都是基督的阿尼西謀。"],["p","保羅在這裡沒有教導代贖論，也沒有說阿尼西謀代表罪人。他處理的是一筆真實的帳。"],["p","可是這一筆帳，使我們想起另一筆帳。「歸在帳上」這個字，和羅馬書說「罪也不算罪」（羅 5:13）的「算」同一個字根。"],["q","「神使那無罪的，替我們成為罪，好叫我們在他裡面成為神的義。」（林後 5:21）"],["p","同一段經文還說，神「不將他們的過犯歸到他們身上」（林後 5:19）。"],["p","我們的帳，沒有被假裝不存在。它被記到另一位的名下。"],["p","那一位不是簽了一張借據。他在十字架上，把它付清了。"],["q","「我並不用對你說，連你自己也是虧欠於我。」（1:19）"],["p","這一句，有人讀成溫和的施壓，有人讀成帶笑的提醒。"],["p","保羅剛說過要甘心，我寧可聽成朋友之間的一句玩笑。"],["p","但對收信的人來說，恩情仍有重量。"],["p","這句話絕不可以變成講台上綁人的話：你的一切是我給的，所以你要聽我的。"],["q","「兄弟啊，望你使我在主裡因你得快樂，並望你使我的心在基督裡得暢快。」（1:20）"],["p","「快樂」，和合本註腳說也可譯作「益處」，和阿尼西謀的名字同一個字根。"],["p","保羅等於說：願我從你那裡，得著一個阿尼西謀。"],["p","然後是第三次「心」。"],["p","你使眾聖徒的心暢快；我的心站在你門口；也請你讓我的心暢快。"],["q","「我寫信給你，深信你必順服，知道你所要行的必過於我所說的。」（1:21）"],["p","這是信任，不是威脅。過於我所說的是甚麼？保羅沒有說破，空間留給腓利門。"],["q","「此外你還要給我預備住處」（1:22）"],["p","保羅要親自來。阿尼西謀在那個家過得怎樣，他會知道。"],["p","被接回來的人，不是交出去，就沒有人管了。"],["q","「與我同工的馬可、亞里達古、底馬、路加也都問你安。」（1:24）"],["p","以巴弗和這四個人一起問安。馬可從前半途離開過，現在名列同工。"],["p","後來保羅說，他在傳道的事上於我有益處。正是說阿尼西謀的那個字。"],["p","底馬後來離開了。團隊名單是真實的，不是完美的。"],["p","我們不拿底馬羞辱離開教會的人，我們保留的是禱告。"],["p","我們也不說，離開的人都會回來。馬可的回轉是恩典，不是保證。"],["p","然後，是最後一句。"],["q","「願我們主耶穌基督的恩常在你的心裡。阿們！」（1:25）"],["p","最後一個字，是恩。從第三節的恩開始，在恩裡結束。"],["p","這個「你的」，原文是複數：你們的。恩給了整個家。"],["p","因為腓利門要開那扇門，不能只靠咬牙。咬著牙開的門，很快又會關上。"],["q","先有恩，才有接納。"],["q","推基古念完了信。客廳裡沒有人說話。腓利門看著門口那個人。"],["p","經文沒有告訴我們，那天晚上腓利門怎麼做。"],["p","可是這封信被保存下來了。我們有理由盼望，那扇門開了。"],["p","今天，你是哪一個？"],["p","也許你像阿尼西謀，有一個不想再提的從前。"],["p","這使我們想起那位主：他使那無罪的替我們成為罪（林後 5:21），在你開口以前，已經替你擔保。"],["p","也許你是腓利門。不要咬牙，先讓恩進來；如果那個人還在傷害你，先求安全。"],["p","也許你是保羅。試著開口求，不是下令；試著替一個人扛一點帳。"],["p","可是弟兄姊妹，讀完這封信，請你不要更佩服保羅的口才。"],["p","保羅會這樣寫，是因為他的帳也先被記在另一位的名下。"],["p","那一位，就是我們的主耶穌。他的恩，常在你的心裡。"],["p","這個禮拜，請你想一想：你家的門口、你教會的門口，站著誰？"],["p","不要急著開門，也不要急著關門。先把他的名字，帶到主面前。"],["p","我們一起低頭禱告。"]]}},"issues":[{"id":"ISS00_1","t":"書信的處境與原則：一封寫給家庭教會的私人信，該怎麼讀？","r":"1:1--3；西 4:7--17","ch":[],"why":"一、一封私人信，在全教會面前念出來——本講義的全卷立場之一（本卷新立）。腓利門書是新約最私人的一封信：寫給一個人，談一件家務事，關乎一個奴僕的去留；收信人卻有四組——腓利門、亞腓亞、亞基布，「以及在你家的教會」。若不在開卷講定這封信的處境（歌羅西、羅馬法下奴僕是財產、家庭教會、與歌羅西書同一趟送出）與保羅從福音推出的原則，全卷會被講成兩種極端：一種是只屬於古代主僕之間的私事，與今天無關；另一種是把一封「求」的信，直接搬成今天的命令，壓在受傷的人身上。","pos":[["【一】經文問的是甚麼","","<p>信的開頭很長，收信人一個接一個點名：「寫信給我們所親愛的同工腓利門，和妹子亞腓亞並與我們同當兵的亞基布，以及在你家的教會」（1:1--2）。可是從第 4 節起，信裡的「你」幾乎全是單數，對腓利門一個人說話；只有問安（1:3）、盼望（1:22）與祝福（1:25）用複數，把整個家庭教會包了進來。</p><p>處境要先擺出來。腓利門住在歌羅西（西 4:9 說阿尼西謀「也是你們那裡的人」），有房子可以接待聚會，有奴僕；很可能是透過保羅信主的（1:19）。在羅馬法裡，奴僕是主人的財產（<em>res</em>），沒有法律上的人格；離開主人的奴僕，被抓回來可能受重罰。歌羅西書與這封信是同一趟送出的：「我又打發一位親愛忠心的兄弟阿尼西謀同去；他也是你們那裡的人」（西 4:9）；同一批同工（西 4:10--14）、同一位亞基布（西 4:17）。阿尼西謀為甚麼在保羅身邊，經文沒有明說，有四種讀法（逃走的奴僕、主動來找主人的朋友求情、腓利門差他來服事保羅、少數說二人是兄弟）。<strong>經文問的是：這是一封私人信，還是一封教會的信？讀這封信，哪些是處境、哪些是原則？今天這原則落在哪裡？</strong></p>"],["私人推薦信說（一封朋友之間的求情信）","","<p>許多讀者把腓利門書看成希臘羅馬世界常見的推薦信或求情信：一位有份量的朋友，替一個得罪主人的人說情。最常被拿來對照的是小普林尼寫給朋友薩比尼亞努的信，替一位得罪主人、跑來求他的被釋奴說情。這派的優點是讀得很具體：信的開場先肯定對方（1:4--7），接著請求（1:8--20），最後結語（1:21--22），修辭結構完整，是一封真實的、有溫度的信。</p><p><strong>難處：</strong>若只是一封朋友之間的私信，保羅不必點名亞腓亞、亞基布，更不必寫上「在你家的教會」。而且兩封信的落點完全不同：普林尼勸主人看在那人哭泣悔改的份上寬恕他，恩主與被釋奴的從屬關係照舊；保羅卻說「不再是奴僕，乃是高過奴僕，是親愛的兄弟」（1:16）。只把它當成私人求情信，會漏掉這封信真正新的地方——福音進到一個家，改變了家裡每一個人彼此的稱呼。</p>"],["教會公開信說（刻意在全教會面前念）","","<p>另一派強調 1:2 的「在你家的教會」：保羅刻意讓全教會聽見這封信，家務事因此成了教會的事。阿尼西謀回來，不是只有主人一個人在決定，是一整個聚會在看這個家怎樣接待一個回來的人；保羅又說他要來，請腓利門「預備住處」（1:22）——這封信的結果，全教會都會看見。這派的優點是看見了 321 所說「建立屬神的體系」的最小單位：一個客廳、一張桌子、一封被念出來的信。</p><p><strong>難處：</strong>若把「公開」讀成保羅用群眾的眼光逼腓利門就範，就違背了保羅自己說的「叫你的善行不是出於勉強，乃是出於甘心」（1:14）。信的主體仍是單數的「你」，對腓利門一個人說話；教會在這封信裡的角色是見證與扶持，不是陪審團。把這封信講成「在眾人面前施壓」的範本，正好落入本卷最常見的誤用：把一封「求」的信講成一道命令（見 ISS00_4）。</p>"],["亞基布說（真正的主人是亞基布）","","<p>二十世紀有學者（諾克斯 John Knox）提出：阿尼西謀的主人其實是亞基布，信是在他家的教會裡念的；歌羅西書末了那句「要對亞基布說：『務要謹慎，盡你從主所受的職分。』」（西 4:17）正是要他按這封信去做；甚至主張歌羅西書提到的「從老底嘉來的書信」（西 4:16）就是這封信。這派的優點是認真處理了兩封信之間的關聯，提醒讀者兩封信要一起讀。</p><p><strong>難處：</strong>信的第一個收信人是腓利門，1:2 的「你家」最自然是接著前面第一個名字說的；西 4:17 的「職分」也沒有說是甚麼事。這派的推論一層疊一層，多數解經家沒有接受。本講義照最自然的讀法：主人是腓利門，亞基布可能是他家的人，但經文沒有明說，不定論。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：這是一封寫給一個人的私人信，卻在家庭教會面前念出來——私事放在恩典的群體裡處理。全卷照「書信」三問讀：①受信人遇到甚麼？一個在家裡接待教會的主人，門口站著一個曾經虧負他、帶著保羅的信回來的奴僕。②保羅從福音推出甚麼原則？在主裡是親愛的兄弟；憑愛心求、不憑命令；甘心不是勉強；收納他如同收納我；虧負的帳有人擔保。③今天這原則落在哪裡？家、教會、職場、移工與看護、斷裂的關係。</strong></p><p>阿尼西謀的處境，本講義以「逃走的奴僕」與「主動來找主人的朋友求情」兩讀並為主要讀法，不裁判；講台只講經文確定的三件事——他從前「與你沒有益處」（1:11），他是保羅「在捆鎖中所生的兒子」（1:10），他現在被打發回去（1:12）。</p><p><strong>腓利門書與歌羅西書要一起讀：家規在歌羅西書是原則，在腓利門書是一個有名字的人。</strong>歌羅西教會聽完推基古念的信——「你們作主人的，要公公平平地待僕人，因為知道你們也有一位主在天上」（西 4:1）——轉身就看見站在旁邊的阿尼西謀。原則照守，落點隨處境；處境變了，原則仍要在一個有名字的人身上試驗。</p>"],["【四】這件事該不該影響你的信心","","<p>這封信是私人信還是公開信、主人是腓利門還是亞基布、阿尼西謀為甚麼離開，這些討論不該動搖你的信心；各派都同意：這是一封保羅在捆鎖中寫的、為一個人求情的信，而且它被教會保存下來，因為它把福音落在一個家裡。</p><p>但有一件事該問自己：<strong>我家的那扇門，坐不坐得進一個曾經對不起我的人？</strong>福音不是只把一個人救進天堂，是把一群人放進一個家。這封信最後的祝福，原文的「你的」是複數：「願我們主耶穌基督的恩常在你的心裡」（1:25）——接納一個人，不是一個人靠意志力撐住的，是一群人一起被恩托住。</p>"]],"con":[],"say":"本講義的全卷立場：腓利門書是寫給一個人、卻在家庭教會面前念出來的私人信；處境是歌羅西、羅馬法下奴僕是財產、與歌羅西書同一趟送出。全卷照「書信」三問讀——原則是在主裡是親愛的兄弟、憑愛心求、甘心不是勉強、收納如同收納我、虧負的帳有人擔保；家規在歌羅西書是原則，在腓利門書是一個有名字的人。阿尼西謀的處境四讀並陳，以前兩讀為主，不裁判。","care":"席上會有家裡就是聚會地點、累到不敢說的接待家庭；有在小組裡和曾經得罪自己的人同桌、每次聚會都像在受刑的人；也有自己就是那個「曾經沒有益處」、不知道教會會不會讓他回來的人。牧者要讓三種人都聽見：這封信不是叫接待的人無限犧牲，也不是在眾人面前逼人表態，而是一群人一起被恩托住。不要在聚會中公開點名、要人當眾表態接納誰，也不要把私人的傷害拿到台前當作「教會的見證」；需要處理的關係，先私下、慢慢地、在安全的陪伴裡談。"},{"id":"ISS00_2","t":"奴隸制、勞動與身分：保羅把阿尼西謀送回去，是在為奴隸制背書嗎？","r":"1:15--16；1:21","ch":[],"why":"二、新約不為奴隸制背書；福音進到一個具體的家，把一件「東西」叫成「弟兄」——本講義的全卷立場之二（沿用彼得前書立場三，本卷補新）。腓利門書是歷史上被誤用得最慘的經卷之一：十九世紀美國南方的講台說「保羅也把逃奴送回主人那裡」，用它為奴隸制與追捕逃奴辯護；今天又有人反過來說「保羅連奴隸制都不反對」，用它輕看整本聖經。這一題必須在開卷講定，而且要講到今天的移工、家庭看護、派遣勞工——他們就坐在我們的教會裡，或在我們家裡工作。","pos":[["【一】經文問的是甚麼","","<p>先承認處境的重量。第一世紀的羅馬社會，奴僕佔城市人口相當大的比例；有戰俘、有被拐賣的、有生在主人家的、也有因債賣身的。古代奴隸制與後來按種族世代販賣的大西洋奴隸貿易不完全一樣，但它同樣讓一個人成為另一個人的財產，可以被買賣、被責打、被分離家人。阿尼西謀就活在這個制度裡。</p><p>保羅在這封信的樞紐說：「他暫時離開你，或者是叫你永遠得著他，不再是奴僕，乃是高過奴僕，是親愛的兄弟。在我實在是如此，何況在你呢！這也不拘是按肉體說，是按主說」（1:15--16）。他又說「深信你必順服，知道你所要行的必過於我所說的」（1:21）。<strong>經文問的是：保羅有沒有要求腓利門釋放阿尼西謀？他為甚麼不直接反對奴隸制？「不再是奴僕」改變的是身分、關係，還是制度？今天這原則落在哪裡？</strong></p>"],["暗示釋放說（21 節「必過於我所說的」就是釋放）","","<p>許多解經家認為保羅雖然沒有明說，卻已經把話說到門口：他說阿尼西謀「不再是奴僕」（1:16），說他本來有意將他留下「替你伺候我」（1:13），又說腓利門所要行的「必過於我所說的」（1:21）——最自然的「過於」，就是讓他得自由，甚至讓他回到保羅身邊同工。十九世紀的萊特富特說過，「釋放」這個詞彷彿就在保羅的嘴邊顫動，他卻一次也沒有說出口。這派的優點是把 16 節的翻轉讀得夠重：一個人若真是「親愛的兄弟」，就很難再被當成財產。</p><p><strong>難處：</strong>保羅確實沒有說出「釋放」兩個字；21 節的「過於」也可能只是指更熱情的接納，或把阿尼西謀差回保羅身邊服事，而不改變他的法律身分。而且經文沒有記載腓利門後來做了甚麼。把一個推論講成保羅的明確要求，是替經文多說了話。</p>"],["改變關係說（16 節改變了關係，沒有改變制度）","","<p>另一派著重 16 節的小字 ὡς「作為」：保羅說的是「不再作為奴僕」，指腓利門看他、待他的方式，未必是他的法律身分。家規在新約裡仍然對作主人的和作僕人的說話（西 3:22--4:1；弗 6:5--9），可見早期教會裡有信主的主人，也有信主的僕人。這派的優點是誠實：它不把今天的廢奴觀念讀進第一世紀的信裡，也看見一個小小的少數群體，在帝國的法律底下能做和不能做的事。</p><p><strong>難處：</strong>若只停在「關係變了、制度不變」，很容易讓人滿足於「在聚會裡是弟兄、在家裡照舊是財產」。可是保羅偏偏說「不拘是按肉體說，是按主說」（1:16）——「按肉體」正是社會關係、家裡、帳本上的那一層。歷史上南方的蓄奴者正是用這種讀法說服自己：只要對奴隸好一點、讓他們也來聽道，就沒有違背聖經。</p>"],["從內部瓦解說（福音埋下的種子終於撐破制度）","","<p>還有一派認為，保羅沒有寫一份廢奴宣言，卻把一顆會撐破制度的種子種了下去：「並不分猶太人、希臘人，自主的、為奴的，或男或女，因為你們在基督耶穌裡都成為一了」（加 3:28）；「在此並不分……為奴的、自主的，惟有基督是包括一切，又住在各人之內」（西 3:11）。當一個主人每週和他的奴僕同領一個餅、同稱一位主，又被要求叫他「親愛的兄弟」，這個制度遲早要被掏空。後來推動廢奴的信徒，正是從這些經文得到力量。這派的優點是看見福音改變社會的方式：從一個家、一張桌子開始。</p><p><strong>難處：</strong>這顆種子發芽得太慢了——教會與信徒擁有奴僕，延續了好幾個世紀；用「種子」來解釋，有時變成替那幾百年的沉默找台階下。而且這派容易變成事後的自我恭維，卻回答不了站在門口的那個人：我明天早上還要不要照舊被派工？</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：沿用彼得前書立場三——新約不為奴隸制背書，順服的理由與界線都是「為主的緣故」。本卷補一筆：腓利門書是福音進到一個具體的家，把一件「東西」叫成「弟兄」；而且保羅說，這個改變要「按肉體」，也要「按主」——不只在聚會裡，也在家裡、帳本上、明天早上派工的時候。</strong>三種讀法各有所見，本講義並陳，不把推論講成保羅的明文。</p><p>新約不為奴隸制背書，有經文為憑：保羅把「搶人口」列在「不法和不服的」人中間（提前 1:9--10），律法說「拐帶人口，或是把人賣了，或是留在他手下，必要把他治死」（出 21:16）；保羅勸作奴隸蒙召的人，若能得自由，就求自由更好（林前 7:21）；申命記甚至說「若有奴僕脫了主人的手，逃到你那裡，你不可將他交付他的主人」（申 23:15）（見 ISS01_6）——這一條是否只適用於從外邦逃到以色列的奴僕，各家看法不同，本講義並陳，不據此推論保羅違背律法。所以本講義不說聖經支持奴隸制，也不說阿尼西謀若是逃走就是罪、回去受罰是應該的；同樣不說「保羅沒有寫廢奴宣言，所以聖經不可信」。保羅送阿尼西謀回去，帶著信、帶著同伴、帶著擔保，而且請求主人「收納他，如同收納我一樣」（1:17）——這不是把人送回制度，是把制度帶到十字架前。</p><p><strong>今天的移工、家庭看護、外傭、派遣勞工要被具體看見。</strong>本講義不說「外勞就是奴僕」——今天的僱傭有契約、有法律，和古代的奴隸制不同，這樣說既不準確，也再一次把人貼上標籤。但扣留護照、沒有休假、高額仲介債務、工資拖欠、二十四小時待命、不准用手機，這些事要被叫出名字。聖經說「雇工人的工價，不可在你那裡過夜，留到早晨」（利 19:13），雅各說「你們虧欠他們的工錢，這工錢有聲音呼叫」（雅 5:4）。<strong>在主裡是弟兄，不能讓社會上的不公變得不重要；正因為是弟兄，「按肉體」的那一層——工資、休假、尊嚴——更要算清楚。</strong>同樣，本講義也不把腓利門講成反派：他是一個被邀請的人，不是被定罪的人。</p>"],["【四】這件事該不該影響你的信心","","<p>保羅為甚麼沒有寫一份廢奴宣言，學者有不同的解釋；這些討論不該動搖你的信心。聖經不是過時的書，它是在一個不公義的世界裡說話的書：它沒有假裝那個世界不存在，卻在那個世界裡，把一個被法律當成東西的人叫成「親愛的兄弟」（1:16）。</p><p>真正該問的是：<strong>我在誰的身上，還只看見「工」，沒有看見「人」？</strong>家裡的看護、公司的派遣同事、工地的移工、餐廳的外場——他們都有名字。那位「反倒虛己，取了奴僕的形像」（腓 2:7）的主，先站到了奴僕的位置上；跟隨他的人，沒有理由站在比他更高的地方看人。</p>"]],"con":[],"say":"本講義的全卷立場：沿用彼得前書立場三——新約不為奴隸制背書（提前 1:10；出 21:16；林前 7:21）。腓利門書是福音進到一個具體的家，把一件「東西」叫成「弟兄」，而且「按肉體」也「按主」；「暗示釋放」「改變關係」「從內部瓦解」三讀並陳。今天的移工、看護、派遣勞工要被具體看見——不說「外勞就是奴僕」，也不以「在主裡是弟兄」抹去工資、休假與尊嚴的不公。","care":"席上會有祖先曾被販賣或自己曾被剝削的人；有在異鄉當看護、外傭、工廠移工，連星期天來聚會都要看雇主臉色的弟兄姊妹；也有家裡請了看護、心裡隱隱不安的雇主。牧者要讓第一種人感到被看見，不是被要求閉嘴；對正在被扣證件、被欠薪、被限制自由的人，具體協助他找當地的勞工主管機關、申訴專線或關懷移工的機構；對雇主，用 1:16「按肉體說」陪他檢查工資、休假與住宿。不要說「保羅也叫奴僕順服，你就忍一忍」，不要在講台上用「外勞」這種標籤稱呼人，也不要把雇主一概講成壓迫者。"},{"id":"ISS00_3","t":"饒恕、和好與回歸：阿尼西謀回去了，受傷的人也要「回去」嗎？","r":"1:12--17","ch":[],"why":"三、饒恕不等於和好，和好需要悔改、擔保與安全；「回去」不等於回到危險——本講義的全卷立場之三（本卷新立）。腓利門書是一封關於「回來」的信：一個離開的人被打發回去，一個受損的主人被請求收納他。正因為如此，它最常被拿來說兩句傷人的話：「阿尼西謀都回去了，你也要回到你先生、老闆、家人那裡」；「腓利門都接納了，你為甚麼不能饒恕」。這兩句話把一封「求」的信講成一道命令，又把一封保護人的信講成叫受害者留在危險裡的信。這一題必須在開卷講定。","pos":[["【一】經文問的是甚麼","","<p>保羅說：「我現在打發他親自回你那裡去；他是我心上的人」（1:12）；「他暫時離開你，或者是叫你永遠得著他」（1:15）；「你若以我為同伴，就收納他，如同收納我一樣」（1:17）；「他若虧負你，或欠你甚麼，都歸在我的帳上」（1:18）。一段斷掉的關係，在這幾節裡被請求接回來。</p><p>可是要先看清楚：在這封信裡，<strong>回去的人是可能虧負了對方的那一位，被請求收納的是受了損失的那一位</strong>；而那個請求是「求」，不是命令（1:9、14）。<strong>經文問的是：受了傷害的人，非饒恕不可嗎？饒恕了，就一定要恢復原來的關係嗎？虧負的帳要不要算？這封信能不能拿來叫一個人回到傷害他的人身邊？</strong></p>"],["恢復說（饒恕了，就該恢復原來的關係）","","<p>許多敬虔的講台這樣教：基督徒要「彼此饒恕，正如神在基督裡饒恕了你們一樣」（弗 4:32），主說饒恕要「到七十個七次」（太 18:22）；既然饒恕了，就該像腓利門一樣把人接回來，關係恢復如初。這派的優點是認真看待福音的激進：神不是勉強地接納我們，是張開雙手接回浪子。</p><p><strong>難處：</strong>這派把饒恕與和好看成同一件事，結果把受傷的人放在兩難裡——若不回到原來的關係，就被說成沒有饒恕。可是保羅沒有命令腓利門，他說「不是出於勉強，乃是出於甘心」（1:14）；他也沒有說那筆帳不存在，他說「歸在我的帳上」（1:18）。更嚴重的是，這種講法落在家暴、性侵、長期虐待的處境裡，等於叫受害者回到危險裡去——這是本卷紅線二要擋下的事。</p>"],["條件說（對方悔改了，才饒恕）","","<p>另一派引主的話：「若是你的弟兄得罪你，就勸戒他；他若懊悔，就饒恕他」（路 17:3），主張饒恕要以對方的悔改為條件；沒有悔改，就不必饒恕，也不應和好。這派的優點是保護了公義：它不讓傷害人的人輕易脫身，也不讓受害者被迫假裝沒事。</p><p><strong>難處：</strong>主也說「你們站著禱告的時候，若想起有人得罪你們，就當饒恕他」（可 11:25），那裡沒有提對方是否悔改。若把饒恕完全綁在對方的悔改上，受傷的人一生的平安就握在傷害他的人手裡——對方不認錯，他就一直被那件事捆住。條件說抓住了和好的條件，卻可能把饒恕也一併鎖住了。</p>"],["分層說（饒恕、和好、責任、安全分開看）","","<p>第三派主張把幾件事分開：<strong>饒恕</strong>是向神交出審判——「不要自己伸冤，寧可讓步，聽憑主怒」（羅 12:19），可以由受傷的人一方、在神面前、按自己的步調完成；<strong>和好</strong>是雙方的路，需要悔改、擔保與安全，不是一方可以單獨完成的；<strong>責任</strong>不因饒恕而消失，虧負的帳是真的（1:18）；<strong>安全</strong>永遠在前面——「通達人見禍藏躲；愚蒙人前往受害」（箴 22:3）。這派的優點是同時保住了福音的恩典與受害者的安全。</p><p><strong>難處：</strong>分層說有時被誤用成「我饒恕了，但永遠不必再面對他」的藉口，讓本來可以和好的關係停在半路；而且真實的人生裡，這幾層常常纏在一起，需要時間、陪伴與牧養的智慧，不是一張圖表就能分清。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：採分層說。饒恕（向神交出審判）不等於和好（雙方的路，需要悔改、擔保與安全），也不等於免除責任或恢復原職；不可逼人立刻饒恕，也不可說「腓利門都接納了，你為甚麼不能」。「回去」不等於回到危險。</strong></p><p>看清楚阿尼西謀是怎樣回去的：<strong>他帶著保羅的信</strong>，信裡稱他是「我心上的人」（1:12）；<strong>他不是一個人回去</strong>，有推基古同行（西 4:7--9）；<strong>他回到一個家庭教會的見證之下</strong>，信是在「在你家的教會」（1:2）面前念的；<strong>他有保羅以自己擔保</strong>——「都歸在我的帳上；我必償還」（1:18--19）；<strong>保羅還要親自來</strong>，請腓利門「給我預備住處」（1:22）。這是一個被保護的回去。而且在這封信裡，回去的是可能虧負人的一方，被請求接納的是受損失的一方；經文從來沒有叫一個受虐的人回到虐待他的人那裡。</p><p><strong>所以，12 節不可以拿來叫受家暴的配偶、受虐的孩子、被剝削的移工或員工，回到傷害他的人那裡。</strong>人身安全受威脅時，先保護生命，依當地法律求助、報警或通報；神設立掌權的，是要「刑罰那作惡的」（羅 13:4）。和好若有一天發生，是在悔改、擔保與安全都具備之後，由受傷的人甘心走出來的一步——就像保羅說的「或者」（1:15），他沒有把神的旨意說死，我們也不可以替受傷的人說死。</p>"],["【四】這件事該不該影響你的信心","","<p>教會之間對「饒恕要不要以悔改為條件」有真誠的分歧，這不該動搖你的信心。各派都同意：神饒恕我們是白白的恩典，而饒恕人是我們一生跟隨主要學的功課。</p><p>但若你曾經因為「還沒有饒恕」被定罪，請聽見這一句：<strong>饒恕是一條路，不是一道門檻。</strong>你可以先把審判交給神，再慢慢走；你可以饒恕，同時保護自己、追究責任、拒絕回到危險。那位說「歸在我的帳上」的主，沒有假裝你的傷不存在——他把那筆帳記在自己身上，所以你不必再自己扛著它，也不必再為了證明自己屬靈，回到傷害你的地方。</p>"]],"con":[],"say":"本講義的全卷立場：饒恕（向神交出審判）不等於和好（雙方的路，需要悔改、擔保與安全），也不等於免責或恢復原職；不可逼人立刻饒恕。阿尼西謀的回去是被保護的回去——有信、有推基古同行、有教會見證、有保羅擔保；12 節不可拿來叫受害者回到傷害他的人那裡，人身安全受威脅時先保護生命、依法求助、通報。","care":"席上會有正在受家暴、不敢說出口的配偶；有小時候受虐、長大後被長輩要求「回家孝順」的人；有被雇主扣薪、限制自由的移工；也有被教會要求「趕快饒恕、趕快和好」而再次受傷的人。牧者先確認他現在是否安全，再陪他慢慢分辨饒恕與和好；涉及暴力、性侵、兒少虐待，協助他報警、通報、找庇護與專業輔導，並依法履行通報責任。不要說「你為甚麼不能原諒他」「阿尼西謀都回去了」「為了家庭完整你再忍一忍」，也不要安排受害者與加害者當面「和好禱告」。對真心悔改、想回來的人，則像保羅一樣為他寫信、陪他走、替他擔保。"},{"id":"ISS00_4","t":"權柄與請求：能命令的人為甚麼選擇憑愛心求？","r":"1:8--14；1:19--21","ch":[],"why":"四、能命令的人選擇憑愛心求；甘心不是勉強；19 節的恩情不可拿來綁人——本講義的全卷立場之四（沿用彼得前書立場五、提摩太前書立場四，本卷補 8--9、14、19--21）。腓利門書是新約裡把權柄觀寫得最細的一封信：保羅明說他「能放膽吩咐」，卻選擇「求」。可是同一封信裡也有「連你自己也是虧欠於我」與「深信你必順服」，常被講台拿來壓人：「你的生命是教會給的，你欠教會的」「牧者說的你就要順服」。這一題必須在開卷講定。","pos":[["【一】經文問的是甚麼","","<p>保羅說：「我雖然靠著基督能放膽吩咐你合宜的事，然而像我這有年紀的保羅，現在又是為基督耶穌被囚的，寧可憑著愛心求你」（1:8--9）；又說「但不知道你的意思，我就不願意這樣行，叫你的善行不是出於勉強，乃是出於甘心」（1:14）。可是幾節以後，他寫：「我必償還，這是我－保羅親筆寫的。我並不用對你說，連你自己也是虧欠於我」（1:19）；又寫：「我寫信給你，深信你必順服，知道你所要行的必過於我所說的」（1:21）。</p><p>這封信開頭，保羅沒有像在別的信裡那樣自稱「使徒」，只說自己是「為基督耶穌被囚的」（1:1）。<strong>經文問的是：保羅放下權柄，是真的放下，還是換一種方式施壓？19 節是情緒勒索嗎？21 節的「順服」是順服誰？今天的屬靈領袖可以怎樣用、不可以怎樣用這幾節？</strong></p>"],["溫和的施壓說（保羅用盡每一個槓桿）","","<p>不少學者從修辭學讀這封信：保羅先稱讚（1:4--7），再自稱老人與囚犯博取同情（1:9），把信在全教會面前念（1:2），提醒對方欠他一條命（1:19），最後說要親自來查看（1:22）——每一個槓桿都用上了，腓利門幾乎沒有拒絕的餘地。這派的優點是誠實：它不把保羅美化成毫無份量的人，也承認關係與恩情本身就帶著重量。</p><p><strong>難處：</strong>若保羅只是換一種方式下命令，14 節「不是出於勉強，乃是出於甘心」就成了空話；而且 19 節用的是修辭上的「略過法」——「我並不用對你說」，他刻意把這筆帳放在一邊，沒有拿來要求。更大的危險在講台上：一旦把這幾節讀成「高明的施壓技巧」，就等於替今天的領袖提供了一套包裝命令的範本。</p>"],["幽默的提醒說（老朋友之間的玩笑話）","","<p>另一派讀出 19--20 節的溫度與笑意：保羅剛剛親筆寫下一張欠條「我必償還」，轉身又說「其實你還欠我一個你自己呢」，下一句接著用阿尼西謀名字的雙關——「望你使我在主裡因你得快樂」（1:20），「快樂」原文 ὀναίμην 與「阿尼西謀」同字根（和合本註腳：或譯益處）。這是老朋友之間的會心一笑，不是討債。這派的優點是讀出了信的語氣，也讀出保羅與腓利門之間真實的情誼。</p><p><strong>難處：</strong>我們聽不見保羅的語氣，幽默說也是推論；而且玩笑話在權力不對等的關係裡，一樣可能帶著重量——老使徒說的玩笑，收信人未必笑得出來。只講「幽默」，可能讓人忽略了權力的現實。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：沿用彼得前書立場五、提摩太前書立場四——屬靈權柄是為了服事，不是轄制；本卷補一筆：腓利門書是全卷的權柄觀，能命令的人選擇憑愛心求（1:8--9），而請求不是包裝過的命令（1:14）。19 節「溫和的施壓」與「幽默的提醒」兩讀並陳，不裁判；但無論哪一讀，都不可當作講台上以恩情綁人、情緒勒索的範本。21 節「你必順服」也不可拿來壓制會眾的提問。</strong></p><p>保羅沒有失去權柄，他選擇不用；他把命令的權力放下，換來一個人甘心的善行。這使我們想起主說的「只是在你們中間，不是這樣。你們中間，誰願為大，就必作你們的用人」（可 10:43），彼得也說長老「不是出於勉強，乃是出於甘心」地牧養，「也不是轄制所託付你們的，乃是作群羊的榜樣」（彼前 5:2--3）。19 節兩讀並陳，本講義略傾向幽默讀法；但對收信人而言，恩情仍有重量，所以更不可拿來綁人。21 節的「順服」也有不同讀法——順服保羅的請求，或順服福音本身；本講義並陳，只說清楚一件事：那是順服保羅在主裡所求的（終究是順服主），不是對個人無條件的服從。</p><p>一條可以自己檢查的界線：<strong>一個不能被拒絕的請求，就是命令。</strong>講台上若說「你的生命是教會給的，你欠教會的，所以要順服」，就已經越界；牧者說的不等於神說的，會眾有權發問、有權說不，而不必擔心被貼上「悖逆」的標籤。</p>"],["【四】這件事該不該影響你的信心","","<p>19 節是施壓還是幽默，學者各有所見，這不該動搖你的信心；兩派都同意：保羅本可命令，卻選擇了求。</p><p>但若你曾經在教會裡被「恩情」綁住——不敢離開、不敢發問、不敢說不，因為怕被說忘恩負義——請聽見 14 節：神要的善行是「出於甘心」的。<strong>那位本可命令一切的主，在十字架上沒有命令我們愛他，他先愛了我們。</strong>被恩典抓住的人會甘心，被恩情綁住的人只會害怕；這兩樣，神分得很清楚。</p>"]],"con":[],"say":"本講義的全卷立場：沿用彼得前書立場五、提摩太前書立場四——屬靈權柄是為了服事，不是轄制。保羅能命令卻憑愛心求（1:8--9），請求不是包裝過的命令（1:14）；19 節「溫和的施壓」與「幽默的提醒」兩讀並陳，但都不可當作以恩情綁人、情緒勒索的範本；21 節不可拿來壓制提問。一個不能被拒絕的請求，就是命令。","care":"席上會有被屬靈領袖以「教會對你那麼好」「你是我帶信主的」綁住、不敢離開也不敢發問的人；也有在職場、家族裡被恩情勒索、每一次拒絕都要背上忘恩負義罪名的人。牧者要讓他們聽見 14 節的「甘心」，陪他分辨感恩與被控制的不同；涉及屬靈虐待，回指彼得前書立場五的處理，必要時協助他找可信任的第三方。不要說「你欠教會的」「牧者說的就是神說的」「不順服就是悖逆」；牧者自己也要先檢查，自己的請求是否容得下一個「不」。"},{"id":"ISS00_5","t":"歸帳與擔保：18--19 節「都歸在我的帳上」是福音的比喻嗎？","r":"1:17--19","ch":[],"why":"五、18--19 節可以「使我們想起」基督，不可說成保羅的預表或代贖論教導；虧負的帳是真的，有人要負責——本講義的全卷立場之五（本卷新立）。兩千年來讀這封信的人，都在「都歸在我的帳上；我必償還」這裡停下來；路德在腓利門書序言裡說：「我們都是他（基督）的阿尼西謀，只要我們信」。這份感動是真的，但也容易走過頭：把阿尼西謀講成罪人的預表、把腓利門講成發怒的父神、把一封求情信講成代贖論。另一方面，講台也容易因為講「恩典」，就把那筆虧負的帳講得好像不存在。這一題要把兩條界線都劃清楚。","pos":[["【一】經文問的是甚麼","","<p>保羅寫：「他若虧負你，或欠你甚麼，都歸在我的帳上；我必償還，這是我－保羅親筆寫的」（1:18--19）。這是會計與法律的語言：ἐλλόγα 是「記入帳上」，ἀποτίσω 是「償還、賠償」；保羅把筆從書記手裡接過來，親筆寫下，等於開了一張具法律效力的欠條。前一節他說「就收納他，如同收納我一樣」（1:17）。</p><p>保羅沒有否認阿尼西謀可能真的造成了損失——「他若虧負你，或欠你甚麼」；他也沒有請腓利門一筆勾銷，而是請他把帳轉到自己名下。<strong>經文問的是：這是福音的比喻嗎？保羅在這裡教導代贖嗎？如果不是，我們可以在這裡看見基督嗎？那筆虧負的帳，在恩典裡還算不算數？</strong></p>"],["福音比喻說（這就是基督為我們做的事）","","<p>從古代到宗教改革，許多講道者在這裡直接看見福音：路德在腓利門書序言說，基督為我們做的，正是保羅為阿尼西謀做的——他放下自己的權利，把我們的債記在自己身上，在父面前為我們求；「我們都是他（基督）的阿尼西謀，只要我們信」。這派的優點是讓會眾在一封短信裡看見十字架的形狀，感動是真的，也確實有新約的字根可以呼應：保羅在羅馬書用同一個字根說罪「不算罪」（羅 5:13）。</p><p><strong>難處：</strong>保羅自己沒有作這個連結。一旦把它說成預表或教義，比喻就會被推到它承受不了的地方：腓利門不是發怒的父神，他自己也是蒙恩的罪人（1:19）；保羅不是基督，他沒有替誰死；阿尼西謀也不比腓利門更是罪人。不可說「阿尼西謀預表罪人」——那會讓一個奴僕又一次被放在最低的位置上，這正是本卷紅線五要擋下的。</p>"],["商業擔保說（這只是一張欠條）","","<p>另一派堅持把這兩節讀成它字面上的樣子：一位有能力的朋友，用正式的法律格式替另一人擔保債務；保羅確實可能有能力償還（他在羅馬「自己所租的房子裡住了足足兩年」，徒 28:30），這是一個真實的財務承諾，不是比喻。這派的優點是尊重經文的字面與歷史，也讓這兩節保有它真實的重量：保羅是真的準備掏錢。</p><p><strong>難處：</strong>只讀成商業文件，又漏掉了保羅整個人被福音塑造的事實。他在 17 節說「收納他，如同收納我」，用的「收納」正是他在羅馬書說「你們要彼此接納，如同基督接納你們一樣」（羅 15:7）的同一個字；保羅這樣替人擔保，本身就是他所領受的福音在他身上活出來的樣子。完全不准讀者想起基督，是對經文的另一種失聽。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：18--19 節是一張真實的欠條，同時「這使我們想起」基督——可以想起，不可說成保羅的預表或代贖論教導。不可說「阿尼西謀預表罪人」「保羅在這裡教導代贖論」。</strong>路德「我們都是他（基督）的阿尼西謀，只要我們信」也只能放在「這使我們想起」的位置。</p><p>這使我們想起的經文是：保羅在羅馬書用同字根的字說罪「不算罪」（羅 5:13）；又說「這就是神在基督裡，叫世人與自己和好，不將他們的過犯歸到他們身上」（林後 5:19）；「神使那無罪的，替我們成為罪，好叫我們在他裡面成為神的義」（林後 5:21）。還有一張欠條：「又塗抹了在律例上所寫、攻擊我們、有礙於我們的字據，把它撤去，釘在十字架上」（西 2:14）——那是與腓利門書同一趟送出的信。<strong>保羅在監獄裡為一個人寫欠條；那位主在十字架上，為所有人把欠條撤去。</strong></p><p>另一條界線同樣重要：<strong>虧負的帳是真的，有人要負責。</strong>保羅沒有對腓利門說「算了吧，不要計較」，他說「歸在我的帳上」。恩典不是假裝沒有虧負，是有人把虧負扛起來。所以本講義不把饒恕講成「當作沒發生」，也不叫受了損失的人把損失吞下去；在教會與職場裡，賠償、歸還與修復關係的責任，都要誠實面對（見 ISS00_3）。</p>"],["【四】這件事該不該影響你的信心","","<p>這兩節是不是福音的比喻，各家說法不同，這不該動搖你的信心；保羅在別的信裡已經把十字架講得很清楚，不需要靠這兩節來證明。</p><p>但這兩節可以讓你在一個具體的畫面裡，再一次看見自己：<strong>我是那個欠了帳、不知道門會不會開的人；也是那個手上拿著別人欠條、想要討回來的人。</strong>而有一位主，在我們還作罪人的時候，把我們的帳記在自己身上。被這樣擔保過的人，也會開始學著替別人寫一張「我必償還」，而不是逼受傷的人把帳一筆勾銷。</p>"]],"con":[],"say":"本講義的全卷立場：18--19 節是保羅親筆的真實擔保，這使我們想起基督（羅 5:13；林後 5:19、21；西 2:14），不說成保羅的預表或代贖論教導，也不說阿尼西謀預表罪人；路德「我們都是他（基督）的阿尼西謀，只要我們信」只放在「這使我們想起」。虧負的帳是真的，有人要負責——恩典不是假裝沒有虧負，是有人把虧負扛起來。","care":"席上會有背著債務、做錯事虧損了別人、不敢回到教會或家裡的人；也有被人虧欠了錢、時間或名譽，卻被勸「基督徒不要計較」的人。牧者對前一種人，傳講那位替我們擔保的主，並陪他一步步負起可以負的責任；對後一種人，承認他的損失是真的，不要急著叫他「放下」。不要把「歸帳」講成「一筆勾銷、當作沒發生」，不要把犯錯的人講成阿尼西謀、受損的人講成腓利門而逼雙方照劇本走，也不要在講台上把某位會友的債務當成例子。"},{"id":"ISS00_6","t":"作者與真實性：腓利門書是保羅寫的嗎？","r":"1:1","ch":[],"why":"六、作者是使徒保羅，幾乎沒有爭議；連第二世紀的馬吉安都把它收進他的保羅書信集。這一題要交代：信的自稱、19 節親筆、與歌羅西書的關聯，以及十九世紀少數學者的懷疑——讓讀者知道，本卷可以放心地寫「保羅說」，同時把焦點放在保羅所傳的那位主身上。","pos":[["【一】經文問的是甚麼","","<p>信的開頭說：「為基督耶穌被囚的保羅，同兄弟提摩太寫信給我們所親愛的同工腓利門」（1:1）；中間又說「像我這有年紀的保羅，現在又是為基督耶穌被囚的」（1:9），還說「這是我－保羅親筆寫的」（1:19）。信中提到的同工——以巴弗、馬可、亞里達古、底馬、路加——與歌羅西書末了的名單幾乎一樣（西 4:10--14）。<strong>經文問的是：這封信是不是保羅寫的？為甚麼這一卷幾乎沒有作者的爭議？</strong></p>"],["保羅親筆說（歷代傳統與絕大多數學者）","","<p>歷代教會一致接受這是保羅的信：馬吉安的正典、穆拉多利殘篇都收入它，特土良、俄利根都引用過；近代絕大多數學者，包括對其他保羅書信持懷疑態度的學者，也把它列在無可爭議的保羅書信裡。理由是：信的自稱（1:1、9、19）、與歌羅西書名單的自然吻合、保羅特有的語氣與用字（「在基督裡」「在主裡」「心腸」），以及一個造假的人很難有動機寫這樣一封私人短信。</p><p><strong>難處：</strong>這一說的難處很少；唯一要注意的，是若歌羅西書的作者有爭議，兩封信的名單幾乎相同，反而要解釋：是腓利門書證明了歌羅西書的真實，還是歌羅西書抄了腓利門書的名單？本講義在歌羅西書講義已採保羅為作者，兩封信互相印證。</p>"],["託名小說說（十九世紀杜賓根學派）","","<p>十九世紀的鮑爾（F. C. Baur）曾懷疑這封信，認為它像一篇基督教的小故事，借保羅之名，要說明基督教怎樣看待奴隸與主人；他的理由是文體與思想和他認定的保羅「主要書信」不同。這派的優點是逼讀者不能只說「傳統就是這樣」，要認真面對文字的證據。</p><p><strong>難處：</strong>這封信太短、太具體，沒有一點虛構作品要傳達的教義綱領；連鮑爾的學生與後來的批判學者，大多也放棄了這個看法。一個寫小說的人，不會把主角的去留寫成一個沒有結局的「或者」（1:15），也不會讓整個故事沒有交代腓利門最後怎樣回應。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：作者是使徒保羅，提摩太是聯名者；19 節是保羅親筆擔保的那一段。鮑爾的懷疑並陳，不嘲諷。</strong>保羅在這封信裡不稱自己是使徒，只稱自己是「被囚的」——這是全卷權柄觀的第一筆（見 ISS00_4）。</p><p>本卷因此可以寫「保羅說」；但每一處都要落在保羅所指的那一位身上。讀完這封信，會眾記得的應該是那位把我們的帳記在自己身上的主，不是保羅的口才。</p>"]],"con":[],"say":"本講義的全卷立場：作者是使徒保羅（1:1、9
